<!DOCTYPE html>
<html lang="en">

<head>
    <title>Progress Bar</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- LIBRARY FILES -->
    <link rel="preload" href="../basic/font/open-sans/OpenSans-Regular.ttf" as="font" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="../basic/basic.css">
    <script src="../basic/basic.js" type="text/javascript" charset="utf-8"></script>

    <!-- COMPONENT FILES -->
    <script src="../comp/progress-bar.js" type="text/javascript" charset="utf-8"></script>
    <script src="../comp/smart-button.js" type="text/javascript" charset="utf-8"></script>

    <script>

        /* Bismillah */

        const CARD_MAX_WIDTH = 420;

        // *** VARIABLES:
        let prgBasic, lblBasic;
        let prgUpload, uploadTimer = null;
        let prgConnect;
        let prgModern, prgModernTasks;

        const start = function () {

            page.color = "whitesmoke";

            // BOX: Full screen scrollable container
            // WHY: page does not scroll. Scrollable content must be inside a Box with scrollY: 1.
            startBox(0, 0, "100%", "100%", {
                color: "transparent",
                scrollY: 1,
            });

                // GROUP: Page layout
                VGroup({
                    width: "100%",
                    height: "auto", // Grows with content, so the Box can scroll.
                    align: "center top",
                    gap: 30,
                    padding: [16, 50], // WHY 16 at the sides: the cards fill a phone (390 px)
                });

                    // LABEL: Title
                    Label({
                        text: "Progress Bar",
                        fontSize: 26,
                        fontFamily: "opensans-bold",
                    });

                    // SAMPLE 1: Default (classic)
                    startCard("1. Default");

                        prgBasic = ProgressBar({
                            width: "100%",
                            titleText: "Profile completed",
                            value: 40,
                            onChange: function (self) {
                                lblBasic.text = "Value: " + self.value;
                            },
                            onComplete: function (self) {
                                lblBasic.text = "Completed!";
                            },
                        });

                        // GROUP: Buttons
                        startButtonRow();
                            SmartButton({ labelText: "- 10", onClick: function () { prgBasic.addValue(-10); } });
                            SmartButton({ labelText: "+ 10", onClick: function () { prgBasic.addValue(10); } });
                            SmartButton({
                                tone: "white",
                                labelText: "Reset",
                                onClick: function () {
                                    prgBasic.reset();
                                    lblBasic.text = "Value: 0";
                                },
                            });
                        endGroup();

                        lblBasic = addInfoLabel("Value: 40");

                    endCard();

                    // SAMPLE 2: Custom maxValue, value text on the right, status
                    startCard("2. Upload (maxValue, valueFormat, status)");

                        prgUpload = ProgressBar({
                            width: "100%",
                            titleText: "Uploading photos",
                            maxValue: 12,
                            valuePosition: "right",
                            valueFormat: function (self) {
                                return self.value + " / " + self.maxValue;
                            },
                            onComplete: function (self) {
                                stopUpload();
                                self.setStatus("success");
                                self.setTitleText("12 photos uploaded");
                            },
                        });

                        // GROUP: Buttons
                        startButtonRow();
                            SmartButton({ tone: "cyan", labelText: "Start", onClick: startUpload });
                            SmartButton({
                                tone: "orange",
                                labelText: "Fail",
                                onClick: function () {
                                    stopUpload();
                                    prgUpload.setStatus("error");
                                    prgUpload.setTitleText("Upload failed");
                                },
                            });
                            SmartButton({
                                tone: "white",
                                labelText: "Reset",
                                onClick: function () {
                                    stopUpload();
                                    prgUpload.reset();
                                    prgUpload.setTitleText("Uploading photos");
                                },
                            });
                        endGroup();

                    endCard();

                    // SAMPLE 3: Indeterminate
                    startCard("3. Indeterminate");

                        prgConnect = ProgressBar({
                            width: "100%",
                            titleText: "Connecting to the server...",
                            indeterminate: 1,
                        });

                        // GROUP: Buttons
                        startButtonRow();
                            SmartButton({
                                labelText: "Connected",
                                onClick: function () {
                                    prgConnect.setTitleText("Downloading data");
                                    prgConnect.setValue(25); // A known value ends the indeterminate mode.
                                },
                            });
                            SmartButton({
                                tone: "white",
                                labelText: "Waiting",
                                onClick: function () {
                                    prgConnect.setTitleText("Connecting to the server...");
                                    prgConnect.setIndeterminate(1);
                                },
                            });
                        endGroup();

                    endCard();

                    // SAMPLE 4: Modern style
                    startCard("4. Modern Style");

                        prgModern = ProgressBar({
                            styleName: "modern",
                            width: "100%",
                            titleText: "Storage",
                            maxValue: 50,
                            value: 32,
                            valueFormat: function (self) {
                                return self.value + " GB of " + self.maxValue + " GB";
                            },
                        });

                        prgModernTasks = ProgressBar({
                            styleName: "modern",
                            width: "100%",
                            valuePosition: "right",
                            value: 70,
                        });

                        ProgressBar({
                            styleName: "modern",
                            width: "100%",
                            titleText: "Backup",
                            value: 100,
                            status: "success",
                            valueFormat: function () { return "Done"; },
                        });

                        ProgressBar({
                            styleName: "modern",
                            width: "100%",
                            titleText: "Sync",
                            value: 45,
                            status: "error",
                            valueFormat: function () { return "Stopped at 45%"; },
                        });

                        ProgressBar({
                            styleName: "modern",
                            width: "100%",
                            titleText: "Searching for devices...",
                            indeterminate: 1,
                        });

                        // GROUP: Buttons
                        startButtonRow();
                            SmartButton({
                                labelText: "Random",
                                onClick: function () {
                                    prgModern.setValue(random(0, 50));
                                    prgModernTasks.setValue(random(0, 100));
                                },
                            });
                        endGroup();

                    endCard();

                    // SAMPLE 5: Custom style
                    startCard("5. Custom Style");

                        ProgressBar({
                            width: "100%",
                            titleText: "Thick bar, no value text",
                            valuePosition: "none",
                            value: 60,
                            style: {
                                track: { height: 16, color: "#FFE0DA", round: 8 },
                                bar: { color: "tomato" },
                                title: { fontSize: 15, textColor: "tomato" },
                            },
                        });

                        ProgressBar({
                            width: "100%",
                            valuePosition: "right",
                            value: 25,
                            style: {
                                track: { height: 4, color: Black(0.08), round: 2 },
                                bar: { color: "#689BD2" },
                                valueText: { fontSize: 12, textColor: "#689BD2" },
                            },
                        });

                    endCard();

                endGroup();

            endBox();

        };

        // *** OTHER FUNCTIONS:

        const startUpload = function () {
            if (uploadTimer) return;
            if (prgUpload.value >= prgUpload.maxValue || prgUpload.status !== "normal") {
                prgUpload.reset();
                prgUpload.setTitleText("Uploading photos");
            }
            uploadTimer = setInterval(function () {
                prgUpload.addValue(1);
            }, 350);
        };

        const stopUpload = function () {
            clearInterval(uploadTimer);
            uploadTimer = null;
        };

        // GROUP: A white card with a title.
        const startCard = function (title) {
            VGroup({
                width: "100%",
                height: "auto",
                align: "left top",
                gap: 16,
                padding: 20,
                color: "white",
                round: 10,
                border: 1,
                borderColor: Black(0.1),
                css: { maxWidth: CARD_MAX_WIDTH + "px" },
            });
            Label({
                text: title,
                fontSize: 14,
                textColor: Black(0.45),
            });
        };

        const endCard = function () {
            endGroup();
        };

        // GROUP: SmartButtons side by side (endGroup() closes it)
        const startButtonRow = function () {
            // WHY clipContent 0: the focus ring of a SmartButton is not cut
            HGroup({ width: "auto", height: "auto", align: "left center", gap: 8, wrap: 1, clipContent: 0 });
        };

        const addInfoLabel = function (text) {
            return Label({
                text: text,
                fontSize: 14,
                textColor: Black(0.5),
            });
        };

    </script>
</head>

<body></body>

</html>

        <script>
        
        // *** VARIABLES:          
        let myInput;

        const start = function () {

            page.color = "white";

            // PageContainer
            AutoLayout();

                // ItemGroup
                VGroup({
                    gap: 12,
                    width: 350,
                });

                    // SelectCountryGroup
                    VGroup({
                        gap: 0,
                        width: "100%",
                        height: "auto",
                    });

                        // CountryCodeTitle
                        Label({
                            text: "COUNTRY CODE:",
                            width: "100%",
                            padding: [20, 0],
                            fontSize: 16,
                            textColor: "#555555",
                        });

                        // SELECT: Country ("ozden", with a search box).
                        // The rows and the field are drawn by this page: the code in a gray pill and the name.
                        SelectBox({
                            styleName: "ozden",
                            fullHeightList: 1, // the list from the top of the page to its bottom
                            width: "100%",
                            height: COUNTRY_FIELD_HEIGHT,
                            options: countryList.map(toCountryOption),
                            value: countryList[0].shortName,
                            style: { itemList: { row: { gap: COUNTRY_GAP } } },
                            createItemView: createCountryRow,
                            createValueView: createCountryView,
                            onChange: function (self) {
                                selectCountry(self.value);
                            },
                            css: { marginTop: "8px" },
                        });

                    endGroup();

                    // INPUT: Phone
                    myInput = PhoneField({
                        key: "1",
                        required: 1,
                        titleText: "PHONE NUMBER",
                        placeholder: "(auto)",
                        warningText: "Invalid phone number format",
                        warningColor: "#E5885E",
                        countryCode: countryList[0].code,
                        phoneMask: " (___) ___-____",
                        unitText: countryList[0].shortName,
                        width: "100%",
                    });

                endGroup(); // END GROUP

            endAutoLayout(); // End Page

            // Get value
            myInput.onChange = function () {
                console.log(myInput.getValue());
            };

        };

        const COUNTRY_FIELD_HEIGHT = 60;
        const COUNTRY_ROW_HEIGHT = 60;
        const COUNTRY_GAP = 12; // Between the code and the name
        const ROW_LINE = "inset 0px -1px 0px rgba(0, 0, 0, 0.05)"; // The light line under a row

        // An option of the country list. The search finds the name, the code (the description, not shown) and
        // the other names of a country (searchText: "Turkey" for "Türkiye").
        const toCountryOption = function (country) {
            return {
                value: country.shortName,
                label: country.name,
                description: country.code,
                code: country.code,
                searchText: country.searchText,
            };
        };

        // The code of a country in a gray round pill
        const createCodePill = function (code) {
            return Label({
                plainText: code,
                fontSize: 16,
                padding: [6, 2],
                color: "rgba(0, 0, 0, 0.05)",
                textColor: "#373836",
                round: 8,
            });
        };

        // A row of the list: the code and the name, a light line under it (white under the mouse: the package).
        const createCountryRow = function (option, row) {
            row.height = COUNTRY_ROW_HEIGHT;
            row.boxShadow = ROW_LINE;
            createCountryView(option);
        };

        // The chosen country in the field: the same as its row.
        const createCountryView = function (option) {
            createCodePill(option.code);
            Label({ plainText: option.label, fontSize: 20, ellipsis: 1 });
        };

        // The phone field takes the code, the mask and the short name of the chosen country
        const selectCountry = function (shortName) {
            const country = countryList.find(function (item) { return item.shortName === shortName; });
            if (!country) return;
            myInput.setCountryCode(country.code);
            myInput.setPhoneMask(country.phoneMask);
            myInput.setUnitText(country.shortName);
            myInput.setValue("");
            myInput.fillAutoPlaceholder();
        };

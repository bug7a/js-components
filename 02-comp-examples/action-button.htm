<!DOCTYPE html>
<html lang="en">
    <head>

        <title>ActionButton</title>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- LIBRARY FILES -->
        <link rel="stylesheet" type="text/css" href="../basic/basic.css">
        <script src="../basic/basic.js" type="text/javascript" charset="utf-8"></script>

        <!-- COMPONENT -->
        <script src="../comp/action-button.js" type="text/javascript" charset="utf-8"></script>

        <script>

        /* Bismillah */

        // SAMPLE: ActionButton (comp/action-button.js). Above it: styleName "ozden".

        const ACTIONS = [
            { key: "photo", text: "Take a Photo" },
            { key: "gallery", text: "Add from Gallery" },
            { key: "url", text: "Add from URL" },
        ];

        // *** VARIABLES:
        let fab, fabOzden, lblAction, btnAnimated;

        const start = function () {

            page.color = "whitesmoke";

            // LABEL: What onAction gives
            lblAction = Label({
                left: 40,
                top: 40,
                text: "Click the yellow button at the bottom right.",
                fontSize: 16,
                textColor: Black(0.5),
            });

            // BUTTON: animated on / off (context/basic-js-animated-rules.md)
            btnAnimated = Button({ left: 40, top: 80, width: 160, height: 40, fontSize: 15, text: "animated: 1" });
            btnAnimated.on("click", toggleAnimated);

            // ACTION BUTTON
            fab = ActionButton({
                items: ACTIONS,
                animated: 1,
                onAction: showAction,
            });

            // ACTION BUTTON: styleName "ozden" (animated: 1 is in the package), above the yellow one
            fabOzden = ActionButton({
                styleName: "ozden",
                bottomSpace: 160,
                rightSpace: 53, // WHY: 64 px button: its middle in one line with the 90 px yellow one.
                items: ACTIONS,
                onAction: showAction,
            });

        };

        // *** OTHER FUNCTIONS:

        const showAction = function (self, key) {
            lblAction.text = "onAction: " + key;
        };

        const toggleAnimated = function () {
            const value = (fab.animated) ? 0 : 1;
            fab.setAnimated(value);
            fabOzden.setAnimated(value);
            btnAnimated.text = "animated: " + value;
        };

        </script>

    </head>
    <body>
    </body>
</html>

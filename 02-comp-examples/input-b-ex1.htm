<!DOCTYPE html>
<html lang="en">
    <head>

        <title>InputB JS Component</title>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0"><!-- , user-scalable=no -->

        <!-- LIBRARY FILES -->
        <!-- <link rel="preload" href="image.png" as="image"> -->
        <link rel="preload" href="../basic/font/open-sans/OpenSans-Regular.ttf" as="font" crossorigin="anonymous">
        <link rel="stylesheet" type="text/css" href="../basic/basic.min.css">
        <script src="../basic/basic.min.js" type="text/javascript" charset="utf-8"></script>
        <!--<script src="basic/scroll-bar.min.js" type="text/javascript" charset="utf-8"></script>-->

        <script src="../comp/tooltip.js" type="text/javascript" charset="utf-8"></script>
        <script src="../comp/input-b.js" type="text/javascript" charset="utf-8"></script>

        <!-- ALL COMPONENTS IN ONE FILE -->
        <!-- <script src="components.js" type="text/javascript" charset="utf-8"></script> -->

        <script>

        const start = function () {

            page.color = "white";

            // GROUP: Autolayout
            AutoLayout();

                // INPUT: #1
                const myInput = InputB({
                    key: "1",
                    width: 350,
                    height: "auto",
                    leftPadding: 80,
                    rightPadding: 60,
                    titleText: "FIRST NAME",
                    placeholder: "Jack",
                    inputValue: "",
                    maxChar: 30,
                    createDescription: 0,
                    descriptionText: "",

                    backgroundColor: "#F6F6F6",
                    selectedBackgroundColor: "#F3F4E0",
                    lineColor: "#141414",
                    selectedLineColor: "#65A293",

                    isRequired: 1,
                    requiredText: "Required",
                    requiredColor: "white",
                    warningText: "Invalid value format",
                    warningColor: "#E5885E",

                    createLeftBox: 1,
                    createRightBox: 0,
                    createUnit: 0,
                    unitText: "",
                    unitStyle: {
                        padding: [12, 4],
                        color: "#373836",
                        textColor: "white",
                        round: 40,
                        fontSize: 14,
                    },

                });

            endAutoLayout(); // END GROUP

            // Other functions of InputB: setTitle(), setDescription() (needs createDescription: 1), setMaxChar(),
            // setPlaceholder(), setBackgroundColor(), setSelectedBackgroundColor(), setLineColor(),
            // setSelectedLineColor(), setRequired(), setRequiredText()

            // Get value
            myInput.onEdit = function () {
                console.log(myInput.getInputValue());
            };

            // *** ADD AN ICON into INPUT (createLeftBox: 1, leftPadding: 80)
            myInput.leftBox.align = "top left";
            myInput.leftBox.padding = [20, 20];

            // ICON:
            myInput.icon = Icon({
                width: 42,
                height: 42,
            });
            myInput.icon.load("../assets/fruids/brokoli.png");
            myInput.leftBox.add(myInput.icon);
            myInput.icon.position = "relative";

        };

        </script>

    </head>
    <body>

        <!-- HTML content -->

    </body>
</html>

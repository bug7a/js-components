<!DOCTYPE html>
<html lang="en">
<head>

    <title>ScrollingText</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preload" href="../basic/font/open-sans/OpenSans-Regular.ttf" as="font" crossorigin="anonymous">
    <link rel="preload" href="../basic/font/open-sans/OpenSans-Bold.ttf" as="font" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="../basic/basic.css">
    <script src="../basic/basic.js" type="text/javascript" charset="utf-8"></script>

    <script src="../comp/scrolling-text.js" type="text/javascript" charset="utf-8"></script>

    <script>

    /* Bismillah */

    // ScrollingText: a one line text that slides to show its end when it does not fit.

    const FILES = [
        "Annual report 2026 - final version with the comments of the board.pdf",
        "Photo.jpg",
        "The list of the customers of the north and the south offices.xlsx",
        "Notes.txt",
    ];

    // GROUP: A title over a sample
    const startSample = function (title) {
        VGroup({ hug: 1, align: "left top", gap: 10, clipContent: 0 });
        Label({ plainText: title, fontSize: 14, bold: 1, textColor: Black(0.5) });
    };

    const endSample = function () {
        endGroup();
    };

    const start = function () {

        page.color = "white";

        VGroup({ align: "center top", gap: 40, padding: 40 });

            Label({ text: "ScrollingText", fontSize: 26, bold: 1, textColor: Black(0.8) });

            // A box with the text
            startSample("mode: \"always\" (it slides again and again)");
                HGroup({
                    width: 220,
                    height: 50,
                    align: "center",
                    color: "white",
                    round: 8,
                    border: 1,
                    borderColor: Black(0.1),
                    padding: [10, 0],
                });
                    ScrollingText({ width: "100%", labelText: "Start. Vegetables are healthy. End." });
                endGroup();
            endSample();

            // A list of long file names: "..." until the mouse comes
            startSample("mode: \"hover\" (it slides under the mouse; a text that fits never moves)");
                VGroup({
                    width: 260,
                    height: "auto",
                    align: "left top",
                    gap: 0,
                    color: "whitesmoke",
                    round: 8,
                    padding: [0, 6],
                });
                    FILES.forEach(function (name) {
                        ScrollingText({
                            width: "100%",
                            labelText: name,
                            mode: "hover",
                            style: { box: { padding: [14, 8] }, label: { fontSize: 15 } },
                        });
                    });
                endGroup();
            endSample();

        endGroup();

    };

    </script>

</head>
<body>
</body>
</html>

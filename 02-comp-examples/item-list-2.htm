<!DOCTYPE html>
<html lang="en">
<head>

    <title>ItemList - sections and motion</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preload" href="../basic/font/open-sans/OpenSans-Regular.ttf" as="font" crossorigin="anonymous">
    <link rel="preload" href="../basic/font/open-sans/OpenSans-Bold.ttf" as="font" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="../basic/basic.css">
    <script src="../basic/basic.js" type="text/javascript" charset="utf-8"></script>
    <script src="../basic/scroll-bar.js" type="text/javascript" charset="utf-8"></script>

    <script src="../comp/search-input.js" type="text/javascript" charset="utf-8"></script>
    <script src="../comp/smart-button.js" type="text/javascript" charset="utf-8"></script>
    <script src="../comp/item-list.js" type="text/javascript" charset="utf-8"></script>

    <script>

    /* Bismillah */

    // ItemList: section rows with a search and the pressed flash (the Usage Examples list of
    // javascript-mobile-app-template), and animated rows: addItem / removeItem with a FLIP motion.

    const PAGE_COLOR = "indianred";
    const CONTENT_WIDTH = 460; // px: the column of the page on a wide screen
    const EXAMPLES_HEIGHT = 520;
    const FOODS_HEIGHT = 380;
    const BUTTON_HEIGHT = 44;
    const BUTTON_STYLE = { label: { fontSize: 16 } };
    const FOOD_PATH = "../assets/fruids/";

    // A section is an item { type: "section", title }: the items under it (until the next section) are its items.
    const EXAMPLES = [
        { type: "section", title: "UI COMPONENTS" },
        { title: "Toggle", desc: "comp/toggle.js" },
        { title: "Page Control", desc: "comp/page-control.js" },
        { title: "Tabs", desc: "comp/tabs.js" },
        { title: "Search Input", desc: "comp/search-input.js" },
        { title: "Action Button", desc: "comp/action-button.js" },
        { title: "Progress Bar", desc: "comp/progress-bar.js" },
        { title: "Web View", desc: "comp/web-view.js" },
        { type: "section", title: "VIEWS" },
        { title: "defaultView", desc: "pages/default-example.js" },
        { title: "secondView", desc: "pages/second-example.js" },
        { title: "smallView", desc: "App.openSheet()" },
        { type: "section", title: "PAGE TEMPLATES" },
        { title: "Select Item Dialog", desc: "pages/color-dialog.js" },
        { title: "Edit Item Dialog", desc: "pages/edit-item-dialog.js" },
        { title: "Template A", desc: "pages/template-a.js" },
        { title: "Lock Screen", desc: "pages/lock.js" },
        { type: "section", title: "TECHNIQUES" },
        { title: "Autolayout Group", desc: "VGroup, HGroup" },
        { title: "Scrolling Text", desc: "comp/scrolling-text.js" },
        { title: "HTML Page", desc: "html/privacy.htm" },
    ];

    // The rows of the Usage Examples tab: white texts on indianred, a dark flash under the finger.
    const EXAMPLES_STYLE = {
        box: { color: "transparent", border: 0, padding: [0, 4] },
        list: { gap: 2 },
        row: { height: 46, padding: [20, 0], gap: 12, round: 12, color: "transparent", motion: "background-color 0.3s" },
        hover: { color: Black(0.06) },
        pressed: { color: Black(0.2) }, // At once, then a 0.3 s fade (row.motion)
        section: { textColor: Black(0.35) },
        focus: { ringColor: White(0.8) },
        empty: { textColor: White(0.8) },
        search: {
            height: 46,
            padding: [0, 0, 0, 8],
            fontSize: 18,
            color: Black(0.2),
            textColor: Black(0.65),
            placeholderColor: Black(0.4),
            border: 0,
            borderBottomStyle: "2px solid " + Black(0.2),
            round: 8,
            searchIconSize: 20,
        },
        scrollBar: { bar_color: "white", bar_mouseOverColor: "white", bar_opacity: 0.5, neverHide: 0, showDots: 0 },
    };

    const FRUIT = "fruits";
    const VEGETABLE = "vegetables";

    // The foods of the animated list. section: the key of the section it goes under.
    const FOODS = [
        { key: "apple", title: "Apple", desc: "Fruit", iconFile: FOOD_PATH + "elma.png", section: FRUIT },
        { key: "banana", title: "Banana", desc: "Fruit", iconFile: FOOD_PATH + "muz.png", section: FRUIT },
        { key: "carrot", title: "Carrot", desc: "Vegetable", iconFile: FOOD_PATH + "havuc.png", section: VEGETABLE },
        { key: "strawberry", title: "Strawberry", desc: "Fruit", iconFile: FOOD_PATH + "cilek.png", section: FRUIT },
        { key: "lemon", title: "Lemon", desc: "Fruit", iconFile: FOOD_PATH + "limon.png", section: FRUIT },
        { key: "tomato", title: "Tomato", desc: "Vegetable", iconFile: FOOD_PATH + "domates.png", section: VEGETABLE },
        { key: "eggplant", title: "Eggplant", desc: "Vegetable", iconFile: FOOD_PATH + "patlican.png", section: VEGETABLE },
        { key: "watermelon", title: "Watermelon", desc: "Fruit", iconFile: FOOD_PATH + "karpuz.png", section: FRUIT },
        { key: "pepper", title: "Green pepper", desc: "Vegetable", iconFile: FOOD_PATH + "yesilbiber.png", section: VEGETABLE },
    ];
    // Apple, Banana, Carrot: the first Add (Strawberry) goes over VEGETABLES, the rows under it move
    const START_FOOD_COUNT = 3;

    const ItemListSample = {};

    // A row of the Usage Examples: the name on the left, its file on the right.
    // (createItemView is called only for the items: the sections are drawn by ItemList, style.section.)
    ItemListSample.createExampleRow = function (item) {
        Label({ plainText: item.title, fontSize: 19, textColor: White(0.85), ellipsis: 1 });
        that.grow = 1;
        that.css.minWidth = "0px"; // WHY: A long name ends with "..." before the file name.
        Label({ plainText: item.desc, fontSize: 12, textColor: White(0.65) });
        that.shrink = 0;
    };

    // The items of the animated list: the two sections and the first foods under them.
    ItemListSample.getStartFoods = function () {
        const foods = FOODS.slice(0, START_FOOD_COUNT);
        const underSection = function (sectionKey) {
            return foods.filter(function (food) { return food.section === sectionKey; });
        };
        return [{ type: "section", key: FRUIT, title: "FRUITS" }]
            .concat(underSection(FRUIT))
            .concat([{ type: "section", key: VEGETABLE, title: "VEGETABLES" }])
            .concat(underSection(VEGETABLE));
    };

    // The place of a new food: at the end of its section (before the next section).
    ItemListSample.getPlaceInSection = function (list, sectionKey) {
        const items = list.getItems();
        const sectionIndex = items.findIndex(function (item) { return item.key === sectionKey; });
        const nextIndex = items.findIndex(function (item, index) { return index > sectionIndex && item.type === "section"; });
        return (nextIndex === -1) ? items.length : nextIndex;
    };

    ItemListSample.getFoodCount = function (list) {
        return list.getItems().filter(function (item) { return item.type !== "section"; }).length;
    };

    // GROUP: A white card with a title and a short description
    ItemListSample.startCard = function (title, description) {
        const card = VGroup({
            width: "100%",
            height: "auto",
            align: "left top",
            gap: 12,
            padding: 16,
            color: "white",
            round: 14,
            css: { alignItems: "stretch" },
        });
            Label({ plainText: title, fontSize: 15, textColor: Black(0.8), bold: 1 });
            Label({
                plainText: description,
                fontSize: 13,
                textColor: Black(0.5),
                width: "100%",
                css: { lineHeight: "1.4" },
            });
        return card;
    };

    const start = function () {

        page.color = PAGE_COLOR;

        const pageBox = startBox(0, 0, "100%", "100%", { color: "transparent", scrollY: 1 });

            VGroup({ width: "100%", height: "auto", align: "center top", gap: 16, padding: [16, 24] });

                // GROUP: The column of the page
                VGroup({
                    width: "100%",
                    height: "auto",
                    align: "left top",
                    gap: 16,
                    css: { maxWidth: CONTENT_WIDTH + "px", alignItems: "stretch" },
                });

                    Label({ plainText: "ItemList: sections and motion", fontSize: 24, textColor: White(0.95), bold: 1 });
                    Label({
                        plainText: "The Usage Examples list of the mobile template: { type: \"section\" } rows, a search that keeps the section of a match, and a dark flash on a click (style.pressed).",
                        fontSize: 13,
                        textColor: White(0.8),
                        width: "100%",
                        css: { lineHeight: "1.4" },
                    });

                    // LIST: Usage Examples (sections, search, the pressed flash)
                    ItemList({
                        width: "100%",
                        height: EXAMPLES_HEIGHT,
                        items: EXAMPLES,
                        selection: "none",
                        showSearch: 1,
                        searchParams: { placeholderText: "Search", searchIconOpacity: 0.4 },
                        style: EXAMPLES_STYLE,
                        createItemView: ItemListSample.createExampleRow,
                        onItemClick: function (self, item) {
                            lblOpened.plainText = "Opened: " + item.title + " (" + item.desc + ")";
                        },
                    });
                    const lblOpened = Label({ plainText: "Click a row: it flashes.", fontSize: 13, textColor: White(0.85) });

                    // GROUP: Card of the animated list
                    ItemListSample.startCard(
                        "animated: 1 · addItem / removeItem",
                        "The rows move to their new places (FLIP), a new row fades in, a removed one fades out and then leaves. A section without items goes too. The count changes at once."
                    );

                        const foodList = ItemList({
                            width: "100%",
                            height: FOODS_HEIGHT,
                            styleName: "modern",
                            animated: 1,
                            items: ItemListSample.getStartFoods(),
                            onChange: function () { showCount(); },
                        });

                        // GROUP: Buttons
                        HGroup({ width: "100%", height: "auto", align: "left center", gap: 8, wrap: 1 });
                            SmartButton({
                                height: BUTTON_HEIGHT,
                                labelText: "Add",
                                style: BUTTON_STYLE,
                                onClick: function () { addFood(); },
                            });
                            SmartButton({
                                height: BUTTON_HEIGHT,
                                labelText: "Remove",
                                style: BUTTON_STYLE,
                                onClick: function () { removeFood(); },
                            });
                            const btnMotion = SmartButton({
                                height: BUTTON_HEIGHT,
                                labelText: "Motion: on",
                                styleName: "ozdenType4",
                                style: BUTTON_STYLE,
                                onClick: function () { toggleMotion(); },
                            });
                        endGroup();

                        const lblCount = Label({ plainText: "", fontSize: 13, textColor: Black(0.5) });

                    endGroup();

                endGroup();

            endGroup();

        endBox();

        ScrollBar({ scrollableBox: pageBox });

        // *** THE ANIMATED LIST

        function showCount() {
            const keys = foodList.getSelectedKeys();
            lblCount.plainText = "Foods: " + ItemListSample.getFoodCount(foodList) + " · selected: " + (keys.length ? keys.join(", ") : "-");
        }

        // The first food that is not in the list goes to the end of its section.
        function addFood() {
            const food = FOODS.find(function (item) { return !foodList.getItem(item.key); });
            if (!food) {
                lblCount.plainText = "All the foods are in the list.";
                return;
            }
            foodList.addItem(Object.assign({}, food), ItemListSample.getPlaceInSection(foodList, food.section));
            showCount();
        }

        // The selected food goes (or the first one, when nothing is selected).
        function removeFood() {
            const firstFood = foodList.getItems().find(function (item) { return item.type !== "section"; });
            if (!firstFood) return;
            const key = foodList.getSelectedKeys()[0] || firstFood.key;
            foodList.removeItem(key, 1);
            showCount(); // WHY: The data changes at once, while the row still fades out.
        }

        // setAnimated(0): the rows are still again (Add and Remove change the list at once).
        function toggleMotion() {
            const isOn = (foodList.animated == 1);
            foodList.setAnimated(isOn ? 0 : 1);
            btnMotion.setText(isOn ? "Motion: off" : "Motion: on");
        }

        showCount();

    };

    </script>

</head>
<body>
</body>
</html>

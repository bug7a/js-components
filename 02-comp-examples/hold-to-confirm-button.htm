<!DOCTYPE html>
<html lang="en">

<head>
    <title>Hold to Confirm Button Component</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- LIBRARY FILES -->
    <link rel="stylesheet" type="text/css" href="../basic/basic.min.css">
    <script src="../basic/basic.min.js" type="text/javascript" charset="utf-8"></script>

    <!-- COMPONENT FILES -->
    <script src="../comp/hold-to-confirm-button.js" type="text/javascript" charset="utf-8"></script>

    <script>

        const ASSETS_PATH = "../comp/hold-to-confirm-button/";

        const UI_STATES = {
            SHOW_FRUID: "show-fruid",
            DELETE_FRUID: "delete-fruid",
            DISABLE_DELETE: "disable-delete-button",
        };

        // *** VARIABLES:
        let icoFruid, btnConfirm, btnShow;

        const start = function () {

            page.color = "whitesmoke";

            // GROUP: Icon
            HGroup({
                height: "50%",
            });

                icoFruid = Icon({
                    width: 80,
                    height: 80,
                });
                icoFruid.load("../assets/fruids/yabanmersini.png");
                icoFruid.setMotion("opacity 0.2s");

            endGroup();

            // GROUP: Buttons
            HGroup({
                gap: 8,
            });

                // Confirm Button
                btnConfirm = HoldToConfirmButton({
                    width: "auto",
                    labelText: "Hold to Delete",
                    completedText: "DELETED",
                    iconFile: ASSETS_PATH + "trash.png",
                    holdingIconFile: ASSETS_PATH + "trash-red.png",
                    style: {
                        layout: { gap: 4, padding: [18, 5] },
                        label: { fontSize: 20, textColor: Black(0.65) },
                        box: { color: "white", border: 1, borderColor: Black(0.3), round: 8 },
                        holdingBox: { color: "#FFD1CB" },
                    },
                });

                btnConfirm.onConfirm = function (self) {
                    console.log("Button held!");
                    refreshView(UI_STATES.DELETE_FRUID);
                };

                btnConfirm.onReset = function (self) {
                    refreshView(UI_STATES.DISABLE_DELETE);
                };

                // Show Button
                btnShow = Button({
                    text: "Show",
                    color: "white",
                    minimal: 1,
                    round: 8,
                    border: 1,
                });

                btnShow.on("click", function () {
                    refreshView(UI_STATES.SHOW_FRUID);
                });

            endGroup();

            refreshView(UI_STATES.SHOW_FRUID);

        };

        // *** OTHER FUNCTIONS:

        const refreshView = function (state) {

            switch (state) {

                case UI_STATES.SHOW_FRUID:

                    // show icon
                    icoFruid.opacity = 1;

                    // delete button usable
                    btnConfirm.opacity = 1;
                    btnConfirm.clickable = 1;

                    // show button disabled
                    btnShow.opacity = 0.5;
                    btnShow.clickable = 0;

                    break;

                case UI_STATES.DELETE_FRUID:

                    // hide icon
                    icoFruid.opacity = 0;

                    break;

                case UI_STATES.DISABLE_DELETE:

                    // delete button disabled
                    btnConfirm.opacity = 0.5;
                    btnConfirm.clickable = 0;

                    // show button usable
                    btnShow.opacity = 1;
                    btnShow.clickable = 1;

                    break;

            }

        };
    </script>
</head>

<body></body>

</html>

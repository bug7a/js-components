<!DOCTYPE html>
<html lang="en">
    <head>

        <title>Tiny Select</title>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0"><!-- , user-scalable=no -->

        <link rel="preload" href="../basic/font/open-sans/OpenSans-Regular.ttf" as="font" crossorigin="anonymous">
        <link rel="preload" href="../basic/font/open-sans/OpenSans-Bold.ttf" as="font" crossorigin="anonymous">
        <link rel="stylesheet" type="text/css" href="../basic/basic.min.css">
        <script src="../basic/basic.js" type="text/javascript" charset="utf-8"></script>

        <script src="../comp/tiny-select.js" type="text/javascript" charset="utf-8"></script>

        <script type="text/javascript">

        const start = function () {

            // TINY SELECT: Minimal select text
            const tinySelectA = TinySelect({
                left: 40,
                top: 40,
                titleText: "Theme",
                list: [
                    { id: "1", label: "(none)" },
                    { id: "2", label: "Star Wars" },
                    { id: "3", label: "Supernova" },
                    { id: "4", label: "Metro" },
                    { id: "5", label: "1990s" },
                ],
                selectedIndex: 2,
            });
            tinySelectA.onChange = showSelected;

            // TINY SELECT:
            const tinySelectB = TinySelect({
                titleText: "Language",
                label: "",
                list: [
                    { id: "1", label: "English" },
                    { id: "2", label: "Spanish" },
                    { id: "3", label: "French" },
                    { id: "4", label: "Turkish" },
                ],
                selectedIndex: 3,
            });
            tinySelectB.onChange = showSelected;

            // Put second object bottom of the previous object.
            tinySelectB.aline(tinySelectA, "bottom", 4, "left");

            // Other functions: setList(list, selectedIndex), setSelectedIndex(), setTitle(), setEnabled(), setColor()

        };

        const showSelected = function (self) {
            const item = self.getSelectedItem();
            console.log(`${self.titleText}: ${item.label} (${item.id})`);
        };

        </script>

    </head>
    <body>

        <!-- HTML content -->

    </body>
</html>

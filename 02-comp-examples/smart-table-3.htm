<!DOCTYPE html>
<html lang="en">

<head>
    <title>Smart Table - Edit & Delete Sample</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- LIBRARY FILES -->
    <link rel="stylesheet" type="text/css" href="../basic/basic.min.css">
    <script src="../basic/basic.js" type="text/javascript" charset="utf-8"></script>
    <script src="../basic/scroll-bar.js" type="text/javascript" charset="utf-8"></script>

    <!-- COMPONENT FILES -->
    <script src="../comp/search-input.js" type="text/javascript" charset="utf-8"></script>
    <script src="../comp/tooltip.js" type="text/javascript" charset="utf-8"></script>
    <script src="../comp/text-field.js" type="text/javascript" charset="utf-8"></script>
    <script src="../comp/email-field.js" type="text/javascript" charset="utf-8"></script>
    <script src="../comp/number-field.js" type="text/javascript" charset="utf-8"></script>
    <script src="../comp/hold-to-confirm-button.js" type="text/javascript" charset="utf-8"></script>
    <script src="../comp/context-menu.js" type="text/javascript" charset="utf-8"></script>
    <script src="../comp/smart-table.js" type="text/javascript" charset="utf-8"></script>

    <script>

        const titleDataList = [
            { name: "ID", dataTitle: "id", dataType: "integer", width: 100, sortable: 1 },
            { name: "NAME", dataTitle: "name", dataType: "string", width: 180, sortable: 1 },
            { name: "EMAIL", dataTitle: "email", dataType: "string", width: 290, sortable: 0 },
            { name: "", dataTitle: "active", dataType: "boolean", width: 80, sortable: 0 },
        ];

        const itemDataList = [
            { id: 1, name: "Bugra Ozden", desc: "Developer", email: "bugra.ozden@gmail.com", active: 1 },
            { id: 2, name: "Alper Kaya", desc: "Product Manager", email: "a.kaya@company.net", active: 1 },
            { id: 3, name: "Murat Demir", desc: "Backend Engineer", email: "mdemir@work.io", active: 0 },
            { id: 4, name: "Deniz Arslan", desc: "UI/UX Designer", email: "deniz_arslan@studio.com", active: 1 },
            { id: 5, name: "Nilüfer Çelik", desc: "Data Analyst", email: "n.celik@datahouse.org", active: 1 },
            { id: 6, name: "Frank Weber", desc: "DevOps Engineer", email: "frank.weber@infrateam.de", active: 0 },
            { id: 7, name: "Dany Moreau", desc: "Mobile Developer", email: "dmoreau@appworks.fr", active: 0 },
            { id: 8, name: "Duygu Şahin", desc: "QA Engineer", email: "duygu.sahin@testlab.com", active: 0 },
            { id: 9, name: "Filiz Yıldız", desc: "Scrum Master", email: "f.yildiz@agile.io", active: 1 },
            { id: 10, name: "Anka Polat", desc: "System Architect", email: "anka_polat@systems.net", active: 1 },
            { id: 11, name: "Ceren Aktaş", desc: "Frontend Developer", email: "ceren.aktas@webco.com", active: 1 },
            { id: 12, name: "Emre Güneş", desc: "Database Administrator", email: "e.gunes@dbworks.org", active: 0 },
            { id: 13, name: "Selin Koç", desc: "Business Analyst", email: "selin.koc@analytics.io", active: 1 },
            { id: 14, name: "Tarık Yılmaz", desc: "Cloud Engineer", email: "tarik.yilmaz@cloudbase.co", active: 1 },
            { id: 15, name: "Yasemin Doğan", desc: "Technical Writer", email: "y.dogan@docshub.net", active: 0 },
            { id: 16, name: "Kemal Aydın", desc: "Security Specialist", email: "kemal_aydin@securelab.com", active: 1 },
            { id: 17, name: "Pınar Erdoğan", desc: "HR Manager", email: "p.erdogan@people.io", active: 0 },
            { id: 18, name: "Baran Çetin", desc: "Full Stack Developer", email: "baran.cetin@devstack.net", active: 1 },
            { id: 19, name: "Zeynep Karaca", desc: "Marketing Specialist", email: "zkaraca@brandworks.com", active: 1 },
            { id: 20, name: "Hakan Bulut", desc: "Network Engineer", email: "h.bulut@netcore.org", active: 0 },
        ];

        let newId = null;
        let selectedId = null;
        let smartTable1 = null;
        let inputId, inputName, inputEmail, inputActive, lblStatus;
        let btnEdit, btnDelete;

        const ASSETS_PATH = "../comp/hold-to-confirm-button/";

        const FORM_BUTTON_STYLE = {
            width: "auto",
            padding: [12, 0],
            color: "#A8CFB1",
            fontSize: 16,
            minimal: 1,
            border: 0,
            round: 8,
        };

        const start = function () {

            page.color = "whitesmoke";
            newId = findNextAvailableID();

            // LEFT: Form Panel
            VGroup({
                width: "40%",
                gap: 8,
                padding: [0, 16],
                align: "top left",
            });

                initTitle();
                initEditForm();
                initStatusLabel();
                initFormButtons();

            endGroup();

            // RIGHT: Smart Data Table
            smartTable1 = SmartTable({
                top: 0,
                titleDataList: titleDataList,
                itemDataList: itemDataList,
                onSelect: function (self, data) {
                    console.log(data);
                    fillForm(data);
                },
                style: { width: "60%", height: "100%" },
            });
            smartTable1.right = smartTable1.getVerticalScrollWidth() + 2;

        };

        const initTitle = function () {

            // Title
            Label({
                text: "Record Details",
                fontSize: 24,
                padding: [20, 6],
                textColor: "#65A293",
                fontFamily: "opensans-bold",
                css: { marginBottom: "8px", whiteSpace: "nowrap" },
            });

        };

        const initStatusLabel = function () {

            // Status Label
            lblStatus = Label({
                text: "No record selected",
                fontSize: 14,
                padding: [20, 6],
                css: { color: "#999", marginTop: "8px" },
            });

        };

        // Fill input fields from selected data
        const fillForm = function (data) {

            selectedId = data.id;
            inputId.setValue(String(data.id));
            inputName.setValue(data.name);
            inputEmail.setValue(data.email);
            inputActive.setValue(String(data.active));
            lblStatus.text = "Selected ID: " + data.id;
            btnEdit.enabled = 1;
            btnDelete.clickable = 1;
            btnDelete.opacity = 1;

        };

        // Clear input fields
        const clearForm = function () {

            selectedId = null;
            inputId.setValue("");
            inputName.setValue("");
            inputEmail.setValue("");
            inputActive.setValue("");
            lblStatus.text = "No record selected";
            btnEdit.enabled = 0;
            btnDelete.clickable = 0;
            btnDelete.opacity = 0.6;

        };

        const initEditForm = function () {

            const inputStyle = {
                width: "100%",
                height: "auto",
                leftPadding: 20,
                rightPadding: 20,
                showDescription: 0,
                backgroundColor: "#F6F6F6",
                focusBackgroundColor: "#FFFFFF",
                lineColor: "transparent",
                focusLineColor: "#65A293",
                showLeftBox: 0,
                showRightBox: 0,
                showUnit: 0,
                value: "",
                maxLength: 100,
            };

            // ID (read-only)
            inputId = TextField({
                key: "id",
                ...inputStyle,
                titleText: "ID",
                placeholder: "Auto",
            });
            // Read-only
            inputId.input.enabled = 0;

            // Name
            inputName = TextField({
                key: "name",
                ...inputStyle,
                titleText: "NAME",
                placeholder: "Enter name",
            });

            // Email
            inputEmail = EmailField({
                key: "email",
                ...inputStyle,
                required: 0,
                titleText: "EMAIL",
                placeholder: "Enter email",
                warningText: "Invalid email format",
                warningColor: "#E5885E",
            });

            // Active
            inputActive = NumberField({
                key: "active",
                ...inputStyle,
                titleText: "ACTIVE",
                placeholder: "1 or 0",
                maxLength: 1,
                allowNegative: 0,
                allowDecimal: 0,
            });

            // Only 0 or 1: anything else becomes 1
            inputActive.onChange = function () {
                const value = inputActive.getValue();
                if (!(value == 1 || value == 0)) inputActive.setValue("1");
            };

        };

        const initFormButtons = function () {

            // Buttons Group
            HGroup({
                fit: 1,
                gap: 8,
                padding: [20, 8],
                align: "left center",
            });

                createUpdateButton();
                createDeleteButton();
                createClearButton();

            endGroup();

            createAddButton();

        };

        const findSelectedIndex = function () {
            return itemDataList.findIndex(function (item) {
                return item.id === selectedId;
            });
        };

        const createUpdateButton = function () {

            btnEdit = Button({
                text: "Update Record",
                enabled: 0,
                ...FORM_BUTTON_STYLE,
                css: { whiteSpace: "nowrap" },
            });

            btnEdit.on("click", function () {
                if (selectedId === null) return;

                const index = findSelectedIndex();
                if (index === -1) return;

                itemDataList[index].name = inputName.getValue();
                itemDataList[index].email = inputEmail.getValue();
                itemDataList[index].active = parseInt(inputActive.getValue()) || 0;
                smartTable1.setItemDataList(itemDataList);
                lblStatus.text = "Updated ID: " + selectedId;
            });

        };

        // Hold to Confirm
        const createDeleteButton = function () {

            btnDelete = HoldToConfirmButton({
                width: "auto",
                labelText: "Hold to Delete",
                completedText: "DELETED",
                iconFile: ASSETS_PATH + "trash.png",
                holdingIconFile: ASSETS_PATH + "trash-red.png",
                style: {
                    layout: { gap: 4, padding: FORM_BUTTON_STYLE.padding },
                    icon: { width: 24, height: 24 },
                    label: { fontSize: FORM_BUTTON_STYLE.fontSize, textColor: Black(0.65) },
                    box: {
                        color: FORM_BUTTON_STYLE.color,
                        border: FORM_BUTTON_STYLE.border,
                        borderColor: Black(0.3),
                        round: FORM_BUTTON_STYLE.round,
                    },
                    holdingBox: { color: "#FFD1CB" },
                    holdingLabel: { fontSize: FORM_BUTTON_STYLE.fontSize },
                },
            });
            btnDelete.clickable = 0;
            btnDelete.opacity = 0.6;

            btnDelete.onConfirm = function (self) {
                if (selectedId === null) return;

                const index = findSelectedIndex();
                if (index === -1) return;

                itemDataList.splice(index, 1);
                smartTable1.setItemDataList(itemDataList);
                lblStatus.text = "Deleted ID: " + selectedId;
                clearForm();
            };

        };

        const createClearButton = function () {

            const btnClear = Button({
                text: "Clear Form",
                width: "auto",
                ...FORM_BUTTON_STYLE,
                css: { whiteSpace: "nowrap" },
            });

            btnClear.on("click", clearForm);

        };

        const createAddButton = function () {

            const btnAdd = Button({
                text: "Add New",
                width: "auto",
                height: "auto",
                color: "#65A293",
                padding: [6, 2],
                fontSize: 16,
                position: "absolute",
                right: 20,
                top: 10,
            });

            btnAdd.on("click", function () {
                const data = {
                    id: newId,
                    name: "User " + newId,
                    desc: "desc",
                    email: "user" + newId + "a@test.com",
                    active: 0,
                };
                itemDataList.push(data);
                newId++;
                smartTable1.setItemDataList(itemDataList);
                fillForm(data);
            });

        };

        const findNextAvailableID = function () {

            if (itemDataList.length === 0) return 1;

            let maxId = 0;
            for (let i = 0; i < itemDataList.length; i++) {
                if (itemDataList[i].id > maxId) maxId = itemDataList[i].id;
            }

            return maxId + 1;

        };

    </script>
</head>

<body></body>

</html>

<!DOCTYPE html>
<html lang="en">
    <head>

        <title>DataTable - Custom Cells</title>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- LIBRARY FILES -->
        <link rel="stylesheet" type="text/css" href="../basic/basic.css">
        <script src="../basic/basic.js" type="text/javascript" charset="utf-8"></script>
        <script src="../basic/scroll-bar.js" type="text/javascript" charset="utf-8"></script>

        <!-- COMPONENTS -->
        <script src="../comp/search-input.js" type="text/javascript" charset="utf-8"></script>
        <script src="../comp/data-table.js" type="text/javascript" charset="utf-8"></script>

        <!-- DATA -->
        <script src="../assets/data-table/people.js" type="text/javascript" charset="utf-8"></script>

        <script>

        /* Bismillah */

        // SAMPLE (DataTable, comp/data-table.js): Your own cells: a colored ID column, a gray city badge, a small chart and a trash button that deletes
        // the row. Search in the header; the rows have one height (rowHeight).

        const TABLE_WIDTH = 760;
        const TABLE_HEIGHT = 520;
        const ROW_HEIGHT = 46;
        const ID_COLOR = "#FFF5D6";
        const BADGE_COLOR = Black(0.04);
        const CHART_WIDTH = 100;
        const CHART_HEIGHT = 8;
        const CHART_LOW_LIMIT = 40;
        const CHART_HIGH_LIMIT = 80;
        const CHART_COLORS = { low: "orangered", middle: "#689BD2", high: "seagreen" };
        const TRASH_BUTTON_SIZE = 34;
        const TRASH_ICON_SIZE = 18;

        let table;

        const start = function () {

            page.color = "#F2F2F2";

            // GROUP: The page (the table in the middle)
            VGroup({ align: "center" });

                // TABLE: People
                table = DataTable({
                    width: TABLE_WIDTH,
                    height: TABLE_HEIGHT,
                    rowHeight: ROW_HEIGHT,
                    titleText: "People",
                    showSearch: 1,
                    searchParams: { placeholderText: "Name or city" },
                    columns: [
                        { key: "id", title: "ID", valueIndex: 0, type: "number", width: 64, align: "center", sortable: 1, cellColor: ID_COLOR, cellStyle: { bold: 1 } },
                        { key: "name", title: "First And Last Name", valueIndex: 1, width: 230, sortable: 1, cellStyle: { fontSize: 13 } },
                        { key: "city", title: "City", valueIndex: 2, width: 130, align: "center", sortable: 1, createView: createCityBadge },
                        { key: "graph", title: "Graph", valueIndex: 0, type: "number", width: 150, sortable: 1, createView: createSmallChart },
                        { key: "action", title: "", valueIndex: 0, align: "center", createView: createTrashButton },
                    ],
                    rows: testData,
                    sortKey: "name",
                });

            endGroup();

        };

        // LABEL: A gray badge with the city
        const createCityBadge = function (cell, city) {
            Label({
                plainText: city,
                fontSize: 14,
                textColor: Black(0.5),
                color: BADGE_COLOR,
                round: 8,
                padding: [12, 3],
            });
        };

        // BOX: A small bar; the value (0 - 100) fills a part of it
        const createSmallChart = function (cell, value) {

            startBox({
                width: CHART_WIDTH,
                height: CHART_HEIGHT,
                color: "white",
                border: 1,
                borderColor: Black(0.8),
                round: 2,
            });

                // BOX: Value
                Box(0, 0, Math.max(0, Math.min(100, value)) + "%", "100%", {
                    color: getChartColor(value),
                    opacity: 0.6,
                    css: { borderRight: "2px solid black" },
                });

            endBox();

        };

        const getChartColor = function (value) {
            if (value < CHART_LOW_LIMIT) return CHART_COLORS.low;
            if (value < CHART_HIGH_LIMIT) return CHART_COLORS.middle;
            return CHART_COLORS.high;
        };

        // BOX: The trash button of a row: the record goes from the data and from the table
        const createTrashButton = function (cell, id, row) {

            const button = startBox({
                width: TRASH_BUTTON_SIZE,
                height: TRASH_BUTTON_SIZE,
                round: TRASH_BUTTON_SIZE / 2,
                color: "transparent",
                clickable: 1,
                cursor: "pointer",
                role: "button",
                aria: { label: "Delete " + row.data[1] },
            });

                // ICON: Trash
                Icon({ width: TRASH_ICON_SIZE, height: TRASH_ICON_SIZE, opacity: 0.6 });
                that.load("../assets/data-table/trash.svg");
                that.center();

            endBox();

            button.onHoverChange(function (self, isOver) {
                button.color = isOver ? Black(0.06) : "transparent";
            });
            button.on("click", function (self, event) {
                event.stopPropagation(); // WHY: the click must not select the row that is deleted
                deleteRow(id);
            });

        };

        const deleteRow = function (id) {
            const index = testData.findIndex(function (data) { return data[0] == id; });
            if (index == -1) return;
            testData.splice(index, 1);
            table.removeRow(id);
        };

        </script>

    </head>
    <body>
    </body>
</html>

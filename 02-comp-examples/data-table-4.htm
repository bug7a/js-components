<!DOCTYPE html>
<html lang="en">
    <head>

        <title>DataTable - Add, Edit, Delete</title>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- LIBRARY FILES -->
        <link rel="stylesheet" type="text/css" href="../basic/basic.css">
        <script src="../basic/basic.js" type="text/javascript" charset="utf-8"></script>
        <script src="../basic/scroll-bar.js" type="text/javascript" charset="utf-8"></script>

        <!-- COMPONENTS -->
        <script src="../comp/data-table.js" type="text/javascript" charset="utf-8"></script>

        <script>

        /* Bismillah */

        // SAMPLE (DataTable, comp/data-table.js): A column with your own cells (circles of colors), and the rows changed with updateRows():
        // the buttons add, change and delete rows; the sorting stays.

        const PAGE_WIDTH = 700;
        const PAGE_SPACE = 10;
        const BUTTON_WIDTH = 140;
        const BUTTON_HEIGHT = 50;
        const BUTTON_GAP = 4;
        const COLOR_SIZE = 30;
        const COLOR_GAP = 6;
        const ADD_COLOR = "#5ABB9F";
        const DELETE_COLOR = "indianred";

        // The data: [id, name, colors]
        let palettes = [
            [1, "Complementary", ["#689BD2", "#BE94CA", "#FE5D49"]],
            [2, "Split Complementary", ["#CC75AA", "#FEC108", "#4577C1"]],
            [3, "Triadic", ["#63B964", "#9F60BD"]],
            [4, "Square", ["#FEC108", "#FE5D49", "#4577C1", "#5ABB9F"]],
        ];

        let table;

        const start = function () {

            page.fit(PAGE_WIDTH);
            page.onResize(function () {
                page.fit(PAGE_WIDTH);
            });
            page.color = "white";

            // TABLE: Palettes
            table = DataTable({
                left: 0,
                top: 0,
                width: "100%",
                height: "calc(100% - " + (BUTTON_HEIGHT + PAGE_SPACE * 2) + "px)",
                styleName: "minimal",
                canSelect: 0,
                columns: [
                    { key: "id", title: "#", valueIndex: 0, type: "number", width: 60, sortable: 1 },
                    { key: "name", title: "Palette Name", valueIndex: 1, sortable: 1 },
                    { key: "colors", title: "Colors", valueIndex: 2, align: "center", iconFile: "../assets/data-table/palette.svg", createView: createColorPalette },
                ],
                rows: palettes,
            });

            createButtons();

        };

        // GROUP: A row of color circles (column.createView: made in the cell)
        const createColorPalette = function (cell, colorList) {

            HGroup({ hug: 1, gap: COLOR_GAP });

                colorList.forEach(function (color) {
                    Box({
                        width: COLOR_SIZE,
                        height: COLOR_SIZE,
                        round: COLOR_SIZE / 2,
                        border: 1,
                        borderColor: Black(0.8),
                        color: color,
                    });
                });

            endGroup();

        };

        const createButtons = function () {

            // GROUP: Test buttons
            HGroup({ left: PAGE_SPACE, bottom: PAGE_SPACE, hug: 1, gap: BUTTON_GAP, position: "absolute" });

                createButton("Add Items", ADD_COLOR, addPalettes);
                createButton("Update Items", ADD_COLOR, renameFirstPalette);
                createButton("Delete Items", DELETE_COLOR, deleteTwoPalettes);
                createButton("Clear All", DELETE_COLOR, clearPalettes);

            endGroup();

        };

        const createButton = function (text, color, onClick) {
            const button = Button({
                text: text,
                width: BUTTON_WIDTH,
                height: BUTTON_HEIGHT,
                fontSize: 18,
                minimal: 1,
                color: color,
            });
            button.on("click", onClick);
            return button;
        };

        // Two new palettes after the biggest id
        const addPalettes = function () {
            const biggestId = table.getBiggestId();
            palettes.push([biggestId + 1, "Rectangle", ["#9F60BD", "#FE5D49", "#FE5D49", "#5ABB9F"]]);
            palettes.push([biggestId + 2, "Natural", ["#5ABB9F", "#9F60BD", "#FE5D49"]]);
            table.updateRows(palettes);
        };

        const renameFirstPalette = function () {
            if (palettes.length == 0) return;
            palettes[0] = [palettes[0][0], "Edited Name", ["#000000", "#FFFFFF"]];
            table.updateRows(palettes);
        };

        // Two palettes from the second one
        const deleteTwoPalettes = function () {
            palettes.splice(1, 2);
            table.updateRows(palettes);
        };

        const clearPalettes = function () {
            palettes = [];
            table.clearRows();
        };

        </script>

    </head>
    <body>
    </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>

    <title>DataTable</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preload" href="../basic/font/open-sans/OpenSans-Regular.ttf" as="font" crossorigin="anonymous">
    <link rel="preload" href="../basic/font/open-sans/OpenSans-Bold.ttf" as="font" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="../basic/basic.css">
    <script src="../basic/basic.js" type="text/javascript" charset="utf-8"></script>
    <script src="../basic/scroll-bar.js" type="text/javascript" charset="utf-8"></script>

    <script src="../comp/smart-button.js" type="text/javascript" charset="utf-8"></script>
    <script src="../comp/search-input.js" type="text/javascript" charset="utf-8"></script>
    <script src="../comp/data-table.js" type="text/javascript" charset="utf-8"></script>
    <script src="../comp/scroll-area.js" type="text/javascript" charset="utf-8"></script>

    <script>

    /* Bismillah */

    // DataTable: the three style packages, the search, the selection, updateRows() and your own cells.
    // For very many rows: comp/smart-table.js (02-comp-examples/smart-table-5.htm, 2M rows).

    const CARD_WIDTH = 560;
    const WIDE_CARD_WIDTH = 2 * CARD_WIDTH + 20;
    const TABLE_HEIGHT = 380;
    const ORDER_COUNT = 40;
    const STATUS_COLORS = { Paid: "seagreen", Waiting: "#C98A00", Late: "indianred" };

    const NAMES = ["Ayşe Yılmaz", "John Smith", "İlker Şahin", "Jane Doe", "Emre Çelik", "Sofia Rodriguez", "Peter Johnson",
        "Zeynep Öztürk", "Ahmed Ali", "Olivia Brown", "Can Doğan", "Emma Williams"];
    const CITIES = ["İstanbul", "London", "İzmir", "Paris", "Ankara", "Madrid", "Berlin", "Tokyo"];
    const STATUSES = ["Paid", "Waiting", "Late"];

    // 40 orders: [id, customer, city, amount, status]
    const ORDERS = [];
    for (let i = 1; i <= ORDER_COUNT; i++) {
        const customer = NAMES[i % NAMES.length];
        const city = CITIES[(i * 3) % CITIES.length];
        const amount = (i * 37) % 500 + 20;
        const status = STATUSES[(i * 7) % STATUSES.length];
        ORDERS.push([i, customer, city, amount, status]);
    }

    const ORDER_COLUMNS = [
        { key: "id", title: "#", valueIndex: 0, type: "number", width: 60, sortable: 1 },
        { key: "customer", title: "Customer", valueIndex: 1, sortable: 1 },
        { key: "city", title: "City", valueIndex: 2, width: 120, sortable: 1 },
        { key: "amount", title: "Amount", valueIndex: 3, type: "number", width: 130, align: "right", sortable: 1 },
    ];

    // The page look of each style package (the table sits on it)
    const LOOKS = {
        light: { color: "white", textColor: Black(0.5) },
        dark: { color: "#141414", textColor: White(0.5) },
    };

    // GROUP: A card with a title and a short description.
    const startCard = function (title, description, look, width = CARD_WIDTH) {
        VGroup({
            width: width,
            height: "auto",
            align: "left top",
            gap: 12,
            padding: 16,
            color: look.color,
            round: 12,
            border: 1,
            borderColor: Black(0.1),
            css: { alignItems: "stretch", maxWidth: "100%" },
        });
        Label({ plainText: title, fontSize: 14, textColor: look.textColor, bold: 1 });
        Label({
            plainText: description,
            fontSize: 13,
            textColor: look.textColor,
            width: "100%",
            css: { lineHeight: "1.4" },
        });
    };

    const endCard = function () {
        endGroup();
    };

    const showRow = function (label, row) {
        if (!row) {
            label.plainText = "Nothing is selected.";
            return;
        }
        label.plainText = "Selected: " + row.data.join(" · ");
    };

    const createStyleSample = function (styleName, description, look) {
        startCard("styleName: \"" + styleName + "\"", description, look);
            DataTable({
                width: "100%",
                height: TABLE_HEIGHT,
                styleName: styleName,
                titleText: "Orders",
                showSearch: 1,
                columns: ORDER_COLUMNS,
                rows: ORDERS,
                sortKey: "id",
                onSelect: function (self, row) { showRow(info, row); },
            });
            const info = Label({
                plainText: "Click a row (or Tab to the table, then the arrow keys).",
                width: "100%",
                fontSize: 13,
                textColor: look.textColor,
            });
        endCard();
    };

    // LABEL: A colored status badge (column.createView)
    const createStatusBadge = function (cell, status) {
        Label({
            plainText: status,
            fontSize: 12,
            bold: 1,
            textColor: "white",
            color: STATUS_COLORS[status],
            round: 10,
            padding: [10, 2],
        });
    };

    // The rows change with updateRows(): the sorting, the search and the selection stay.
    const createUpdateSample = function () {

        const look = LOOKS.light;
        const rows = ORDERS.slice(0, 8).map(function (data) { return data.slice(); });
        const statusColumn = {
            key: "status",
            title: "Status",
            valueIndex: 4,
            width: 120,
            align: "center",
            sortable: 1,
            createView: createStatusBadge,
        };

        startCard(
            "updateRows() · your own cells (column.createView)",
            "Add, change and remove rows: only the changed rows are drawn again. The status is a badge made by the column.",
            look,
            WIDE_CARD_WIDTH
        );

            const table = DataTable({
                width: "100%",
                height: TABLE_HEIGHT,
                styleName: "plain",
                rowHeight: 48,
                columns: ORDER_COLUMNS.concat([statusColumn]),
                rows: rows,
                sortKey: "amount",
                sortDirection: "desc",
            });

            HGroup({ hug: 1, gap: 8, wrap: 1, css: { maxWidth: "100%" } }); // WHY wrap: a phone
                createButton("Add a row", function () {
                    rows.push([table.getBiggestId() + 1, "New Customer", "İstanbul", 999, "Waiting"]);
                    table.updateRows(rows);
                });
                createButton("Pay the first", function () {
                    if (rows.length) rows[0][4] = "Paid";
                    table.updateRows(rows);
                });
                createButton("Remove the selected", function () {
                    const id = table.getSelectedId();
                    const index = rows.findIndex(function (data) { return data[0] == id; });
                    if (index != -1) rows.splice(index, 1);
                    table.updateRows(rows);
                });
            endGroup();

        endCard();

    };

    // A button of the sample (SmartButton, white)
    const createButton = function (text, onClick) {
        return SmartButton({ labelText: text, tone: "white", onClick: onClick });
    };

    const start = function () {

        page.color = "#E9EAE6";

        ScrollArea({ align: "center top", gap: 24, padding: 32 });

            Label({ text: "DataTable", fontSize: 26, bold: 1, textColor: Black(0.8) });
            Label({
                plainText: "More samples: data-table-2 ... data-table-5 · for very many rows: SmartTable",
                fontSize: 14,
                textColor: Black(0.45),
            });

            // GROUP: The style packages
            HGroup({ width: "100%", height: "auto", align: "center top", gap: 20, wrap: 1 });
                createStyleSample(
                    "classic",
                    "A gray title row, striped rows, a soft yellow selection. Search: try \"istanbul\" (the Turkish letters are found without their marks).",
                    LOOKS.light
                );
                createStyleSample("plain", "White, only lines: a table inside a page.", LOOKS.light);
                createStyleSample("dark", "For a dark page; the search box is ozdenDark.", LOOKS.dark);
            endGroup();

            createUpdateSample();

        endGroup();

    };

    </script>

</head>
<body>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
    <head>

        <title>InputB JS Component</title>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0"><!-- , user-scalable=no -->

        <!-- LIBRARY FILES -->
        <!-- <link rel="preload" href="image.png" as="image"> -->
        <link rel="preload" href="../basic/font/open-sans/OpenSans-Regular.ttf" as="font" crossorigin="anonymous">
        <link rel="stylesheet" type="text/css" href="../basic/basic.min.css">
        <script src="../basic/basic.min.js" type="text/javascript" charset="utf-8"></script>
        <!--<script src="basic/scroll-bar.min.js" type="text/javascript" charset="utf-8"></script>-->

        <script src="../comp/tooltip.js" type="text/javascript" charset="utf-8"></script>
        <script src="../comp/input-b.js" type="text/javascript" charset="utf-8"></script>
        <script src="../comp/number-input-b.js" type="text/javascript" charset="utf-8"></script>

        <!-- ALL COMPONENTS IN ONE FILE -->
        <!-- <script src="components.js" type="text/javascript" charset="utf-8"></script> -->

        <script>

        const start = function () {

            page.color = "white";

            // GROUP: Autolayout
            AutoLayout({
                flow: "vertical",
                gap: 20,
            });

                // INPUT: #1
                const myInput1 = InputB({
                    key: "1",
                    isRequired: 1,
                    placeholder: "Jack",
                    leftPadding: 20,
                });
                myInput1.setTitle("FIRST NAME");

                // INPUT: #2
                const myInput2 = NumberInputB({
                    key: "2",
                    titleText: "HEIGHT",
                    placeholder: "175",
                    descriptionText: "The vertical size...",
                    unitText: "cm",
                    maxChar: 3,
                    isRequired: 0,
                    allowNegative: 0,
                    allowDecimal: 0,
                });
                myInput2.onEdit = function () {
                    console.log(myInput2.getInputValue());
                };

                // INPUT: #3
                const myInput3 = InputB({
                    key: "3",
                    placeholder: "",
                    titleText: "COUNT",
                    descriptionText: "As you type something, it will write the number of characters.",
                    isRequired: 1,
                    maxChar: 20,
                    unitText: "0/20",
                    unitStyle: {
                        fontSize: 16,
                    },
                });
                myInput3.onEdit = function () {
                    const currentLength = myInput3.input.text.length;
                    myInput3.setUnitText(`${currentLength}/${myInput3.maxChar}`);
                };

            endAutoLayout(); // END GROUP

            // GROUP: Setting buttons
            AutoLayout({
                flow: "horizontal",
                align: "left top",
                gap: 8,
                padding: [20, 20],
            });

                createSettingButton("Button A");
                createSettingButton("Button B");

            endAutoLayout();

        };

        const createSettingButton = function (text) {
            const btn = Button({
                text: text,
                width: "auto",
                height: "auto",
                color: "lightgray",
                fontSize: 16,
                padding: [8, 4],
                minimal: 1,
            });
            btn.on("click", function () {
                console.log(text);
            });
        };

        </script>

    </head>
    <body>

        <!-- HTML content -->

    </body>
</html>

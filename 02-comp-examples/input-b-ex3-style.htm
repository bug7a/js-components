<!DOCTYPE html>
<html lang="en">
    <head>

        <title>InputB JS Component</title>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0"><!-- , user-scalable=no -->

        <!-- LIBRARY FILES -->
        <!-- <link rel="preload" href="image.png" as="image"> -->
        <link rel="preload" href="../basic/font/open-sans/OpenSans-Regular.ttf" as="font" crossorigin="anonymous">
        <link rel="stylesheet" type="text/css" href="../basic/basic.min.css">
        <script src="../basic/basic.min.js" type="text/javascript" charset="utf-8"></script>
        <!--<script src="basic/scroll-bar.min.js" type="text/javascript" charset="utf-8"></script>-->

        <script src="../comp/tooltip.js" type="text/javascript" charset="utf-8"></script>
        <script src="../comp/input-b.js" type="text/javascript" charset="utf-8"></script>

        <!-- ALL COMPONENTS IN ONE FILE -->
        <!-- <script src="components.js" type="text/javascript" charset="utf-8"></script> -->

        <script>

        const start = function () {

            page.color = "white";

            // GROUP: Autolayout
            AutoLayout({
                flow: "vertical",
                gap: 20,
            });

                // INPUT: #1
                const myInput1 = InputB({
                    key: "1",
                    required: 1,
                    placeholder: "Jack",
                    leftPadding: 20,
                    backgroundColor: "transparent",
                    focusBackgroundColor: "whitesmoke",
                    lineColor: "transparent",
                    focusLineColor: "transparent",
                });
                myInput1.setTitle("FIRST NAME");
                myInput1.background.border = 1;
                myInput1.background.borderColor = "lightgray";

                // INPUT: #2
                const myInput2 = InputB({
                    key: "2",
                    titleText: "HEIGHT",
                    placeholder: "175",
                    descriptionText: "The vertical size...",
                    unitText: "cm",
                    required: 0,
                    backgroundColor: "whitesmoke",
                    focusBackgroundColor: "whitesmoke",
                    lineColor: "transparent",
                    focusLineColor: "lightgray",
                });
                myInput2.onChange = function () {
                    console.log(myInput2.getValue());
                };

                // INPUT: #3
                const myInput3 = InputB({
                    key: "3",
                    placeholder: "Sample",
                    titleText: "INPUT TITLE",
                    descriptionText: "Its a style example for input fields.",
                    required: 0,
                    maxLength: 20,
                    leftPadding: 20,
                    rightPadding: 20,
                    unitText: "",
                    backgroundColor: "transparent",
                    focusBackgroundColor: "transparent",
                    lineColor: "transparent",
                    focusLineColor: "transparent",
                });
                myInput3.inputGroup.gap = 4;
                myInput3.input.color = "whitesmoke";
                myInput3.input.border = 1;
                myInput3.input.borderColor = "lightgray";
                myInput3.input.inputElement.style.padding = "0px 12px";
                myInput3.onChange = function () {
                    console.log(myInput3.getValue());
                };

            endAutoLayout(); // END GROUP

        };

        </script>

    </head>
    <body>

        <!-- HTML content -->

    </body>
</html>

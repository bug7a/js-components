<!DOCTYPE html>
<html lang="en">

<head>
    <title>Gauge</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- LIBRARY FILES -->
    <link rel="preload" href="../basic/font/open-sans/OpenSans-Regular.ttf" as="font" crossorigin="anonymous">
    <link rel="preload" href="../basic/font/open-sans/OpenSans-Bold.ttf" as="font" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="../basic/basic.min.css">
    <script src="../basic/basic.min.js" type="text/javascript" charset="utf-8"></script>

    <!-- COMPONENT FILES -->
    <script src="../comp/gauge.js" type="text/javascript" charset="utf-8"></script>
    <script src="../comp/smart-button.js" type="text/javascript" charset="utf-8"></script>
    <script src="../comp/scroll-area.js" type="text/javascript" charset="utf-8"></script>

    <script>

        /* Bismillah */

        // Gauge (comp/gauge.js): a ring (sweepAngle: 360), a half arc (startAngle: -90, sweepAngle: 180), other sweeps and styles.

        const CARD_MAX_WIDTH = 600;

        // *** VARIABLES:
        let ring;

        const start = function () {

            page.color = "#F4F5F2";

            // WHY 16 at the sides: the cards fill a phone (390 px)
            ScrollArea({ align: "center top", gap: 30, padding: [16, 50] });

                Label({ text: "Gauge", fontSize: 26, fontFamily: "opensans-bold" });

                // SAMPLE 1: Ring
                startCard("1. Ring (sweepAngle: 360)", "A battery charge. The marker line is the reserve.", 1);

                    HGroup({ width: "100%", height: "auto", align: "center center", gap: 20 });
                        ring = Gauge({
                            width: 180, height: 180,
                            styleName: "dark",
                            value: 46, subText: "Charging",
                            markerValue: 20,
                        });
                    endGroup();

                    HGroup({ hug: 1, gap: 8, clipContent: 0 }); // WHY clipContent: a pressed SmartButton is not cut
                        addButton("+15%", function () { ring.setValue(Math.min(100, ring.value + 15)); });
                        addButton("−15%", function () { ring.setValue(Math.max(0, ring.value - 15)); });
                        addButton("Low", function () {
                            ring.setBarColor("#F2B24C");
                            ring.setSubText("Low");
                        }, "yellowDark");
                    endGroup();

                endCard();

                // SAMPLE 2: Half arc
                startCard("2. Half arc (startAngle: -90, sweepAngle: 180)", "Two heaters. The white line is the target.", 1);

                    // (a phone: one under the other)
                    HGroup({ width: "100%", height: "auto", align: "center center", gap: 30, wrap: 1 });
                        Gauge({
                            width: 200, height: 130,
                            styleName: "dark",
                            startAngle: -90, sweepAngle: 180,
                            maxValue: 300, value: 215, markerValue: 220,
                            valueSuffix: "°", subText: "Target 220°", titleText: "Nozzle",
                            style: { bar: { color: "#E0715A" }, value: { fontSize: 26 } },
                        });
                        Gauge({
                            width: 200, height: 130,
                            styleName: "dark",
                            startAngle: -90, sweepAngle: 180,
                            maxValue: 300, value: 58, markerValue: 60,
                            valueSuffix: "°", subText: "Target 60°", titleText: "Bed",
                            style: { bar: { color: "#5A8FE0" }, value: { fontSize: 26 } },
                        });
                    endGroup();

                endCard();

                // SAMPLE 3: Other sweeps and styles
                startCard("3. Any sweep, any style", "sweepAngle: 270 and the modern package.");

                    // (a phone: one under the other)
                    HGroup({ width: "100%", height: "auto", align: "center center", gap: 30, wrap: 1 });
                        Gauge({
                            width: 170, height: 170,
                            startAngle: -135, sweepAngle: 270,
                            value: 68, subText: "Disk used", valueSuffix: "%",
                        });
                        Gauge({
                            width: 170, height: 170,
                            styleName: "modern",
                            value: 82, subText: "Score",
                        });
                    endGroup();

                endCard();

            endGroup();

        };

        // *** OTHER FUNCTIONS:

        const startCard = function (title, description = "", isDark = 0) {
            VGroup({
                width: "100%", height: "auto", align: "left top", gap: 16, padding: 20,
                color: (isDark) ? "#1C1C1B" : "white",
                round: 10, border: 1, borderColor: (isDark) ? "#1C1C1B" : Black(0.1),
                // (basic.js has no maxWidth prop)
                css: { alignItems: "stretch", maxWidth: CARD_MAX_WIDTH + "px" },
            });
            Label({ text: title, fontSize: 14, textColor: (isDark) ? White(0.5) : Black(0.45) });
            if (description) {
                Label({
                    text: description,
                    fontSize: 13,
                    textColor: (isDark) ? White(0.4) : Black(0.35),
                    css: { marginTop: "-10px" },
                });
            }
        };

        const endCard = function () {
            endGroup();
        };

        // BUTTON: a SmartButton of the kit for the dark card (tone: "" is the gray of the template)
        const addButton = function (text, onClick, tone = "") {
            return SmartButton({ styleName: "ozdenDark", tone: tone, labelText: text, onClick: onClick });
        };

    </script>
</head>

<body></body>

</html>

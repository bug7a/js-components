<!DOCTYPE html>
<html lang="en">

<head>
    <title>BadgeV2 Component Demo</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- LIBRARY FILES -->
    <link rel="stylesheet" type="text/css" href="../basic/basic.min.css">
    <script src="../basic/basic.min.js" type="text/javascript" charset="utf-8"></script>

    <!-- COMPONENT FILES -->
    <script src="../comp/badge.js" type="text/javascript" charset="utf-8"></script>

    <script>

        // Badge (comp/badge.js) over a box: a number, and a number bigger than its maxValue (999 with maxValue: 9).

        const start = function () {

            page.color = "#f5f5f5";

            HGroup({
                gap: 10,
            });

                const box1 = Box(0, 0, 100, 100, {
                    color: "lightgray",
                    round: 5,
                });

                // Badge with number
                const badge1 = Badge({
                    value: 1,
                    maxValue: 99,
                });
                box1.add(badge1);

                const box2 = Box(0, 0, 100, 100, {
                    color: "lightgray",
                    round: 5,
                });

                // Badge with number
                const badge2 = Badge({
                    value: 999,
                    maxValue: 9,
                });
                box2.add(badge2);

            endGroup();

            // badge.setValue(0): hidden, setValue(1): a dot, setValue(10): a number

        };
    </script>
</head>

<body>
</body>

</html>

<html lang="en">

        <title>EmailInputB JS Component</title>

        <meta charset="UTF-8">

        <!-- LIBRARY FILES -->

        <link rel="stylesheet" type="text/css" href="../basic/basic.min.css">
        <script src="../basic/basic.js" type="text/javascript" charset="utf-8"></script>

        <script src="../comp/tooltip.js" type="text/javascript" charset="utf-8"></script>

        <!-- ALL COMPONENTS IN ONE FILE -->
        <!-- <script src="components.js" type="text/javascript" charset="utf-8"></script> -->

        <script>

        const start = function () {

            page.color = "white";

            // GROUP: Centered content
            AutoLayout();

                // INPUT: #1
                const myInput = EmailInputB({
                    key: "1",
                    width: 350,
                    required: 1,
                    titleText: "EMAIL",
                    placeholder: "example@site.com",
                    warningText: "Invalid email format",
                    warningColor: "#E5885E",
                    maxLength: 40,
                });

            endAutoLayout(); // END GROUP

            // Get value
            myInput.onChange = function () {
                console.log(myInput.getValue());
            };

        };

        </script>

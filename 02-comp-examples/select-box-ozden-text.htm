<!DOCTYPE html>
<html lang="en">
<head>

    <title>SelectBox - ozden (text rows)</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preload" href="../basic/font/open-sans/OpenSans-Regular.ttf" as="font" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="../basic/basic.css">
    <script src="../basic/basic.js" type="text/javascript" charset="utf-8"></script>
    <script src="../basic/scroll-bar.js" type="text/javascript" charset="utf-8"></script>

    <script src="../comp/search-input-v2.js" type="text/javascript" charset="utf-8"></script>
    <script src="../comp/select-box.js" type="text/javascript" charset="utf-8"></script>

    <script>

    /* Bismillah */

    // SelectBox with styleName: "ozden": text rows, the look of the old comp-m1 SelectText.
    // The package gives the size (350 x 50) and the search box; fullHeightList: 1 opens the list from the top of the
    // page to its bottom (the comp-m1 SelectText opened full screen).
    // Your own rows (a picture, a description...): select-box-ozden-item.htm (createItemView).

    const FRUITS_PATH = "../assets/fruids/";

    const FRUITS = [
        { value: "Broccoli", label: "Broccoli", description: "Vegetable", iconFile: FRUITS_PATH + "brokoli.png" },
        { value: "Strawberry", label: "Strawberry", description: "Fruit", iconFile: FRUITS_PATH + "cilek.png" },
        { value: "Tomato", label: "Tomato", description: "Vegetable", iconFile: FRUITS_PATH + "domates.png" },
        { value: "Apple", label: "Apple", description: "Fruit", iconFile: FRUITS_PATH + "elma.png" },
        { value: "Carrot", label: "Carrot", description: "Vegetable", iconFile: FRUITS_PATH + "havuc.png" },
        { value: "Watermelon", label: "Watermelon", description: "Fruit", iconFile: FRUITS_PATH + "karpuz.png" },
        { value: "Lemon", label: "Lemon", description: "Fruit", iconFile: FRUITS_PATH + "limon.png" },
        { value: "Banana", label: "Banana", description: "Fruit", iconFile: FRUITS_PATH + "muz.png" },
        { value: "Pomegranate", label: "Pomegranate", description: "Fruit", iconFile: FRUITS_PATH + "nar.png" },
        { value: "Eggplant", label: "Eggplant", description: "Vegetable", iconFile: FRUITS_PATH + "patlican.png" },
        { value: "Blueberry", label: "Blueberry", description: "Fruit", iconFile: FRUITS_PATH + "yabanmersini.png" },
        { value: "Green Pepper", label: "Green Pepper", description: "Vegetable", iconFile: FRUITS_PATH + "yesilbiber.png" },
    ];


    let fruitSelect = null;

    const start = function () {

        fruitSelect = SelectBox({
            styleName: "ozden",
            fullHeightList: 1,
            options: FRUITS.map(function (fruit) { return fruit.label; }),
            value: "Tomato",
            onChange: function (self) { println(self.value); },
        });
        fruitSelect.center();

    };

    </script>

</head>
<body>
</body>
</html>

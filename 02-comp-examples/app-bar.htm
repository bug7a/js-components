<!DOCTYPE html>
<html lang="en">
<head>

    <title>AppBar</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preload" href="../basic/font/open-sans/OpenSans-Regular.ttf" as="font" crossorigin="anonymous">
    <link rel="preload" href="../basic/font/open-sans/OpenSans-Bold.ttf" as="font" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="../basic/basic.css">
    <script src="../basic/basic.js" type="text/javascript" charset="utf-8"></script>

    <script src="../comp/smart-button.js" type="text/javascript" charset="utf-8"></script>
    <script src="../comp/app-bar.js" type="text/javascript" charset="utf-8"></script>
    <script src="../comp/scroll-area.js" type="text/javascript" charset="utf-8"></script>

    <script>

    /* Bismillah */

    // AppBar: the top bar of a tab page of a mobile app. The page is a 600 px design fitted to the screen (page.fit(600, 800)),
    // like the mobile template: every size here is a px of that design.

    const DESIGN_WIDTH = 600;
    const MAX_ZOOM_WIDTH = 800; // A wider screen shows the design at most this wide
    const PAGE_COLOR = "#F4F4F4";
    const SPACE = 20;
    const TEXT_SIZE = 20; // The captions (13 px on a 390 px phone)
    const BOTTOM_SPACE = 60; // Under the last line (padding: [left, top, right, bottom])
    const GREEN = "#5ABB9F";
    const TITLES = ["Tasks", "Search", "A very long title that does not fit in the bar", "Home"];

    let lblResult;
    let titleIndex = 0;

    const fitPage = function () {
        page.fit(DESIGN_WIDTH, MAX_ZOOM_WIDTH);
    };

    const showResult = function (text) {
        lblResult.plainText = text;
    };

    // LABEL: What the bar under it shows
    const createCaption = function (text) {
        Label({
            plainText: text,
            width: "100%",
            fontSize: TEXT_SIZE,
            textColor: Black(0.5),
            padding: [SPACE, 0],
            css: { margin: "28px 0 10px" },
        });
    };

    // The buttons that change the last bar
    const createSetterButtons = function (bar) {
        HGroup({
            width: "100%",
            height: "auto",
            align: "left center",
            gap: 10,
            wrap: 1,
            padding: [SPACE, 14],
            clipContent: 0,
        });

            SmartButton({ labelText: "Left / Center", height: 50, onClick: function () {
                bar.setTitleAlign((bar.titleAlign == "left") ? "center" : "left");
            } });

            SmartButton({ labelText: "Back", height: 50, onClick: function () {
                bar.setBackVisible(!bar.showBack);
            } });

            SmartButton({ labelText: "Menu", height: 50, onClick: function () {
                bar.setMenuVisible(!bar.showMenu);
            } });

            SmartButton({ labelText: "Line", height: 50, onClick: function () {
                bar.setLine(!bar.line);
            } });

            SmartButton({ labelText: "Title", height: 50, onClick: function () {
                titleIndex = (titleIndex + 1) % TITLES.length;
                bar.setTitleText(TITLES[titleIndex]);
            } });

        endGroup();
    };

    const onBack = function (bar) {
        showResult("onBack: " + bar.titleText);
    };

    const onMenu = function (bar) {
        showResult("onMenu: " + bar.titleText);
    };

    const start = function () {

        fitPage();
        page.onResize(fitPage);
        page.color = PAGE_COLOR;

        ScrollArea({ align: "left top", gap: 0, padding: [0, 0, 0, BOTTOM_SPACE] });

            // The bar of a page in the place of the tabs: back, the title in the middle, ⋮
            AppBar({ titleText: "Default Example", showBack: 1, line: 1, onBack: onBack, onMenu: onMenu });

            createCaption("titleAlign: \"left\", line: 1 (the Settings tab)");
            AppBar({ titleText: "Settings", titleAlign: "left", line: 1, onMenu: onMenu });

            createCaption("showMenu: 0, no line");
            AppBar({ titleText: "Home", showMenu: 0 });

            createCaption("A long title ends with \"...\"");
            AppBar({
                titleText: "Privacy Policy and Terms of Use of This Application",
                showBack: 1,
                line: 1,
                onBack: onBack,
                onMenu: onMenu,
            });

            createCaption("Your own colors: color, iconColor, style.title");
            AppBar({
                titleText: "Categories",
                color: GREEN,
                iconColor: "white",
                showBack: 1,
                style: { title: { textColor: "white" } },
                onBack: onBack,
                onMenu: onMenu,
            });

            createCaption("The setters: setTitleAlign, setBackVisible, setMenuVisible, setLine, setTitleText");
            const bar = AppBar({ titleText: TITLES[0], line: 1, onBack: onBack, onMenu: onMenu });
            createSetterButtons(bar);

            // LABEL: The last onBack / onMenu
            lblResult = Label({
                plainText: "Click a back or a menu button.",
                width: "100%",
                fontSize: TEXT_SIZE,
                textColor: GREEN,
                padding: [SPACE, 0],
            });

        endGroup();

    };

    </script>

</head>
<body>
</body>
</html>

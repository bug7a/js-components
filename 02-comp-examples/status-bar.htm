<!DOCTYPE html>
<html lang="en">
    <head>

        <title>StatusBar</title>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- LIBRARY FILES -->
        <link rel="stylesheet" type="text/css" href="../basic/basic.min.css">
        <script src="../basic/basic.min.js" type="text/javascript" charset="utf-8"></script>
        <script src="../basic/scroll-bar.min.js" type="text/javascript" charset="utf-8"></script>

        <!-- COMPONENT FILES -->
        <script src="../comp/smart-button.js" type="text/javascript" charset="utf-8"></script>
        <script src="../comp/status-bar.js" type="text/javascript" charset="utf-8"></script>

        <script>

        /* Bismillah */

        // StatusBar (comp/status-bar.js): the thin bar at the bottom of a window, in the two themes.
        // The buttons change both of them. A part with onClick (the zoom at the right end) can be clicked.

        // *** VARIABLES:
        const PAGE_COLOR = "#ECEBE8";
        const SOFT_TEXT = "#6F6E6B";
        const WINDOW_MIN_WIDTH = 340;
        const WINDOW_MAX_WIDTH = 620;
        const WINDOW_HEIGHT = 190;
        const SAVED_MESSAGE_TIME = 3000; // ms
        const ZOOM_LEVELS = ["100%", "125%", "150%", "75%"];

        const GIT_ICON = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="4.5" cy="3.5" r="1.7"/><circle cx="4.5" cy="12.5" r="1.7"/><circle cx="11.5" cy="5.5" r="1.7"/><path d="M4.5 5.2v5.6M11.5 7.2c0 2.5-2.2 3-7 3.6"/><\/svg>';

        let statusBars = [];
        let fileCount = 3;
        let zoomIndex = 0;
        let isBusy = 0;
        let btnBusy;

        // First running function. (basic.js calls it when the page is ready)
        const start = function () {

            page.color = PAGE_COLOR;

            // BOX: Page (it scrolls when the window is lower than the samples)
            const pageBox = startBox(0, 0, "100%", "100%", { color: "transparent", scrollY: 1 });

            // GROUP: The title, the controls and the two themes
            VGroup({ width: "100%", height: "auto", align: "center top", gap: 16, padding: [16, 28], clipContent: 0 });

                Label({ text: "StatusBar", fontSize: 24, bold: 1, textColor: Black(0.8) });

                // GROUP: The buttons
                HGroup({ width: "100%", height: "auto", align: "center center", gap: 8, wrap: 1 });
                    SmartButton({ labelText: "Save", tone: "cyan", onClick: showSaved });
                    SmartButton({
                        labelText: "A warning",
                        onClick: function () { setMessage("The disk is nearly full", "warn"); },
                    });
                    SmartButton({
                        labelText: "An error",
                        onClick: function () { setMessage("The file can not be written", "error"); },
                    });
                    SmartButton({ labelText: "Ready", onClick: function () { setMessage("Ready", ""); } });
                    btnBusy = SmartButton({ labelText: "Start a job", onClick: toggleBusy });
                    SmartButton({ labelText: "Add a file", onClick: addFile });
                endGroup();

                // GROUP: The two themes side by side (one under the other on a narrow screen)
                HGroup({ width: "100%", height: "auto", align: "center top", gap: 20, wrap: 1 });
                    statusBars.push(createWindow("Light", "styleName: \"light\" (default)", "light", "#FFFFFF", Black(0.14), Black(0.35)));
                    statusBars.push(createWindow("Dark", "styleName: \"dark\"", "dark", "#1C1C1B", White(0.1), White(0.4)));
                endGroup();

            endGroup();

            endBox();

            ScrollBar({ scrollableBox: pageBox });

        };

        // *** OTHER FUNCTIONS:

        const eachBar = function (func) {
            statusBars.forEach(func);
        };

        const setMessage = function (text, tone) {
            eachBar(function (bar) { bar.setMessageText(text, tone); });
        };

        // GROUP: A title and a small window with a StatusBar. Returns the StatusBar.
        const createWindow = function (titleText, noteText, styleName, windowColor, lineColor, softColor) {

            VGroup({
                width: "auto",
                height: "auto",
                align: "left top",
                gap: 8,
                css: { flex: "1 1 " + WINDOW_MIN_WIDTH + "px", maxWidth: WINDOW_MAX_WIDTH + "px", minWidth: "0" },
            });

                HGroup({ width: "100%", height: "auto", align: "left center", gap: 8 });
                    Label({ text: titleText, fontSize: 15, bold: 1, textColor: Black(0.75) });
                    Label({ text: basic.escapeHtml(noteText), fontSize: 12, textColor: SOFT_TEXT });
                endGroup();

                // BOX: The window
                // NOTE: The StatusBar stands at the bottom of a Box by itself.
                startBox({
                    width: "100%",
                    height: WINDOW_HEIGHT,
                    color: windowColor,
                    border: 1,
                    borderColor: lineColor,
                    round: 8,
                });

                    Label({ left: 14, top: 14, text: "The window of a program", fontSize: 13, textColor: softColor });

                    const bar = StatusBar({
                        styleName: styleName,
                        messageText: "Ready",
                        items: [
                            { key: "branch", text: "main", icon: GIT_ICON },
                            { key: "files", text: fileCount + " files" },
                            "UTF-8",
                            { key: "zoom", text: ZOOM_LEVELS[0], ariaLabel: "Zoom", onClick: changeZoom },
                        ],
                    });

                endBox();

            endGroup();

            return bar;

        };

        // A message with a time: after it the bar goes back to its lasting message.
        const showSaved = function () {
            eachBar(function (bar) { bar.setMessageText("Saved", "success", SAVED_MESSAGE_TIME); });
        };

        const toggleBusy = function () {
            isBusy = (isBusy) ? 0 : 1;
            btnBusy.setLabelText((isBusy) ? "Stop the job" : "Start a job");
            setMessage((isBusy) ? "Copying the files..." : "Ready", "");
            eachBar(function (bar) { bar.setBusy(isBusy); });
        };

        const addFile = function () {
            fileCount++;
            eachBar(function (bar) { bar.setItemText("files", fileCount + " files"); });
        };

        const changeZoom = function () {
            zoomIndex = (zoomIndex + 1) % ZOOM_LEVELS.length;
            eachBar(function (bar) { bar.setItemText("zoom", ZOOM_LEVELS[zoomIndex]); });
        };

        </script>

    </head>
    <body>
    </body>
</html>

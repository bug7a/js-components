<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Login</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- LIBRARY FILES -->
        <link rel="preload" href="../basic/font/open-sans/OpenSans-Regular.ttf" as="font" crossorigin="anonymous">
        <link rel="preload" href="../basic/font/open-sans/OpenSans-Bold.ttf" as="font" crossorigin="anonymous">
        <link rel="stylesheet" type="text/css" href="../basic/basic.min.css">
        <script src="../basic/basic.min.js" charset="utf-8" ></script>
        <script src="../basic/scroll-bar.min.js" charset="utf-8" ></script>

        <script src="../comp/ui-effects.js" type="text/javascript" charset="utf-8"></script>
        <script src="../comp/tooltip.js" charset="utf-8" ></script>
        <script src="../comp/input-b.js" charset="utf-8" ></script>
        <script src="../comp/email-input-b.js" charset="utf-8" ></script>
        <script src="../comp/password-input-b.js" charset="utf-8" ></script>
        <script src="../comp/tabs.js" charset="utf-8" ></script>
        <script src="../comp/smart-button.js" charset="utf-8" ></script>
        <script src="../comp/loading-screen.js" charset="utf-8" ></script>
        <script src="../comp/login-page-v2.js" type="text/javascript" charset="utf-8" ></script>

        <script>

        const googleLogo = "https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg";
        // The Apple logo: a dark apple in the color of the text of its button, on a transparent ground (the user,
        // 2026-11-05). WHY: an SVG in the page: the picture of before (a link to a search result) was a white apple in
        // a black square.
        const APPLE_COLOR = LoginPageLightStyle.style.customLoginButton.textColor;
        const APPLE_PATH = "M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701";
        const appleLogo = "data:image/svg+xml;utf8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="' + APPLE_COLOR + '" d="' + APPLE_PATH + '"/></svg>');
    
        let loginPage = null;
        let userData = null;

        const PANEL_WIDTH = 420;
        const PAGE_SIDE_PADDING = 30; // px: the padding of LoginPage at the sides of the page

        // First running function.
        window.onload = function() {

            page.color = "white";

            checkIfLoggedIn({
                onSuccess: initPageView,
                onFail: initLoginView,
            });

        };

        const fillTestData = function() {

            // TEST DATA: Fill the user data
            loginPage.loginEmail.setInputValue("bugra.ozden@gmail.com");
            loginPage.loginPassword.setInputValue("123456");
            // Call manuel to check form with out edit
            loginPage.loginEmail.onEdit();

        };

        const initLoginView = function() {
                
            // WHY: a phone narrower than the panel (390 px): the panel takes the screen without the sides of the page
            const panelWidth = Math.min(PANEL_WIDTH, page.width - PAGE_SIDE_PADDING * 2);

            // Show Login Page
            loginPage = LoginPage({
                panelWidth: panelWidth,
                inputStyleName: "ozden", // the fields: the InputB package "ozden"
                primaryColor: "#2C5A38",
                panelName: "MY PANEL v25.08.11",
                onLoginClick: onLoginClick,
                onSignupClick: onSignupClick,
                showPasswordIconFile: "../comp/password-input-b/show-btn.png",
                hidePasswordIconFile: "../comp/password-input-b/hide-btn.png",
                signupPasswordParams: {
                    minChar: 8,
                    minCharWarningText: "Password must be at least 8 characters",
                    mustUseNumber: 1,
                    mustUseLetter: 1,
                    mustUseUppercase: 0,
                    mustUseLowercase: 0,
                    mustUseSpecialChar: 0,
                },
                ...LoginPageLightStyle, // (its tab bar too: one light gray, a soft edge, a white selected tab)
                // (after the light style: these win over it; the user, 2026-11-05)
                buttonStyleName: "ozdenType3", // LOGIN / SIGN UP: SmartButtons of the kit, in the text color of the tone
                buttonTone: "green", // the green of SmartButton (the user, 2026-11-05: it was blue)
            });

            // Add custom login buttons:
            loginPage.createButtonWithIcon("Sign in with Google", googleLogo, onLoginWithGoogle);
            loginPage.createButtonWithIcon("Sign in with Apple", appleLogo, onLoginWithApple);

            // TEST
            fillTestData();

        };

        const initPageView = function() {

            if (!userData) { logout(); return 0; }

            // or go to your page

            page.color = "whitesmoke";

            HGroup({
                    gap: 20,
                });

                Label({
                    text: "Logged In.",
                });

                Label({
                    text: "Logout",
                    color: "indianred",
                    textColor: "white",
                    padding: [8, 2],
                    round: 4,
                });
                that.elem.style.cursor = "pointer";
                that.on("click", function() {

                    logout();

                });

            endGroup();

        };

        const openPageByKey = function(key) {

            if (!userData) { logout(); return 0; }

            switch (key) {

                case "page1":
                    // open page 1
                    break;

                case "page2":
                    // open page 2
                    break;

            }

        };

        const checkIfLoggedIn = function(callback) {

            // callback: { onSuccess: func, onFail: func }

            // TODO: Check logged in with your service

            // TEST LOGIN:
            userData = basic.storage.load("appid_login");

            if (userData) {
                callback.onSuccess();
            } else {
                callback.onFail();
            }

        };

        const logout = function() {

            // TEST LOGIN:
            userData = null;
            basic.storage.save("appid_login", userData);

            // Try to logout with your service
            window.location.reload();

        };

        // Actions
        const onLoginClick = function() {

            loginPage.showAlert("login");

            const email = loginPage.loginEmail.getInputValue();
            const password = loginPage.loginPassword.getInputValue();

            if (!email || !password) { loginPage.showAlert("Please enter email and password"); return; }

            const onSuccess = function() {

                window.location.reload();

            };

            const onFail = function(message) {
                loginPage.showAlert("Login failed: " + message);
            };

            loginPage.waiting.show();

            try {
                
                // TEST LOGIN:
                userData = { user: "test" };
                basic.storage.save("appid_login", userData);

                // TODO: Try to login with your service
                onSuccess();
                //onFail();


            } catch (e) {
                loginPage.showAlert("Login error");

            } finally {
                loginPage.waiting.hide();
            }

        };

        const onSignupClick = function() {

            const email = loginPage.signupEmail.getInputValue();
            const p1 = loginPage.signupPassword.getInputValue();
            const p2 = loginPage.signupPassword2.getInputValue();

            if (!email || !p1 || !p2) { loginPage.showAlert("Please fill all fields"); return; }
            if (p1 !== p2) { loginPage.showAlert("Passwords do not match"); return; }

            const onSuccess = function() {

                loginPage.showAlert("Sign up successful. Check your email to confirm.", "#5DB182");
                loginPage.signupPassword.setInputValue("");
                loginPage.signupPassword2.setInputValue("");
                loginPage.loginEmail.setInputValue(loginPage.signupEmail.getInputValue());
                loginPage.setActiveTab(0); // (the tab bar follows it)

            };

            const onFail = function(message) {
                loginPage.showAlert("Sign up failed: " + message);
            };

            loginPage.waiting.show();

            try {
                
                // TODO: Try to Signup with your service
                onSuccess();
                //onFail();
                
            } catch (e) {
                loginPage.showAlert("Sign up error");

            } finally {
                loginPage.waiting.hide();
            }

        };

        const onLoginWithGoogle = function() {

            // TODO: Login with Google
            loginPage.showAlert("Logged in with Google.", "#5DB182");

        };

        const onLoginWithApple = function() {

            // TODO: Login with Apple
            loginPage.showAlert("Logged in with Apple.", "#5DB182");

        };

        </script>
        
    </head>
    <body></body>
</html>

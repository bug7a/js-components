<!DOCTYPE html>
<html lang="en">
<head>

    <title>ProgressBar - ozden, two parts, stripes, limits, a dark track</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- LIBRARY FILES -->
    <link rel="preload" href="../basic/font/open-sans/OpenSans-Regular.ttf" as="font" crossorigin="anonymous">
    <link rel="preload" href="../basic/font/open-sans/OpenSans-Bold.ttf" as="font" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="../basic/basic.css">
    <script src="../basic/basic.js" type="text/javascript" charset="utf-8"></script>

    <!-- COMPONENT FILES -->
    <script src="../comp/progress-bar.js" type="text/javascript" charset="utf-8"></script>
    <script src="../comp/smart-button.js" type="text/javascript" charset="utf-8"></script>

    <script>

    /* Bismillah */

    // ProgressBar with styleName "ozden" (the user, 2026-11-06): the colors of SmartButton. The bar is a cyan SmartButton
    // ozdenType1 (an edge and a line at its bottom: it looks raised); the track keeps its light colors and has round
    // ends, or it is dark (darkTrack: 1); the second part (secondValue) is a second bar next to the value, lighter and
    // not transparent; moving stripes on each part (stripes / secondStripes) and limit lines.

    // *** THE COLORS AND SIZES OF THE PAGE
    const PAGE_COLOR = "#F0F1EE";
    const INK = "#232323";
    const CARD_WIDTH = 560;
    const BAR_WIDTH = 400;
    // The tones of SmartButton (SmartButton.tones): another main color, the color of a limit
    const ORANGE = "#DE815B";
    const YELLOW = "#F1C74A";
    const BLUE = "#52A8D0";
    const UPLOAD_STEP_TIME = 300; // ms

    let uploadBar = null;
    let uploadTimer = null;

    const start = function () {

        page.color = PAGE_COLOR;

        startBox(0, 0, "100%", "100%", { color: "transparent", scrollY: 1 });

            VGroup({ width: "100%", height: "auto", align: "center top", gap: 24, padding: [30, 20] });

                Label({ plainText: "ProgressBar: ozden", fontSize: 26, bold: 1, textColor: INK });

                // 1. The look
                startCard("1. The ozden look", "styleName: \"ozden\": the bar is a cyan SmartButton ozdenType1 (an edge and a line at its bottom), the track has round ends. limits: [{ value: 60, text: \"60\" }]: a line a little longer than the bar, its text under it.");
                    ProgressBar({
                        width: BAR_WIDTH,
                        styleName: "ozden",
                        titleText: "Progress Title:",
                        value: 40,
                        valuePosition: "none",
                        limits: [{ value: 60, text: "60" }],
                    });
                    ProgressBar({
                        width: BAR_WIDTH,
                        styleName: "ozden",
                        value: 60,
                        valuePosition: "none",
                        limits: [{ value: 30, color: BLUE }, 80],
                    });
                endCard();

                // 2. A dark track
                startCard("2. A dark track: darkTrack: 1", "The track is #242424 with a faint white edge (style.darkTrack); the bars keep their colors. setDarkTrack() changes it.");
                    const darkTrackBar = ProgressBar({
                        width: BAR_WIDTH,
                        styleName: "ozden",
                        darkTrack: 1,
                        titleText: "Storage",
                        value: 55,
                        secondValue: 15,
                        valueFormat: function (self) { return self.value + "% + " + self.secondValue + "%"; },
                    });
                    ProgressBar({
                        width: BAR_WIDTH,
                        styleName: "ozden",
                        darkTrack: 1,
                        value: 35,
                        stripes: 1,
                        valuePosition: "right",
                        style: { bar: { color: YELLOW } },
                    });
                    startButtonRow();
                        SmartButton({ labelText: "dark track on / off", onClick: function () { darkTrackBar.setDarkTrack(!darkTrackBar.darkTrack); } });
                    endGroup();
                endCard();

                // 3. Two parts
                startCard("3. Two parts: value + secondValue", "70 done and 5 on the way. The second part is a second bar next to the value: the main color mixed with white, not transparent (or its own: style.secondBar.color); the value text and onComplete are of the value only.");
                    const twoParts = ProgressBar({
                        width: BAR_WIDTH,
                        styleName: "ozden",
                        titleText: "Storage",
                        value: 70,
                        secondValue: 5,
                        limits: [80],
                        valueFormat: function (self) { return self.value + "% + " + self.secondValue + "%"; },
                    });
                    startButtonRow();
                        SmartButton({ labelText: "value +5", onClick: function () { twoParts.setValue(twoParts.value + 5); } });
                        SmartButton({ labelText: "second +5", onClick: function () { twoParts.setSecondValue(twoParts.secondValue + 5); } });
                        SmartButton({ labelText: "setValues(40, 20)", onClick: function () { twoParts.setValues(40, 20); } });
                        SmartButton({ tone: "white", labelText: "reset()", onClick: function () { twoParts.reset(); } });
                    endGroup();
                endCard();

                // 4. Stripes
                startCard("4. Moving stripes", "stripes: 1 on the value, secondStripes: 1 on the second part; setStripes() / setSecondStripes() turn them on and off. (Still with reduced motion.)");
                    const striped = ProgressBar({
                        width: BAR_WIDTH,
                        styleName: "ozden",
                        value: 55,
                        secondValue: 15,
                        stripes: 1,
                        secondStripes: 1,
                        limits: [80],
                        valuePosition: "right",
                    });
                    startButtonRow();
                        SmartButton({ labelText: "stripes on / off", onClick: function () { striped.setStripes(!striped.stripes); } });
                        SmartButton({ labelText: "second on / off", onClick: function () { striped.setSecondStripes(!striped.secondStripes); } });
                    endGroup();
                endCard();

                // 5. A job: the done part grows, the part on the way has stripes
                startCard("5. An upload", "The value is what is saved, the second part what is being sent (with stripes). The limit is the quota.");
                    uploadBar = ProgressBar({
                        width: BAR_WIDTH,
                        styleName: "ozden",
                        titleText: "Uploading 12 files",
                        secondStripes: 1,
                        limits: [{ value: 90, color: ORANGE }],
                        valueFormat: function (self) { return Math.round(self.getPercent()) + "%"; },
                        onComplete: function (self) { self.setTitleText("Done"); },
                    });
                    startButtonRow();
                        SmartButton({ tone: "cyan", labelText: "start", onClick: startUpload });
                    endGroup();
                endCard();

                // 6. Another main color
                startCard("6. Another main color", "Only style: { bar: { color } }: a tone of SmartButton (blue, yellow); the second part follows it. status: \"success\" is the green of SmartButton, \"error\" its orange.");
                    ProgressBar({ width: BAR_WIDTH, styleName: "ozden", value: 45, secondValue: 10, valuePosition: "right", style: { bar: { color: BLUE } } });
                    ProgressBar({ width: BAR_WIDTH, styleName: "ozden", value: 65, secondValue: 10, stripes: 1, valuePosition: "right", style: { bar: { color: YELLOW } } });
                    ProgressBar({ width: BAR_WIDTH, styleName: "ozden", value: 100, status: "success", valuePosition: "right" });
                    ProgressBar({ width: BAR_WIDTH, styleName: "ozden", value: 85, limits: [{ value: 80, text: "limit 80" }], status: "error", valuePosition: "right" });
                endCard();

                // 7. A dark page
                VGroup({ width: CARD_WIDTH, height: "auto", align: "left top", gap: 16, padding: [20, 22], color: "#1A1A19", round: 12 });
                that.css = { maxWidth: "calc(100vw - 40px)" };
                    Label({ plainText: "7. For a dark page", fontSize: 15, bold: 1, textColor: White(0.9) });
                    Label({ plainText: "styleName: \"ozdenDark\": a dark track, the bar in the main color of the kit.", fontSize: 13, textColor: White(0.55), width: "100%", css: { whiteSpace: "normal" } });
                    ProgressBar({
                        width: BAR_WIDTH,
                        styleName: "ozdenDark",
                        titleText: "Storage",
                        value: 70,
                        secondValue: 5,
                        limits: [80],
                    });
                endGroup();

            endGroup();

        endBox();

    };

    // *** OTHER FUNCTIONS

    const startUpload = function () {
        clearInterval(uploadTimer);
        uploadBar.reset();
        uploadBar.setTitleText("Uploading 12 files");
        uploadTimer = setInterval(function () {
            const done = Math.min(100, uploadBar.value + 6);
            uploadBar.setValues(done, Math.min(12, 100 - done));
            if (done >= 100) clearInterval(uploadTimer);
        }, UPLOAD_STEP_TIME);
    };

    const startCard = function (title, description) {
        VGroup({ width: CARD_WIDTH, height: "auto", align: "left top", gap: 16, padding: [20, 22], color: "white", round: 8, border: 1, borderColor: Black(0.1) });
        that.css = { maxWidth: "calc(100vw - 40px)" };
        Label({ plainText: title, fontSize: 15, bold: 1, textColor: INK });
        Label({ plainText: description, fontSize: 13, textColor: Black(0.5), width: "100%", css: { whiteSpace: "normal", marginTop: "-8px" } });
    };

    const endCard = function () { endGroup(); };

    // GROUP: SmartButtons side by side, one under the other on a narrow screen (endGroup() closes it)
    const startButtonRow = function () {
        HGroup({ hug: 1, align: "left center", gap: 8, wrap: 1, clipContent: 0 }); // WHY clipContent 0: the focus ring of a SmartButton is not cut
    };

    </script>

</head>
<body>
</body>
</html>

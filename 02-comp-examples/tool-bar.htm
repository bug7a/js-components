<!DOCTYPE html>
<html lang="en">
    <head>

        <title>ToolBar</title>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- LIBRARY FILES -->
        <link rel="stylesheet" type="text/css" href="../basic/basic.min.css">
        <script src="../basic/basic.min.js" type="text/javascript" charset="utf-8"></script>
        <script src="../basic/scroll-bar.min.js" type="text/javascript" charset="utf-8"></script>

        <!-- COMPONENT FILES -->
        <script src="../comp/tooltip.js" type="text/javascript" charset="utf-8"></script>
        <script src="../comp/smart-button.js" type="text/javascript" charset="utf-8"></script>
        <script src="../comp/context-menu.js" type="text/javascript" charset="utf-8"></script>
        <script src="../comp/menu-bar.js" type="text/javascript" charset="utf-8"></script>
        <script src="../comp/status-bar.js" type="text/javascript" charset="utf-8"></script>
        <script src="../comp/tool-bar.js" type="text/javascript" charset="utf-8"></script>
        <script src="../comp/scroll-area.js" type="text/javascript" charset="utf-8"></script>

        <script>

        /* Bismillah */

        // ToolBar (comp/tool-bar.js): the row of small buttons of a window, in the two themes.
        // Icons with a hint, lines between the groups, Bold stays pressed, one of the Align buttons stays pressed,
        // Insert opens a menu, Run stands at the right end. Ctrl+S and F9 run their buttons.
        // Make the window narrow, or press "Narrow": the last buttons go into the "..." menu.
        // Tab comes to the bar; the arrows go between the buttons.

        // *** VARIABLES:
        const PAGE_COLOR = "#ECEBE8";
        const SOFT_TEXT = "#6F6E6B";
        const WINDOW_WIDTH_NARROW = 280;
        const WINDOW_MIN_WIDTH = 340;
        const WINDOW_MAX_WIDTH = 620;
        const WINDOW_HEIGHT = 250;
        const MENUS = [
            { text: "File", items: ["New", "Open"] },
            { text: "Edit", items: ["Undo", "Redo"] },
        ];
        const LOOKS = [
            { title: "Light", note: "styleName: \"light\" (default)", styleName: "light", windowColor: "#FFFFFF", lineColor: Black(0.14), softColor: Black(0.55) },
            { title: "Dark", note: "styleName: \"dark\"", styleName: "dark", windowColor: "#1C1C1B", lineColor: White(0.1), softColor: White(0.6) },
        ];

        let windows = [];
        let isNarrow = 0;
        let btnNarrow;

        // First running function. (basic.js calls it when the page is ready)
        const start = function () {

            page.color = PAGE_COLOR;

            // SCROLL AREA: Page (it scrolls when the window is lower than the samples)
            ScrollArea({ align: "center top", gap: 16, padding: [16, 28] });

                Label({ text: "ToolBar", fontSize: 24, bold: 1, textColor: Black(0.8) });

                btnNarrow = SmartButton({ labelText: "Narrow", onClick: toggleNarrow });

                // GROUP: The two themes side by side (one under the other on a narrow screen)
                HGroup({ width: "100%", height: "auto", align: "center top", gap: 20, wrap: 1, clipContent: 0 });
                    LOOKS.forEach(createWindow);
                endGroup();

            endGroup();

        };

        // *** OTHER FUNCTIONS:

        const toggleNarrow = function () {
            isNarrow = (isNarrow) ? 0 : 1;
            btnNarrow.setLabelText((isNarrow) ? "Wide" : "Narrow");
            windows.forEach(function (one) { one.width = (isNarrow) ? WINDOW_WIDTH_NARROW : "100%"; });
        };

        // The items of a bar. Its status bar tells what was pressed.
        const getItems = function (tell) {
            return [
                { key: "new", icon: "new", hint: "New", onClick: function () { tell("New"); } },
                { key: "open", icon: "open", hint: "Open" },
                { key: "save", icon: "save", hint: "Save", shortcut: "Ctrl+S" },
                "-",
                { key: "undo", icon: "undo", hint: "Undo" },
                { key: "redo", icon: "redo", hint: "Redo", enabled: 0 },
                "-",
                { key: "bold", icon: "bold", hint: "Bold", toggle: 1, checked: 1 },
                { key: "italic", icon: "italic", hint: "Italic", toggle: 1 },
                "-",
                { key: "left", icon: "alignLeft", hint: "Align left", group: "align", checked: 1 },
                { key: "center", icon: "alignCenter", hint: "Align center", group: "align" },
                { key: "right", icon: "alignRight", hint: "Align right", group: "align" },
                "-",
                { key: "insert", text: "Insert", hint: "Insert an object", items: [
                    { text: "A picture", key: "picture", onClick: function () { tell("A picture"); } },
                    { text: "A table", key: "table", onClick: function () { tell("A table"); } },
                ] },
                " ",
                { key: "run", icon: "play", text: "Run", shortcut: "F9" },
            ];
        };

        // GROUP: A title and a small window: a MenuBar, a ToolBar, a page and a StatusBar
        const createWindow = function (look) {

            VGroup({
                width: "auto",
                height: "auto",
                align: "left top",
                gap: 8,
                clipContent: 0,
                css: { flex: "1 1 " + WINDOW_MIN_WIDTH + "px", maxWidth: WINDOW_MAX_WIDTH + "px", minWidth: "0" },
            });

                HGroup({ width: "100%", height: "auto", align: "left center", gap: 8 });
                    Label({ text: look.title, fontSize: 15, bold: 1, textColor: Black(0.75) });
                    Label({ text: look.note, fontSize: 13, textColor: SOFT_TEXT });
                endGroup();

                // GROUP: The window
                const oneWindow = VGroup({
                    width: "100%",
                    height: WINDOW_HEIGHT,
                    align: "left top",
                    color: look.windowColor,
                    border: 1,
                    borderColor: look.lineColor,
                    round: 8,
                });
                windows.push(oneWindow);

                    MenuBar({ styleName: look.styleName, menus: MENUS, shrink: 0 });

                    let statusBar = null;
                    const tell = function (text) { statusBar.setMessageText(text); };
                    ToolBar({
                        styleName: look.styleName,
                        items: getItems(tell),
                        onClick: function (self, item) { tell(item.hint || item.text); },
                    });

                    Label({
                        width: "100%",
                        height: "auto",
                        grow: 1,
                        text: "The page of the window",
                        fontSize: 14,
                        textColor: look.softColor,
                        padding: 14,
                    });

                    statusBar = StatusBar({ styleName: look.styleName, messageText: "Press a button.", shrink: 0 });

                endGroup();

            endGroup();

        };

        </script>
    </head>

    <body></body>

</html>

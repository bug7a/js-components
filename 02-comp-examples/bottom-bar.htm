<!DOCTYPE html>
<html lang="en">

<head>
    <title>BottomBar Component Sample</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- LIBRARY FILES -->
    <link rel="stylesheet" type="text/css" href="../basic/basic.min.css">
    <script src="../basic/basic.min.js" type="text/javascript" charset="utf-8"></script>

    <!-- COMPONENT FILES -->
    <script src="../comp/bottom-bar.js" type="text/javascript" charset="utf-8"></script>
    <script src="../comp/badge.js" type="text/javascript" charset="utf-8"></script>

    <script>
        // BottomBar (comp/bottom-bar.js): four tabs at the bottom of the page, a number on two of them (setBadge), onItemClick.

        const start = function () {

            page.color = "white";

            const bottomBar = BottomBar({
                bottom: 0,
                selectedIndex: 0,
                items: [
                    { iconFile: "bottom-bar/icon1.png", selectedIconFile: "bottom-bar/icon1s.png", text: "Home" },
                    { iconFile: "bottom-bar/icon2.png", selectedIconFile: "bottom-bar/icon2s.png", text: "Basket" },
                    { iconFile: "bottom-bar/icon3.png", selectedIconFile: "bottom-bar/icon3s.png", text: "Favorites" },
                    { iconFile: "bottom-bar/icon4.png", selectedIconFile: "bottom-bar/icon4s.png", text: "Notifications" }
                ],
                onItemClick: function (self, itemObj, index) {
                    console.log("Clicked:", itemObj);
                }
            });

            bottomBar.setBadge(1, 8);
            bottomBar.setBadge(3, 1);

        };
    </script>
</head>

<body></body>

</html>

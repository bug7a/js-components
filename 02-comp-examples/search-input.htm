<!DOCTYPE html>
<html lang="en">

<head>
    <title>Search Input: ozden style</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- LIBRARY FILES -->
    <link rel="stylesheet" type="text/css" href="../basic/basic.css">
    <script src="../basic/basic.js" type="text/javascript" charset="utf-8"></script>
    <script src="../basic/scroll-bar.js" type="text/javascript" charset="utf-8"></script>

    <!-- COMPONENT FILES -->
    <script src="../comp/search-input.js" type="text/javascript" charset="utf-8"></script>
    <script src="../comp/scroll-area.js" type="text/javascript" charset="utf-8"></script>

    <script>

        /* Bismillah */

        // SearchInput (comp/search-input.js): the model page, and the design page of SearchInput.styles.ozden.
        // The look comes only from the package: the samples give no look params.
        // basic.js Designer:
        // http://127.0.0.1:5505/_basic-designer/index.htm?page=02-comp-examples/search-input.htm
        // WHY a name for every SearchInput: it is the name of its layer in basic-designer.

        // *** THE COLORS AND SIZES OF THE PAGE
        const PAGE_COLOR = "#F4F5F2";
        const CARD_WIDTH = 540;
        const LIGHT_CARD = { color: "white", line: Black(0.08), text: Black(0.45) };
        const DARK_CARD = { color: "#1E1F22", line: "#1E1F22", text: White(0.45) };

        // *** VARIABLES:
        let lblSearched;

        const start = function () {

            page.color = PAGE_COLOR;

            // SCROLL AREA: The page (comp/scroll-area.js)
            // WHY: page does not scroll. A ScrollArea fills the window; its content scrolls when it is taller.
            ScrollArea({ align: "center top", gap: 20, padding: [16, 40] });

                Label({ text: "SearchInput", fontSize: 24, bold: 1, textColor: Black(0.8) });

                // CARD: ozden (the default)
                startCard("styleName: \"ozden\" (the default)", LIGHT_CARD);

                    caption("empty", LIGHT_CARD);
                    const searchEmpty = SearchInput({
                        styleName: "ozden",
                        onChange: showSearched,
                    });

                    caption("with text (a value shows the clear icon)", LIGHT_CARD);
                    SearchInput({
                        styleName: "ozden",
                        placeholder: "Search products",
                        value: "fishing boat",
                        onChange: showSearched,
                    });

                    caption("wide (480)", LIGHT_CARD);
                    const searchWide = SearchInput({
                        styleName: "ozden",
                        width: 480,
                        height: 40,
                        fontSize: 18,
                        searchIconSize: 20,
                        placeholder: "Search in all pages",
                        onChange: showSearched,
                        css: { maxWidth: "100%" }, // WHY maxWidth: on a phone it is as wide as the card
                    });

                    caption("animated: 1 (move the mouse over it, click, type, clear; the packages are still: animated 0)", LIGHT_CARD);
                    const searchAnimated = SearchInput({
                        styleName: "ozden",
                        animated: 1,
                        placeholder: "Search products",
                        onChange: showSearched,
                    });

                    lblSearched = Label({ text: "Searched: -", fontSize: 13, textColor: Black(0.5) });

                endCard();

                // CARD: ozdenDark
                startCard("styleName: \"ozdenDark\" (a dark page)", DARK_CARD);

                    SearchInput({
                        styleName: "ozdenDark",
                        placeholder: "Search products",
                        value: "fishing boat",
                        onChange: showSearched,
                    });

                    caption("animated: 1", DARK_CARD);
                    const searchDarkAnimated = SearchInput({
                        styleName: "ozdenDark",
                        animated: 1,
                        placeholder: "Search products",
                        onChange: showSearched,
                    });

                endCard();

                // CARD: light (to compare)
                startCard("styleName: \"light\" (the look of the kit, to compare)", LIGHT_CARD);
                    const searchLight = SearchInput({
                        styleName: "light",
                        onChange: showSearched,
                    });
                endCard();

            endGroup();

        };

        // *** OTHER FUNCTIONS:

        const showSearched = function (self) {
            lblSearched.plainText = "Searched: " + (self.getSearchText() || "-");
        };

        // GROUP: A card in the colors of its page, with its title
        const startCard = function (title, look) {
            VGroup({
                width: CARD_WIDTH,
                height: "auto",
                align: "left top",
                gap: 12,
                padding: 24,
                color: look.color,
                round: 10,
                border: 1,
                borderColor: look.line,
                css: { maxWidth: "100%" }, // WHY maxWidth: on a phone the card is as wide as the screen
            });
            Label({ plainText: title, fontSize: 13, bold: 1, textColor: look.text });
        };

        const endCard = function () {
            endGroup();
        };

        const caption = function (text, look) {
            return Label({ plainText: text, fontSize: 12, textColor: look.text });
        };

    </script>

</head>

<body>
</body>

</html>

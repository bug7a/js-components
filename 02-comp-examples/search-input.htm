<!DOCTYPE html>
<html lang="en">

<head>
    <title>Search Input: ozden style</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- LIBRARY FILES -->
    <link rel="stylesheet" type="text/css" href="../basic/basic.css">
    <script src="../basic/basic.js" type="text/javascript" charset="utf-8"></script>
    <script src="../basic/scroll-bar.js" type="text/javascript" charset="utf-8"></script>

    <!-- COMPONENT FILES -->
    <script src="../comp/search-input.js" type="text/javascript" charset="utf-8"></script>

    <script>

        /* Bismillah */

        // DESIGN PAGE: SearchInput with styleName "ozden", to edit SearchInput.styles.ozden (comp/search-input.js).
        // The look comes only from the package: the samples give no look params.
        // basic-designer:
        // http://127.0.0.1:5505/_basic-designer/index.htm?page=02-comp-examples/search-input.htm
        // WHY a name for every SearchInput: it is the name of its layer in basic-designer.

        // *** VARIABLES:
        let lblSearched;

        const start = function () {

            page.color = "#F4F5F2";

            // BOX: Scrolling page
            // WHY: page does not scroll. Scrollable content must be inside a Box with scrollY: 1.
            const scrollBox = startBox(0, 0, "100%", "100%", { color: "#FFFFFF", scrollY: 1 });

                VGroup({ width: "100%", height: "auto", align: "left top", gap: 28, padding: 40 });

                    // SAMPLES: ozden
                    caption("ozden · empty");
                    const searchEmpty = SearchInput({
                        styleName: "ozden",
                        onChange: showSearched,
                    });

                    caption("ozden · with text (setText shows the clear icon)");
                    const searchWithText = SearchInput({
                        styleName: "ozden",
                        placeholder: "Search products",
                        onChange: showSearched,
                    });
                    searchWithText.setText("fishing boat");

                    caption("ozden · wide (480)");
                    const searchWide = SearchInput({
                        styleName: "ozden",
                        width: 480,
                        height: 40,
                        fontSize: 18,
                        searchIconSize: 20,
                        placeholder: "Search in all pages",
                        onChange: showSearched,
                    });

                    caption("ozden · animated: 1 (move the mouse over it, click, type, clear; the packages are still: animated 0)");
                    const searchAnimated = SearchInput({
                        styleName: "ozden",
                        animated: 1,
                        placeholder: "Search products",
                        onChange: showSearched,
                    });

                    lblSearched = Label({ text: "Searched: -", fontSize: 13, textColor: Black(0.5) });

                    // SAMPLES: ozdenDark
                    VGroup({ hug: 1, align: "left top", gap: 12, padding: 24, color: "#1E1F22", round: 16 });

                        Label({ text: "ozdenDark · on a dark page", fontSize: 12, textColor: White(0.45) });
                        const searchDark = SearchInput({
                            styleName: "ozdenDark",
                            placeholder: "Search products",
                            onChange: showSearched,
                        });
                        searchDark.setText("fishing boat");

                        Label({ text: "ozdenDark · animated: 1", fontSize: 12, textColor: White(0.45) });
                        const searchDarkAnimated = SearchInput({
                            styleName: "ozdenDark",
                            animated: 1,
                            placeholder: "Search products",
                            onChange: showSearched,
                        });

                    endGroup();

                    // LIGHT (to compare)
                    caption("light · to compare");
                    const searchLight = SearchInput({
                        styleName: "light",
                        onChange: showSearched,
                    });

                endGroup();

            endBox();

            ScrollBar({ scrollableBox: scrollBox });

        };

        // *** OTHER FUNCTIONS:

        const showSearched = function (self) {
            lblSearched.text = "Searched: " + (self.getSearchText() || "-");
        };

        const caption = function (text) {
            return Label({ text: text, fontSize: 12, textColor: Black(0.4) });
        };

    </script>

</head>

<body>
</body>

</html>

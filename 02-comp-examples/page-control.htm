<!DOCTYPE html>
<html lang="en">

<head>
    <title>Page Control</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- LIBRARY FILES -->
    <link rel="preload" href="../basic/font/open-sans/OpenSans-Regular.ttf" as="font" crossorigin="anonymous">
    <link rel="preload" href="../basic/font/open-sans/OpenSans-Bold.ttf" as="font" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="../basic/basic.min.css">
    <script src="../basic/basic.min.js" type="text/javascript" charset="utf-8"></script>

    <!-- COMPONENT FILES -->
    <script src="../comp/smart-button.js" type="text/javascript" charset="utf-8"></script>
    <script src="../comp/page-control.js" type="text/javascript" charset="utf-8"></script>
    <script src="../comp/scroll-area.js" type="text/javascript" charset="utf-8"></script>

    <script>

        /* Bismillah */

        // *** VARIABLES:
        let wizard, lblWizard;
        let wizardStep = 0;
        let screens, lblScreens;

        const WIZARD_STEPS = ["account", "profile", "done"];
        const SLIDES = [
            { title: "Fresh roasts every week", text: "Single origin beans, roasted on Mondays.", color: "#65A293" },
            { title: "Free delivery over $60", text: "Same day in the city, next day everywhere else.", color: "#5B7BD5" },
            { title: "Gift boxes", text: "Wrapped by hand with a card of your words.", color: "#E0457B" },
            { title: "Brewing classes", text: "Saturday mornings at the shop.", color: "#E5885E" },
        ];

        const start = function () {

            page.color = "#F4F5F2";

            // SCROLL AREA: The page
            // WHY: page does not scroll. A ScrollArea fills the window; its content scrolls when it is taller.
            ScrollArea({
                align: "center top",
                gap: 30,
                padding: [16, 50], // WHY 16 at the sides: the cards fill a phone (390 px)
            });

                // LABEL: Title
                Label({
                    text: "Page Control",
                    fontSize: 26,
                    fontFamily: "opensans-bold",
                });

                // SAMPLE 1: Wizard (steps)
                startCard(
                    "1. Wizard (slide, no swipe)",
                    "onBeforeChange stops the change when the step is not complete. The pages are filled with startPage() / endPage()."
                );

                    wizard = PageControl({
                        width: "100%",
                        height: 220,
                        swipe: 0,
                        keyboard: 0,
                        pages: WIZARD_STEPS,
                        onBeforeChange: function (self, fromKey, toKey) {
                            // Only the "Continue" button can go forward.
                            if (self.getIndex(toKey) > wizardStep) {
                                lblWizard.text = "Complete the step first.";
                                return false;
                            }
                        },
                        onChange: function (self) {
                            lblWizard.text = "Step " + (self.getIndex() + 1) + " of " + self.getCount() + ": " + self.value;
                        },
                        style: { box: { color: "white", border: 1, borderColor: Black(0.1), round: 10 } },
                    });

                    WIZARD_STEPS.forEach(fillWizardStep);

                    lblWizard = addInfoLabel("Step 1 of 3: account");

                endCard();

                // SAMPLE 2: Carousel
                startCard(
                    "2. Carousel (dots, arrows, loop, autoPlay: 4, swipe)",
                    "Drag with the mouse or a finger. Arrow keys work when the box has the focus. Auto play pauses while the mouse is over it."
                );

                    const carousel = PageControl({
                        width: "100%",
                        height: 200,
                        dots: 1,
                        arrows: 1,
                        loop: 1,
                        autoPlay: 4,
                        style: { box: { round: 10 } },
                    });

                    SLIDES.forEach(function (slide, index) {
                        carousel.addPage("slide" + index);
                        carousel.startPage("slide" + index);
                            VGroup({ width: "100%", height: "100%", align: "center center", gap: 8, padding: 30, color: slide.color });
                                Label({ text: slide.title, fontSize: 22, textColor: "white", fontFamily: "opensans-bold", textAlign: "center" });
                                Label({ text: slide.text, fontSize: 14, textColor: White(0.85), textAlign: "center" });
                            endGroup();
                        carousel.endPage();
                    });

                endCard();

                // SAMPLE 3: App screens, add / remove pages
                startCard("3. Screens (vertical slide, pageScroll: 1)", "Each page scrolls its own content. Pages can be added and removed at run time.");

                    HGroup({ width: "100%", height: "auto", align: "left top", gap: 16 });

                        screens = PageControl({
                            width: 260,
                            height: 300,
                            transition: "slide-vertical",
                            pageScroll: 1,
                            dots: 0,
                            pages: ["inbox", "settings"],
                            onChange: function (self) {
                                lblScreens.text = "Open: " + self.value + " · pages: " + self.getKeys().join(", ");
                            },
                            style: { box: { color: "white", border: 1, borderColor: Black(0.1), round: 16 } },
                        });
                        fillScreen("inbox", "#5B7BD5");
                        fillScreen("settings", "#65A293");

                        VGroup({ width: "auto", height: "auto", align: "left top", gap: 8 });
                            addSampleButton("Next", function () { screens.next(); });
                            addSampleButton("Previous", function () { screens.previous(); });
                            addSampleButton("Add page", function () {
                                const key = "page" + (screens.getCount() + 1);
                                screens.addPage(key);
                                fillScreen(key, "#E0457B");
                                screens.open(key);
                            }, 1);
                            addSampleButton("Remove open", function () { screens.removePage(screens.value); }, 1);
                            lblScreens = addInfoLabel("Open: inbox · pages: inbox, settings");
                        endGroup();

                    endGroup();

                endCard();

                // SAMPLE 4: Fade
                startCard("4. Fade (transition: \"fade\")");

                    HGroup({ width: "100%", height: "auto", align: "left center", gap: 16 });

                        const fader = PageControl({
                            width: 200,
                            height: 120,
                            transition: "fade",
                            motion: 0.5,
                            loop: 1,
                            pages: ["a", "b", "c"],
                            style: { box: { round: 10 } },
                        });
                        [
                            { key: "a", color: "#65A293" },
                            { key: "b", color: "#5B7BD5" },
                            { key: "c", color: "#E5885E" },
                        ].forEach(function (item) {
                            fader.startPage(item.key);
                                VGroup({ width: "100%", height: "100%", align: "center center", color: item.color });
                                    Label({ text: item.key.toUpperCase(), fontSize: 40, textColor: "white", fontFamily: "opensans-bold" });
                                endGroup();
                            fader.endPage();
                        });

                        addSampleButton("Next", function () { fader.next(); });

                    endGroup();

                endCard();

            endGroup();

        };

        // *** OTHER FUNCTIONS:

        // "account" -> "Account"
        const toTitle = function (key) {
            return key.charAt(0).toUpperCase() + key.slice(1);
        };

        // A page of the wizard: a title, a text and its buttons at the bottom
        const fillWizardStep = function (key, index) {
            const isLastStep = (index === WIZARD_STEPS.length - 1);
            const message = isLastStep ? "All done. Thank you!" : "Fill in the " + key + " details here, then continue.";

            wizard.startPage(key);
                VGroup({ width: "100%", height: "100%", align: "left top", gap: 12, padding: 24 });

                    Label({ text: (index + 1) + ". " + toTitle(key), fontSize: 20, fontFamily: "opensans-bold" });
                    Label({ text: message, fontSize: 14, textColor: Black(0.55) });

                    HGroup({ width: "auto", height: "auto", gap: 8, css: { marginTop: "auto" } });

                        if (index > 0) {
                            addSampleButton("Back", function () { wizard.previous(); }, 1);
                        }

                        if (isLastStep) {
                            addSampleButton("Start over", function () {
                                wizardStep = 0;
                                wizard.open("account");
                            }, 1);
                        } else {
                            addSampleButton("Continue", function () {
                                wizardStep = index + 1;
                                wizard.next();
                            });
                        }

                    endGroup();

                endGroup();
            wizard.endPage();
        };

        // A screen with a header and a long list (to show pageScroll)
        const fillScreen = function (key, color) {
            screens.startPage(key);
                VGroup({ width: "100%", height: "auto", align: "left top", gap: 0 });
                    Label({
                        text: toTitle(key),
                        width: "100%",
                        fontSize: 18,
                        textColor: "white",
                        color: color,
                        padding: [16, 14],
                        fontFamily: "opensans-bold",
                    });
                    for (let i = 1; i <= 12; i++) {
                        Label({
                            text: key + " item " + i,
                            width: "100%",
                            fontSize: 14,
                            textColor: Black(0.7),
                            padding: [16, 10],
                            css: { borderBottom: "1px solid " + Black(0.06) },
                        });
                    }
                endGroup();
            screens.endPage();
        };

        // GROUP: A card with a title and a short description.
        const startCard = function (title, description = "") {
            VGroup({
                width: 620,
                height: "auto",
                align: "left top",
                gap: 16,
                padding: 20,
                color: "white",
                round: 10,
                border: 1,
                borderColor: Black(0.1),
                css: { maxWidth: "100%", alignItems: "stretch" }, // WHY maxWidth: on a phone the card is as wide as the screen
            });
            Label({
                text: title,
                fontSize: 14,
                textColor: Black(0.45),
            });
            if (description) {
                Label({
                    text: description,
                    fontSize: 13,
                    textColor: Black(0.35),
                    css: { marginTop: "-10px" },
                });
            }
        };

        const endCard = function () {
            endGroup();
        };

        // A button of the sample (SmartButton): its gray, a secondary one white
        const addSampleButton = function (text, onClick, isSecondary = 0) {
            return SmartButton({
                labelText: text,
                tone: (isSecondary) ? "white" : "",
                onClick: onClick,
            });
        };

        const addInfoLabel = function (text) {
            return Label({
                text: text,
                fontSize: 14,
                textColor: Black(0.5),
            });
        };

    </script>
</head>

<body></body>

</html>

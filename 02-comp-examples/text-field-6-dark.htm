<!DOCTYPE html>
<html lang="en">
    <head>

        <title>TextField - Dark Style</title>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- LIBRARY FILES -->
        <link rel="preload" href="../basic/font/open-sans/OpenSans-Regular.ttf" as="font" crossorigin="anonymous">
        <link rel="stylesheet" type="text/css" href="../basic/basic.css">
        <script src="../basic/basic.js" type="text/javascript" charset="utf-8"></script>
        <script src="../basic/scroll-bar.js" type="text/javascript" charset="utf-8"></script>

        <script src="../comp/tooltip.js" type="text/javascript" charset="utf-8"></script>
        <script src="../comp/text-field.js" type="text/javascript" charset="utf-8"></script>
        <script src="../comp/scroll-area.js" type="text/javascript" charset="utf-8"></script>

        <script>

        /* Bismillah */

        // TextField with styleName: "dark": the dark theme of classic (the same shape: a line under the field, no border).

        const PAGE_COLOR = "black";
        const CARD_COLOR = "#1A1A19";
        const CARD_BORDER_COLOR = White(0.1);
        const CARD_WIDTH = 420;

        const addCaption = function (text) {
            Label({ text: text, fontSize: 12, textColor: White(0.45), css: { letterSpacing: "1px" } });
        };

        const start = function () {

            page.color = PAGE_COLOR;

            ScrollArea({ align: "center top", padding: 40, gap: 20 });

                Label({ text: "TextField · styleName: \"dark\"", fontSize: 22, textColor: White(0.9) });

                // GROUP: A dark card (Ozden Panel)
                VGroup({
                    width: CARD_WIDTH,
                    height: "auto",
                    align: "left top",
                    gap: 14,
                    padding: 20,
                    color: CARD_COLOR,
                    round: 12,
                    border: 1,
                    borderColor: CARD_BORDER_COLOR,
                    css: { alignItems: "stretch" },
                });

                    addCaption("REQUIRED");
                    TextField({
                        styleName: "dark",
                        width: "100%",
                        titleText: "FULL NAME",
                        placeholder: "Your name",
                        required: 1,
                    });

                    addCaption("UNIT AND DESCRIPTION");
                    TextField({
                        styleName: "dark",
                        width: "100%",
                        titleText: "WEIGHT",
                        placeholder: "0",
                        unitText: "KG",
                        descriptionText: "The weight of the package",
                    });

                    addCaption("WARNING ICON (warningBallType: \"icon\")");
                    const codeInput = TextField({
                        styleName: "dark",
                        width: "100%",
                        titleText: "CODE",
                        placeholder: "4 digits",
                        value: "12a",
                        warningText: "Only digits",
                        warningBallType: "icon",
                        maxLength: 4,
                    });
                    codeInput.isValid = function () {
                        return /^\d*$/.test(codeInput.getValue());
                    };
                    codeInput.showWarningIfNotValid(codeInput.isValid());

                    addCaption("ONE PARAM OF THE PACKAGE CHANGED (focusLineColor)");
                    TextField({
                        styleName: "dark",
                        width: "100%",
                        titleText: "E-MAIL",
                        placeholder: "name@example.com",
                        focusLineColor: "#3987E5",
                    });

                endGroup();

            endGroup();

        };

        </script>

    </head>
    <body>
    </body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartButton - Pill and outlined</title>

    <!-- LIBRARY FILES -->
    <link rel="preload" href="../basic/font/open-sans/OpenSans-Bold.ttf" as="font" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="../basic/basic.css">
    <script src="../basic/basic.js" type="text/javascript" charset="utf-8"></script>
    <script src="../basic/scroll-bar.js" type="text/javascript" charset="utf-8"></script>

    <!-- COMPONENTS -->
    <script src="../comp/smart-button.js" type="text/javascript" charset="utf-8"></script>

    <script>

        /* Bismillah */

        // SMARTBUTTON · STATUS BUTTONS
        // The shape is a template of SmartButton ("pill", "outlined"); the colors are this page's own (SmartButton
        // keeps only the tones of the kit). As high as every other button (44).
        // Every button is one SmartButton({ ... }) call; the colors and the icons come from the small helpers below.
        // - SmartButton({ styleName: "pill", labelText, iconFile: pillIcon("clock", COLORS.orange), style: pillColors(COLORS.orange) })
        // - pillColors: a soft tint, pillSolidColors: the full color, outlinedColors: a colored edge
        // - button.setStyle(colors), button.setText(text), button.setIcon(file) -> after create
        // TRY: click the buttons of "Click to change": "Add" becomes "Added" (click again: back to "Add").

        // *** VARIABLES:

        const ROW_MAX_WIDTH = 960;
        const LIGHT_GRAY_CIRCLE = "#A9A9A9";

        // THE COLORS OF THIS PAGE: color: the strong color; solidHover: its hover;
        // tint / hover: the soft surface; deep: the text of outlined; pillText: the text of pill (color when not
        // given); light: the light part of a two-tone icon. A new color is one new row.
        const COLORS = {
            gray: { color: "#6E6F74", deep: "#3A3A3A", tint: "#F0F0F0", hover: "#E6E6E6", solidHover: "#5F6065", light: "#C4C5C9", pillText: "#3A3A3A" },
            blue: { color: "#2F6FED", deep: "#2563D8", tint: "#E4EDFD", hover: "#D8E5FC", solidHover: "#2563D8", light: "#93B7F7" },
            green: { color: "#3F9A6C", deep: "#2F8259", tint: "#E6F5EE", hover: "#D9EFE4", solidHover: "#358A5E", light: "#9FD6BC" },
            purple: { color: "#8B5CF0", deep: "#7C4FE0", tint: "#EFE9FD", hover: "#E6DDFC", solidHover: "#7C4FE0", light: "#C9B4F7" },
            orange: { color: "#F28C33", deep: "#B8651E", tint: "#FDF1E3", hover: "#FCE8D2", solidHover: "#E57E25", light: "#F7C393" },
            red: { color: "#E5564A", deep: "#C8443A", tint: "#FDECEA", hover: "#FBDFDC", solidHover: "#D84A3E", light: "#F4B1AB" },
            yellow: { color: "#D9A400", deep: "#8F6B00", tint: "#FFF7DB", hover: "#FFF0C2", solidHover: "#C99700", light: "#F5DC8A", pillText: "#B88A00" },
            teal: { color: "#0E9A9A", deep: "#0B7F7F", tint: "#E4F5F5", hover: "#D6EEEE", solidHover: "#0B8C8C", light: "#92D6D6" },
            sky: { color: "#4FB5D4", deep: "#2A7C93", tint: "#E3F7FB", hover: "#D5F2F8", solidHover: "#3FA6C6", light: "#A5DEEC", pillText: "#2E8BC0" },
            navy: { color: "#2A3A8C", deep: "#1C2A78", tint: "#DFE3EF", hover: "#D3D8E9", solidHover: "#1C2A78", light: "#8F9AC6" },
            pink: { color: "#E8457C", deep: "#C93668", tint: "#FDE8EF", hover: "#FBDBE6", solidHover: "#DC3A70", light: "#F5AFC7" },
        };

        // THE COLORS OF A BUTTON: a style made from a color of COLORS (the shape is the template of SmartButton)
        // pill: a soft tint, a bold text in the color
        const pillColors = function (color) {
            return {
                box: { color: color.tint },
                hover: { color: color.hover },
                label: { textColor: color.pillText || color.color },
            };
        };

        // pill: the full color, a white text
        const pillSolidColors = function (color) {
            return {
                box: { color: color.color },
                hover: { color: color.solidHover },
                label: { textColor: "white" },
            };
        };

        // outlined: a colored edge with the line at its bottom, a deep text
        const outlinedColors = function (color) {
            return {
                box: {
                    color: color.tint,
                    borderColor: color.color,
                    boxShadow: "inset 0 -" + SmartButton.EDGE_WIDTH + "px 0 " + color.color,
                },
                hover: { color: color.hover },
                label: { textColor: color.deep },
            };
        };

        // The icons: a filled circle and a white mark in it (circleColor, markColor)
        const MARKS = {
            plus: '<path d="M12 7.5v9M7.5 12h9" stroke="MARK" stroke-width="2.4" stroke-linecap="round"/>',
            check: '<path d="M7.6 12.4l3 3 5.8-6.4" fill="none" stroke="MARK" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>',
            clock: '<path d="M12 7v5.2l3 2.6" fill="none" stroke="MARK" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>',
            cross: '<path d="M8.6 8.6l6.8 6.8M15.4 8.6l-6.8 6.8" stroke="MARK" stroke-width="2.4" stroke-linecap="round"/>',
            pencil: '<path d="M7.6 16.4l.8-3.2 6.1-6.1 2.4 2.4-6.1 6.1z" fill="MARK"/>',
            dots: '<circle cx="7.6" cy="12" r="1.6" fill="MARK"/><circle cx="12" cy="12" r="1.6" fill="MARK"/><circle cx="16.4" cy="12" r="1.6" fill="MARK"/>',
            arrow: '<path d="M6.8 12h10M12.8 8l4 4-4 4" fill="none" stroke="MARK" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>',
            heart: '<path d="M12 17.6s-5.6-3.4-5.6-7.2a3.1 3.1 0 0 1 5.6-1.8 3.1 3.1 0 0 1 5.6 1.8c0 3.8-5.6 7.2-5.6 7.2z" fill="MARK"/>',
            bookmark: '<path d="M8.4 6.4h7.2v11.2L12 15.1l-3.6 2.5z" fill="MARK"/>',
            star: '<path d="M12 5.9l1.9 3.9 4.3.6-3.1 3 .7 4.3-3.8-2-3.8 2 .7-4.3-3.1-3 4.3-.6z" fill="MARK"/>',
            info: '<circle cx="12" cy="7.6" r="1.5" fill="MARK"/><path d="M12 11.2v5.6" stroke="MARK" stroke-width="2.4" stroke-linecap="round"/>',
            lock: '<rect x="7.8" y="11" width="8.4" height="6.6" rx="1.3" fill="MARK"/><path d="M9.5 11V9.3a2.5 2.5 0 0 1 5 0V11" fill="none" stroke="MARK" stroke-width="1.8"/>',
        };

        // The two-tone icons of "Outlined": a light shape (LIGHT) and a strong detail on it (STRONG)
        const TWO_TONE_ICONS = {
            music: '<circle cx="12" cy="12" r="10.5" fill="LIGHT"/><path d="M10.2 16.5V7.6l6.6-1.6v9" fill="none" stroke="STRONG" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8.2" cy="16.5" r="2.2" fill="STRONG"/><circle cx="14.8" cy="15" r="2.2" fill="STRONG"/>',
            compass: '<circle cx="12" cy="12" r="10.5" fill="LIGHT"/><path d="M17 7l-3 7-7 3 3-7z" fill="STRONG"/>',
            photo: '<rect x="2.5" y="4" width="19" height="16" rx="3" fill="LIGHT"/><circle cx="8" cy="9.2" r="2" fill="STRONG"/><path d="M5 18l4-4.5 3 3 4-4.5 3 3.5V18z" fill="STRONG"/>',
            coffee: '<path d="M8.5 2.5c-1 1.2 1 2 0 3.5M13 2.5c-1 1.2 1 2 0 3.5M17.5 11h1.2a2.8 2.8 0 0 1 0 5.6h-1.5" fill="none" stroke="STRONG" stroke-width="2" stroke-linecap="round"/><path d="M3.5 8.5h14v7a6 6 0 0 1-6 6h-2a6 6 0 0 1-6-6z" fill="LIGHT"/>',
            gamepad: '<rect x="2" y="6.5" width="20" height="12" rx="6" fill="LIGHT"/><path d="M7.5 10.5v4M5.5 12.5h4" fill="none" stroke="STRONG" stroke-width="2" stroke-linecap="round"/><circle cx="15.5" cy="11" r="1.5" fill="STRONG"/><circle cx="18" cy="14" r="1.5" fill="STRONG"/>',
            gift: '<rect x="3.5" y="10" width="17" height="11.5" rx="2.5" fill="LIGHT"/><rect x="2.5" y="7.5" width="19" height="5" rx="1.5" fill="LIGHT"/><rect x="10.7" y="7.5" width="2.6" height="14" fill="STRONG"/><path d="M12 7.5C9.5 3 5.5 3.5 6.5 6c.5 1.2 2.5 1.5 5.5 1.5zM12 7.5c2.5-4.5 6.5-4 5.5-1.5-.5 1.2-2.5 1.5-5.5 1.5z" fill="none" stroke="STRONG" stroke-width="1.8" stroke-linejoin="round"/>',
            display: '<rect x="2.5" y="3" width="19" height="14" rx="3" fill="LIGHT"/><path d="M12 17v3.5M8 21h8" fill="none" stroke="STRONG" stroke-width="2" stroke-linecap="round"/><path d="M6.5 12.5l3.5-3.5 2.5 2.5 4-4" fill="none" stroke="STRONG" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',
            wallet: '<path d="M5 6l10.5-2.8c1.1-.3 2 .5 2 1.5V6" fill="none" stroke="STRONG" stroke-width="2" stroke-linecap="round"/><rect x="2.5" y="6" width="19" height="15" rx="3" fill="LIGHT"/><rect x="14.5" y="11" width="7" height="5" rx="2.5" fill="STRONG"/>',
            notes: '<rect x="4" y="2.5" width="16" height="19" rx="3" fill="LIGHT"/><path d="M8 8h8M8 12h8M8 16h5" fill="none" stroke="STRONG" stroke-width="2" stroke-linecap="round"/>',
            rocket: '<path d="M7.8 11L4.5 14.5V19L8.5 16.5zM16.2 11l3.3 3.5V19l-4-2.5zM10 18h4l-2 4.5z" fill="STRONG"/><path d="M12 1.5c3.4 2.4 5 5.8 5 9.5 0 2.2-.4 4.2-1.2 6.5H8.2C7.4 15.2 7 13.2 7 11c0-3.7 1.6-7.1 5-9.5z" fill="LIGHT"/><circle cx="12" cy="9.5" r="2.2" fill="STRONG"/>',
            lock: '<path d="M7.5 11V7.5a4.5 4.5 0 0 1 9 0V11" fill="none" stroke="STRONG" stroke-width="2.2"/><rect x="3.5" y="10" width="17" height="12" rx="3" fill="LIGHT"/><circle cx="12" cy="15" r="1.9" fill="STRONG"/><path d="M12 15.5v3" stroke="STRONG" stroke-width="2.2" stroke-linecap="round"/>',
            cloudSun: '<circle cx="16.5" cy="8" r="5" fill="STRONG"/><path d="M6.8 21a4.8 4.8 0 0 1-.6-9.56A5.8 5.8 0 0 1 17.3 13a4 4 0 0 1 .2 8z" fill="LIGHT"/>',
        };

        const svgIcon = function (body) {
            const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">' + body + "<\/svg>";
            return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
        };

        const circleIcon = function (mark, circleColor, markColor) {
            const circle = '<circle cx="12" cy="12" r="11" fill="' + circleColor + '"/>';
            const coloredMark = MARKS[mark].split("MARK").join(markColor);
            return svgIcon(circle + coloredMark);
        };

        const twoToneIcon = function (name, lightColor, strongColor) {
            const drawing = TWO_TONE_ICONS[name];
            return svgIcon(drawing.split("LIGHT").join(lightColor).split("STRONG").join(strongColor));
        };

        // THE ICON OF A BUTTON: a colored circle with a white mark (pill), a white circle with a colored mark (a full
        // pill), a gray circle (a state before it is chosen), a two-tone drawing (outlined)
        const pillIcon = function (mark, color) {
            return circleIcon(mark, color.pillText || color.color, "white");
        };

        const solidIcon = function (mark, color) {
            return circleIcon(mark, "white", color.color);
        };

        const grayIcon = function (mark) {
            return circleIcon(mark, LIGHT_GRAY_CIRCLE, "white");
        };

        const outlinedIcon = function (name, color) {
            return twoToneIcon(name, color.light, color.color);
        };

        // *** START:

        const start = function () {

            page.color = "white";

            // BOX: Scrolling page
            const scrollBox = startBox(0, 0, "100%", "100%", { color: "transparent", scrollY: 1 });

                VGroup({ width: "100%", height: "auto", align: "center top", gap: 40, padding: [20, 60], clipContent: 0 });

                    startRow("Order status");
                        SmartButton({ styleName: "pill", labelText: "Draft", iconFile: grayIcon("pencil"), style: pillColors(COLORS.gray) });
                        SmartButton({ styleName: "pill", labelText: "Waiting", iconFile: pillIcon("clock", COLORS.orange), style: pillColors(COLORS.orange) });
                        SmartButton({ styleName: "pill", labelText: "Preparing", iconFile: pillIcon("dots", COLORS.blue), style: pillColors(COLORS.blue) });
                        SmartButton({ styleName: "pill", labelText: "On the way", iconFile: pillIcon("arrow", COLORS.purple), style: pillColors(COLORS.purple) });
                        SmartButton({ styleName: "pill", labelText: "Accepted", iconFile: pillIcon("check", COLORS.green), style: pillColors(COLORS.green) });
                        SmartButton({ styleName: "pill", labelText: "Declined", iconFile: pillIcon("cross", COLORS.red), style: pillColors(COLORS.red) });
                    endRow();

                    // A click changes the look; a second click brings it back
                    startRow("Click to change");
                        createSwitchButton(
                            { text: "Add", icon: grayIcon("plus"), colors: pillColors(COLORS.gray) },
                            { text: "Added", icon: solidIcon("check", COLORS.blue), colors: pillSolidColors(COLORS.blue) }
                        );
                        createSwitchButton(
                            { text: "Follow", icon: grayIcon("plus"), colors: pillColors(COLORS.gray) },
                            { text: "Following", icon: solidIcon("check", COLORS.purple), colors: pillSolidColors(COLORS.purple) }
                        );
                        createSwitchButton(
                            { text: "Like", icon: grayIcon("heart"), colors: pillColors(COLORS.gray) },
                            { text: "Liked", icon: solidIcon("heart", COLORS.pink), colors: pillSolidColors(COLORS.pink) }
                        );
                        createSwitchButton(
                            { text: "Save", icon: grayIcon("bookmark"), colors: pillColors(COLORS.gray) },
                            { text: "Saved", icon: solidIcon("bookmark", COLORS.teal), colors: pillSolidColors(COLORS.teal) }
                        );
                    endRow();

                    startRow("Labels");
                        SmartButton({ styleName: "pill", labelText: "New", iconFile: pillIcon("star", COLORS.yellow), style: pillColors(COLORS.yellow) });
                        SmartButton({ styleName: "pill", labelText: "Verified", iconFile: pillIcon("check", COLORS.teal), style: pillColors(COLORS.teal) });
                        SmartButton({ styleName: "pill", labelText: "Info", iconFile: pillIcon("info", COLORS.sky), style: pillColors(COLORS.sky) });
                        SmartButton({ styleName: "pill", labelText: "Locked", iconFile: pillIcon("lock", COLORS.gray), style: pillColors(COLORS.gray) });
                    endRow();

                    startRow("Outlined");
                        SmartButton({ styleName: "outlined", labelText: "Music", iconFile: outlinedIcon("music", COLORS.blue), style: outlinedColors(COLORS.blue) });
                        SmartButton({ styleName: "outlined", labelText: "Travel", iconFile: outlinedIcon("compass", COLORS.green), style: outlinedColors(COLORS.green) });
                        SmartButton({ styleName: "outlined", labelText: "Photos", iconFile: outlinedIcon("photo", COLORS.purple), style: outlinedColors(COLORS.purple) });
                        SmartButton({ styleName: "outlined", labelText: "Coffee", iconFile: outlinedIcon("coffee", COLORS.orange), style: outlinedColors(COLORS.orange) });
                        SmartButton({ styleName: "outlined", labelText: "Games", iconFile: outlinedIcon("gamepad", COLORS.navy), style: outlinedColors(COLORS.navy) });
                        SmartButton({ styleName: "outlined", labelText: "Gifts", iconFile: outlinedIcon("gift", COLORS.pink), style: outlinedColors(COLORS.pink) });
                    endRow();

                    // ONLY AN ICON (labelText: ""): a circle; its name is read by a screen reader (ariaLabel)
                    startRow("Outlined, only an icon");
                        SmartButton({ styleName: "outlined", labelText: "", ariaLabel: "Display", iconFile: outlinedIcon("display", COLORS.blue), style: outlinedColors(COLORS.blue) });
                        SmartButton({ styleName: "outlined", labelText: "", ariaLabel: "Wallet", iconFile: outlinedIcon("wallet", COLORS.green), style: outlinedColors(COLORS.green) });
                        SmartButton({ styleName: "outlined", labelText: "", ariaLabel: "Notes", iconFile: outlinedIcon("notes", COLORS.purple), style: outlinedColors(COLORS.purple) });
                        SmartButton({ styleName: "outlined", labelText: "", ariaLabel: "Boost", iconFile: outlinedIcon("rocket", COLORS.orange), style: outlinedColors(COLORS.orange) });
                        SmartButton({ styleName: "outlined", labelText: "", ariaLabel: "Privacy", iconFile: outlinedIcon("lock", COLORS.navy), style: outlinedColors(COLORS.navy) });
                        SmartButton({ styleName: "outlined", labelText: "", ariaLabel: "Weather", iconFile: outlinedIcon("cloudSun", COLORS.sky), style: outlinedColors(COLORS.sky) });
                    endRow();

                endGroup();

            endBox();

            ScrollBar({ scrollableBox: scrollBox });

        };

        // *** FUNCTIONS:

        // GROUP: A title and its buttons side by side (they wrap on a narrow screen); the buttons are made between the two
        const startRow = function (title) {
            VGroup({
                width: "100%",
                height: "auto",
                align: "center top",
                gap: 16,
                clipContent: 0,
                css: { maxWidth: ROW_MAX_WIDTH + "px" },
            });
                Label({ text: title, fontSize: 14, textColor: Black(0.45) });
                HGroup({ width: "100%", height: "auto", align: "center center", gap: 14, wrap: 1, clipContent: 0 });
        };

        const endRow = function () {
                endGroup();
            endGroup();
        };

        // SMARTBUTTON: A pill that changes its look at every click. off: its look when made, on: after a click.
        // off, on: { text, icon, colors }
        const createSwitchButton = function (off, on) {
            return SmartButton({
                styleName: "pill",
                labelText: off.text,
                iconFile: off.icon,
                style: off.colors,
                onClick: function (self) {
                    const next = (self.labelText == off.text) ? on : off;
                    self.setText(next.text);
                    self.setIcon(next.icon);
                    self.setStyle(next.colors);
                },
            });
        };

    </script>

</head>

<body>
</body>

</html>

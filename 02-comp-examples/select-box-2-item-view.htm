<!DOCTYPE html>
<html lang="en">
<head>

    <title>SelectBox - your own rows and field, in every package</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preload" href="../basic/font/open-sans/OpenSans-Regular.ttf" as="font" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="../basic/basic.css">
    <script src="../basic/basic.js" type="text/javascript" charset="utf-8"></script>
    <script src="../basic/scroll-bar.js" type="text/javascript" charset="utf-8"></script>

    <script src="../comp/scroll-area.js" type="text/javascript" charset="utf-8"></script>
    <script src="../comp/smart-button.js" type="text/javascript" charset="utf-8"></script>
    <!-- item-list.js before select-box.js: with createItemView, the list of SelectBox is an ItemList -->
    <script src="../comp/item-list.js" type="text/javascript" charset="utf-8"></script>
    <script src="../comp/search-input.js" type="text/javascript" charset="utf-8"></script>
    <script src="../comp/select-box.js" type="text/javascript" charset="utf-8"></script>

    <script>

    /* Bismillah */

    /*

    SelectBox with YOUR OWN ROWS and FIELD, in the packages "ozden", "light" and "dark".

    - createItemView(option, row, self) -> draws one row of the list (an HGroup: the objects side by side).
    - createValueView(option, field, self) -> draws the selected option in the field.
    - disabled: 1 -> the option can not be selected. searchText -> more words the search finds it by ("Turkey").

    1. Countries: single, ozden, own rows and field, a search, a disabled option (Vatican City).
    2. Fruits: multiple, ozden, own rows (a picture, the name and a tag).
    3. Fruits: single, light, own rows and field, a search.
    4. Fruits: single, dark, own rows.

    The buttons under a select call its functions: setValue() (with 1: no onChange), clear(), setOptions(), setEnabled().

    */

    // *** VARIABLES:
    const FRUITS_PATH = "../assets/fruids/";
    const COLUMN_WIDTH = 350;
    const COUNTRY_FIELD_HEIGHT = 60;
    const COUNTRY_ROW_HEIGHT = 60;
    const ROW_LINE = "inset 0px -1px 0px rgba(0, 0, 0, 0.05)";

    const COUNTRIES = [
        { value: "US", label: "United States", code: "+1" },
        { value: "CA", label: "Canada", code: "+1" },
        { value: "GB", label: "United Kingdom", code: "+44" },
        { value: "DE", label: "Germany", code: "+49" },
        { value: "FR", label: "France", code: "+33" },
        { value: "TR", label: "Türkiye", code: "+90", searchText: "Turkey Turkiye" },
        { value: "RU", label: "Russia", code: "+7" },
        { value: "IT", label: "Italy", code: "+39" },
        { value: "VA", label: "Vatican City", code: "+39", disabled: 1 },
        { value: "ES", label: "Spain", code: "+34" },
        { value: "BR", label: "Brazil", code: "+55" },
        { value: "IN", label: "India", code: "+91" },
        { value: "CN", label: "China", code: "+86" },
        { value: "JP", label: "Japan", code: "+81" },
        { value: "DZ", label: "Algeria", code: "+213" },
        { value: "NG", label: "Nigeria", code: "+234" },
    ];

    const FRUITS = [
        { value: "Broccoli", label: "Broccoli", description: "Vegetable", iconFile: FRUITS_PATH + "brokoli.png" },
        { value: "Strawberry", label: "Strawberry", description: "Fruit", iconFile: FRUITS_PATH + "cilek.png" },
        { value: "Tomato", label: "Tomato", description: "Vegetable", iconFile: FRUITS_PATH + "domates.png" },
        { value: "Apple", label: "Apple", description: "Fruit", iconFile: FRUITS_PATH + "elma.png" },
        { value: "Carrot", label: "Carrot", description: "Vegetable", iconFile: FRUITS_PATH + "havuc.png", disabled: 1 },
        { value: "Watermelon", label: "Watermelon", description: "Fruit", iconFile: FRUITS_PATH + "karpuz.png" },
        { value: "Lemon", label: "Lemon", description: "Fruit", iconFile: FRUITS_PATH + "limon.png" },
        { value: "Banana", label: "Banana", description: "Fruit", iconFile: FRUITS_PATH + "muz.png" },
        { value: "Pomegranate", label: "Pomegranate", description: "Fruit", iconFile: FRUITS_PATH + "nar.png" },
        { value: "Eggplant", label: "Eggplant", description: "Vegetable", iconFile: FRUITS_PATH + "patlican.png" },
    ];

    let countrySelect = null;
    let fruitsSelect = null;
    let lightSelect = null;
    let darkSelect = null;
    let changeLabel = null;
    let changeCount = 0;

    // *** START:
    const start = function () {

        page.color = "white";

        // WHY 16 px at the sides: a column of 350 px fits a phone of 390 px
        ScrollArea({ align: "center top", gap: 24, padding: [16, 30] });

            Label({ text: "SelectBox: createItemView / createValueView", fontSize: 22 });
            changeLabel = Label({ plainText: "onChange: -", fontSize: 14, textColor: Black(0.6) });

            HGroup({ hug: 1, align: "left top", gap: 40, wrap: 1, clipContent: 0 });

                startColumn("1. Countries (single, ozden)");

                    countrySelect = SelectBox({
                        styleName: "ozden",
                        width: "100%",
                        height: COUNTRY_FIELD_HEIGHT,
                        options: COUNTRIES,
                        value: "US",
                        searchPlaceholder: "Search a country or a code",
                        style: { itemList: { row: { gap: 12 } } },
                        createItemView: createCountryRow,
                        createValueView: createCountryValue,
                        onChange: logChange,
                    });

                    startButtonRow();

                        SmartButton({
                            labelText: "setValue(\"DE\")",
                            style: { label: { fontSize: 14 } },
                            onClick: function () { countrySelect.setValue("DE"); },
                        });

                        // 1: silent, onChange is not called
                        SmartButton({
                            labelText: "setValue(\"TR\", silent)",
                            style: { label: { fontSize: 14 } },
                            onClick: function () { countrySelect.setValue("TR", 1); },
                        });

                        SmartButton({
                            labelText: "clear()",
                            style: { label: { fontSize: 14 } },
                            onClick: function () { countrySelect.clear(); },
                        });

                        SmartButton({
                            labelText: "setOptions(5)",
                            style: { label: { fontSize: 14 } },
                            onClick: function () { countrySelect.setOptions(COUNTRIES.slice(0, 5)); },
                        });

                        SmartButton({
                            labelText: "setOptions(all)",
                            style: { label: { fontSize: 14 } },
                            onClick: function () { countrySelect.setOptions(COUNTRIES); },
                        });

                        SmartButton({
                            labelText: "setEnabled(on / off)",
                            style: { label: { fontSize: 14 } },
                            onClick: function () { countrySelect.setEnabled(!countrySelect.enabled); },
                        });

                    endButtonRow();

                endColumn();

                startColumn("2. Fruits (multiple, ozden)");

                    fruitsSelect = SelectBox({
                        styleName: "ozden",
                        width: "100%",
                        multiple: 1,
                        options: FRUITS,
                        value: ["Apple", "Lemon"],
                        placeholder: "Select fruits",
                        createItemView: createFruitRow,
                        onChange: logChange,
                    });

                    startButtonRow();

                        SmartButton({
                            labelText: "setValue([Tomato, Banana])",
                            style: { label: { fontSize: 14 } },
                            onClick: function () { fruitsSelect.setValue(["Tomato", "Banana"]); },
                        });

                        SmartButton({
                            labelText: "clear()",
                            style: { label: { fontSize: 14 } },
                            onClick: function () { fruitsSelect.clear(); },
                        });

                    endButtonRow();

                endColumn();

                startColumn("3. Fruits (single, light)");

                    lightSelect = SelectBox({
                        width: 300,
                        options: FRUITS,
                        value: "Tomato",
                        searchable: 1,
                        createItemView: createFruitRow,
                        createValueView: createFruitValue,
                        onChange: logChange,
                    });

                    startButtonRow();

                        SmartButton({
                            labelText: "setValue(\"Banana\")",
                            style: { label: { fontSize: 14 } },
                            onClick: function () { lightSelect.setValue("Banana"); },
                        });

                    endButtonRow();

                endColumn();

                startColumn("4. Fruits (single, dark)");

                    darkSelect = SelectBox({
                        styleName: "dark",
                        width: 300,
                        options: FRUITS,
                        value: "Lemon",
                        createItemView: createDarkFruitRow,
                        onChange: logChange,
                    });

                endColumn();

            endGroup();

        endGroup();

    };

    // *** FUNCTIONS:

    // A column: its title, then the select and its buttons. Close it with endColumn().
    const startColumn = function (titleText) {
        VGroup({ width: COLUMN_WIDTH, height: "auto", align: "left top", gap: 12, clipContent: 0, css: { maxWidth: "100%" } });
        Label({ plainText: titleText, fontSize: 16, textColor: "#555555" });
    };

    const endColumn = function () {
        endGroup();
    };

    // The buttons under a select, side by side
    const startButtonRow = function () {
        HGroup({ width: "100%", height: "auto", align: "left top", gap: 8, wrap: 1, clipContent: 0 });
    };

    const endButtonRow = function () {
        endGroup();
    };

    const logChange = function (self) {
        changeCount++;
        changeLabel.plainText = "onChange: " + JSON.stringify(self.value) + "  (" + changeCount + " calls)";
    };

    // The dial code in a gray round pill
    const createCodePill = function (code) {
        return Label({ plainText: code, fontSize: 16, padding: [6, 2], color: "rgba(0, 0, 0, 0.05)", textColor: "#373836", round: 8 });
    };

    const createCountryRow = function (option, row) {
        row.height = COUNTRY_ROW_HEIGHT;
        row.boxShadow = ROW_LINE;
        createCodePill(option.code);
        Label({ plainText: option.label, fontSize: 20 });
    };

    const createCountryValue = function (option) {
        createCodePill(option.code);
        Label({ plainText: option.label, fontSize: 20 });
        that.ellipsis = 1;
    };

    const createFruitRow = function (option, row) {
        Icon({ width: 36, height: 36, round: 4 });
        that.load(option.iconFile);
        Label({ plainText: option.label, fontSize: 18 });
        that.grow = 1;
        Label({ plainText: option.description, fontSize: 12, padding: [8, 2], round: 10, color: Black(0.06), textColor: Black(0.6) });
    };

    const createFruitValue = function (option) {
        Icon({ width: 24, height: 24, round: 4 });
        that.load(option.iconFile);
        Label({ plainText: option.label, fontSize: 16 });
    };

    const createDarkFruitRow = function (option) {
        Icon({ width: 28, height: 28, round: 4 });
        that.load(option.iconFile);
        Label({ plainText: option.label, fontSize: 15, textColor: White(0.9) });
    };

    </script>

</head>
<body>
</body>
</html>

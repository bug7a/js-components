<!DOCTYPE html>
<html lang="en">

<head>
    <title>Smart Table Component Sample</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- LIBRARY FILES -->
    <link rel="stylesheet" type="text/css" href="../basic/basic.min.css">
    <script src="../basic/basic.js" type="text/javascript" charset="utf-8"></script>
    <script src="../basic/scroll-bar.js" type="text/javascript" charset="utf-8"></script>

    <!-- COMPONENT FILES -->
    <script src="../comp/search-input.js" type="text/javascript" charset="utf-8"></script>
    <script src="../comp/context-menu.js" type="text/javascript" charset="utf-8"></script>
    <script src="../comp/tooltip.js" type="text/javascript" charset="utf-8"></script>
    <script src="../comp/smart-table.js" type="text/javascript" charset="utf-8"></script>

    <script>

        // SmartTable (comp/smart-table.js) with 2 million rows (fillTestData): only the rows that are seen are drawn; the keys move the selection.

        const titleDataList = [
            { name: "ID", dataTitle: "id", dataType: "integer", width: 100, sortable: 1 },
            { name: "NAME", dataTitle: "name", dataType: "string", width: 180, sortable: 1 },
            { name: "EMAIL", dataTitle: "email", dataType: "string", width: 290, sortable: 0 },
            { name: "", dataTitle: "active", dataType: "boolean", width: 80, sortable: 0 },
        ];

        const itemDataList = [
            { id: 1, name: "Bugra Ozden", desc: "Developer", email: "bugra.ozden@gmail.com", active: 1 },
            { id: 2, name: "Alper Kaya", desc: "Product Manager", email: "a.kaya@company.net", active: 1 },
            { id: 3, name: "Murat Demir", desc: "Backend Engineer", email: "mdemir@work.io", active: 0 },
            { id: 4, name: "Deniz Arslan", desc: "UI/UX Designer", email: "deniz_arslan@studio.com", active: 1 },
            { id: 5, name: "Nilüfer Çelik", desc: "Data Analyst", email: "n.celik@datahouse.org", active: 1 },
            { id: 6, name: "Frank Weber", desc: "DevOps Engineer", email: "frank.weber@infrateam.de", active: 0 },
            { id: 7, name: "Dany Moreau", desc: "Mobile Developer", email: "dmoreau@appworks.fr", active: 0 },
            { id: 8, name: "Duygu Şahin", desc: "QA Engineer", email: "duygu.sahin@testlab.com", active: 0 },
            { id: 9, name: "Filiz Yıldız", desc: "Scrum Master", email: "f.yildiz@agile.io", active: 1 },
            { id: 10, name: "Anka Polat", desc: "System Architect", email: "anka_polat@systems.net", active: 1 },
            { id: 11, name: "Ceren Aktaş", desc: "Frontend Developer", email: "ceren.aktas@webco.com", active: 1 },
            { id: 12, name: "Emre Güneş", desc: "Database Administrator", email: "e.gunes@dbworks.org", active: 0 },
            { id: 13, name: "Selin Koç", desc: "Business Analyst", email: "selin.koc@analytics.io", active: 1 },
            { id: 14, name: "Tarık Yılmaz", desc: "Cloud Engineer", email: "tarik.yilmaz@cloudbase.co", active: 1 },
            { id: 15, name: "Yasemin Doğan", desc: "Technical Writer", email: "y.dogan@docshub.net", active: 0 },
            { id: 16, name: "Kemal Aydın", desc: "Security Specialist", email: "kemal_aydin@securelab.com", active: 1 },
            { id: 17, name: "Pınar Erdoğan", desc: "HR Manager", email: "p.erdogan@people.io", active: 0 },
            { id: 18, name: "Baran Çetin", desc: "Full Stack Developer", email: "baran.cetin@devstack.net", active: 1 },
            { id: 19, name: "Zeynep Karaca", desc: "Marketing Specialist", email: "zkaraca@brandworks.com", active: 1 },
            { id: 20, name: "Hakan Bulut", desc: "Network Engineer", email: "h.bulut@netcore.org", active: 0 },
        ];

        const start = function () {

            page.color = "darkgray";

            HGroup({
                align: "top left",
                padding: [5, 5],
            });

            // TRY: click a row, then ↑ ↓, Page Up / Page Down, Home / End (Enter: onSelect). Make the window taller or
            // shorter: fitLineCount: 1 keeps the rows 40 px high (itemHeight) and changes their count.
            const smartTable1 = SmartTable({
                fillTestData: 1,
                fitLineCount: 1,
                titleDataList: titleDataList,
                itemDataList: itemDataList,
                createCellView: createCellView,
                updateCellView: updateCellView,
                sortByTitleIndex: 0,
                sortDirection: "Z-A", // "A-Z" or "Z-A"
                style: { width: "100%", height: "100%" },
            });
            smartTable1.onSelect = function (self, data) {
                console.log(data);
            };

            endGroup();

            // Hybrid usage with HTML pages:
            // document.getElementById("element-id").appendChild(smartTable1.elem);

        };

        const ACTIVE_COLUMN = 3; // the index of dataTitle: active
        const CHECK_ROOM = 12; // px: the cell is this much higher than the check

        const updateCellView = function (itemCell, titleDataIndex, value) {

            if (titleDataIndex != ACTIVE_COLUMN) return;

            itemCell.boxCheck.color = (value == 1) ? "#E7BB67" : "white";

            const checkSize = itemCell.height - CHECK_ROOM;
            itemCell.boxCheck.width = checkSize;
            itemCell.boxCheck.height = checkSize;

        };

        // Called once for every cell: the objects made here go into the cell
        const createCellView = function (itemCell, titleDataIndex) {

            if (titleDataIndex != ACTIVE_COLUMN) return;

            itemCell.label.visible = 0;

            itemCell.boxCustom = HGroup();

                const checkSize = itemCell.height - CHECK_ROOM;
                itemCell.boxCheck = Box({
                    width: checkSize,
                    height: checkSize,
                    border: 1,
                    color: "white",
                    round: 100,
                    css: { minHeight: "10px", minWidth: "10px" },
                });

            endGroup();

        };

    </script>
</head>

<body></body>

</html>

<!DOCTYPE html>
<html lang="en">
    <head>

        <title>MenuBar</title>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- LIBRARY FILES -->
        <link rel="stylesheet" type="text/css" href="../basic/basic.min.css">
        <script src="../basic/basic.min.js" type="text/javascript" charset="utf-8"></script>
        <script src="../basic/scroll-bar.min.js" type="text/javascript" charset="utf-8"></script>

        <!-- COMPONENT FILES (MenuBar takes its menus from ContextMenu) -->
        <script src="../comp/context-menu.js" type="text/javascript" charset="utf-8"></script>
        <script src="../comp/menu-bar.js" type="text/javascript" charset="utf-8"></script>
        <script src="../comp/scroll-area.js" type="text/javascript" charset="utf-8"></script>

        <script>

        /* Bismillah */

        // MenuBar (comp/menu-bar.js): the row of menus at the top of a window, in the two themes.
        // A click opens a menu; the mouse on another title opens that one. Try the arrow keys and the shortcuts.
        // Two bars on one page share the keys: a shortcut runs in the first one. (A program has one bar.)

        // *** VARIABLES:
        const PAGE_COLOR = "#ECEBE8";
        const SOFT_TEXT = "#6F6E6B";
        const WINDOW_MIN_WIDTH = 340;
        const WINDOW_MAX_WIDTH = 620;
        const WINDOW_HEIGHT = 300;

        // NOTE: Both bars are made from this list: a bar keeps its own check marks and its own disabled items.
        const MENUS = [
            { text: "File", key: "file", items: [
                { text: "New", key: "new", shortcut: "Ctrl+N" },
                { text: "Open...", key: "open", shortcut: "Ctrl+O" },
                { text: "Open recent", key: "recent", items: ["report.txt", "photo.jpg", "notes.md"] },
                "-",
                { text: "Save", key: "save", shortcut: "Ctrl+S" },
                { text: "Save as...", key: "saveAs", shortcut: "Ctrl+Shift+S" },
                "-",
                { text: "Quit", key: "quit", enabled: 0 },
            ] },
            { text: "Edit", key: "edit", items: [
                { text: "Undo", key: "undo", shortcut: "Ctrl+Z", enabled: 0 },
                { text: "Redo", key: "redo", shortcut: "Ctrl+Y", enabled: 0 },
                "-",
                { text: "Copy", key: "copy", shortcut: "Ctrl+C" },
                { text: "Paste", key: "paste", shortcut: "Ctrl+V" },
            ] },
            { text: "View", key: "view", items: [
                { text: "Word wrap", key: "wrap", checked: 1 },
                { text: "Line numbers", key: "lineNumbers", checked: 0 },
                "-",
                { text: "Reload", key: "reload", shortcut: "F5" },
            ] },
            { text: "Help", key: "help", items: [
                { text: "About", key: "about" },
            ] },
        ];

        // First running function. (basic.js calls it when the page is ready)
        const start = function () {

            page.color = PAGE_COLOR;

            // SCROLL AREA: Page (it scrolls when the window is lower than the samples)
            ScrollArea({ align: "center top", gap: 16, padding: [16, 28] });

                Label({ text: "MenuBar", fontSize: 24, bold: 1, textColor: Black(0.8) });

                // GROUP: The two themes side by side (one under the other on a narrow screen)
                HGroup({ width: "100%", height: "auto", align: "center top", gap: 20, wrap: 1 });
                    createWindow("Light", "styleName: \"light\" (default)", "light", "#FFFFFF", Black(0.14), Black(0.6));
                    createWindow("Dark", "styleName: \"dark\"", "dark", "#1C1C1B", White(0.1), White(0.65));
                endGroup();

            endGroup();

        };

        // *** OTHER FUNCTIONS:

        // GROUP: A title and a small window with a MenuBar
        const createWindow = function (titleText, noteText, styleName, windowColor, lineColor, softColor) {

            VGroup({
                width: "auto",
                height: "auto",
                align: "left top",
                gap: 8,
                css: { flex: "1 1 " + WINDOW_MIN_WIDTH + "px", maxWidth: WINDOW_MAX_WIDTH + "px", minWidth: "0" },
            });

                HGroup({ width: "100%", height: "auto", align: "left center", gap: 8 });
                    Label({ text: titleText, fontSize: 15, bold: 1, textColor: Black(0.75) });
                    Label({ text: basic.escapeHtml(noteText), fontSize: 12, textColor: SOFT_TEXT });
                endGroup();

                // BOX: The window
                // NOTE: The MenuBar stands at the top of a Box by itself.
                startBox({
                    width: "100%",
                    height: WINDOW_HEIGHT,
                    color: windowColor,
                    border: 1,
                    borderColor: lineColor,
                    round: 8,
                });

                    const lblResult = Label({
                        left: 14,
                        top: 50,
                        width: "calc(100% - 28px)",
                        text: "Choose something from a menu.",
                        fontSize: 14,
                        textColor: softColor,
                    });

                    MenuBar({
                        styleName: styleName,
                        menus: MENUS,
                        onClick: function (self, item, menu) {
                            lblResult.plainText = menu.text + " > " + item.text;
                            // A choice that can be on: the page keeps it.
                            if (item.checked !== undefined) self.setItemChecked(item.key, !item.checked);
                        },
                    });

                endBox();

            endGroup();

        };

        </script>

    </head>
    <body>
    </body>
</html>

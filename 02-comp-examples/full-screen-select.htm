<!DOCTYPE html>
<html lang="en">
<head>

    <title>FullScreenSelect</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preload" href="../basic/font/open-sans/OpenSans-Regular.ttf" as="font" crossorigin="anonymous">
    <link rel="preload" href="../basic/font/open-sans/OpenSans-Bold.ttf" as="font" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="../basic/basic.css">
    <script src="../basic/basic.js" type="text/javascript" charset="utf-8"></script>
    <script src="../basic/scroll-bar.js" type="text/javascript" charset="utf-8"></script>

    <script src="../comp/search-input.js" type="text/javascript" charset="utf-8"></script>
    <script src="../comp/full-screen-select.js" type="text/javascript" charset="utf-8"></script>
    <script src="../comp/scroll-area.js" type="text/javascript" charset="utf-8"></script>

    <script>

    /* Bismillah */

    // FullScreenSelect: a select field whose list opens on the whole screen, with a search box.
    // The keyboard: Tab to a field, Enter opens; in the list: type to search, the arrow keys, Enter, Escape.

    const FRUITS = [
        { key: "none", text: "(unselected)" }, { key: "banana", text: "Banana" }, { key: "pineapple", text: "Pineapple" },
        { key: "peach", text: "Peach" }, { key: "avocado", text: "Avocado" }, { key: "melon", text: "Melon" },
        { key: "lemon", text: "Lemon" }, { key: "orange", text: "Orange" }, { key: "kiwi", text: "Kiwi" },
        { key: "passion", text: "Passion Fruit" }, { key: "grapefruit", text: "Grapefruit" }, { key: "papaya", text: "Papaya" },
        { key: "coconut", text: "Coconut" }, { key: "mango", text: "Mango" }, { key: "strawberry", text: "Strawberry" },
        { key: "watermelon", text: "Watermelon" }, { key: "cherry", text: "Cherry" }, { key: "raspberry", text: "Raspberry" },
        { key: "blueberry", text: "Blueberry" }, { key: "blackberry", text: "Blackberry" }, { key: "cranberry", text: "Cranberry" },
        { key: "apple", text: "Apple" },
    ];
    const STATUSES = [{ key: "on", text: "On" }, { key: "off", text: "Off" }, { key: "auto", text: "Automatic" }];
    const CITIES = ["İstanbul", "İzmir", "Ankara", "Çanakkale", "Şanlıurfa", "Muğla", "Ağrı", "Trabzon", "Eskişehir", "Gaziantep"];

    // *** THE COLORS AND SIZES OF THE PAGE
    const PAGE_COLOR = "#F4F5F2";
    const CARD_WIDTH = 480;
    const LIGHT_CARD = { color: "white", line: Black(0.08), text: Black(0.55), title: Black(0.8) };
    const DARK_CARD = { color: "#141414", line: "#141414", text: White(0.5), title: White(0.6) };

    const start = function () {

        page.color = PAGE_COLOR;

        // SCROLL AREA: The page (comp/scroll-area.js)
        ScrollArea({ align: "center top", gap: 20, padding: [16, 40] });

            Label({ text: "FullScreenSelect", fontSize: 24, bold: 1, textColor: Black(0.8) });

            // CARD: Three fields
            startCard("Click a field: its list opens on the whole screen, with a search box.", LIGHT_CARD);

                startField("Fruits:", LIGHT_CARD);
                    const fruits = FullScreenSelect({
                        width: "100%",
                        items: FRUITS,
                        selectedKey: "banana",
                        onChange: function (self) { showSelected(fruitsInfo, self); },
                    });
                    const fruitsInfo = createInfo();
                    showSelected(fruitsInfo, fruits);
                endField();

                startField("Connection status:", LIGHT_CARD);
                    FullScreenSelect({ width: "100%", items: STATUSES, selectedKey: "auto" });
                endField();

                // autoWidth and Turkish letters in the search
                startField("City (autoWidth: 1; search \"canakkale\" or \"sanli\"):", LIGHT_CARD);
                    FullScreenSelect({ autoWidth: 1, items: CITIES, placeholder: "Şehir ara", emptyText: "Sonuç yok" });
                endField();

            endCard();

            // CARD: The dark package
            startCard("styleName: \"dark\"", DARK_CARD);
                FullScreenSelect({ width: "100%", styleName: "dark", items: FRUITS, selectedKey: "mango" });
            endCard();

        endGroup();

    };

    // *** OTHER FUNCTIONS:

    // GROUP: A card in the colors of its page, with a line that says what to try
    const startCard = function (text, look) {
        VGroup({
            width: CARD_WIDTH,
            height: "auto",
            align: "left top",
            gap: 20,
            padding: 24,
            color: look.color,
            round: 10,
            border: 1,
            borderColor: look.line,
            css: { maxWidth: "100%" }, // WHY maxWidth: on a phone the card is as wide as the screen
        });
        Label({ plainText: text, fontSize: 13, textColor: look.text });
    };

    const endCard = function () {
        endGroup();
    };

    // GROUP: A title over a field
    const startField = function (title, look) {
        VGroup({ width: "100%", height: "auto", align: "left top", gap: 10 });
        Label({ plainText: title, fontSize: 16, textColor: look.title });
    };

    const endField = function () {
        endGroup();
    };

    const createInfo = function () {
        return Label({ plainText: "", width: "100%", fontSize: 14, textColor: Black(0.45) });
    };

    const showSelected = function (info, select) {
        const item = select.getSelectedItem();
        info.plainText = item ? "selectedKey: \"" + item.key + "\"" : "";
    };

    </script>

</head>
<body>
</body>
</html>

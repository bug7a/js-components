<!DOCTYPE html>
<html lang="en">

<head>
    <title>Stepper: ozden, ozdenDark and the button line</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- LIBRARY FILES -->
    <link rel="preload" href="../basic/font/open-sans/OpenSans-Regular.ttf" as="font" crossorigin="anonymous">
    <link rel="preload" href="../basic/font/open-sans/OpenSans-Bold.ttf" as="font" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="../basic/basic.min.css">
    <script src="../basic/basic.min.js" type="text/javascript" charset="utf-8"></script>

    <!-- COMPONENT FILES -->
    <script src="../comp/stepper.js" type="text/javascript" charset="utf-8"></script>
    <script src="../comp/scroll-area.js" type="text/javascript" charset="utf-8"></script>

    <script>

        /* Bismillah */

        // The "ozden" package of Stepper, its dark twin "ozdenDark" and
        // style.button.border / borderColor (a line around the buttons) on the other packages.

        // *** VARIABLES:
        let lblOzden;
        const CARD_MAX_WIDTH = 560;

        const start = function () {

            page.color = "#F4F5F2";

            // SCROLL AREA: The page
            // WHY: page does not scroll. A ScrollArea fills the window; its content scrolls when it is taller.
            ScrollArea({
                align: "center top",
                gap: 24,
                padding: [16, 40],
            });

                // LABEL: Title
                Label({
                    text: "Stepper",
                    fontSize: 26,
                    fontFamily: "opensans-bold",
                });

                // SAMPLE 1: ozden
                startCard(
                    "1. styleName: \"ozden\"",
                    "For a 600 px design: 150 x 50, round white buttons with a dark line. At min / max a button fades to 0.4."
                );

                    HGroup({ width: "100%", height: "auto", align: "left center", gap: 16, wrap: 1 });

                        Stepper({ styleName: "ozden", value: 1, minValue: 1, maxValue: 10, onChange: showOzdenValue });
                        Stepper({ styleName: "ozden", value: 5, minValue: 1, maxValue: 10, onChange: showOzdenValue });
                        Stepper({ styleName: "ozden", value: 10, minValue: 1, maxValue: 10, onChange: showOzdenValue });

                    endGroup();

                    lblOzden = addInfoLabel("Value: -");

                endCard();

                // SAMPLE 2: ozden with your params
                startCard(
                    "2. ozden with your own params",
                    "A param you give wins over the package: width: 180 and a unit; a gray pill behind the buttons (style.box.color)."
                );

                    HGroup({ width: "100%", height: "auto", align: "left center", gap: 16, wrap: 1 });

                        Stepper({ styleName: "ozden", width: 180, value: 18, minValue: 18, maxValue: 24, unitText: "px" });
                        Stepper({ styleName: "ozden", value: 3, minValue: 1, maxValue: 15, style: { box: { color: Black(0.08) } } });

                    endGroup();

                endCard();

                // SAMPLE 3: ozdenDark
                startCard(
                    "3. styleName: \"ozdenDark\"",
                    "ozden on a dark page: the same shape, the buttons in the ground of a dark card with a light line."
                );

                    // GROUP: Dark background
                    HGroup({ width: "100%", height: "auto", align: "left center", gap: 16, wrap: 1, padding: 16, color: "#232322", round: 10 });

                        Stepper({ styleName: "ozdenDark", value: 1, minValue: 1, maxValue: 10 });
                        Stepper({ styleName: "ozdenDark", value: 5, minValue: 1, maxValue: 10 });

                    endGroup();

                endCard();

                // SAMPLE 4: The line around the buttons
                startCard(
                    "4. style.button.border and borderColor",
                    "A line around the buttons, on any package. (0 and \"transparent\" by default: no line)"
                );

                    HGroup({ width: "100%", height: "auto", align: "left center", gap: 16, wrap: 1 });

                        Stepper({ value: 2, minValue: 0, maxValue: 9, style: { button: { border: 1, borderColor: Black(0.25) } } });
                        Stepper({
                            styleName: "modern",
                            value: 4,
                            minValue: 1,
                            maxValue: 12,
                            style: { button: { border: 1, borderColor: "cadetblue" } },
                        });

                        // GROUP: Dark background
                        HGroup({ hug: 1, align: "left center", padding: 16, color: "#1C1C1B", round: 10 });
                            Stepper({
                                styleName: "dark",
                                value: 2,
                                minValue: 0,
                                maxValue: 5,
                                style: { button: { border: 1, borderColor: White(0.25) } },
                            });
                        endGroup();

                    endGroup();

                endCard();

                // SAMPLE 5: classic, to compare
                startCard("5. classic (the default), to compare", "No line around the buttons, no fade.");

                    HGroup({ width: "100%", height: "auto", align: "left center", gap: 16, wrap: 1 });
                        Stepper({ value: 1, minValue: 1, maxValue: 10 });
                        Stepper({ value: 10, minValue: 1, maxValue: 10 });
                    endGroup();

                endCard();

            endGroup();

        };

        // *** OTHER FUNCTIONS:

        const showOzdenValue = function (self) {
            let limitText = "";
            if (self.value === self.minValue) limitText = " (min)";
            if (self.value === self.maxValue) limitText = " (max)";
            lblOzden.text = "Value: " + self.value + limitText;
        };

        // GROUP: A card with a title and a short description.
        const startCard = function (title, description = "") {
            VGroup({
                width: "100%",
                height: "auto",
                align: "left top",
                gap: 16,
                padding: 20,
                color: "white",
                round: 10,
                border: 1,
                borderColor: Black(0.1),
                css: { maxWidth: CARD_MAX_WIDTH + "px", alignItems: "stretch" },
            });
            Label({
                text: title,
                fontSize: 14,
                textColor: Black(0.45),
            });
            if (description) {
                Label({
                    text: description,
                    fontSize: 13,
                    textColor: Black(0.35),
                    css: { marginTop: "-10px" },
                });
            }
        };

        const endCard = function () {
            endGroup();
        };

        const addInfoLabel = function (text) {
            return Label({
                text: text,
                fontSize: 14,
                textColor: Black(0.5),
            });
        };

    </script>
</head>

<body></body>

</html>

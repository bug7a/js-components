<!DOCTYPE html>
<html lang="en">
    <head>

        <title>PhoneField JS Component</title>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0"><!-- , user-scalable=no -->

        <!-- LIBRARY FILES -->
        <!-- <link rel="preload" href="image.png" as="image"> -->
        <link rel="preload" href="../basic/font/open-sans/OpenSans-Regular.ttf" as="font" crossorigin="anonymous">
        <link rel="stylesheet" type="text/css" href="../basic/basic.min.css">
        <script src="../basic/basic.min.js" type="text/javascript" charset="utf-8"></script>

        <script src="../comp/tooltip.js" type="text/javascript" charset="utf-8"></script>
        <script src="../comp/text-field.js" type="text/javascript" charset="utf-8"></script>
        <script src="../comp/phone-field.js" type="text/javascript" charset="utf-8"></script>

        <script>

        // PhoneField (comp/phone-field.js): a phone number with a country code (+90) and its unit (TR).

        const start = function () {

            page.color = "white";

            // GROUP: Container Centered
            HGroup();

                // INPUT: #1
                const myInput = PhoneField({
                    styleName: "modern",
                    key: "1",
                    required: 1,
                    titleText: "PHONE NUMBER",
                    placeholder: "(auto)",
                    warningText: "Invalid phone number format",
                    warningColor: "#E5885E",
                    countryCode: "+90",
                    phoneMask: " (___) ___-____",
                    unitText: "TR",
                });

            endGroup();

            // Get value
            myInput.onChange = function () {
                console.log(myInput.getValue());
            };

        };

        </script>

    </head>

    </body>
</html>

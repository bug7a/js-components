<!DOCTYPE html>
<html lang="en">

<head>
    <title>UrlField</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- LIBRARY FILES -->
    <link rel="preload" href="../basic/font/open-sans/OpenSans-Regular.ttf" as="font" crossorigin="anonymous">
    <link rel="preload" href="../basic/font/open-sans/OpenSans-Bold.ttf" as="font" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="../basic/basic.css">
    <script src="../basic/basic.js" type="text/javascript" charset="utf-8"></script>
    <script src="../basic/scroll-bar.js" type="text/javascript" charset="utf-8"></script>

    <!-- COMPONENT FILES -->
    <script src="../comp/tooltip.js" type="text/javascript" charset="utf-8"></script>
    <script src="../comp/text-field.js" type="text/javascript" charset="utf-8"></script>
    <script src="../comp/tiny-select.js" type="text/javascript" charset="utf-8"></script>
    <script src="../comp/url-field.js" type="text/javascript" charset="utf-8"></script>
    <script src="../comp/scroll-area.js" type="text/javascript" charset="utf-8"></script>

    <script>

        /* Bismillah */

        // UrlField (comp/url-field.js): a web address; its start (https://, https://www.) is chosen in a small list. A
        // wrong address is marked when the field is left. The value is written under it (onChange).

        // *** THE COLORS AND SIZES OF THE PAGE
        const PAGE_COLOR = "#F4F5F2";
        const CARD_WIDTH = 420;

        let lblValue;

        const start = function () {

            page.color = PAGE_COLOR;

            // SCROLL AREA: The page (comp/scroll-area.js)
            ScrollArea({ align: "center top", gap: 20, padding: [16, 40] });

                Label({ text: "UrlField", fontSize: 24, bold: 1, textColor: Black(0.8) });

                // CARD: The field and what to try
                startCard("Choose the start of the address in the list at the left, then type the rest.");

                    // URL FIELD
                    UrlField({
                        styleName: "modern",
                        width: "100%",
                        required: 1,
                        titleText: "URL",
                        placeholder: "example.com",
                        warningText: "Invalid URL format",
                        warningColor: "#E5885E",
                        maxLength: 255,
                        rightPadding: 20,
                        tinySelectParams: {
                            titleText: "",
                            list: [
                                { value: "1", label: "http://" },
                                { value: "2", label: "https://" },
                                { value: "3", label: "http://www." },
                                { value: "4", label: "https://www." },
                            ],
                            selectedIndex: 3,
                            paddingX: 0,
                            arrowSize: 20,
                            fontSize: 20,
                            round: 3,
                            listOverTextColor: "#65A293",
                        },
                        onChange: function (self) {
                            lblValue.plainText = "Value: " + self.getValue();
                        },
                    });

                    // LABEL: The value (onChange)
                    lblValue = Label({ text: "Value: -", fontSize: 13, textColor: Black(0.5) });

                endCard();

            endGroup();

        };

        // *** OTHER FUNCTIONS:

        // GROUP: A white card with a line that says what to try
        const startCard = function (text) {
            VGroup({
                width: CARD_WIDTH,
                height: "auto",
                align: "left top",
                gap: 14,
                padding: 24,
                color: "white",
                round: 10,
                border: 1,
                borderColor: Black(0.08),
                css: { maxWidth: "100%", alignItems: "stretch" }, // WHY maxWidth: on a phone the card is as wide as the screen
            });
            Label({ text: text, fontSize: 13, textColor: Black(0.55) });
        };

        const endCard = function () {
            endGroup();
        };

    </script>

</head>

<body>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <title>Search Results</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- LIBRARY FILES -->
    <link rel="preload" href="../basic/font/open-sans/OpenSans-Regular.ttf" as="font" crossorigin="anonymous">
    <link rel="preload" href="../basic/font/open-sans/OpenSans-Bold.ttf" as="font" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="../basic/basic.min.css">
    <script src="../basic/basic.min.js" type="text/javascript" charset="utf-8"></script>
    <script src="../basic/scroll-bar.min.js" type="text/javascript" charset="utf-8"></script>

    <!-- COMPONENT FILES -->
    <script src="../comp/search-input.js" type="text/javascript" charset="utf-8"></script>
    <script src="../comp/search-results.js" type="text/javascript" charset="utf-8"></script>

    <script>

        /* Bismillah */

        // SearchResults (comp/search-results.js): the result list under a SearchInput, in the default and the dark look; the arrows, Enter and Escape work in it.

        const CARD_MAX_WIDTH = 600;
        const PAGE_SIDE_PADDING = 16; // px: the sides of the page on a phone

        // *** VARIABLES:
        let lightInput, lightResults, lblLight;
        let darkInput, darkResults;

        // DATA: Some rows to search in.
        const DATA = [
            { group: "Pages", text: "Dashboard", desc: "Page" },
            { group: "Pages", text: "Products", desc: "Page" },
            { group: "Pages", text: "Orders", desc: "Page" },
            { group: "Pages", text: "Settings", desc: "Page" },
            { group: "Users", text: "Ada Lovelace", desc: "ada@example.com · Admin" },
            { group: "Users", text: "Grace Hopper", desc: "grace@example.com · Editor" },
            { group: "Users", text: "Alan Turing", desc: "alan@example.com · Viewer" },
            { group: "Users", text: "Katherine Johnson", desc: "katherine@example.com · Admin" },
            { group: "Orders", text: "#1042 · Ada Lovelace", desc: "$248.00 · Paid" },
            { group: "Orders", text: "#1043 · Alan Turing", desc: "$92.50 · Shipped" },
            { group: "Orders", text: "#1044 · Grace Hopper", desc: "$1,120.00 · Pending" },
            { group: "Products", text: "Aluminium Frame 40x40", desc: "SKU-1001 · $12.40" },
            { group: "Products", text: "Steel Bracket", desc: "SKU-1002 · $3.10" },
            { group: "Products", text: "Rubber Gasket <M8>", desc: "SKU-1003 · $0.80" },
            { group: "Products", text: "Ball Bearing 6202", desc: "SKU-1004 · $2.25" },
            { group: "Products", text: "Linear Rail 500mm", desc: "SKU-1005 · $48.00" },
            { group: "Products", text: "Timing Belt GT2", desc: "SKU-1006 · $6.90" },
            { group: "Products", text: "Stepper Motor NEMA17", desc: "SKU-1007 · $18.50" },
        ];

        const findResults = function (text) {
            const query = text.trim().toLowerCase();
            if (!query) return [];
            return DATA.filter(function (row) {
                return (row.text + " " + row.desc).toLowerCase().includes(query);
            });
        };

        const start = function () {

            page.color = "#F4F5F2";

            // BOX: Full screen scrollable container
            // WHY: page does not scroll. Scrollable content must be inside a Box with scrollY: 1.
            startBox(0, 0, "100%", "100%", { color: "transparent", scrollY: 1 });

                VGroup({ width: "100%", height: "auto", align: "center top", gap: 30, padding: [PAGE_SIDE_PADDING, 50] });

                    Label({ text: "Search Results", fontSize: 26, fontFamily: "opensans-bold" });

                    // SAMPLE 1: Classic
                    startCard(
                        "1. Default (classic), matchAnchorWidth: 1",
                        "SearchInput \"ozden\". Type \"a\" or \"ord\". ArrowUp / ArrowDown move, Enter opens, Escape closes. The list is as wide as the search box and scrolls with ScrollBar."
                    );

                        // SEARCH INPUT: comp/search-input.js, the package "ozden"
                        lightInput = SearchInput({
                            styleName: "ozden",
                            width: "100%",
                            position: "relative", // WHY: It is created in a group.
                            placeholder: "Search pages, users...", // WHY short: the 20 px text of ozden on a 390 px phone
                        });

                        lblLight = Label({ text: "Nothing was opened yet.", fontSize: 14, textColor: Black(0.5) });

                    endCard();

                    // SAMPLE 2: Dark, left aligned
                    startCard(
                        "2. styleName: \"dark\", matchAnchorWidth: 1",
                        "SearchInput \"ozdenDark\". The same component with the dark package, as wide as the search box.",
                        1
                    );

                        // SEARCH INPUT: the package "ozdenDark"
                        darkInput = SearchInput({
                            styleName: "ozdenDark",
                            width: "100%",
                            position: "relative",
                            placeholder: "Search...",
                        });

                    endCard();

                endGroup();

            endBox();

            // *** RESULT LISTS:
            // NOTE: They are created here, inside the scrolling Box, but a SearchResults always puts
            //       itself on the page, so it is not clipped by the Box or by the card.

            lightResults = SearchResults({
                anchor: lightInput,
                matchAnchorWidth: 1, // as wide as the search box: both edges meet (on a phone too)
                onSelect: function (self, item) {
                    lblLight.text = "Opened: " + item.text + "  (" + item.group + ")";
                    clearSearchInput(lightInput);
                },
            });
            lightResults.attachTo(lightInput.txtSearch.inputElement);
            // NOTE: getSearchText() is the text in lower case, getText() the text as it is typed.
            lightInput.onChange = function (self) {
                lightResults.setItems(findResults(self.getSearchText()), self.getText());
            };

            darkResults = SearchResults({
                anchor: darkInput,
                matchAnchorWidth: 1,
                styleName: "dark",
                onSelect: function (self, item) {
                    println("Opened: " + item.text);
                    clearSearchInput(darkInput);
                },
            });
            darkResults.attachTo(darkInput.txtSearch.inputElement);
            darkInput.onChange = function (self) {
                darkResults.setItems(findResults(self.getSearchText()), self.getText());
            };

        };

        // *** OTHER FUNCTIONS:

        const startCard = function (title, description = "", isDark = 0) {
            VGroup({
                width: "100%",
                height: "auto",
                align: "left top",
                gap: 16,
                padding: 20,
                color: (isDark) ? "#1C1C1B" : "white",
                round: 10,
                border: 1,
                borderColor: (isDark) ? "#1C1C1B" : Black(0.1),
                // WHY: basic.js has no maxWidth prop (a phone: the full width)
                css: { alignItems: "stretch", maxWidth: CARD_MAX_WIDTH + "px" },
            });
            Label({ text: title, fontSize: 14, textColor: (isDark) ? White(0.5) : Black(0.45) });
            if (description) {
                Label({
                    text: description,
                    fontSize: 13,
                    textColor: (isDark) ? White(0.4) : Black(0.35),
                    css: { marginTop: "-10px" },
                });
            }
        };

        const endCard = function () {
            endGroup();
        };

        // Cleans a SearchInput after a result was opened. (The clear (x) icon goes with the text.)
        const clearSearchInput = function (input) {
            input.setText("");
            input.imgClearIcon.opacity = 0;
            input.imgClearIcon.clickable = 0;
            input.txtSearch.inputElement.blur();
        };

    </script>
</head>

<body></body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <title>Select Box</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- LIBRARY FILES -->
    <link rel="preload" href="../basic/font/open-sans/OpenSans-Regular.ttf" as="font" crossorigin="anonymous">
    <link rel="preload" href="../basic/font/open-sans/OpenSans-Bold.ttf" as="font" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="../basic/basic.css">
    <script src="../basic/basic.js" type="text/javascript" charset="utf-8"></script>
    <script src="../basic/scroll-bar.js" type="text/javascript" charset="utf-8"></script>

    <!-- COMPONENT FILES -->
    <script src="../comp/smart-button.js" type="text/javascript" charset="utf-8"></script>
    <script src="../comp/search-input.js" type="text/javascript" charset="utf-8"></script>
    <script src="../comp/select-box.js" type="text/javascript" charset="utf-8"></script>
    <script src="../comp/scroll-area.js" type="text/javascript" charset="utf-8"></script>

    <script>

        /* Bismillah */

        // *** VARIABLES:
        let selectBig;
        let lblFruit, lblCountry, lblSkills, lblPayment, lblDark, lblBig;

        const CUSTOMER_COUNT = 2000;

        // ICONS: Inline SVG (no image file needed)
        const svgIcon = function (paths) {
            const svgStart = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#555"'
                + ' stroke-width="2" stroke-linecap="round" stroke-linejoin="round">';
            return "data:image/svg+xml," + encodeURIComponent(svgStart + paths + "</svg>");
        };

        const PAYMENT_ICONS = {
            card: svgIcon('<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>'),
            bank: svgIcon('<path d="M3 21h18M5 10v8M19 10v8M9 10v8M15 10v8M2 10l10-6 10 6z"/>'),
            cash: svgIcon('<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>'),
            wallet: svgIcon('<path d="M20 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0 0 4h15v12H5a2 2 0 0 1-2-2V5"/><path d="M16 13h.01"/>'),
        };

        const start = function () {

            page.color = "#F4F5F2";

            // SCROLL AREA: The page
            // WHY: page does not scroll. A ScrollArea fills the window; its content scrolls when it is taller.
            ScrollArea({
                align: "center top",
                gap: 20,
                padding: 40,
                useScrollBar: 0,
            });

                Label({ text: "Select Box", fontSize: 26, fontFamily: "opensans-bold", textColor: "#1B1B1A" });

                // SAMPLE 1: Basic
                startCard("1. Basic (short list: no search), clearable");

                    SelectBox({
                        width: 280,
                        css: { maxWidth: "100%" }, // WHY: on a phone the card is narrower than this width
                        options: ["Apple", "Banana", "Cherry", "Grape", "Orange"],
                        value: "Banana",
                        clearable: 1,
                        placeholder: "Select a fruit",
                        onChange: function (self) {
                            lblFruit.text = "Value: <b>" + self.value + "</b>";
                        },
                    });

                    lblFruit = infoLabel("Value: <b>Banana</b> (onChange is not called on create)");

                endCard();

                // SAMPLE 2: Search, groups, descriptions
                startCard("2. Search, groups and descriptions (Tab to it and type a letter)");

                    SelectBox({
                        width: "100%",
                        options: [
                            { value: "tr", label: "Turkey", description: "Ankara · +90", group: "Europe / Asia" },
                            { value: "de", label: "Germany", description: "Berlin · +49", group: "Europe" },
                            { value: "fr", label: "France", description: "Paris · +33", group: "Europe" },
                            { value: "nl", label: "Netherlands", description: "Amsterdam · +31", group: "Europe" },
                            { value: "it", label: "Italy", description: "Rome · +39", group: "Europe" },
                            { value: "jp", label: "Japan", description: "Tokyo · +81", group: "Asia" },
                            { value: "kr", label: "South Korea", description: "Seoul · +82", group: "Asia" },
                            { value: "in", label: "India", description: "New Delhi · +91", group: "Asia" },
                            { value: "us", label: "United States", description: "Washington, D.C. · +1", group: "America" },
                            { value: "br", label: "Brazil", description: "Brasília · +55", group: "America" },
                            { value: "ca", label: "Canada", description: "Ottawa · +1", group: "America" },
                        ],
                        placeholder: "Select a country",
                        searchPlaceholder: "Search country, city or code",
                        onChange: function (self) {
                            const option = self.getSelectedOptions()[0];
                            if (!option) {
                                lblCountry.text = "Nothing selected";
                                return;
                            }
                            lblCountry.text = "Selected: <b>" + option.label + "</b> (" + option.value + ")";
                        },
                    });

                    lblCountry = infoLabel("Search looks at the name, description and group. Try: \"asia\", \"par\" or \"+49\".");

                endCard();

                // SAMPLE 3: Multiple
                startCard("3. Multiple (select all, clear)");

                    SelectBox({
                        width: "100%",
                        multiple: 1,
                        clearable: 1,
                        options: ["JavaScript", "TypeScript", "HTML", "CSS", "Node.js", "SQL", "Python", "Figma", "Git", "Docker"],
                        value: ["JavaScript", "CSS"],
                        placeholder: "Select skills",
                        onChange: function (self) {
                            lblSkills.text = "Value: <b>" + JSON.stringify(self.getValue()) + "</b>";
                        },
                    });

                    lblSkills = infoLabel("Value: <b>[\"JavaScript\",\"CSS\"]</b>");

                endCard();

                // SAMPLE 4: Icons and disabled options
                startCard("4. Icons and disabled options");

                    SelectBox({
                        width: 320,
                        css: { maxWidth: "100%" }, // WHY: on a phone the card is narrower than this width
                        options: [
                            { value: "card", label: "Credit card", description: "Visa, Mastercard", iconFile: PAYMENT_ICONS.card },
                            { value: "bank", label: "Bank transfer", description: "1-2 business days", iconFile: PAYMENT_ICONS.bank },
                            { value: "cash", label: "Cash on delivery", description: "Not available for this address", iconFile: PAYMENT_ICONS.cash, disabled: 1 },
                            { value: "wallet", label: "Wallet", description: "Balance: $24.50", iconFile: PAYMENT_ICONS.wallet },
                        ],
                        value: "card",
                        onChange: function (self) {
                            lblPayment.text = "Value: <b>" + self.value + "</b>";
                        },
                    });

                    lblPayment = infoLabel("\"Cash on delivery\" can not be selected. Arrow keys skip it.");

                endCard();

                // SAMPLE 5: Dark
                startDarkCard("5. Dark style (styleName: \"dark\")");

                    SelectBox({
                        width: 300,
                        css: { maxWidth: "100%" }, // WHY: on a phone the card is narrower than this width
                        options: [
                            { value: "active", label: "Active", description: "Visible in the store" },
                            { value: "draft", label: "Draft", description: "Only the team can see it" },
                            { value: "archived", label: "Archived", description: "Old product" },
                        ],
                        value: "draft",
                        styleName: "dark",
                        onChange: function (self) {
                            lblDark.text = "Status: <b>" + self.value + "</b>";
                        },
                    });

                    lblDark = Label({ text: "Status: <b>draft</b>", fontSize: 13, textColor: White(0.6) });

                endCard();

                // SAMPLE 6: Big list and functions
                startCard("6. Big list (2000 options) and functions");

                    const bigOptions = createCustomerOptions();

                    selectBig = SelectBox({
                        width: "100%",
                        options: bigOptions,
                        placeholder: "Search 2000 customers",
                        clearable: 1,
                        onChange: function (self) {
                            lblBig.text = "Value: <b>" + self.value + "</b>";
                        },
                    });

                    lblBig = infoLabel("Only the first 300 matches are drawn. Type to find the others (Ex: 1999).");

                    HGroup({ width: "100%", height: "auto", align: "left center", gap: 8, wrap: 1 });

                        smallButton("setValue(1500)", function () {
                            selectBig.setValue(1500);
                        });

                        smallButton("setValue(7, silent)", function () {
                            selectBig.setValue(7, 1);
                            lblBig.text = "Value set to 7 without onChange.";
                        });

                        smallButton("Enable / disable", function () {
                            selectBig.setEnabled(selectBig.enabled ? 0 : 1);
                        });

                        smallButton("setOptions(first 10)", function () {
                            selectBig.setOptions(bigOptions.slice(0, 10));
                            lblBig.text = "10 options (no search). Value kept if it is in them: <b>" + selectBig.value + "</b>";
                        });

                    endGroup();

                endCard();

            endGroup();

        };

        // *** OTHER FUNCTIONS:

        // GROUP: A white card with a title.
        const startCard = function (title, dark = 0) {
            VGroup({
                width: 640,
                height: "auto",
                align: "left top",
                gap: 12,
                padding: 20,
                color: (dark) ? "#1A1A19" : "white",
                round: 10,
                border: 1,
                borderColor: (dark) ? White(0.1) : Black(0.1),
                css: { maxWidth: "100%" },
            });
            Label({
                text: title,
                fontSize: 14,
                textColor: (dark) ? White(0.5) : Black(0.45),
            });
        };

        const startDarkCard = function (title) {
            startCard(title, 1);
        };

        const endCard = function () {
            endGroup();
        };

        // A button of the sample (SmartButton, its gray)
        const smallButton = function (text, onClick) {
            return SmartButton({ labelText: text, onClick: onClick });
        };

        const createCustomerOptions = function () {
            const options = [];
            for (let i = 1; i <= CUSTOMER_COUNT; i++) {
                options.push({
                    value: i,
                    label: "Customer #" + String(i).padStart(4, "0"),
                    description: "customer" + i + "@mail.com",
                });
            }
            return options;
        };

        const infoLabel = function (text) {
            return Label({
                text: text,
                fontSize: 13,
                textColor: Black(0.6),
            });
        };

    </script>

</head>

<body></body>

</html>

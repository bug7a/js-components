<!DOCTYPE html>
<html lang="en">
<head>

    <title>Tap Effect</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preload" href="../basic/font/open-sans/OpenSans-Regular.ttf" as="font" crossorigin="anonymous">
    <link rel="preload" href="../basic/font/open-sans/OpenSans-Bold.ttf" as="font" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="../basic/basic.css">
    <script src="../basic/basic.js" type="text/javascript" charset="utf-8"></script>

    <script src="../comp/smart-button.js" type="text/javascript" charset="utf-8"></script>
    <script src="../comp/tap-effect.js" type="text/javascript" charset="utf-8"></script>

    <script>

    /* Bismillah */

    // TapEffect (comp-m4): a soft circle where the screen is tapped, the tap effect of the old
    // javascript-mobile-app-template. Tap anywhere: a card, the page, the button. The circle never catches the tap:
    // the card under it still gets it ("Tapped: ...").

    const CARD_WIDTH = 140;
    const CARD_HEIGHT = 100;
    const BUTTON_WIDTH = 120;
    const BUTTON_HEIGHT = 44;
    const CARDS = [
        { text: "Coffee", color: "#F6E7C8" },
        { text: "Tea", color: "#DDEFD9" },
        { text: "Juice", color: "#FAD9CF" },
        { text: "Water", color: "#D8E9F6" },
    ];

    let btnStartStop;
    let lblState;
    let lblTapped;

    const showState = function () {
        btnStartStop.setText(TapEffect.isOn ? "Stop" : "Start");
        const reducedMotionNote = TapEffect.isReducedMotion() ? " (the system asks for reduced motion: no circle)" : "";
        lblState.plainText = "TapEffect.isOn: " + TapEffect.isOn + reducedMotionNote;
    };

    const toggleTapEffect = function () {
        if (TapEffect.isOn) TapEffect.stop();
        else TapEffect.start();
        showState();
    };

    const createCard = function (card) {
        const box = HGroup({ width: CARD_WIDTH, height: CARD_HEIGHT, align: "center", color: card.color, round: 14 });
            Label({ text: card.text, fontSize: 18, textColor: Black(0.7) });
        endGroup();
        box.cursor = "pointer";
        box.on("click", function () {
            lblTapped.plainText = "Tapped: " + card.text;
        });
        return box;
    };

    const start = function () {

        page.color = "white";
        TapEffect.start();

        startBox(0, 0, "100%", "100%", { color: "transparent", scrollY: 1 });
            VGroup({ width: "100%", height: "auto", align: "center top", gap: 20, padding: 40 });

                Label({ text: "Tap Effect", fontSize: 26, bold: 1, textColor: Black(0.8) });
                Label({ text: "Tap anywhere: a soft circle comes where you tap.", fontSize: 16, textColor: Black(0.55) });

                HGroup({ width: "100%", height: "auto", align: "center top", gap: 12, wrap: 1 });
                    CARDS.forEach(createCard);
                endGroup();

                lblTapped = Label({ text: "Tapped: -", fontSize: 14, textColor: Black(0.5) });

                HGroup({ hug: 1, align: "left center", gap: 14, clipContent: 0 });
                    // WHY ripple: 0: only the circle of TapEffect is seen, not the wave of the button too
                    btnStartStop = SmartButton({ labelText: "Stop", width: BUTTON_WIDTH, height: BUTTON_HEIGHT, ripple: 0, onClick: toggleTapEffect });
                    lblState = Label({ text: "", fontSize: 14, textColor: Black(0.5) });
                endGroup();

            endGroup();
        endBox();

        showState();

    };

    </script>

</head>
<body>
</body>
</html>

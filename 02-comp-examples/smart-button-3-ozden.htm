<!DOCTYPE html>
<html lang="en">
<head>

    <title>SmartButton - Dialogs (ozden)</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preload" href="../basic/font/open-sans/OpenSans-Regular.ttf" as="font" crossorigin="anonymous">
    <link rel="preload" href="../basic/font/open-sans/OpenSans-Bold.ttf" as="font" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="../basic/basic.css">
    <script src="../basic/basic.js" type="text/javascript" charset="utf-8"></script>

    <script src="../comp/tooltip.js" type="text/javascript" charset="utf-8"></script> <!-- the bubble of ask -->
    <script src="../comp/smart-button.js" type="text/javascript" charset="utf-8"></script>

    <script>

    /* Bismillah */

    // SmartButton: the button standards in the ozden look (a white card, a thin line, a line at the bottom): Primary (the colored action, it
    // waits with the clock of setWaiting()), Default (Cancel, gray and white) and Alternative (the trash, only an
    // icon: it asks again, two clicks). Every button is one SmartButton({ ... }) call; its colors are a style object
    // at the top of the page (the color and the color under the mouse; pressed, it gets darker by itself).

    // *** THE PAGE
    const PAGE_COLOR = "#F0F1EE";
    const COVER_COLOR = Black(0.8); // behind the dialog (the cover of a Dialog)
    const BOTTOM_LINE = "inset 0 -3px 0 rgba(0, 0, 0, 0.06)"; // the soft line at the bottom of the ozden fields
    const INK = "#232323"; // the texts and the edge of the card
    const CARD_WIDTH = 674; // five actions in a row
    const CARD_HEIGHT = 524;
    const CARD_ROUND = 8;
    const CARD_BORDER = 2;
    const TEXT_SIZE = 16;
    const PRIMARY_ROW_COLOR = "#FFFBDB"; // the row of the Primary buttons
    const TRASH_WIDTH = 50; // as in the footer of a Dialog
    const RED = "#E8796D"; // danger (design.md)
    const JOB_TIME = 1200; // ms: the action takes time (the sample)

    // *** THE COLORS OF THE BUTTONS: style objects of SmartButton.
    // The actions: a little lighter edge; WHY icon opacity 0.7: the transparency of the text (the icon lines are black)
    const ACTION_LINE = "rgba(35, 35, 35, 0.4)";
    const actionStyle = function (color, hoverColor) {
        return {
            box: { color: color, borderColor: ACTION_LINE },
            hover: { color: hoverColor },
            icon: { opacity: 0.7 },
        };
    };
    const TEAL_ACTION = actionStyle("#9DC7B5", "#91BCA9");
    const CYAN_ACTION = actionStyle("#5BBAC1", "#50AFB6");
    const SKY_ACTION = actionStyle("#52A8D0", "#479DC5");
    const ORANGE_ACTION = actionStyle("#DE815B", "#D4724B");
    const SLATE_ACTION = actionStyle("#8FA6BE", "#8199B2");
    // The plain buttons in soft colors
    const SOFT_YELLOW = { box: { color: "#F8E57A" }, hover: { color: "#EFDA62" } };
    const ROSE = { box: { color: "#D97F80" }, hover: { color: "#CF7071" } };
    const MINT = { box: { color: "#C3DBCE" }, hover: { color: "#B5D0C1" } };
    const MIST = { box: { color: "#CEDBE1" }, hover: { color: "#C1D0D7" } };
    const LAVENDER = { box: { color: "#CFC3DD" }, hover: { color: "#C3B6D3" } };
    // The trash: a bigger bin; it asks in red before it deletes (the bin turns white)
    const TRASH = {
        icon: { width: 30, height: 30, opacity: 1 },
        ask: { button: { color: RED, border: 0, boxShadow: BOTTOM_LINE } },
    };

    // *** THE ICONS: minimal lines: no circle, no fill. Black lines: the look gives them the
    // transparency of the text (WHY not in the color: two lines that cross would be darker there)
    const LINE_WIDTH = 1.7;
    const svgIcon = function (body) {
        const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">' + body + "<\/svg>";
        return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
    };
    const lineIcon = function (paths) {
        const lineStyle = 'fill="none" stroke="black" stroke-width="' + LINE_WIDTH + '" stroke-linecap="round" stroke-linejoin="round"';
        return svgIcon('<path d="' + paths + '" ' + lineStyle + '/>');
    };
    // A soft bin: curves only, the rim and the cross are holes (the button shows through)
    const TRASH_PATH = "M 4 6 Q 4 2 12 2 Q 20 2 20 6 L 18.5 18 Q 18 22 12 22 Q 6 22 5.5 18 Z " +
        "M 6.7 5.9 C 6.7 3.7 17.3 3.7 17.3 5.9 C 17.3 8.1 6.7 8.1 6.7 5.9 Z " +
        "M 9 11 Q 9.7 10.3 10.4 11 L 12 12.6 L 13.6 11 Q 14.3 10.3 15 11 Q 15.7 11.7 15 12.4 L 13.4 14 L 15 15.6 " +
        "Q 15.7 16.3 15 17 Q 14.3 17.7 13.6 17 L 12 15.4 L 10.4 17 Q 9.7 17.7 9 17 Q 8.3 16.3 9 15.6 L 10.6 14 L 9 12.4 Q 8.3 11.7 9 11 Z";
    const binIcon = function (color) {
        return svgIcon('<path fill-rule="evenodd" fill="' + color + '" d="' + TRASH_PATH + '"/>');
    };
    const ICONS = {
        edit: lineIcon("M15.5 5.5l3 3L8 19l-4 1 1-4z"),
        save: lineIcon("M6 4h10l4 4v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zM8 20v-6h8v6"),
        send: lineIcon("M20.5 3.5l-17 7 7 3 3 7zM10.5 13.5l10-10"),
        upload: lineIcon("M12 15V5M8 9l4-4 4 4M5 19h14"),
        print: lineIcon("M7 8V4h10v4M7 17H5.5A1.5 1.5 0 0 1 4 15.5v-6A1.5 1.5 0 0 1 5.5 8h13A1.5 1.5 0 0 1 20 9.5v6a1.5 1.5 0 0 1-1.5 1.5H17M7 14h10v6H7z"),
        trash: binIcon("#6B6F73"),
    };

    // *** START:

    const start = function () {

        page.color = PAGE_COLOR;

        // BOX: Cover (behind the dialog)
        Box(0, 0, "100%", "100%", { color: COVER_COLOR });

        startBox(0, 0, "100%", "100%", { color: "transparent", scrollY: 1 });

            VGroup({ width: "100%", height: "100%", align: "center top", gap: 30, padding: [20, 50], clipContent: 0 });

                // GROUP: The card of the button standards
                VGroup({
                    width: CARD_WIDTH,
                    height: CARD_HEIGHT,
                    align: "left top",
                    gap: 0,
                    color: "white",
                    round: CARD_ROUND,
                    border: CARD_BORDER,
                    borderColor: INK,
                    boxShadow: "0 10px 30px rgba(0, 0, 0, 0.08), " + BOTTOM_LINE,
                    clipContent: 0,
                    css: { maxWidth: "calc(100vw - 40px)" },
                });

                    // GROUP: Content (it fills the card: the height of the card in its edge)
                    VGroup({ width: "100%", height: CARD_HEIGHT - 2 * CARD_BORDER, align: "left top", gap: 8, padding: [24, 22] });

                        Label({
                            plainText: "Button styles",
                            width: "100%",
                            fontSize: TEXT_SIZE,
                            textColor: INK,
                            fontFamily: "opensans-bold",
                            css: { whiteSpace: "normal", lineHeight: "1.5", textWrap: "balance" },
                        });

                        // DEFAULT: Cancel, gray and white
                        createSectionTitle("Default (ozden)");
                        HGroup({ width: "100%", height: "auto", align: "left center", gap: 10, clipContent: 0 });
                            SmartButton({ labelText: "Cancel" });
                            SmartButton({ tone: "white", labelText: "Cancel" });
                        endGroup();

                        // PRIMARY: the actions, each in its own color (it waits while the job runs)
                        createSectionTitle("Primary (ozden)");
                        HGroup({ width: "100%", height: "auto", align: "left center", gap: 10, color: PRIMARY_ROW_COLOR, clipContent: 0 });
                            SmartButton({ labelText: "Edit", iconFile: ICONS.edit, style: TEAL_ACTION, onClick: waitForJob });
                            SmartButton({ labelText: "Save", iconFile: ICONS.save, style: CYAN_ACTION, onClick: waitForJob });
                            SmartButton({ labelText: "Send", iconFile: ICONS.send, style: SKY_ACTION, onClick: waitForJob });
                            SmartButton({ labelText: "Upload", iconFile: ICONS.upload, style: ORANGE_ACTION, onClick: waitForJob });
                            SmartButton({ labelText: "Print", iconFile: ICONS.print, style: SLATE_ACTION, onClick: waitForJob });
                        endGroup();

                        // ALTERNATIVE (ozden2): the white trash (it asks before it deletes), plain buttons in a few colors
                        createSectionTitle("Alternative (ozden2)");
                        HGroup({ height: "auto", align: "left center", gap: 10, clipContent: 0 });
                            SmartButton({
                                styleName: "ozden2",
                                tone: "white",
                                width: TRASH_WIDTH,
                                labelText: "",
                                iconFile: ICONS.trash,
                                ariaLabel: "Delete the draft",
                                ask: "Click again to delete the draft.",
                                style: TRASH,
                            });
                            SmartButton({ styleName: "ozden2", tone: "white", labelText: "Details" });
                            SmartButton({ styleName: "ozden2", labelText: "Later", style: SOFT_YELLOW });
                            SmartButton({ styleName: "ozden2", labelText: "Report", style: ROSE });
                            SmartButton({ styleName: "ozden2", labelText: "Archive", style: MINT });
                        endGroup();

                        // ALTERNATIVE (ozden3): the same kinds with a fainter edge, a gray bin
                        createSectionTitle("Alternative (ozden3)");
                        HGroup({ width: "100%", height: "auto", align: "left center", gap: 10, clipContent: 0 });
                            SmartButton({
                                styleName: "ozden3",
                                width: TRASH_WIDTH,
                                labelText: "",
                                iconFile: ICONS.trash,
                                ariaLabel: "Delete the draft",
                                ask: "Click again to delete the draft.",
                                style: TRASH,
                            });
                            SmartButton({ styleName: "ozden3", labelText: "Send" });
                            SmartButton({ styleName: "ozden3", labelText: "Print", style: SOFT_YELLOW });
                            SmartButton({ styleName: "ozden3", labelText: "Save", style: MIST });
                            SmartButton({ styleName: "ozden3", labelText: "Upload", style: LAVENDER });
                        endGroup();

                        // ALTERNATIVE (ozden4): a text button and a bin with no surface (their hover shows they are buttons)
                        createSectionTitle("Alternative (ozden4)");
                        HGroup({ height: "auto", align: "left center", gap: 10, clipContent: 0 });
                            SmartButton({ styleName: "ozden4", labelText: "Upload" });
                            SmartButton({
                                styleName: "ozden4",
                                width: TRASH_WIDTH,
                                labelText: "",
                                iconFile: ICONS.trash,
                                ariaLabel: "Delete the draft",
                                ask: "Click again to delete the draft.",
                                style: TRASH,
                            });
                        endGroup();

                    endGroup();

                endGroup();

            endGroup();

        endBox();

    };

    // *** FUNCTIONS:

    // LABEL: The name of a kind of button over its row
    const createSectionTitle = function (text) {
        return Label({ plainText: text, width: "100%", fontSize: TEXT_SIZE, textColor: INK });
    };

    // A job that takes time: the button waits, then it is as before
    const waitForJob = function (button) {
        button.setWaiting(1);
        button.after(JOB_TIME, function () { button.setWaiting(0); });
    };

    </script>

</head>
<body>
</body>
</html>

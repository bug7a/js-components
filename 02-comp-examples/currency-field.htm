<!DOCTYPE html>
<html lang="en">
    <head>

        <title>CurrencyField JS Component</title>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0"><!-- , user-scalable=no -->

        <!-- LIBRARY FILES -->
        <!-- <link rel="preload" href="image.png" as="image"> -->
        <link rel="preload" href="../basic/font/open-sans/OpenSans-Regular.ttf" as="font" crossorigin="anonymous">
        <link rel="stylesheet" type="text/css" href="../basic/basic.min.css">
        <script src="../basic/basic.min.js" type="text/javascript" charset="utf-8"></script>

        <script src="../comp/tooltip.js" type="text/javascript" charset="utf-8"></script>
        <script src="../comp/text-field.js" type="text/javascript" charset="utf-8"></script>
        <script src="../comp/currency-field.js" type="text/javascript" charset="utf-8"></script>

        <script>

        // CurrencyField (comp/currency-field.js): a TextField for an amount of money; its value goes to the console (onChange).

        const start = function () {

            page.color = "white";

            // GROUP: Centered content
            HGroup();

                // INPUT: #1
                const myInput = CurrencyField({
                    styleName: "modern",
                    key: "1",
                    width: 350,
                    required: 0,
                    titleText: "CURRENCY",
                    placeholder: "(auto)",
                    maxLength: 35,
                    allowNegative: 1,
                    allowDecimal: 1,
                    decimalSeparator: ".", // or ","
                    maxDecimalDigits: 2,
                    groupSeparator: ",", // for thousands grouping
                    unitText: "TL",
                });

            endGroup();

            // Get value
            myInput.onChange = function () {
                console.log(myInput.getValue());
            };

        };

        </script>

    </head>
    <body>

        <!-- HTML content -->

    </body>
</html>

<!DOCTYPE html>
<html lang="en">
    <head>

        <title>TextareaInputB JS Component</title>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0"><!-- , user-scalable=no -->

        <!-- LIBRARY FILES -->
        <!-- <link rel="preload" href="image.png" as="image"> -->
        <link rel="preload" href="../basic/font/open-sans/OpenSans-Regular.ttf" as="font" crossorigin="anonymous">
        <link rel="stylesheet" type="text/css" href="../basic/basic.min.css">
        <script src="../basic/basic.min.js" type="text/javascript" charset="utf-8"></script>
        <script src="../basic/scroll-bar.min.js" type="text/javascript" charset="utf-8"></script>

        <script src="../comp/tooltip.js" type="text/javascript" charset="utf-8"></script>
        <script src="../comp/text-field.js" type="text/javascript" charset="utf-8"></script>
        <script src="../comp/text-area-field.js" type="text/javascript" charset="utf-8"></script>

        <script>

        const start = function () {

            page.color = "white";

            // GROUP: Centered container
            HGroup();

                // INPUT: #1
                TextAreaField({
                    key: "1",
                    height: 170, // 4 lines
                    required: 1,
                    titleText: "MESSAGE",
                    placeholder: "How can we help you?",
                    minCharCount: 80,
                    showCount: 1,
                    lengthText: "length: ",
                    warningText: "The entered text must be longer than 80",
                    warningColor: "#E5885E",
                    maxLength: 255,
                    rightPadding: 5,
                    unitStyle: {
                        padding: [12, 4],
                        color: "#373836EE",
                        textColor: "white",
                    },
                });

            endGroup(); // GROUP: Centered container

        };

        </script>

    </head>
    <body>

        <!-- HTML content -->

    </body>
</html>

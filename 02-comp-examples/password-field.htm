<!DOCTYPE html>
<html lang="en">
    <head>
        <title>PasswordField JS Component</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- LIBRARY FILES -->
        <link rel="preload" href="../basic/font/open-sans/OpenSans-Regular.ttf" as="font" crossorigin="anonymous">
        <link rel="stylesheet" type="text/css" href="../basic/basic.min.css">
        <script src="../basic/basic.js" type="text/javascript" charset="utf-8"></script>
        <script src="../comp/tooltip.js" type="text/javascript" charset="utf-8"></script>
        <script src="../comp/text-field.js" type="text/javascript" charset="utf-8"></script>
        <script src="../comp/password-field.js" type="text/javascript" charset="utf-8"></script>

        <script>
        // PasswordField (comp/password-field.js): the eye shows and hides the password; minLength and its warning.

        const start = function () {
            page.color = "white";

            // GROUP: Centered content
            HGroup();

                // INPUT: #1
                const myPasswordInput = PasswordField({
                    styleName: "modern",
                    key: "1",
                    type: "password",
                    width: 350,
                    required: 1,
                    titleText: "PASSWORD",
                    placeholder: "Enter your password",
                    warningColor: "#E5885E",
                    maxLength: 25,
                    showPassword: 0,
                    showShowPasswordButton: 1, // enable show/hide icon by default
                    showPasswordHintText: "Show Password",
                    hidePasswordHintText: "Hide Password",
                    minLength: 6,
                    minLengthWarningText: "Password must be at least 6 characters",
                    mustUseNumber: 1,
                    mustUseNumberWarningText: "Password must contain at least one number",
                    mustUseLetter: 1,
                    mustUseLetterWarningText: "Password must contain at least one letter",
                    mustUseUppercase: 1,
                    mustUseUppercaseWarningText: "Password must contain at least one uppercase letter",
                    mustUseLowercase: 1,
                    mustUseLowercaseWarningText: "Password must contain at least one lowercase letter",
                    mustUseSpecialChar: 1,
                    mustUseSpecialCharWarningText: "Password must contain at least one special character",
                });

            endGroup();

            // Get value
            myPasswordInput.onChange = function () {
                console.log(myPasswordInput.getValue());
            };
        };
        </script>
    </head>
    <body>
        <!-- HTML content -->
    </body>
</html>

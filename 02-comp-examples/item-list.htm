<!DOCTYPE html>
<html lang="en">
<head>

    <title>ItemList</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preload" href="../basic/font/open-sans/OpenSans-Regular.ttf" as="font" crossorigin="anonymous">
    <link rel="preload" href="../basic/font/open-sans/OpenSans-Bold.ttf" as="font" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="../basic/basic.css">
    <script src="../basic/basic.js" type="text/javascript" charset="utf-8"></script>
    <script src="../basic/scroll-bar.js" type="text/javascript" charset="utf-8"></script>

    <script src="../comp/search-input.js" type="text/javascript" charset="utf-8"></script>
    <script src="../comp/item-list.js" type="text/javascript" charset="utf-8"></script>
    <script src="../comp/scroll-area.js" type="text/javascript" charset="utf-8"></script>

    <script>

    /* Bismillah */

    // ItemList: the style packages, the layouts, multiple selection, search and your own rows.

    const FRUITS_PATH = "../assets/fruids/";
    const DRINKS_PATH = "../assets/categories/";
    const PICTURES_PATH = "../assets/cards/";
    const STYLE_CARD_WIDTH = 380;
    const STYLE_LIST_HEIGHT = 420;
    const CARD_GAP = 20;
    const TWO_CARDS_WIDTH = 2 * STYLE_CARD_WIDTH + CARD_GAP;

    const FRUITS = [
        { key: "broccoli", text: "Broccoli", description: "Vegetable", iconFile: FRUITS_PATH + "brokoli.png" },
        { key: "strawberry", text: "Strawberry", description: "Fruit", iconFile: FRUITS_PATH + "cilek.png" },
        { key: "tomato", text: "Tomato", description: "Vegetable", iconFile: FRUITS_PATH + "domates.png" },
        { key: "apple", text: "Apple", description: "Fruit", iconFile: FRUITS_PATH + "elma.png" },
        { key: "carrot", text: "Carrot", description: "Vegetable", iconFile: FRUITS_PATH + "havuc.png" },
        { key: "watermelon", text: "Watermelon", description: "Fruit", iconFile: FRUITS_PATH + "karpuz.png" },
        { key: "lemon", text: "Lemon", description: "Fruit", iconFile: FRUITS_PATH + "limon.png" },
        { key: "banana", text: "Banana", description: "Fruit", iconFile: FRUITS_PATH + "muz.png" },
        { key: "pomegranate", text: "Pomegranate", description: "Fruit", iconFile: FRUITS_PATH + "nar.png" },
        { key: "eggplant", text: "Eggplant", description: "Vegetable", iconFile: FRUITS_PATH + "patlican.png" },
        { key: "blueberry", text: "Blueberry", description: "Fruit", iconFile: FRUITS_PATH + "yabanmersini.png" },
        { key: "pepper", text: "Green pepper", description: "Vegetable", iconFile: FRUITS_PATH + "yesilbiber.png" },
    ];

    const DRINKS = [
        { key: "cappuccino", text: "Cappuccino", description: "Hot", iconFile: DRINKS_PATH + "cappuccino.png" },
        { key: "chocolate", text: "Chocolate milk", description: "Cold", iconFile: DRINKS_PATH + "chocolate-milk.png" },
        { key: "coffee", text: "Coffee", description: "Hot", iconFile: DRINKS_PATH + "coffee.png" },
        { key: "frappe", text: "Frappe", description: "Cold", iconFile: DRINKS_PATH + "frappe.png" },
        { key: "iced", text: "Iced coffee", description: "Cold", iconFile: DRINKS_PATH + "iced-caffee.png" },
        { key: "milkshake", text: "Milkshake", description: "Cold", iconFile: DRINKS_PATH + "milkshake.png" },
        { key: "orange", text: "Orange juice", description: "Cold", iconFile: DRINKS_PATH + "orange-juice.png" },
        { key: "tea", text: "Tea", description: "Hot", iconFile: DRINKS_PATH + "tea.png" },
    ];

    const PICTURES = [
        { key: "olives", text: "Olives", description: "512 x 512", iconFile: PICTURES_PATH + "olives.png" },
        { key: "dill", text: "Dill", description: "512 x 512", iconFile: PICTURES_PATH + "dill.png" },
        { key: "fennel", text: "Fennel", description: "512 x 512", iconFile: PICTURES_PATH + "fennel.png" },
        { key: "juniper", text: "Juniper", description: "512 x 512", iconFile: PICTURES_PATH + "juniper.png" },
        { key: "oregano", text: "Oregano", description: "512 x 512", iconFile: PICTURES_PATH + "oregano.png" },
        { key: "pepper", text: "Pepper", description: "512 x 512", iconFile: PICTURES_PATH + "pepper.png" },
        { key: "rosehip", text: "Rosehip", description: "512 x 512", iconFile: PICTURES_PATH + "rosehip.png" },
    ];

    // The page look of each style package (the list sits on it)
    const STYLE_PAGES = {
        ozden: { color: "whitesmoke", textColor: Black(0.5) },
        ozdenDark: { color: "#1A1A19", textColor: White(0.5) },
        ozdenTiles: { color: "white", textColor: Black(0.5) },
        modern: { color: "#F4F5F2", textColor: Black(0.5) },
        dark: { color: "#141414", textColor: White(0.5) },
        gallery: { color: "white", textColor: Black(0.5) },
        galleryDark: { color: "#1A1A19", textColor: White(0.5) },
    };

    // GROUP: A card with a title and a short description.
    const startCard = function (title, description, look) {
        const card = VGroup({
            width: STYLE_CARD_WIDTH,
            height: "auto",
            align: "left top",
            gap: 12,
            padding: 16,
            color: look.color,
            round: 12,
            border: 1,
            borderColor: Black(0.1),
            css: { alignItems: "stretch", maxWidth: "100%" },
        });
        Label({ plainText: title, fontSize: 14, textColor: look.textColor, bold: 1 });
        Label({
            plainText: description,
            fontSize: 13,
            textColor: look.textColor,
            width: "100%",
            css: { lineHeight: "1.4" },
        });
        return card;
    };

    const endCard = function () {
        endGroup();
    };

    const withoutDescription = function (item) {
        return { key: item.key, text: item.text, iconFile: item.iconFile };
    };

    const showSelection = function (label, list) {
        const keys = list.getSelectedKeys();
        label.plainText = "Selected: " + (keys.length ? keys.join(", ") : "-");
    };

    // One style package: the list with its search box (showSearch: 1) and the selection under it.
    const createStyleSample = function (styleName, selection, description) {
        const look = STYLE_PAGES[styleName];
        startCard("styleName: \"" + styleName + "\" · selection: \"" + selection + "\"", description, look);
            const list = ItemList({
                width: "100%",
                height: STYLE_LIST_HEIGHT,
                styleName: styleName,
                selection: selection,
                showSearch: 1,
                items: FRUITS,
                selectedKeys: ["strawberry"],
                onChange: function (self) { showSelection(info, self); },
            });
            const info = Label({ plainText: "", width: "100%", fontSize: 13, textColor: look.textColor });
            showSelection(info, list);
        endCard();
    };

    // A picture gallery: layout "grid", a big photo on each tile.
    const createGallerySample = function (styleName, description) {
        const look = STYLE_PAGES[styleName];
        startCard("styleName: \"" + styleName + "\" · layout: \"grid\"", description, look);
            const list = ItemList({
                width: "100%",
                height: STYLE_LIST_HEIGHT,
                layout: "grid",
                styleName: styleName,
                items: PICTURES,
                selectedKeys: ["fennel"],
                onChange: function (self) { showSelection(info, self); },
            });
            const info = Label({ plainText: "", width: "100%", fontSize: 13, textColor: look.textColor });
            showSelection(info, list);
        endCard();
    };

    const start = function () {

        page.color = "#E9EAE6";

        ScrollArea({ align: "center top", gap: 24, padding: 32 });

            Label({ text: "ItemList", fontSize: 26, bold: 1, textColor: Black(0.8) });
            Label({ plainText: "Style packages, layouts, multiple selection, search and your own rows", fontSize: 14, textColor: Black(0.45) });

            // GROUP: The four style packages, two in a row: a light one and its dark one
            HGroup({
                width: "100%",
                height: "auto",
                align: "center top",
                gap: CARD_GAP,
                wrap: 1,
                css: { maxWidth: TWO_CARDS_WIDTH + "px" },
            });

                createStyleSample(
                    "ozden",
                    "single",
                    "Rows as wide as the list, white with a thin line above and under them under the mouse, the selected one half transparent (it can not be chosen again)."
                );

                createStyleSample(
                    "ozdenDark",
                    "single",
                    "The dark theme of ozden: the same rows on a dark page, a lighter gray with a thin light line above and under them under the mouse."
                );

                createStyleSample("modern", "multiple", "Light cards; a check mark on the selected rows.");

                createStyleSample("dark", "multiple", "Dark cards; a check mark on the selected rows.");

            endGroup();

            // GROUP: The other layouts
            HGroup({ width: "100%", height: "auto", align: "center top", gap: CARD_GAP, wrap: 1 });

                const ozdenLook = STYLE_PAGES.ozdenTiles;
                const horizontalCard = startCard(
                    "layout: \"horizontal\" · ozden",
                    "One row of tiles, for categories: a grey icon in a circle; the selected one grows, gets its colors and a bold title.",
                    ozdenLook
                );
                horizontalCard.width = TWO_CARDS_WIDTH;

                    ItemList({
                        width: "100%",
                        height: 216,
                        layout: "horizontal",
                        items: DRINKS.map(withoutDescription),
                        selectedKeys: ["coffee"],
                    });

                endCard();

                const darkLook = STYLE_PAGES.dark;
                startCard("layout: \"grid\"", "Tiles that wrap (files, icons, pictures). Arrow keys move in all four ways.", darkLook);

                    ItemList({
                        width: "100%",
                        height: 420,
                        layout: "grid",
                        styleName: "dark",
                        selection: "multiple",
                        items: DRINKS,
                    });

                endCard();

                // Your own rows: createItemView
                startCard("createItemView", "Your own row: a title and a price. style.row.height: \"auto\".", ozdenLook);
                    ItemList({
                        width: "100%",
                        height: "auto",
                        style: { row: { height: "auto", padding: [16, 12] } },
                        items: [
                            { key: "1", text: "Cappuccino", price: "4.50" },
                            { key: "2", text: "Tea", price: "2.00" },
                            { key: "3", text: "Orange juice", price: "3.75" },
                        ],
                        createItemView: function (item, row) {
                            Label({ plainText: item.text, fontSize: 17, textColor: Black(0.8), grow: 1 });
                            Label({ plainText: "$ " + item.price, fontSize: 17, textColor: "#3D7A6B", bold: 1 });
                        },
                    });
                endCard();

            endGroup();

            // GROUP: A picture gallery, light and dark
            HGroup({
                width: "100%",
                height: "auto",
                align: "center top",
                gap: CARD_GAP,
                wrap: 1,
                css: { maxWidth: TWO_CARDS_WIDTH + "px" },
            });

                createGallerySample("gallery", "Pictures: a big photo with no filter that fills its square (tile.iconFit: \"cover\"), its title under it, a ring around the selected one.");

                createGallerySample("galleryDark", "The same gallery on a dark page.");

            endGroup();

        endGroup();

    };

    </script>

</head>
<body>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartButton dark</title>

    <!-- LIBRARY FILES -->
    <link rel="stylesheet" type="text/css" href="../basic/basic.css">
    <script src="../basic/basic.js" type="text/javascript" charset="utf-8"></script>

    <!-- COMPONENTS: tooltip.js for the bubble of ask -->
    <script src="../comp/tooltip.js" type="text/javascript" charset="utf-8"></script>
    <script src="../comp/smart-button.js" type="text/javascript" charset="utf-8"></script>

    <script>

        /* Bismillah */

        // SMARTBUTTON · THE DARK TEMPLATES (2026-11-04)
        // ozdenType1Dark ... ozdenType4Dark: the shapes of ozdenType1-4 for a dark page (the draft
        // _designs/smart-button-dark.htm). The icon turns white, the waiting clock is the dark one.
        // The tones of a dark page end with "Dark" (cyanDark ... blueDark: a light text, a white icon); the light tones
        // keep their dark text on a dark template too.
        // - SmartButton({ styleName: "ozdenType1Dark", labelText, iconFile, onClick })
        // Every button of this page is one SmartButton({ ... }) call: copy it as it is.
        // TRY: press "Download" (it waits 2 s), click "Delete" twice, press Tab to see the focus ring.

        // *** VARIABLES:

        const CARD_COLOR = "#1A1A19"; // the cards of Ozden Panel / Ozden Manager
        const DOWNLOAD_TIME = 2000; // ms: a job that takes time (the sample)
        const ICON_FILE = "../comp/smart-button/alert-black.png"; // a black icon: the dark templates turn it white

        // *** START:

        const start = function () {

            page.color = "#000000";

            // BOX: Scrolling page
            startBox(0, 0, "100%", "100%", { color: "transparent", scrollY: 1 });

                VGroup({ width: "100%", height: "auto", align: "center top", gap: 20, padding: 40, clipContent: 0 });

                    Label({ text: "SmartButton · dark templates", fontSize: 24, bold: 1, textColor: White(0.9) });

                    startCard("ozdenType1Dark (the default dark)");
                        SmartButton({ styleName: "ozdenType1Dark", labelText: "Send", iconFile: ICON_FILE });
                        SmartButton({ styleName: "ozdenType1Dark", labelText: "Only a text" });
                        SmartButton({ styleName: "ozdenType1Dark", labelText: "Download", iconFile: ICON_FILE, onClick: download });
                        SmartButton({ styleName: "ozdenType1Dark", labelText: "Delete", ask: "Click again to delete." });
                        SmartButton({ styleName: "ozdenType1Dark", labelText: "Disabled", iconFile: ICON_FILE, enabled: 0 });
                    endCard();

                    startCard("ozdenType2Dark");
                        SmartButton({ styleName: "ozdenType2Dark", labelText: "Send", iconFile: ICON_FILE });
                        SmartButton({ styleName: "ozdenType2Dark", labelText: "Only a text" });
                        SmartButton({ styleName: "ozdenType2Dark", labelText: "Download", iconFile: ICON_FILE, onClick: download });
                        SmartButton({ styleName: "ozdenType2Dark", labelText: "Delete", ask: "Click again to delete." });
                        SmartButton({ styleName: "ozdenType2Dark", labelText: "Disabled", iconFile: ICON_FILE, enabled: 0 });
                    endCard();

                    startCard("ozdenType3Dark");
                        SmartButton({ styleName: "ozdenType3Dark", labelText: "Send", iconFile: ICON_FILE });
                        SmartButton({ styleName: "ozdenType3Dark", labelText: "Only a text" });
                        SmartButton({ styleName: "ozdenType3Dark", labelText: "Download", iconFile: ICON_FILE, onClick: download });
                        SmartButton({ styleName: "ozdenType3Dark", labelText: "Delete", ask: "Click again to delete." });
                        SmartButton({ styleName: "ozdenType3Dark", labelText: "Disabled", iconFile: ICON_FILE, enabled: 0 });
                    endCard();

                    startCard("ozdenType4Dark");
                        SmartButton({ styleName: "ozdenType4Dark", labelText: "Send", iconFile: ICON_FILE });
                        SmartButton({ styleName: "ozdenType4Dark", labelText: "Only a text" });
                        SmartButton({ styleName: "ozdenType4Dark", labelText: "Download", iconFile: ICON_FILE, onClick: download });
                        SmartButton({ styleName: "ozdenType4Dark", labelText: "Delete", ask: "Click again to delete." });
                        SmartButton({ styleName: "ozdenType4Dark", labelText: "Disabled", iconFile: ICON_FILE, enabled: 0 });
                    endCard();

                    // The tones of a dark page: a light text, the icon turns white
                    startCard("Tones for a dark page (on ozdenType1Dark)");
                        SmartButton({ styleName: "ozdenType1Dark", tone: "cyanDark", labelText: "cyanDark", iconFile: ICON_FILE });
                        SmartButton({ styleName: "ozdenType1Dark", tone: "orangeDark", labelText: "orangeDark", iconFile: ICON_FILE });
                        SmartButton({ styleName: "ozdenType1Dark", tone: "yellowDark", labelText: "yellowDark", iconFile: ICON_FILE });
                        SmartButton({ styleName: "ozdenType1Dark", tone: "greenDark", labelText: "greenDark", iconFile: ICON_FILE });
                        SmartButton({ styleName: "ozdenType1Dark", tone: "blueDark", labelText: "blueDark", iconFile: ICON_FILE });
                    endCard();

                    startCard("The light tones on a dark page (their text stays dark)");
                        SmartButton({ styleName: "ozdenType1Dark", tone: "white", labelText: "white", iconFile: ICON_FILE });
                        SmartButton({ styleName: "ozdenType1Dark", tone: "cyan", labelText: "cyan", iconFile: ICON_FILE });
                        SmartButton({ styleName: "ozdenType1Dark", tone: "orange", labelText: "orange", iconFile: ICON_FILE });
                        SmartButton({ styleName: "ozdenType1Dark", tone: "yellow", labelText: "yellow", iconFile: ICON_FILE });
                        SmartButton({ styleName: "ozdenType1Dark", tone: "green", labelText: "green", iconFile: ICON_FILE });
                        SmartButton({ styleName: "ozdenType1Dark", tone: "blue", labelText: "blue", iconFile: ICON_FILE });
                    endCard();

                endGroup();

            endBox();

        };

        // *** FUNCTIONS:

        // GROUP: A dark card with a title; the buttons made between startCard() and endCard() go side by side (they wrap)
        const startCard = function (title) {
            VGroup({ width: "auto", height: "auto", align: "left top", gap: 14, padding: 24, color: CARD_COLOR, round: 10, border: 1, borderColor: White(0.08), clipContent: 0 });
                Label({ text: title, fontSize: 14, bold: 1, textColor: White(0.6) });
                HGroup({ width: "auto", height: "auto", align: "left center", gap: 12, wrap: 1, clipContent: 0 });
        };

        const endCard = function () {
                endGroup();
            endGroup();
        };

        // A job that takes time: the button waits, then it is as before
        const download = function (button) {
            button.setWaiting(1);
            button.after(DOWNLOAD_TIME, function () { button.setWaiting(0); });
        };

    </script>

</head>

<body>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>

    <title>Notice</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preload" href="../basic/font/open-sans/OpenSans-Regular.ttf" as="font" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="../basic/basic.css">
    <script src="../basic/basic.js" type="text/javascript" charset="utf-8"></script>

    <script src="../comp/notice.js" type="text/javascript" charset="utf-8"></script>

    <script>

    /* Bismillah */

    // Notice: a short message in the middle of the screen. A click or Escape closes it before its time.

    const BUTTON_WIDTH = 250;
    const ALERT_ICON = "../assets/icons/alert.png";

    const createButton = function (text, type, onClick) {
        const look = Notice.COLORS[type];
        const button = Button({
            text: text,
            width: BUTTON_WIDTH,
            minimal: 1,
            border: 1,
            borderColor: Black(0.3),
            color: (type == "info") ? "whitesmoke" : look.color,
            textColor: look.textColor || Black(0.8),
        });
        button.on("click", onClick);
        return button;
    };

    const start = function () {

        page.color = "white";

        VGroup({ align: "center top", gap: 4, padding: 30 });

            Label({ text: "Notice", fontSize: 26, bold: 1, textColor: Black(0.8), css: { marginBottom: "16px" } });

            createButton("Info Message", "info", function () {
                Notice.show({ messageText: "Process completed", displayTime: 2500 });
            });

            createButton("Alert Message", "warning", function () {
                Notice.show({
                    messageText: "No internet connection.",
                    descriptionText: "Please, try again later.",
                    type: "warning",
                    displayTime: 2500,
                });
            });

            createButton("Error Message", "error", function () {
                Notice.show({ messageText: "Failed to copy", type: "error", iconFile: ALERT_ICON, displayTime: 2500 });
            });

            createButton("Note", "note", function () {
                Notice.show({ messageText: "The prices are updated every morning.", type: "note", displayTime: 2500 });
            });

            createButton("Success (until a click)", "success", function () {
                Notice.show({
                    messageText: "Your order is on its way.",
                    descriptionText: "Click anywhere to close.",
                    type: "success",
                    displayTime: 0,
                });
            });

        endGroup();

    };

    </script>

</head>
<body>
</body>
</html>

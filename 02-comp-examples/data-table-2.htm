        <script>

        /* Bismillah */

        // SAMPLE (DataTable, comp/data-table.js): The simplest table: four columns, a sortable name, a click on a row writes it to the console.

        const TABLE_WIDTH = 600;
        const TABLE_HEIGHT = 432;
        const PAGE_SPACE = 20;

        let table;

        const start = function () {

            page.color = "white";

            // GROUP: The page (the table at the top middle)
            VGroup({ align: "center top", padding: PAGE_SPACE });

                // TABLE: People
                table = DataTable({
                    width: TABLE_WIDTH,
                    height: TABLE_HEIGHT,
                    styleName: "minimal",
                    columns: [
                        { key: "id", title: "#", valueIndex: 0, width: 60 },
                        { key: "name", title: "Name", valueIndex: 1, width: 220, sortable: 1 },
                        { key: "age", title: "Age", valueIndex: 3, width: 120 },
                        { key: "city", title: "City", valueIndex: 2 },
                    ],
                    rows: testData,
                    onRowClick: function (self, row) {
                        println(row.data);
                    },
                });

            endGroup();

        };

        </script>

<!DOCTYPE html>
<html lang="en">
    <head>

        <title>Filters</title>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- LIBRARY FILES -->
        <link rel="stylesheet" type="text/css" href="../basic/basic.min.css">
        <script src="../basic/basic.min.js" type="text/javascript" charset="utf-8"></script>
        <script src="../basic/scroll-bar.min.js" type="text/javascript" charset="utf-8"></script>

        <!-- COMPONENT FILES -->
        <script src="../comp/filters.js" type="text/javascript" charset="utf-8"></script>

        <script>

        /* Bismillah */

        // Filters (comp/filters.js):
        // 1. The panel is open, in the layout of the page.
        // 2. A popup (panelMode: "popup"): only the button; the panel opens over the page. Another accent color and other data.

        const PAGE_COLOR = "#ECEBE8";
        const SOFT_TEXT = "#8C8B88";

        const VEHICLE_SECTIONS = [
            { key: "type", titleText: "Type", opened: 1, options: [
                { key: "car", labelText: "Car" },
                { key: "truck", labelText: "Truck", checked: 1 },
                { key: "construction", labelText: "Construction Equipment" },
                { key: "bus", labelText: "Bus" },
            ] },
            { key: "fleet", titleText: "Fleet", opened: 0, options: ["North", "South", "East", "West"] },
            { key: "status", titleText: "Status", opened: 1, options: [
                { key: "online", labelText: "Online" },
                { key: "transit", labelText: "In transit", checked: 1 },
                { key: "repair", labelText: "Under repair", checked: 1 },
                { key: "offline", labelText: "Offline" },
            ] },
        ];

        const PRODUCT_SECTIONS = [
            { key: "color", titleText: "Color", opened: 1, options: ["Red", "Green", "Blue", "Black"] },
            { key: "size", titleText: "Size", opened: 0, options: ["S", "M", "L", "XL"] },
        ];

        // *** VARIABLES:
        let pageBox, vehicleFilters, productFilters, lblResult;

        // First running function. (basic.js calls it when the page is ready)
        const start = function () {

            page.color = PAGE_COLOR;

            // BOX: Page (it scrolls when the window is lower than the samples)
            pageBox = startBox(0, 0, "100%", "100%", { color: "transparent", scrollY: 1 });

            // GROUP: The samples side by side (one under the other on a narrow screen)
            HGroup({ width: "100%", height: "auto", align: "center top", gap: 40, padding: 40, wrap: 1 });
            that.clipContent = 0; // WHY: The shadow of the panel stands out of the group.

                // GROUP: 1. The panel in the page
                VGroup({ hug: 1, align: "left top", gap: 10 });
                that.clipContent = 0;
                    Label({ text: "1. The panel in the page", fontSize: 14, textColor: SOFT_TEXT });
                    vehicleFilters = Filters({
                        sections: VEHICLE_SECTIONS,
                        onChange: showSelected,
                    });
                    lblResult = Label({ text: "", width: 380, fontSize: 14, textColor: SOFT_TEXT });
                endGroup();

                // GROUP: 2. A popup, another accent
                VGroup({ hug: 1, align: "left top", gap: 10 });
                that.clipContent = 0;
                    Label({ text: "2. panelMode: popup, accentColor, panelHeight", fontSize: 14, textColor: SOFT_TEXT });
                    productFilters = Filters({
                        width: 320,
                        panelHeight: 360,
                        panelMode: "popup",
                        panelOpened: 0,
                        buttonText: "Product filters",
                        searchPlaceholder: "Search colors and sizes",
                        sections: PRODUCT_SECTIONS,
                        style: { accentColor: "#2E7D5B" },
                    });
                endGroup();

            endGroup();

            endBox();

            if (typeof ScrollBar !== "undefined") ScrollBar({ scrollableBox: pageBox });

            showSelected(vehicleFilters);

        };

        // *** OTHER FUNCTIONS:

        // LABEL: what onChange gives (self.getSelected())
        const showSelected = function (self) {
            lblResult.text = "onChange: " + JSON.stringify(self.getSelected());
        };

        </script>

    </head>
    <body>
    </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>

    <title>Side Panel - in a column</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preload" href="../basic/font/open-sans/OpenSans-Regular.ttf" as="font" crossorigin="anonymous">
    <link rel="preload" href="../basic/font/open-sans/OpenSans-Bold.ttf" as="font" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="../basic/basic.css">
    <script src="../basic/basic.js" type="text/javascript" charset="utf-8"></script>

    <script src="../comp/smart-button.js" type="text/javascript" charset="utf-8"></script>
    <script src="../comp/side-panel.js" type="text/javascript" charset="utf-8"></script>

    <script>

    /* Bismillah */

    // SidePanel (comp-m4) in a container: a 400 px column in the middle of the page, like the column of a mobile
    // app on a wide screen. The menu (right) and the sheet (bottom) are made in the column (container: appColumn):
    // they are as tall or as wide as the column, their cover darkens only the column, and they follow its size.
    // The menu: whitesmoke, round corners at its left, fade: 0 (it only slides), a darker cover, 200 ms.
    // The sheet: the classic look with round top corners.

    // *** THE COLORS AND SIZES OF THE PAGE
    const OUTSIDE_COLOR = "#D9DAD5"; // the page around the column
    const APP_COLOR = "#F4F5F2"; // the column
    const INK = "#232323";
    const SOFT_INK = "rgba(35, 35, 35, 0.6)";
    const LINE_COLOR = Black(0.08);
    const COLUMN_WIDTH = 400;
    const COLUMN_SHADOW = "0 0 24px rgba(0, 0, 0, 0.12)";
    const BAR_HEIGHT = 64;
    const BAR_SPACE = 16; // the space at the sides of the top bar and of the content
    const CARD_ROUND = 10;
    const BUTTON_HEIGHT = 40;
    const ICON_BUTTON_SIZE = 44;
    const MENU_WIDTH = 300;
    const MENU_ROW_HEIGHT = 44;
    const SHEET_HEIGHT = 300;
    const PANEL_ROUND = 13; // the corners of the menu and of the sheet that face the column
    const PANEL_TIME = 200; // ms: the motion of the menu
    const COVER_COLOR = "rgba(0, 0, 0, 0.4)"; // behind the menu

    // The buttons of the page: SmartButton ozdenType1 (the default) with a smaller text
    const BUTTON_LOOK = { label: { fontSize: 15 } };

    // ☰ (the color is in the file: SmartButton loads an image)
    const MENU_ICON = "data:image/svg+xml;utf8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="' + INK + '" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/><\/svg>');

    const MENU_ITEMS = ["Inbox", "Starred", "Sent", "Drafts", "Archive"];
    const SHARE_TARGETS = ["Copy link", "Email", "Message"];
    const MESSAGES = [
        { from: "Ayşe Kaya", subject: "Lunch on Friday?" },
        { from: "Mert Demir", subject: "The new icons are ready" },
        { from: "Elif Şahin", subject: "Notes from the meeting" },
        { from: "Can Yılmaz", subject: "Your order is on its way" },
        { from: "Zeynep Arslan", subject: "Photos from the trip" },
        { from: "Deniz Koç", subject: "A question about the invoice" },
        { from: "Selin Aydın", subject: "Weekly report" },
        { from: "Emre Çelik", subject: "See you tomorrow" },
    ];

    // *** VARIABLES:
    let appColumn, sideMenu, shareSheet;
    let lblTitle, lblInfo;

    const start = function () {

        page.color = OUTSIDE_COLOR;

        createColumn();
        createMenu();
        createSheet();

        placeColumn();
        page.onResize(placeColumn);

    };

    // *** THE COLUMN OF THE APP

    // BOX: The column: the container of the menu and of the sheet
    const createColumn = function () {

        appColumn = Box(0, 0, COLUMN_WIDTH, "100%", { color: APP_COLOR, boxShadow: COLUMN_SHADOW });

        createIn(appColumn, function () {

            // GROUP: The top bar over the content
            VGroup({ align: "left top", gap: 0, color: "transparent" });
            that.css.alignItems = "stretch";

                createTopBar();

                // BOX: The content scrolls. The column does not: the panels cover it.
                startBox({ width: "100%", height: "auto", grow: 1, color: "transparent", scrollY: 1 });

                    VGroup({ width: "100%", height: "auto", align: "left top", gap: 12, padding: BAR_SPACE, color: "transparent" });
                    that.css.alignItems = "stretch";

                        createInfoCard();
                        MESSAGES.forEach(createMessageRow);

                    endGroup();

                endBox();

            endGroup();

        });

    };

    // GROUP: The title of the page and the menu button
    const createTopBar = function () {

        HGroup({ width: "100%", height: BAR_HEIGHT, align: "left center", gap: 10, padding: [BAR_SPACE, 0], color: "white" });
        that.shrink = 0;
        that.css.borderBottom = "1px solid " + LINE_COLOR;

            lblTitle = Label({ text: MENU_ITEMS[0], fontSize: 20, bold: 1, textColor: INK, grow: 1 });

            SmartButton({
                styleName: "ozdenType4",
                labelText: "",
                iconFile: MENU_ICON,
                ariaLabel: "Menu",
                width: ICON_BUTTON_SIZE,
                height: ICON_BUTTON_SIZE,
                style: { layout: { padding: [10, 10] }, icon: { width: 24, height: 24, opacity: 1 } },
                onClick: function () { sideMenu.open(); },
            });

        endGroup();

    };

    // GROUP: What the sample shows, its buttons and what happened last
    const createInfoCard = function () {

        VGroup({ width: "100%", height: "auto", align: "left top", gap: 10, padding: BAR_SPACE, color: "white", round: CARD_ROUND, border: 1, borderColor: LINE_COLOR });
        that.css.alignItems = "stretch";

            Label({ text: "container: appColumn", fontSize: 15, bold: 1, textColor: INK });
            Label({ text: "The menu and the sheet are made in this column: they are as tall or as wide as the column, their cover darkens only the column, and they follow its size.", fontSize: 13, textColor: SOFT_INK });

            HGroup({ width: "100%", height: "auto", align: "left center", gap: 10, wrap: 1 });
                SmartButton({ labelText: "Menu", height: BUTTON_HEIGHT, style: BUTTON_LOOK, onClick: function () { sideMenu.open(); } });
                SmartButton({ labelText: "Share", height: BUTTON_HEIGHT, style: BUTTON_LOOK, onClick: function () { shareSheet.open(); } });
            endGroup();

            lblInfo = Label({ text: "No panel was opened yet.", fontSize: 13, textColor: SOFT_INK });

        endGroup();

    };

    // GROUP: A message of the inbox (the content under the panels)
    const createMessageRow = function (message) {

        VGroup({ width: "100%", height: "auto", align: "left top", gap: 2, padding: [BAR_SPACE, 12], color: "white", round: CARD_ROUND, border: 1, borderColor: LINE_COLOR });
            Label({ text: message.from, fontSize: 14, bold: 1, textColor: INK });
            Label({ text: message.subject, fontSize: 13, textColor: SOFT_INK });
        endGroup();

    };

    // The column is COLUMN_WIDTH wide in the middle of a wide page; on a phone it fills the page.
    const placeColumn = function () {
        appColumn.width = Math.min(COLUMN_WIDTH, page.width);
        appColumn.left = Math.round((page.width - appColumn.width) / 2);
    };

    // *** THE PANELS (both in the column)

    // The menu at the right of the column: it only slides (fade: 0), its left corners are round
    const createMenu = function () {

        sideMenu = SidePanel({
            container: appColumn,
            side: "right",
            panelSize: MENU_WIDTH,
            fade: 0,
            duration: PANEL_TIME,
            titleText: "Menu",
            ariaLabel: "Menu",
            onOpen: showOpened,
            onClose: showClosed,
            style: {
                panel: { color: "whitesmoke", border: 0, boxShadow: "none", round: PANEL_ROUND },
                backdrop: { color: COVER_COLOR },
            },
        });

        sideMenu.startBody();
            MENU_ITEMS.forEach(createMenuRow);
        sideMenu.endBody();

    };

    // A row of the menu: it shows its page and closes the menu
    const createMenuRow = function (itemName) {
        SmartButton({
            styleName: "ozdenType4",
            labelText: itemName,
            width: "100%",
            height: MENU_ROW_HEIGHT,
            style: { layout: { align: "left center", padding: [14, 0] }, label: { fontSize: 16 } },
            onClick: function () {
                lblTitle.text = itemName;
                sideMenu.close();
            },
        });
    };

    // The sheet at the bottom of the column: the classic look, its top corners are round
    const createSheet = function () {

        shareSheet = SidePanel({
            container: appColumn,
            side: "bottom",
            panelSize: SHEET_HEIGHT,
            titleText: "Share",
            ariaLabel: "Share",
            onOpen: showOpened,
            onClose: showClosed,
            style: { panel: { round: PANEL_ROUND } },
        });

        shareSheet.startBody();
            Label({ text: "Send this inbox with:", fontSize: 14, textColor: SOFT_INK });
            HGroup({ width: "100%", height: "auto", align: "left center", gap: 10, wrap: 1 });
                SHARE_TARGETS.forEach(createShareButton);
            endGroup();
        shareSheet.endBody();

    };

    const createShareButton = function (targetName) {
        SmartButton({
            labelText: targetName,
            height: BUTTON_HEIGHT,
            style: BUTTON_LOOK,
            onClick: function () {
                shareSheet.close();
                lblInfo.text = "Shared with: " + targetName;
            },
        });
    };

    const showOpened = function (panel) {
        lblInfo.text = "Opened: " + panel.titleText;
    };

    const showClosed = function (panel) {
        lblInfo.text = "Closed: " + panel.titleText;
    };

    </script>

</head>

<body></body>

</html>

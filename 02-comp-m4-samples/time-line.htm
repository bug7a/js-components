<!DOCTYPE html>
<html lang="en">

<head>
    <title>Time Line</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- LIBRARY FILES -->
    <link rel="preload" href="../basic/font/open-sans/OpenSans-Regular.ttf" as="font" crossorigin="anonymous">
    <link rel="preload" href="../basic/font/open-sans/OpenSans-Bold.ttf" as="font" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="../basic/basic.min.css">
    <script src="../basic/basic.min.js" type="text/javascript" charset="utf-8"></script>

    <!-- COMPONENT FILES -->
    <script src="../comp-m4/time-line.js" type="text/javascript" charset="utf-8"></script>

    <script>

        /* Bismillah */

        // *** VARIABLES:
        let lineDefault, lineOrder, lineStyle, lineLive;
        let lblDefault, lblLive;
        let liveCount = 0;

        const start = function () {

            page.color = "whitesmoke";

            // BOX: Full screen scrollable container
            // WHY: page does not scroll. Scrollable content must be inside a Box with scrollY: 1.
            startBox(0, 0, "100%", "100%", {
                color: "transparent",
                scrollY: 1,
            });

                // GROUP: Page layout
                VGroup({
                    width: "100%",
                    height: "auto", // Grows with content, so the Box can scroll.
                    align: "center top",
                    gap: 30,
                    padding: 50,
                });

                    // LABEL: Title
                    Label({
                        text: "Time Line",
                        fontSize: 26,
                        bold: 1,
                    });

                    // SAMPLE 1: Default
                    startCard("1. Default");

                        lineDefault = TimeLine({
                            width: "100%",
                            items: [
                                { time: "09:30", title: "Order created", text: "Order #1024 was created by Ayşe Yılmaz." },
                                { time: "10:05", title: "Payment received", text: "1.240,00 TL, credit card." },
                                { time: "13:40", title: "Packed" },
                                { time: "17:15", title: "Sent", text: "Cargo no: 7712 4455 90" },
                            ],
                        });

                        lblDefault = infoLabel("4 items. The line grows with the texts.");

                    endCard();

                    // SAMPLE 2: Item colors, no time
                    startCard("2. Item colors (color), without time");

                        lineOrder = TimeLine({
                            width: "100%",
                            items: [
                                { title: "Opened", text: "The ticket is waiting for an answer.", color: "#5DB182" },
                                { title: "Answered", text: "Support wrote an answer.", color: "#3871E0" },
                                { title: "Waiting", text: "The customer was asked for the invoice.", color: "#E0A038" },
                                { title: "Closed", color: Black(0.3) },
                            ],
                        });

                    endCard();

                    // SAMPLE 3: Style and clickable items
                    startCard("3. Style package and clickableItems");

                        lineStyle = TimeLine({
                            width: "100%",
                            itemGap: 26,
                            dotSize: 16,
                            lineWidth: 3,
                            clickableItems: 1,
                            items: [
                                { time: "Mon", title: "Design", text: "Screens of the new panel.", key: "design" },
                                { time: "Tue", title: "Coding", text: "Components and the pages.", key: "code" },
                                { time: "Wed", title: "Test", text: "Click an item.", key: "test" },
                            ],
                            onClick: function (self, item, index) {
                                lblDefault.text = "Clicked: <b>" + item.title + "</b> (index: " + index + ", key: \"" + item.key + "\")";
                            },
                            style: {
                                row: { gap: 16 },
                                dot: { color: "#5DB182", border: 3, borderColor: White(1), topSpace: 2 },
                                line: { color: "#CFE2D8" },
                                time: { fontSize: 13, textColor: "#3E8E62" },
                                title: { fontSize: 17 },
                            },
                        });

                    endCard();

                    // SAMPLE 4: Functions
                    startCard("4. Functions");

                        lineLive = TimeLine({
                            width: "100%",
                            items: [
                                { time: nowText(), title: "Page opened" },
                            ],
                        });

                        // GROUP: Buttons
                        HGroup({ width: "100%", height: "auto", align: "left center", gap: 8, wrap: 1 });

                            smallButton("addItem()", function () {
                                liveCount++;
                                lineLive.addItem({
                                    time: nowText(),
                                    title: "Event " + liveCount,
                                    text: "This item was added with addItem().",
                                });
                                refreshLive();
                            });

                            smallButton("setItems([...])", function () {
                                liveCount = 0;
                                lineLive.setItems([
                                    { time: nowText(), title: "New list", text: "setItems() writes the items again." },
                                    "A text is also an item.",
                                ]);
                                refreshLive();
                            });

                            smallButton("clear()", function () {
                                liveCount = 0;
                                lineLive.clear();
                                refreshLive();
                            });

                            smallButton("Disable", function (self) {
                                lineLive.setEnabled(lineLive.enabled ? 0 : 1);
                                self.text = (lineLive.enabled) ? "Disable" : "Enable";
                            });

                        endGroup();

                        lblLive = infoLabel("Items: 1");

                    endCard();

                endGroup();

            endBox();

        };

        // *** OTHER FUNCTIONS:

        const refreshLive = function () {
            lblLive.text = "Items: " + lineLive.getItems().length;
        };

        const nowText = function () {
            const now = new Date();
            return twoDigitFormat(now.getHours()) + ":" + twoDigitFormat(now.getMinutes());
        };

        // GROUP: A white card with a title.
        const startCard = function (title) {
            VGroup({
                width: 460,
                height: "auto",
                align: "left top",
                gap: 16,
                padding: 20,
                color: "white",
                round: 10,
                border: 1,
                borderColor: Black(0.1),
            });
            Label({
                text: title,
                fontSize: 14,
                textColor: Black(0.45),
            });
        };

        const endCard = function () {
            endGroup();
        };

        const infoLabel = function (text) {
            return Label({
                width: "100%",
                text: text,
                fontSize: 13,
                textColor: Black(0.55),
            });
        };

        const smallButton = function (text, func) {
            const btn = Button({ text: text, width: "auto", height: 34, fontSize: 13, color: "#E8E8E8", textColor: Black(0.75), round: 6 });
            btn.elem.style.padding = "0 14px";
            btn.on("click", function (self) { func(self); });
            return btn;
        };

    </script>
</head>

<body></body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <title>UIEffects - Short</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- LIBRARY FILES -->
    <link rel="preload" href="../basic/font/open-sans/OpenSans-Regular.ttf" as="font" crossorigin="anonymous">
    <link rel="preload" href="../basic/font/open-sans/OpenSans-Bold.ttf" as="font" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="../basic/basic.min.css">
    <script src="../basic/basic.min.js" type="text/javascript" charset="utf-8"></script>

    <!-- COMPONENT FILES -->
    <script src="../comp-m4/ui-effects.js" type="text/javascript" charset="utf-8"></script>

    <script>

        /* Bismillah */

        /*

        UIEffects - YouTube Short (9:16)

        A self-playing demo for a screen recording: the code of a sample is written on the
        top half, the live objects run on the bottom half and a fake cursor hovers and clicks them.
        (Made from tabs-short.htm. The effects listen to pointer events, so the fake cursor sends
        real PointerEvents to the objects: see firePointer() and glide().)

        - The stage is always 1080 x 1920 and is scaled to fit the window, so the recording
          has the same layout on every screen. The scale is printed at the bottom right.
        - SPACE: pause / play,  R: play again from the start,  S: hide the scale text.
        - The code on the screen is the code that really builds the component below it.

        Started Date: September 2026
        Developer: Bugra Ozden

        */

        // *** CONSTANTS:

        const STAGE_WIDTH = 1080;
        const STAGE_HEIGHT = 1920;
        const CODE_HEIGHT = 900;          // Height of the dark code panel.
        const PREVIEW_HEIGHT = STAGE_HEIGHT - CODE_HEIGHT;

        const COLOR_CODE_BACK = "#0D1117";
        const COLOR_PREVIEW_BACK = "#F4F5F2";
        const COLOR_ACCENT = "#5AC8FA";

        const CODE_FONT = "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace";
        const CODE_FONT_SIZE = 31;
        const CODE_LINE_GAP = 12;

        // Token colors of the code panel.
        const TOKEN_COLOR = {
            keyword: "#FF7B72",
            string: "#A5D6FF",
            number: "#79C0FF",
            prop: "#7EE787",
            func: "#D2A8FF",
            comment: "#8B949E",
            punct: "#8B949E",
            plain: "#E6EDF3",
            space: "transparent",
        };

        const KEYWORDS = ["const", "let", "var", "function", "return", "new", "if", "else", "await", "async"];

        // ICONS: Inline SVG (no image file needed)
        const svgIcon = function (paths, color = "#555") {
            return "data:image/svg+xml," + encodeURIComponent(
                '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="' + color + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + paths + '</svg>'
            );
        };
        const ICON_BELL = svgIcon('<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>', "#FFFFFF");

        const COLORS = {
            blue: "#4A90E2",
            red: "#E2574C",
            orange: "#F2A33A",
            dark: "#1C1C1B",
        };

        // *** VARIABLES:

        let stage, codeBox, previewBox;             // The three main boxes.
        let lblSceneTitle, lblSceneStep;            // Header of the code panel.
        let codeGroup;                              // The code lines are created in this group.
        let compScaler, lblCaption, lblFooter;      // Preview area.
        let cursor, progressBar, lblScale;
        let currentComp = null;                     // The component of the running scene.
        let stageScale = 1;
        let isPaused = 0;
        let playToken = 0;                          // Increases on restart, so an old run stops itself.
        let charWidth = CODE_FONT_SIZE * 0.6;       // Measured at the start by measureCharWidth().

        // *** START:

        const start = function () {

            page.color = "#000000";

            buildStage();
            buildCodePanel();
            measureCharWidth();
            buildPreviewPanel();
            buildCursor();

            fitStage();
            page.onResize(fitStage);

            bindKeys();

            play();

        };

        // *** VIEW:

        // BOX: The 1080 x 1920 stage. Everything is created inside it.
        const buildStage = function () {

            stage = Box(0, 0, STAGE_WIDTH, STAGE_HEIGHT, {
                color: COLOR_CODE_BACK,
                clipContent: 1,
            });
            stage.elem.style.transformOrigin = "center center";

            setDefaultContainerBox(stage);

        };

        const buildCodePanel = function () {

            codeBox = Box(0, 0, STAGE_WIDTH, CODE_HEIGHT, { color: COLOR_CODE_BACK });

            createIn(codeBox, function () {

                // BOX: Thin progress line at the very top.
                Box(0, 0, STAGE_WIDTH, 6, { color: Black(0.4) });
                progressBar = Box(0, 0, 0, 6, { color: COLOR_ACCENT });

                // LABEL: File name chip
                const chip = Box(60, 70, 410, 54, { color: "rgba(90,200,250,0.12)", round: 27 });
                createIn(chip, function () {
                    const lbl = Label({ text: "comp-m4/ui-effects.js", fontSize: 24, textColor: COLOR_ACCENT });
                    lbl.fontFamily = CODE_FONT;
                    lbl.center();
                });

                // LABEL: Scene title and step
                lblSceneTitle = Label(60, 150, { text: "", fontSize: 40, textColor: "#E6EDF3", fontFamily: "opensans-bold" });
                lblSceneStep = Label(0, 82, { text: "", width: STAGE_WIDTH - 60, fontSize: 24, textColor: "#8B949E" });
                lblSceneStep.fontFamily = CODE_FONT;
                lblSceneStep.elem.style.textAlign = "right";

                // GROUP: The code lines
                codeGroup = VGroup({
                    left: 60,
                    top: 240,
                    width: STAGE_WIDTH - 120,
                    height: "auto",
                    align: "left top",
                    gap: CODE_LINE_GAP,
                    color: "transparent",
                });
                endGroup();
                // WHY: A box clips its content, and the scale below is applied after the clipping,
                //      so a long line was cut at the group width instead of being shrunk into it.
                codeGroup.elem.style.overflow = "visible";

            });

        };

        const buildPreviewPanel = function () {

            previewBox = Box(0, CODE_HEIGHT, STAGE_WIDTH, PREVIEW_HEIGHT, {
                color: COLOR_PREVIEW_BACK,
                clipContent: 1,
            });

            createIn(previewBox, function () {

                // GROUP: The component is centered in this group, and the group is scaled up.
                compScaler = VGroup({
                    left: 0,
                    top: 0,
                    width: STAGE_WIDTH,
                    height: PREVIEW_HEIGHT - 260,
                    align: "center center",
                    gap: 30,
                    color: "transparent",
                });
                endGroup();
                compScaler.elem.style.transformOrigin = "center center";
                // WHY: lift, glow and push draw a shadow outside the object; a clipping parent cuts it.
                compScaler.clipContent = 0;

                // LABEL: One line under the component.
                lblCaption = Label(0, PREVIEW_HEIGHT - 150, {
                    text: "",
                    width: STAGE_WIDTH,
                    fontSize: 30,
                    textColor: Black(0.45),
                });
                lblCaption.elem.style.textAlign = "center";

                // LABEL: Footer
                lblFooter = Label(0, PREVIEW_HEIGHT - 80, {
                    text: "basic.js  ·  github.com/bug7a/js-components",
                    width: STAGE_WIDTH,
                    fontSize: 26,
                    textColor: Black(0.3),
                });
                lblFooter.elem.style.textAlign = "center";

                // LABEL: Recording scale (not part of the design, press S to hide it)
                lblScale = Label(0, PREVIEW_HEIGHT - 32, { text: "", width: STAGE_WIDTH - 16, fontSize: 18, textColor: Black(0.25) });
                lblScale.fontFamily = CODE_FONT;
                lblScale.elem.style.textAlign = "right";

            });

        };

        // BOX: The fake mouse pointer.
        const buildCursor = function () {

            cursor = Box(-200, -200, 46, 46, {
                color: "rgba(20,20,20,0.18)",
                border: 3,
                borderColor: "rgba(20,20,20,0.55)",
                round: 23,
            });
            cursor.zIndex = 9999;
            cursor.elem.style.transformOrigin = "center center";

        };

        // *** SIZE:

        // The stage always fits in the window, so the recording looks the same everywhere.
        const fitStage = function () {

            const w = window.innerWidth;
            const h = window.innerHeight;

            stageScale = Math.min(w / STAGE_WIDTH, h / STAGE_HEIGHT);

            stage.elem.style.transform = "scale(" + stageScale + ")";
            stage.left = Math.round((w - STAGE_WIDTH) / 2);
            stage.top = Math.round((h - STAGE_HEIGHT) / 2);

            if (lblScale) lblScale.text = "stage " + STAGE_WIDTH + "x" + STAGE_HEIGHT + "  ·  " + Math.round(stageScale * 100) + "%";

        };

        // *** CODE PANEL:

        // Splits one code line into colored tokens.
        const tokenizeLine = function (line) {

            const tokens = [];
            const regex = /("(?:[^"\\]|\\.)*")|(\/\/.*$)|([A-Za-z_$][A-Za-z0-9_$]*)|(\d+(?:\.\d+)?)|([ \t]+)|([\s\S])/g;
            let match;

            while ((match = regex.exec(line)) !== null) {
                if (match[1]) tokens.push({ text: match[1], type: "string" });
                else if (match[2]) tokens.push({ text: match[2], type: "comment" });
                else if (match[3]) tokens.push({ text: match[3], type: "word" });
                else if (match[4]) tokens.push({ text: match[4], type: "number" });
                else if (match[5]) tokens.push({ text: match[5], type: "space" });
                else tokens.push({ text: match[6], type: "punct" });
            }

            // WHY: A word is a property, a call or a keyword only by what comes after it.
            for (let i = 0; i < tokens.length; i++) {
                if (tokens[i].type !== "word") continue;
                let next = "";
                for (let j = i + 1; j < tokens.length; j++) {
                    if (tokens[j].type !== "space") { next = tokens[j].text.charAt(0); break; }
                }
                if (KEYWORDS.indexOf(tokens[i].text) >= 0) tokens[i].type = "keyword";
                else if (next === ":") tokens[i].type = "prop";
                else if (next === "(") tokens[i].type = "func";
                else tokens[i].type = "plain";
            }

            return tokens;

        };

        // WHY: The code font is monospace, so one measured character gives the width of every line.
        //      Guessing this ratio was wrong and the long lines were still cut off.
        const measureCharWidth = function () {

            let sample = null;
            createIn(codeBox, function () {
                sample = Label({ text: "0123456789", fontSize: CODE_FONT_SIZE, textColor: "transparent" });
                sample.fontFamily = CODE_FONT;
                sample.elem.style.whiteSpace = "pre";
                sample.elem.style.position = "absolute";
                sample.elem.style.left = "-9999px";
            });

            if (sample.elem.offsetWidth > 0) charWidth = sample.elem.offsetWidth / 10;
            sample.remove();

        };

        // WHY: A long line used to run off the right edge. The font is monospace, so the width
        //      of the longest line can be found from its character count, before anything is drawn.
        const fitCodeWidth = function (lines) {

            let maxChars = 0;
            lines.forEach(function (line) { if (line.length > maxChars) maxChars = line.length; });

            const available = STAGE_WIDTH - 120;
            const needed = maxChars * charWidth;
            const scale = Math.min(1, available / (needed || 1));

            codeGroup.elem.style.transformOrigin = "left top";
            codeGroup.elem.style.transform = "scale(" + scale + ")";

        };

        // Writes the lines of a scene into the code panel, one by one.
        const writeCode = async function (lines, token) {

            codeGroup.children.forEach(function (child) { child.remove(); });
            fitCodeWidth(lines);

            for (let i = 0; i < lines.length; i++) {

                if (token !== playToken) return;

                let lineGroup = null;

                createIn(codeGroup, function () {
                    lineGroup = HGroup({ width: "auto", height: "auto", align: "left center", gap: 0, color: "transparent" });
                    lineGroup.elem.style.whiteSpace = "pre";
                    // WHY: An "auto" flex group does not grow with its children, and the children shrink.
                    //      Without these two lines the end of a long line is cut off. (See CLAUDE.md)
                    lineGroup.elem.style.width = "max-content";
                    lineGroup.elem.style.flexShrink = "0";
                    lineGroup.elem.style.overflow = "visible";
                    tokenizeLine(lines[i]).forEach(function (t) {
                        const lbl = Label({
                            text: t.text,
                            fontSize: CODE_FONT_SIZE,
                            textColor: TOKEN_COLOR[t.type] || TOKEN_COLOR.plain,
                        });
                        lbl.fontFamily = CODE_FONT;
                        lbl.elem.style.whiteSpace = "pre";
                        lbl.elem.style.flexShrink = "0";
                    });
                    endGroup();
                });

                // Fade the line in from the left.
                lineGroup.opacity = 0;
                lineGroup.elem.style.transform = "translateX(-18px)";
                lineGroup.setMotion("opacity 0.22s ease-out, transform 0.22s ease-out");
                // WHY: nextFrame() (requestAnimationFrame) is throttled while the page is screen
                //      captured, and the lines then used up the whole scene. A timer is not.
                await basic.sleep(20);
                lineGroup.opacity = 1;
                lineGroup.elem.style.transform = "translateX(0)";

                await sleepPaused((lines[i].trim() === "") ? 40 : 110, token);

            }

        };

        // *** PREVIEW:

        // Puts a new component on the stage and scales it up to fill the preview area.
        const showComponent = function (buildFunc) {

            if (currentComp) { currentComp.remove(); currentComp = null; }
            compScaler.children.forEach(function (child) { child.remove(); });

            createIn(compScaler, function () { currentComp = buildFunc(); });

            return currentComp;

        };

        // WHY: offsetWidth is the layout size, so it is not changed by the CSS scale of the stage.
        const fitComponent = async function () {

            compScaler.elem.style.transform = "scale(1)";
            await basic.sleep(30);

            const w = currentComp.elem.offsetWidth || 1;
            const h = currentComp.elem.offsetHeight || 1;
            const scale = Math.min(2.4, (STAGE_WIDTH - 140) / w, (PREVIEW_HEIGHT - 320) / h);

            compScaler.elem.style.transition = "transform 0.35s ease-out";
            compScaler.elem.style.transform = "scale(" + Math.max(1, scale) + ")";

        };

        // *** CURSOR:

        // Moves the fake cursor over a DOM element of the component.
        const moveCursorTo = async function (element, duration = 520, fx = 0.5, fy = 0.5) {

            if (!element) return;

            const rect = element.getBoundingClientRect();
            const stageRect = stage.elem.getBoundingClientRect();

            const x = (rect.left + rect.width * fx - stageRect.left) / stageScale - cursor.width / 2;
            const y = (rect.top + rect.height * fy - stageRect.top) / stageScale - cursor.height / 2;

            cursor.opacity = 1;
            await cursor.animate({ left: Math.round(x), top: Math.round(y) }, duration, "cubic-bezier(0.4, 0, 0.2, 1)");

        };

        // The click pulse of the fake cursor.
        const pulseCursor = async function () {
            cursor.elem.style.transition = "transform 0.12s ease-out";
            cursor.elem.style.transform = "scale(0.6)";
            await basic.sleep(130);
            cursor.elem.style.transform = "scale(1)";
            await basic.sleep(130);
        };

        // The point of an element in the window, fx / fy: 0 (left, top) ... 1 (right, bottom).
        const pointOf = function (element, fx = 0.5, fy = 0.5) {
            const rect = element.getBoundingClientRect();
            return { x: rect.left + rect.width * fx, y: rect.top + rect.height * fy };
        };

        // Puts the fake cursor on a window point, without motion.
        const placeCursor = function (p) {
            const stageRect = stage.elem.getBoundingClientRect();
            cursor.left = Math.round((p.x - stageRect.left) / stageScale - cursor.width / 2);
            cursor.top = Math.round((p.y - stageRect.top) / stageScale - cursor.height / 2);
        };

        // WHY: The effects listen to pointer events (obj.on("pointerenter")...). The fake cursor sends the
        //      same events, so the real effect code runs. pointerType "mouse": hover effects skip "touch".
        const firePointer = function (obj, type, p) {
            const bubbles = (type !== "pointerenter" && type !== "pointerleave");
            obj.elem.dispatchEvent(new PointerEvent(type, {
                bubbles: bubbles,
                clientX: p.x,
                clientY: p.y,
                pointerType: "mouse",
                isPrimary: true,
                button: 0,
            }));
        };

        // Moves the cursor onto an object (fx, fy) and enters it (hover).
        const enter = async function (obj, token, fx = 0.5, fy = 0.5) {
            const p = pointOf(obj.elem, fx, fy);
            await moveCursorTo(obj.elem, 520, fx, fy);
            if (token !== playToken) return p;
            firePointer(obj, "pointerenter", p);
            firePointer(obj, "pointermove", p);
            return p;
        };

        const leave = function (obj) {
            firePointer(obj, "pointerleave", pointOf(obj.elem, 1.3, 0.5));
        };

        // A click where the cursor is: the pulse and pointerdown / pointerup.
        const click = async function (obj, token, fx = 0.5, fy = 0.5) {
            const p = pointOf(obj.elem, fx, fy);
            firePointer(obj, "pointerdown", p);
            await pulseCursor();
            if (token !== playToken) return;
            firePointer(obj, "pointerup", p);
        };

        // Slides the cursor over an object from one point to another and sends pointermove on the way.
        // WHY: A timer, not requestAnimationFrame: rAF is throttled while the page is screen captured.
        const glide = async function (obj, token, from, to, ms) {
            const steps = Math.max(1, Math.round(ms / 35));
            for (let i = 0; i <= steps; i++) {
                if (token !== playToken) return;
                const t = i / steps;
                const e = t * t * (3 - 2 * t); // smooth start and end
                const p = pointOf(obj.elem, from[0] + (to[0] - from[0]) * e, from[1] + (to[1] - from[1]) * e);
                placeCursor(p);
                firePointer(obj, "pointermove", p);
                await sleepPaused(35, token);
            }
        };

        // *** OBJECTS OF THE SCENES: (The same look as 02-comp-m4-samples/ui-effects.htm)

        const flatButton = function (text, color, width = 150) {
            return Button({ text: text, width: width, height: 46, fontSize: 16, minimal: 1, color: color, textColor: "white", round: 10 });
        };

        const whiteCard = function (title, text) {
            const card = VGroup({ width: 150, height: 104, align: "left top", gap: 2, padding: 16, color: "white", round: 12, border: 1, borderColor: Black(0.12) });
                Label({ text: title, fontSize: 17, fontFamily: "opensans-bold", textColor: Black(0.8) });
                Label({ text: text, width: "100%", fontSize: 14, textColor: Black(0.5) });
            endGroup();
            return card;
        };

        // GROUP: Holds the objects of a scene. It does not clip, so shadows and rings are seen.
        const startScene = function (flow = "horizontal", gap = 18) {
            const group = (flow === "horizontal") ? HGroup({ hug: 1, align: "center center", gap: gap, padding: 30, color: "transparent" })
                                                  : VGroup({ hug: 1, align: "center center", gap: gap, padding: 30, color: "transparent" });
            group.clipContent = 0;
            return group;
        };

        // *** TIMING:

        // A sleep that also waits while the demo is paused, and stops when the demo is restarted.
        const sleepPaused = async function (ms, token) {
            const end = Date.now() + ms;
            while (Date.now() < end || isPaused) {
                if (token !== playToken) return;
                await basic.sleep(40);
                if (isPaused) continue;
            }
        };

        // *** SCENES:

        // Objects the scenes use in run().
        let btnSave, btnList, btnStart, card, focusCards, txtEmail, btnSend;

        const SCENES = [

            // SCENE 1: One line
            {
                title: "One line: press()",
                caption: "A basic.js Button, and one effect on it.",
                seconds: 7,
                code: [
                    'const btn = Button({ text: "Save" });',
                    'UIEffects.press(btn, "ripple");',
                ],
                build: function () {
                    const group = startScene();
                        btnSave = flatButton("Save", COLORS.blue);
                        UIEffects.press(btnSave, "ripple");
                    endGroup();
                    return group;
                },
                run: async function (token) {
                    await enter(btnSave, token, 0.3, 0.5);
                    await click(btnSave, token, 0.3, 0.5);
                    await sleepPaused(700, token);
                    await glide(btnSave, token, [0.3, 0.5], [0.75, 0.4], 400);
                    await click(btnSave, token, 0.75, 0.4);
                    await sleepPaused(500, token);
                    leave(btnSave);
                },
            },

            // SCENE 2: Types
            {
                title: "Pick a type",
                caption: "lift · push · glow · ripple · fill · ring · jelly...",
                seconds: 9,
                code: [
                    '["lift", "push", "glow"].forEach((type) => {',
                    '    const btn = Button({ text: type });',
                    '    UIEffects.press(btn, type);',
                    '});',
                ],
                build: function () {
                    const group = startScene("horizontal", 22);
                        btnList = [["lift", COLORS.blue], ["push", COLORS.orange], ["glow", COLORS.red]].map(function (item) {
                            const btn = flatButton(item[0], item[1], 120);
                            // WHY: push draws a darker edge under the button; its default is a gray one.
                            UIEffects.press(btn, item[0], (item[0] === "push") ? { shadowColor: "#B87414" } : {});
                            return btn;
                        });
                    endGroup();
                    return group;
                },
                run: async function (token) {
                    for (let i = 0; i < btnList.length; i++) {
                        await enter(btnList[i], token);
                        await sleepPaused(450, token);
                        await click(btnList[i], token);
                        await sleepPaused(450, token);
                        leave(btnList[i]);
                    }
                },
            },

            // SCENE 3: Fill
            {
                title: "Outline buttons: fill",
                caption: "The color fills in from one side.",
                seconds: 7,
                code: [
                    'UIEffects.press(btn, "fill", {',
                    '    color: "#1C1C1B",',
                    '    textColor: "white",',
                    '});',
                ],
                build: function () {
                    const group = startScene();
                        btnStart = Button({ text: "Get started", width: 190, height: 50, fontSize: 17, minimal: 1, color: "white", textColor: COLORS.dark, round: 10 });
                        btnStart.elem.style.border = "2px solid " + COLORS.dark;
                        UIEffects.press(btnStart, "fill", { color: COLORS.dark, textColor: "white" });
                    endGroup();
                    return group;
                },
                run: async function (token) {
                    await enter(btnStart, token, 0.2, 0.5);
                    await sleepPaused(1100, token);
                    leave(btnStart);
                    await sleepPaused(700, token);
                    await enter(btnStart, token, 0.6, 0.5);
                    await sleepPaused(500, token);
                    await click(btnStart, token, 0.6, 0.5);
                },
            },

            // SCENE 4: Tilt and spotlight
            {
                title: "Cards: tilt + spotlight",
                caption: "The card follows the pointer.",
                seconds: 8,
                code: [
                    'UIEffects.hover(card, ["tilt", "spotlight"], {',
                    '    angle: 10,',
                    '});',
                ],
                build: function () {
                    const group = startScene();
                        card = VGroup({ width: 240, height: 150, align: "left bottom", gap: 2, padding: 20, color: COLORS.dark, round: 16 });
                        card.elem.style.backgroundImage = "linear-gradient(135deg, #4A90E2, #8E6CEF)";
                            Label({ text: "basic.js", fontSize: 20, fontFamily: "opensans-bold", textColor: "white" });
                            Label({ text: "Hover me", fontSize: 15, textColor: White(0.75) });
                        endGroup();
                        UIEffects.hover(card, ["tilt", "spotlight"], { angle: 10 });
                    endGroup();
                    return group;
                },
                run: async function (token) {
                    await enter(card, token, 0.15, 0.2);
                    await glide(card, token, [0.15, 0.2], [0.85, 0.8], 1500);
                    await glide(card, token, [0.85, 0.8], [0.2, 0.85], 1100);
                    await glide(card, token, [0.2, 0.85], [0.8, 0.2], 1100);
                    leave(card);
                },
            },

            // SCENE 5: Focus group
            {
                title: "focusGroup()",
                caption: "The others step back while one is hovered.",
                seconds: 8,
                code: [
                    'UIEffects.focusGroup([card1, card2, card3], {',
                    '    scale: 1.04, grayscale: 1,',
                    '});',
                ],
                build: function () {
                    const group = startScene("horizontal", 14);
                        focusCards = [
                            whiteCard("Basic", "$9 / month"),
                            whiteCard("Pro", "$19 / month"),
                            whiteCard("Team", "$49 / month"),
                        ];
                        focusCards[1].elem.style.borderColor = COLORS.blue;
                        UIEffects.focusGroup(focusCards, { scale: 1.04, grayscale: 1 });
                    endGroup();
                    return group;
                },
                run: async function (token) {
                    for (let i = 0; i < focusCards.length; i++) {
                        if (i > 0) leave(focusCards[i - 1]);
                        await enter(focusCards[i], token);
                        await sleepPaused(900, token);
                    }
                    leave(focusCards[focusCards.length - 1]);
                },
            },

            // SCENE 6: play() and loop()
            {
                title: "play() and loop()",
                caption: "One time, or until stop().",
                seconds: 9,
                code: [
                    'UIEffects.play(txtEmail, "shake");',
                    '',
                    'const stop = UIEffects.loop(bell, "pulse");',
                ],
                build: function () {
                    const group = startScene("vertical", 26);
                        HGroup({ hug: 1, align: "center center", gap: 12, color: "transparent" });
                        that.clipContent = 0;
                            txtEmail = Input({ width: 230, height: 46, fontSize: 16, placeholder: "E-mail" });
                            txtEmail.text = "bugra@";
                            btnSend = flatButton("Send", COLORS.blue, 100);
                            UIEffects.press(btnSend, "press");
                        endGroup();
                        const bell = Box({ width: 64, height: 64, round: 32, color: COLORS.red });
                        bell.elem.style.position = "relative";
                        createIn(bell, function () {
                            const icon = Icon({ width: 30, height: 30, color: "transparent" });
                            icon.load(ICON_BELL);
                            icon.center();
                        });
                        UIEffects.loop(bell, "pulse");
                    endGroup();
                    return group;
                },
                run: async function (token) {
                    await enter(btnSend, token);
                    await click(btnSend, token);
                    UIEffects.play(txtEmail, "shake");
                    await sleepPaused(1100, token);
                    await click(btnSend, token);
                    UIEffects.play(txtEmail, "shake");
                    await sleepPaused(600, token);
                    leave(btnSend);
                },
            },

        ];

        // *** PLAYER:

        const play = async function () {

            playToken++;
            const token = playToken;

            cursor.left = STAGE_WIDTH / 2;
            cursor.top = CODE_HEIGHT + 200;
            cursor.opacity = 0;

            // INTRO:
            lblSceneTitle.text = "UIEffects";
            lblSceneStep.text = "basic.js";
            lblCaption.text = "Hover and press effects in one line of JavaScript.";
            codeGroup.children.forEach(function (child) { child.remove(); });
            if (currentComp) { currentComp.remove(); currentComp = null; }
            await sleepPaused(1200, token);

            for (let i = 0; i < SCENES.length; i++) {

                if (token !== playToken) return;

                const scene = SCENES[i];
                const sceneStart = Date.now();

                lblSceneTitle.text = scene.title;
                lblSceneStep.text = (i + 1) + " / " + SCENES.length;
                lblCaption.text = scene.caption;

                // Progress of the whole video.
                progressBar.setMotion("width 0.4s linear");
                progressBar.width = Math.round(STAGE_WIDTH * ((i + 1) / SCENES.length));

                await writeCode(scene.code, token);
                if (token !== playToken) return;

                showComponent(scene.build);
                await fitComponent();
                await sleepPaused(500, token);
                if (token !== playToken) return;

                await scene.run(token);
                if (token !== playToken) return;

                // Hold the scene until it has lasted as long as it asked for.
                const left = (scene.seconds * 1000) - (Date.now() - sceneStart);
                await sleepPaused(Math.max(900, left), token);

                // Fade the cursor out between the scenes.
                cursor.setMotion("opacity 0.3s");
                cursor.opacity = 0;

            }

            // OUTRO:
            lblSceneTitle.text = "comp-m4/ui-effects.js";
            lblSceneStep.text = "";
            lblCaption.text = "One file. No CSS. No dependencies.";
            codeGroup.children.forEach(function (child) { child.remove(); });
            await writeCode(['// github.com/bug7a/js-components'], token);

        };

        // *** KEYS:

        const bindKeys = function () {

            page.on("keydown", function (self, event) {

                if (event.code === "Space") {
                    event.preventDefault();
                    isPaused = (isPaused) ? 0 : 1;
                    lblSceneStep.opacity = (isPaused) ? 0.4 : 1;
                }

                if (event.code === "KeyR") play();

                if (event.code === "KeyS") lblScale.visible = (lblScale.visible == 1) ? 0 : 1;

            });

        };

    </script>

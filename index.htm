                <h1>JS Components</h1>
                <p>Plain JavaScript UI components built with basic.js. Every component with a live example and its code.</p>
                <h2>Forms &amp; Inputs</h2>
                <ul>
                    <li><a href="#/select-file" style="color: inherit;">SelectFile</a>: Drop zone and file dialog that lists the chosen files with image previews and sizes.</li>
                    <li><a href="#/tag-input" style="color: inherit;">TagInput</a>: A field of chips for tags, keywords or e-mails, with suggestions, validation and paste splitting.</li>
                    <li><a href="#/stepper" style="color: inherit;">Stepper</a>: Number stepper with decimals, a unit, typed editing and hold-to-repeat buttons.</li>
                    <li><a href="#/input-b" style="color: inherit;">InputB</a>: Labeled text field with an icon, a unit, hints and validation; the base of the other *InputB fields.</li>
                    <li><a href="#/email-input-b" style="color: inherit;">EmailInputB</a>: An InputB that checks e-mail addresses.</li>
                    <li><a href="#/password-input-b" style="color: inherit;">PasswordInputB</a>: Password field with a show and hide button.</li>
                    <li><a href="#/number-input-b" style="color: inherit;">NumberInputB</a>: An InputB that accepts only numbers.</li>
                    <li><a href="#/phone-input-b" style="color: inherit;">PhoneInputB</a>: Phone number field with a country code; one example opens a country list.</li>
                    <li><a href="#/currency-input-b" style="color: inherit;">CurrencyInputB</a>: Money field that formats the amount and shows its currency.</li>
                    <li><a href="#/url-input-b" style="color: inherit;">URLInputB</a>: Web address field with a protocol selector.</li>
                    <li><a href="#/textarea-b" style="color: inherit;">TextareaB</a>: Multi-line text field in the InputB style, with a character counter.</li>
                    <li><a href="#/search-input" style="color: inherit;">SearchInput</a>: Search field with a search icon and a clear button.</li>
                    <li><a href="#/slider" style="color: inherit;">Slider</a>: Slider for choosing a value in a range, inspired by Material 3.</li>
                    <li><a href="#/ui-stepper" style="color: inherit;">UIStepper</a>: The first number stepper. New pages use Stepper.</li>
                    <li><a href="#/ui-search-box" style="color: inherit;">UISearchBox</a>: Search and filter boxes for light and colored backgrounds.</li>
                    <li><a href="#/ui-numeric-keyboard" style="color: inherit;">UINumericKeyboard</a>: On-screen number keyboard for touch screens and kiosks.</li>
                </ul>
                <h2>Selection</h2>
                <ul>
                    <li><a href="#/select-box" style="color: inherit;">SelectBox</a>: Dropdown select for single or multiple selection, with select all and clear.</li>
                    <li><a href="#/select-date" style="color: inherit;">SelectDate</a>: Date picker as a popup or an always visible calendar, with a month and year view.</li>
                    <li><a href="#/select-time" style="color: inherit;">SelectTime</a>: Time picker with scrollable hour and minute columns, as a popup or inline.</li>
                    <li><a href="#/select-color" style="color: inherit;">SelectColor</a>: Color picker: a field that opens a palette, or an always visible palette.</li>
                    <li><a href="#/check-box" style="color: inherit;">CheckBox</a>: Check box with a label, drawn with code; classic and modern style packages.</li>
                    <li><a href="#/radio-button" style="color: inherit;">RadioButton</a>: Radio buttons that work in groups, with keyboard support and style packages.</li>
                    <li><a href="#/toggle" style="color: inherit;">Toggle</a>: On and off switch for light and dark pages.</li>
                    <li><a href="#/tiny-select" style="color: inherit;">TinySelect</a>: Small inline select that fits into a sentence: Theme: Supernova.</li>
                    <li><a href="#/ui-toggle" style="color: inherit;">UIToggle</a>: On and off switch with style presets like Google and Apple.</li>
                    <li><a href="#/check-box-m1" style="color: inherit;">CheckBox (M1)</a>: The first check box. New pages use the M3 CheckBox.</li>
                    <li><a href="#/select-item" style="color: inherit;">SelectItem</a>: A field that opens a searchable list of items with images.</li>
                    <li><a href="#/select-text" style="color: inherit;">SelectText</a>: A field that opens a searchable text list.</li>
                    <li><a href="#/ui-select-text" style="color: inherit;">UISelectText</a>: A select field that opens a searchable list of texts.</li>
                </ul>
                <h2>Buttons &amp; Menus</h2>
                <ul>
                    <li><a href="#/context-menu" style="color: inherit;">ContextMenu</a>: A simple menu that opens at the mouse point, with text or icon items.</li>
                    <li><a href="#/button-with-icon" style="color: inherit;">ButtonWithIcon</a>: A button with an icon and a text; the icon on the left or on top.</li>
                    <li><a href="#/hold-to-confirm-button" style="color: inherit;">HoldToConfirmButton</a>: A button that runs only after it is pressed and held; for risky actions like delete.</li>
                    <li><a href="#/ui-action-button" style="color: inherit;">UIActionButton</a>: Round floating action button in the corner of the screen.</li>
                </ul>
                <h2>Navigation</h2>
                <ul>
                    <li><a href="#/tabs" style="color: inherit;">Tabs</a>: Tab bar with underline and pill variants, counts, badges, closable tabs, a vertical mode and optional panels.</li>
                    <li><a href="#/breadcrumbs" style="color: inherit;">Breadcrumbs</a>: Shows where the current page is in a hierarchy: Home / Products / Laptops.</li>
                    <li><a href="#/page-control" style="color: inherit;">PageControl</a>: Sliding or fading pages for wizards, carousels and app screens, with swipe, dots, arrows and auto play.</li>
                    <li><a href="#/search-results" style="color: inherit;">SearchResults</a>: The result list that opens under a search input, like an autocomplete or a command palette.</li>
                    <li><a href="#/bottom-bar" style="color: inherit;">BottomBar</a>: Mobile app bottom bar built from a JSON list of buttons, with badges.</li>
                    <li><a href="#/text-tabs" style="color: inherit;">TextTabs</a>: Small text tab bar. New pages use Tabs.</li>
                    <li><a href="#/left-menu" style="color: inherit;">LeftMenu</a>: Icon side menu that opens on hover, or with a tap on touch screens.</li>
                    <li><a href="#/ui-tabs" style="color: inherit;">UITabs</a>: The first tab bar, with icon and text tabs. New pages use Tabs.</li>
                    <li><a href="#/ui-page-control" style="color: inherit;">UIPageControl</a>: The first sliding page container. New pages use PageControl.</li>
                </ul>
                <h2>Data &amp; Charts</h2>
                <ul>
                    <li><a href="#/chart-box" style="color: inherit;">ChartBox</a>: Chart.js charts used like a basic.js object.</li>
                    <li><a href="#/gauge" style="color: inherit;">Gauge</a>: A value drawn on an arc: a full ring or a half arc.</li>
                    <li><a href="#/mini-graph-box" style="color: inherit;">MiniGraphBox</a>: Small KPI box with a title, a value, an icon and a live bar graph.</li>
                    <li><a href="#/spark-line-box" style="color: inherit;">SparkLineBox</a>: KPI box with a line graph, a trend badge, min/max dots and a hover tooltip.</li>
                    <li><a href="#/time-line" style="color: inherit;">TimeLine</a>: A vertical time line: a dot for every item and a line between the dots.</li>
                    <li><a href="#/smart-table" style="color: inherit;">SmartTable</a>: Virtual-scroll table for millions of rows, with filtering, sorting, custom cells and editing.</li>
                    <li><a href="#/tiny-table" style="color: inherit;">TinyTable</a>: A light table for short data lists.</li>
                    <li><a href="#/ui-cells" style="color: inherit;">UICells</a>: Splits a box into rows and columns of cells to place objects in them.</li>
                    <li><a href="#/tiny-table-m1" style="color: inherit;">TinyTable (M1)</a>: The first version of the light table.</li>
                </ul>
                <h2>Overlays &amp; Feedback</h2>
                <ul>
                    <li><a href="#/progress-bar" style="color: inherit;">ProgressBar</a>: Horizontal progress bar with a title and a value text; determinate or indeterminate.</li>
                    <li><a href="#/toast" style="color: inherit;">Toast</a>: Short messages that come and go: success, error, loading, and actions like Undo.</li>
                    <li><a href="#/modal" style="color: inherit;">Modal</a>: A dialog window over the page for any content; Modal.confirm() and Modal.alert() return a Promise.</li>
                    <li><a href="#/side-panel" style="color: inherit;">SidePanel</a>: A drawer that slides in from a side of the screen, over the page.</li>
                    <li><a href="#/loading-screen" style="color: inherit;">LoadingScreen</a>: Full cover splash and loading screen with an icon, a title, a spinner and progress.</li>
                    <li><a href="#/line-progress-bar" style="color: inherit;">LineProgressBar</a>: A progress bar drawn with thin vertical lines.</li>
                    <li><a href="#/dialog" style="color: inherit;">Dialog</a>: A simple dialog window.</li>
                    <li><a href="#/tooltip" style="color: inherit;">Tooltip</a>: A small hint box that appears over an object.</li>
                    <li><a href="#/waiting" style="color: inherit;">Waiting</a>: A waiting animation over the page while something loads.</li>
                    <li><a href="#/badge" style="color: inherit;">BadgeV2</a>: Notification badge on an object: a dot, a number or custom content.</li>
                    <li><a href="#/ui-progress-bar" style="color: inherit;">UIProgressBar</a>: The first progress bar. New pages use ProgressBar.</li>
                    <li><a href="#/ui-notice" style="color: inherit;">UINotice</a>: Info, alert and error messages shown over the page.</li>
                    <li><a href="#/object-waiting" style="color: inherit;">ObjectWaiting</a>: Waiting animation over a single object, like a button that downloads.</li>
                </ul>
                <h2>Pages &amp; Views</h2>
                <ul>
                    <li><a href="#/web-view" style="color: inherit;">WebView</a>: An iframe box with a loading spinner, errors, messages, scaled previews and a toolbar. The previews on this site use it.</li>
                    <li><a href="#/login-page" style="color: inherit;">LoginPage</a>: A ready login and sign up page with e-mail, password and social buttons.</li>
                    <li><a href="#/ui-title" style="color: inherit;">UITitle</a>: Mobile page title bar with a back button.</li>
                    <li><a href="#/ui-left-title" style="color: inherit;">UILeftTitle</a>: A settings row with a title, a subtitle and an arrow.</li>
                    <li><a href="#/ui-scrolling-text" style="color: inherit;">UIScrollingText</a>: A line of text that scrolls back and forth inside a small box.</li>
                    <li><a href="#/ui-web-view" style="color: inherit;">UIWebView</a>: The first iframe box. New pages use WebView.</li>
                </ul>
                <h2>Effects &amp; Styles</h2>
                <ul>
                    <li><a href="#/ui-effects" style="color: inherit;">UIEffects</a>: Press, hover and attention effects for any basic.js object: ripple, lift, tilt, spotlight and more.</li>
                    <li><a href="#/ui-standards" style="color: inherit;">UI Standards</a>: Design tokens and themes: colors, font sizes, corner radius and a light, dark or automatic theme.</li>
                </ul>
                <p><a href="https://github.com/bug7a/js-components" style="color: inherit;">github.com/bug7a/js-components</a></p>

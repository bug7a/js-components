                <h1>JS Components</h1>
                <p>Plain JavaScript UI components built with basic.js. Every component with a live example and its code.</p>
                <h2>Forms &amp; Inputs</h2>
                <ul>
                    <li><a href="#/select-file" style="color: inherit;">SelectFile</a>: Drop zone and file dialog that lists the chosen files with image previews and sizes.</li>
                    <li><a href="#/tag-input" style="color: inherit;">TagInput</a>: A field of chips for tags, keywords or e-mails, with suggestions, validation and paste splitting.</li>
                    <li><a href="#/stepper" style="color: inherit;">Stepper</a>: Number stepper with decimals, a unit, typed editing and hold-to-repeat buttons. A line around the buttons and a round look (ozden).</li>
                    <li><a href="#/slider-field" style="color: inherit;">SliderField</a>: A slider in the shape of a field: the label at the left, the value at the right, step dots, drag, click to jump and typed editing.</li>
                    <li><a href="#/label-editor" style="color: inherit;">LabelEditor</a>: An object based editor: add labels, change their properties in a side panel, save the styles with a name and apply them to other labels.</li>
                    <li><a href="#/property-panel" style="color: inherit;">PropertyPanel</a>: A design tool style property inspector at the right side, built from a JSON: numbers, selects, segmented buttons, toggles and constraints, with change events.</li>
                    <li><a href="#/rich-text-editor" style="color: inherit;">RichTextEditor</a>: A simple rich text editor with a toolbar (bold, headings, lists, quote, link, undo), cleaned HTML output and a character limit.</li>
                    <li><a href="#/code-editor" style="color: inherit;">CodeEditor</a>: A text editor for code: line numbers, colors for Python, JavaScript, JSON, HTML, CSS, SQL and Bash, indent keys, and a file of 100000 lines stays fast. Light and dark themes.</li>
                    <li><a href="#/sortable-list" style="color: inherit;">SortableList</a>: A list whose order is changed by drag and drop, the keyboard or up / down buttons, with locked rows.</li>
                    <li><a href="#/input-b" style="color: inherit;">InputB</a>: Labeled text field with an icon, a unit, hints and validation; the base of the other *InputB fields.</li>
                    <li><a href="#/email-input-b" style="color: inherit;">EmailInputB</a>: An InputB that checks e-mail addresses.</li>
                    <li><a href="#/password-input-b" style="color: inherit;">PasswordInputB</a>: Password field with a show and hide button.</li>
                    <li><a href="#/number-input-b" style="color: inherit;">NumberInputB</a>: An InputB that accepts only numbers.</li>
                    <li><a href="#/phone-input-b" style="color: inherit;">PhoneInputB</a>: Phone number field with a country code; one example opens a country list.</li>
                    <li><a href="#/currency-input-b" style="color: inherit;">CurrencyInputB</a>: Money field that formats the amount and shows its currency.</li>
                    <li><a href="#/url-input-b" style="color: inherit;">URLInputB</a>: Web address field with a protocol selector.</li>
                    <li><a href="#/textarea-b" style="color: inherit;">TextareaB</a>: Multi-line text field in the InputB style, with a character counter.</li>
                    <li><a href="#/search-input" style="color: inherit;">SearchInput</a>: Search field with a search icon and a clear button.</li>
                    <li><a href="#/slider" style="color: inherit;">Slider</a>: Slider for choosing a value in a range. Two looks: round (a thin track and a round white knob: the look of new pages) and classic (inspired by Material 3).</li>
                    <li><a href="#/numeric-keyboard" style="color: inherit;">NumericKeyboard</a>: Number keys on the screen for a PIN, an amount or a kiosk: two layouts, a hidden PIN, the keyboard of the computer too. The new version of UINumericKeyboard.</li>
                </ul>
                <h2>Selection</h2>
                <ul>
                    <li><a href="#/item-list" style="color: inherit;">ItemList</a>: A list of items with an icon, a title and a description (or your own rows): vertical, horizontal or grid, single or multiple selection, section titles, search and keyboard; a pressed flash and animated add / remove.</li>
                    <li><a href="#/filters" style="color: inherit;">Filters</a>: A filter menu: a button and a panel with a search field, groups of check boxes, the number of the selected options and Clear all. In the page or as a popup.</li>
                    <li><a href="#/select-box" style="color: inherit;">SelectBox</a>: Dropdown select for single or multiple selection, with select all and clear.</li>
                    <li><a href="#/full-screen-select" style="color: inherit;">FullScreenSelect</a>: A select field whose list opens on the whole screen, with a search box: for phones and long lists. The new version of UISelectText.</li>
                    <li><a href="#/select-date" style="color: inherit;">SelectDate</a>: Date picker as a popup or an always visible calendar, with a month and year view.</li>
                    <li><a href="#/select-time" style="color: inherit;">SelectTime</a>: Time picker with scrollable hour and minute columns, as a popup or inline.</li>
                    <li><a href="#/select-color" style="color: inherit;">SelectColor</a>: Color picker: a field that opens a palette, or an always visible palette.</li>
                    <li><a href="#/period-bar" style="color: inherit;">PeriodBar</a>: A month switcher: this month and the months before it in a white capsule, with round buttons and sliding months. For a mobile app with a 600 px design (page.fit(600, 800)): on a normal page its sizes are too big.</li>
                    <li><a href="#/check-box" style="color: inherit;">CheckBox</a>: Check box with a label, drawn with code; classic, modern and dark style packages.</li>
                    <li><a href="#/radio-button" style="color: inherit;">RadioButton</a>: Radio buttons that work in groups, with keyboard support and style packages.</li>
                    <li><a href="#/toggle" style="color: inherit;">Toggle</a>: On and off switch for light and dark pages. Many looks: modern, classic, the shapes float, round, slim, outline and square, and tick, badge and label with a check, a cross or a text.</li>
                    <li><a href="#/tiny-select" style="color: inherit;">TinySelect</a>: Small inline select that fits into a sentence: Theme: Supernova.</li>
                </ul>
                <h2>Buttons &amp; Menus</h2>
                <ul>
                    <li><a href="#/action-button" style="color: inherit;">ActionButton</a>: Round floating action button in the corner of the screen; it opens a menu of actions. The new version of UIActionButton.</li>
                    <li><a href="#/context-menu" style="color: inherit;">ContextMenu</a>: A simple menu that opens at the mouse point, with text or icon items (SVG icons take the text color) and submenus.</li>
                    <li><a href="#/menu-bar" style="color: inherit;">MenuBar</a>: The row of menus at the top of a window: File, Edit, View. Shortcuts, check marks, submenus and the arrow keys. Light and dark themes.</li>
                    <li><a href="#/smart-button" style="color: inherit;">SmartButton</a>: The default button: an icon and a text (or one of them; an empty text makes an icon button). The look in three steps: styleName (the template: ozdenType1-4, pill, outlined, ozdenType1Dark-4Dark), tone (white, cyan, orange, yellow, green, blue, and blueDark... for a dark page) and style (your own colors: the color and the color under the mouse; pressed, it gets darker by itself). A waiting clock or dots while a job runs, and a two-click ask with a bubble.</li>
                    <li><a href="#/hold-to-confirm-button" style="color: inherit;">HoldToConfirmButton</a>: A button that runs only after it is pressed and held; for risky actions like delete.</li>
                </ul>
                <h2>Navigation</h2>
                <ul>
                    <li><a href="#/tabs" style="color: inherit;">Tabs</a>: Tab bar with underline and pill variants, counts, badges, closable tabs, a vertical mode and optional panels.</li>
                    <li><a href="#/tree-view" style="color: inherit;">TreeView</a>: A tree of nested items with lazy branches, keyboard and type-ahead: a file explorer, a category tree, a menu or design tool layers.</li>
                    <li><a href="#/breadcrumbs" style="color: inherit;">Breadcrumbs</a>: Shows where the current page is in a hierarchy: Home / Products / Laptops.</li>
                    <li><a href="#/page-control" style="color: inherit;">PageControl</a>: Sliding or fading pages for wizards, carousels and app screens, with swipe, dots, arrows and auto play.</li>
                    <li><a href="#/search-results" style="color: inherit;">SearchResults</a>: The result list that opens under a search input, like an autocomplete or a command palette.</li>
                    <li><a href="#/action-tab-bar" style="color: inherit;">ActionTabBar</a>: A bottom tab bar with a big round + button for the main action of the app; a line slides under the selected tab. For a mobile app with a 600 px design (page.fit(600, 800)): on a normal page its sizes are too big.</li>
                    <li><a href="#/bottom-bar" style="color: inherit;">BottomBar</a>: Mobile app bottom bar built from a JSON list of buttons, with badges; the name of the selected item next to it, over it for a moment or hidden, a color per item, keyboard ready.</li>
                    <li><a href="#/app-bar" style="color: inherit;">AppBar</a>: The top bar of a tab page of a mobile app: a title in the middle or at the left, a back and a menu button. For a mobile app with a 600 px design (page.fit(600, 800)): on a normal page its sizes are too big.</li>
                    <li><a href="#/page-header" style="color: inherit;">PageHeader</a>: The header of a page that slides in over the tabs of a mobile app: a small back link over a big title. For a mobile app with a 600 px design (page.fit(600, 800)): on a normal page its sizes are too big.</li>
                    <li><a href="#/left-menu" style="color: inherit;">LeftMenu</a>: Icon side menu that opens on hover, or with a tap on touch screens.</li>
                </ul>
                <h2>Data &amp; Charts</h2>
                <ul>
                    <li><a href="#/graph-box" style="color: inherit;">GraphBox</a>: Charts with no library: one file draws them as SVG. Line, area, bar, pie, doughnut, radar, scatter and bubble, with a tooltip, a legend, a table and two themes.</li>
                    <li><a href="#/gauge" style="color: inherit;">Gauge</a>: A value drawn on an arc: a full ring or a half arc.</li>
                    <li><a href="#/mini-graph-box" style="color: inherit;">MiniGraphBox</a>: Small KPI box with a title, a value, an icon and a live bar graph.</li>
                    <li><a href="#/spark-line-box" style="color: inherit;">SparkLineBox</a>: KPI box with a line graph, a trend badge, min/max dots and a hover tooltip.</li>
                    <li><a href="#/time-line" style="color: inherit;">TimeLine</a>: A vertical time line: a dot for every item and a line between the dots.</li>
                    <li><a href="#/log-view" style="color: inherit;">LogView</a>: The output of a program: colored lines with their time and level, following the last line. Fast output is drawn in batches. Light and dark themes.</li>
                    <li><a href="#/data-table" style="color: inherit;">DataTable</a>: A table for lists up to about 2,000 rows: sorting, search, keyboard selection, your own cells and row updates by id. For more rows: SmartTable.</li>
                    <li><a href="#/smart-table" style="color: inherit;">SmartTable</a>: Virtual-scroll table for millions of rows, with filtering, sorting, custom cells and editing.</li>
                    <li><a href="#/scrolling-text" style="color: inherit;">ScrollingText</a>: A one line text that slides to show its end when it does not fit: always, or only under the mouse.</li>
                    <li><a href="#/tiny-table-m4" style="color: inherit;">TinyTable</a>: A light table for short lists: a colored title row, one line rows, a soft color under the mouse; scrolling rows. The new version of TinyTable (M1).</li>
                </ul>
                <h2>Overlays &amp; Feedback</h2>
                <ul>
                    <li><a href="#/progress-bar" style="color: inherit;">ProgressBar</a>: Horizontal progress bar with a title and a value text; determinate or indeterminate.</li>
                    <li><a href="#/toast" style="color: inherit;">Toast</a>: Short messages that come and go: success, error, loading, and actions like Undo.</li>
                    <li><a href="#/status-bar" style="color: inherit;">StatusBar</a>: The thin bar at the bottom of a window: a short message that can go away by itself, a turning circle for a job, small parts that can be clicked. Light and dark themes.</li>
                    <li><a href="#/dialog" style="color: inherit;">Dialog</a>: A dialog over the page with fields and buttons: a button that asks again, a waiting button, keyboard; Dialog.confirm, alert and prompt. In development.</li>
                    <li><a href="#/notice" style="color: inherit;">Notice</a>: A short message in the middle of the screen over a soft cover: five types, an icon, a second line; it goes by itself. The new version of notice (M1).</li>
                    <li><a href="#/side-panel" style="color: inherit;">SidePanel</a>: A drawer that slides in from a side of the screen, or of a box like an app column, over the page.</li>
                    <li><a href="#/loading-screen" style="color: inherit;">LoadingScreen</a>: Full cover splash and loading screen with an icon, a title, a spinner and progress.</li>
                    <li><a href="#/line-progress-bar" style="color: inherit;">LineProgressBar</a>: A progress bar drawn with thin vertical lines.</li>
                    <li><a href="#/tooltip" style="color: inherit;">Tooltip</a>: A hint bubble over an object: it follows the mouse or stays at the object, with an optional bordered arrow, always inside the screen; your own content in it, or a popover that stays and can be clicked.</li>
                    <li><a href="#/badge" style="color: inherit;">BadgeV2</a>: Notification badge on an object: a dot, a number or custom content.</li>
                </ul>
                <h2>Pages &amp; Views</h2>
                <ul>
                    <li><a href="#/splitter" style="color: inherit;">Splitter</a>: Two areas with a line between them: a drag changes their sizes, side by side or one under the other. Keyboard, limits, sizes that follow the window. Light and dark themes.</li>
                    <li><a href="#/image-view" style="color: inherit;">ImageView</a>: A place to look at a picture or a plot: zoom with the wheel or two fingers, move with a drag, a small toolbar. A plot that is drawn again does not blink. Light and dark themes.</li>
                    <li><a href="#/web-view" style="color: inherit;">WebView</a>: An iframe box with a loading spinner, errors, messages, scaled previews and a toolbar. The previews on this site use it.</li>
                    <li><a href="#/login-page" style="color: inherit;">LoginPage</a>: A ready login and sign up page with e-mail, password and social buttons.</li>
                    <li><a href="#/settings-row" style="color: inherit;">SettingsRow</a>: A row of a settings page: a title, a small text that fades in and out, and a control (a switch, a stepper) or an arrow at the right; bands between the groups. For a mobile app with a 600 px design (page.fit(600, 800)): on a normal page its sizes are too big.</li>
                </ul>
                <h2>Effects &amp; Styles</h2>
                <ul>
                    <li><a href="#/ui-effects" style="color: inherit;">UIEffects</a>: Press, hover and attention effects for any basic.js object: ripple, lift, tilt, spotlight and more.</li>
                    <li><a href="#/ui-standards" style="color: inherit;">UI Standards</a>: Design tokens and themes: colors, font sizes, corner radius and a light, dark or automatic theme.</li>
                    <li><a href="#/tap-effect" style="color: inherit;">TapEffect</a>: A soft circle where the screen is tapped, over everything; it never catches the tap. TapEffect.start() / stop(), also on a page fitted with page.fit().</li>
                </ul>
                <p><a href="https://github.com/bug7a/js-components" style="color: inherit;">github.com/bug7a/js-components</a></p>

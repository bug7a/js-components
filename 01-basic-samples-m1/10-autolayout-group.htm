<!DOCTYPE html>
<html>
    <head>
        
        <title>Group Example (HGroup / VGroup)</title>
        
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

        <!-- LIBRARY FILES -->
        <link rel="stylesheet" type="text/css" href="../basic/basic.min.css">
        <script src="../basic/basic.min.js" type="text/javascript" charset="utf-8"></script>

        <script>

        // First running function.
        window.onload = function() {

            page.color = "whitesmoke";

            // GROUP: A row (Default: centered, 100% x 100%). VGroup({...}) makes a column.
            HGroup({
                align: "center", // "left top", "center right", "right bottom"... (horizontal word + vertical word)
                gap: 10, // space between the children (px)
                padding: 0, // a number or [x, y]
                // wrap: 1, // continue on the next line when there is no space
                // justify: "space-between", // "left", "center", "right", "space-between", "space-around", "space-evenly"
                // hug: 1, // width and height "auto": the group wraps its content
            });
            // To change it after it is created: that.flow = "vertical"; that.align = "left top"; that.gap = 20;

                // BOX: Red 
                Box({
                    color: "orangered",
                });

                // BOX: Blue
                Box({
                    color: "steelblue",
                });
                //that.elem.style.marginLeft = "8px";

            endGroup();

        };

        </script>

    </head>
    <body>
        
        <!-- HTML content -->
        
    </body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <title>Radio Button 2</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- LIBRARY FILES -->
    <link rel="preload" href="../basic/font/open-sans/OpenSans-Regular.ttf" as="font" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="../basic/basic.min.css">
    <script src="../basic/basic.min.js" type="text/javascript" charset="utf-8"></script>

    <!-- COMPONENT FILES -->
    <script src="../comp-m3/radio-button.js" type="text/javascript" charset="utf-8"></script>

    <script>

        /* Bismillah */

        // *** VARIABLES:
        let lblShipping, lblPlan, rdoPremium;

        // Selection color (dot) and its light versions (backgrounds):
        // NOTE: Light versions are solid colors (10% and 20% of ACCENT on white), not rgba.
        // WHY: A transparent mark on a transparent row background stacks and looks darker.

        // Pastel green (alternative, same colors as check-box-2.htm):
        //const ACCENT = "#6FCF97";
        //const ACCENT_10 = "#F1FAF5";
        //const ACCENT_20 = "#E2F5EA";

        // Blue (alternative):
        //const ACCENT = "#689BD2";
        //const ACCENT_10 = "#F0F5FB";
        //const ACCENT_20 = "#E1EBF6";

        // Cadet blue (alternative):
        const ACCENT = "cadetblue"; // #5F9EA0
        const ACCENT_10 = "#EFF5F6";
        const ACCENT_20 = "#DFECEC";

        // Tomato:
        //const ACCENT = "tomato"; // #FF6347
        //const ACCENT_10 = "#FFEFED";
        //const ACCENT_20 = "#FFE0DA";

        const shippingList = [
            { value: "standard", text: "Standard (3-5 days)" },
            { value: "express", text: "Express (1-2 days)" },
            { value: "pickup", text: "Pick up from store" },
        ];

        const start = function () {

            page.color = "whitesmoke";

            // BOX: Full screen scrollable container
            // WHY: page does not scroll. Scrollable content must be inside a Box with scrollY: 1.
            startBox(0, 0, "100%", "100%", {
                color: "transparent",
                scrollY: 1,
            });

                // GROUP: Page layout
                VGroup({
                    width: "100%",
                    height: "auto", // Grows with content, so the Box can scroll.
                    align: "center top",
                    gap: 30,
                    padding: 50,
                });

                    // LABEL: Title
                    Label({
                        text: "Radio Button 2",
                        fontSize: 26,
                        fontFamily: "opensans-bold",
                    });

                    Label({
                        text: "Custom style: matches the check box style in check-box-2.htm",
                        fontSize: 14,
                        textColor: Black(0.5),
                    });

                    // SAMPLE 1: Shipping options (full width rows)
                    startCard("1. Shipping");

                        shippingList.forEach(function (data, index) {
                            RadioButton({
                                width: "100%",
                                group: "shipping",
                                value: data.value,
                                labelText: data.text,
                                checked: (index == 0) ? 1 : 0,
                                onChange: refreshShipping,
                                styleName: "modern",
                                style: getCustomStyle(),
                            });
                        });

                        lblShipping = Label({
                            text: "",
                            fontSize: 14,
                            textColor: Black(0.5),
                            padding: [12, 8],
                        });

                    endCard();

                    // SAMPLE 2: States
                    startCard("2. States");

                        RadioButton({
                            width: "100%",
                            group: "plan",
                            value: "free",
                            labelText: "Free",
                            checked: 1,
                            onChange: refreshPlan,
                            styleName: "modern",
                            style: getCustomStyle(),
                        });

                        RadioButton({
                            width: "100%",
                            group: "plan",
                            value: "pro",
                            labelText: "Pro",
                            onChange: refreshPlan,
                            styleName: "modern",
                            style: getCustomStyle(),
                        });

                        rdoPremium = RadioButton({
                            width: "100%",
                            group: "plan",
                            value: "premium",
                            labelText: "Premium (disabled)",
                            enabled: 0,
                            onChange: refreshPlan,
                            styleName: "modern",
                            style: getCustomStyle(),
                        });

                        // GROUP: Enable premium
                        HGroup({ width: "auto", height: "auto", gap: 8, padding: [12, 4] });

                            Button({ text: "Enable Premium", width: 150, height: 36, fontSize: 14, color: "lightgray" });
                            that.on("click", function (self) {
                                rdoPremium.setEnabled(rdoPremium.enabled ? 0 : 1);
                                rdoPremium.setLabelText("Premium" + (rdoPremium.enabled ? "" : " (disabled)"));
                                self.text = (rdoPremium.enabled ? "Disable" : "Enable") + " Premium";
                            });

                        endGroup();

                        lblPlan = Label({
                            text: "",
                            fontSize: 14,
                            textColor: Black(0.5),
                            padding: [12, 8],
                        });

                        RadioButton({
                            width: "100%",
                            group: "side",
                            labelText: "Label on the left",
                            labelPosition: "left",
                            checked: 1,
                            styleName: "modern",
                            style: getCustomStyle(),
                        });

                        // Without label (auto width)
                        HGroup({ width: "auto", height: "auto", gap: 4 });
                            RadioButton({ group: "mini", styleName: "modern", style: getCustomStyle() });
                            RadioButton({ group: "mini", checked: 1, styleName: "modern", style: getCustomStyle() });
                            RadioButton({ group: "mini", styleName: "modern", style: getCustomStyle() });
                        endGroup();

                    endCard();

                endGroup();

            endBox();

            refreshShipping();
            refreshPlan();

        };

        // *** OTHER FUNCTIONS:

        // Returns a new style object for each radio button.
        // NOTE: Layout, sizes and borders come from the "modern" style package. Only the selection colors are set here.
        // WHY: RadioButton fills missing keys into the given object, so do not share one object.
        const getCustomStyle = function () {
            return {
                checkedBox: {
                    color: ACCENT_10,
                },
                hoverCheckedBox: {
                    color: ACCENT_20, // A bit darker, so mouse over is visible on checked rows too.
                },
                checkedMark: { // The circle stays without border, behind the dot. Same color as hoverCheckedBox.
                    color: ACCENT_20,
                },
                dot: {
                    color: ACCENT,
                },
            };
        };

        // GROUP: A white card with a title.
        const startCard = function (title) {
            VGroup({
                width: 360,
                height: "auto",
                align: "left top",
                gap: 4,
                padding: 12,
                color: "white",
                round: 12,
                border: 1,
                borderColor: Black(0.1),
            });
            Label({
                text: title,
                fontSize: 14,
                textColor: Black(0.45),
                padding: [12, 8],
            });
        };

        const endCard = function () {
            endGroup();
        };

        const refreshShipping = function () {
            const selected = RadioButton.getSelected("shipping");
            lblShipping.text = "Shipping: " + (selected ? selected.value : "none");
        };

        const refreshPlan = function () {
            lblPlan.text = "Plan: " + RadioButton.getValue("plan");
        };

    </script>
</head>

<body></body>

</html>

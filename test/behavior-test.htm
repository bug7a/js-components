        <script>
        "use strict";

        // NOTE: Self-checking BEHAVIOR test (2026-10-29): every check is a bug that was found and fixed, written as
        //       its repro, so it can not come back silently. Open it in a browser: green = passed, red = failed.
        //       The summary is also in the console and in the tab title ("ALL PASS").
        //       (test/components-test.htm checks the life cycle of every component; this page checks what they do.)
        //       A new fixed bug: add a test() with its repro below.

        const results = [];
        const uncaught = [];
        window.addEventListener("error", function (e) { uncaught.push(e.message); });
        window.addEventListener("unhandledrejection", function (e) { uncaught.push(String(e.reason)); });

        const check = function (name, ok, info) {
            results.push({ name: name, ok: !!ok, info: (info === undefined) ? "" : String(info) });
        };

        const wait = function (ms) { return basic.sleep(ms); };

        // The visible element with exactly this text (a leaf), or null
        const findByText = function (text, root) {
            const all = (root || document).querySelectorAll("*");
            for (const el of all) {
                if (el.childElementCount === 0 && el.textContent.trim() === text && el.offsetParent !== null) return el;
            }
            return null;
        };

        const key = function (target, type, keyName, extra) {
            target.dispatchEvent(new KeyboardEvent(type, Object.assign({ key: keyName, bubbles: true, cancelable: true }, extra || {})));
        };

        const pointer = function (target, type, x, y, pointerType) {
            target.dispatchEvent(new PointerEvent(type, { bubbles: true, cancelable: true, clientX: x, clientY: y, pointerId: 7, pointerType: pointerType, isPrimary: true, button: 0 }));
        };

        // Every test runs alone; an error is a failed check, the next test still runs.
        const tests = [];
        const test = function (name, func) { tests.push({ name: name, func: func }); };

        // *** DIALOG (comp/dialog.js)

        test("Dialog: onClick that closes the dialog does not crash", async function () {
            const dialog = Dialog({ removeOnClose: 1, buttons: [{ key: "a", text: "A", type: "primary", onClick: function (d) { d.close(); } }] });
            dialog.getButton("a").elem.click();
            await wait(30);
            check("Dialog: onClick that closes the dialog does not crash", Dialog.stack.length == 0);
        });

        test("Dialog.confirm: Promise(false), then Cancel gives false", async function () {
            const promise = Dialog.confirm({ onConfirm: function () { return Promise.resolve(false); } });
            await wait(30);
            Dialog.getTop().getButton("confirm").elem.click();
            await wait(30);
            Dialog.getTop().getButton("cancel").elem.click();
            check("Dialog.confirm: Promise(false), then Cancel gives false", (await promise) === false);
        });

        test("Dialog: a held Enter in a field does not pass the ask", async function () {
            let deleted = 0;
            const dialog = Dialog({ fields: [{ key: "n", titleText: "N" }], buttons: [{ key: "del", text: "Delete", type: "primary", ask: "Sure?", onClick: function () { deleted = 1; } }] });
            const input = dialog.elem.querySelector("input");
            input.focus();
            key(input, "keydown", "Enter");
            key(input, "keydown", "Enter", { repeat: true });
            check("Dialog: a held Enter in a field does not pass the ask", deleted === 0);
            dialog.remove();
        });

        test("Dialog: the ask is forgotten when the dialog closes", async function () {
            let deleted = 0;
            const dialog = Dialog({ removeOnClose: 0, buttons: [{ key: "del", text: "Delete", type: "danger", ask: "Sure?", onClick: function () { deleted = 1; } }] });
            dialog.getButton("del").elem.click(); // asks
            dialog.close();
            dialog.open();
            dialog.getButton("del").elem.click(); // must ask again
            check("Dialog: the ask is forgotten when the dialog closes", deleted === 0);
            dialog.remove();
        });

        test("Dialog.prompt and Dialog.alert use the style they are given", async function () {
            const CARD_COLOR = "rgb(35, 35, 34)";
            const style = { card: { color: CARD_COLOR } };
            const promptPromise = Dialog.prompt({ titleText: "Name", style: style });
            await wait(30);
            const promptCard = Dialog.stack[Dialog.stack.length - 1].card;
            const promptOk = getComputedStyle(promptCard.elem).backgroundColor === CARD_COLOR;
            findByText("Cancel").click();
            await promptPromise;
            await wait(300);
            const alertPromise = Dialog.alert({ titleText: "Done", style: style });
            await wait(30);
            const alertCard = Dialog.stack[Dialog.stack.length - 1].card;
            const alertOk = getComputedStyle(alertCard.elem).backgroundColor === CARD_COLOR;
            findByText("OK").click();
            await alertPromise;
            await wait(300);
            check("Dialog.prompt and Dialog.alert use the style they are given", promptOk && alertOk, "prompt " + promptOk + ", alert " + alertOk);
        });

        // *** TOOLTIP (comp/tooltip.js)

        test("Tooltip: Escape closes the popover once, and its window events go with it", async function () {
            const target = Button({ text: "Open" });
            let closeCount = 0;
            const bubble = Tooltip.openPopover(target, function () { Label({ text: "A" }); }, {}, "bottom", "", { onClose: function () { closeCount++; } });
            await wait(30);
            window.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
            window.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
            const isClosed = bubble._isRemoved && Tooltip.openedPopover === null;
            check("Tooltip: Escape closes the popover once, and its window events go with it", isClosed && closeCount === 1, "closed: " + isClosed + ", onClose: " + closeCount);
            target.remove();
        });

        test("Tooltip: the color of look stays while the mouse moves", async function () {
            // WHY: a hint left by an earlier test would be the one moved here
            if (window.lblHint) window.lblHint.remove();
            window.lblHint = null;
            const target = Button({ text: "Hint" });
            const tip = Tooltip({ target: target, look: { color: "rgb(35, 35, 35)" }, content: function () { Label({ text: "A", textColor: "white" }); } });
            target.elem.dispatchEvent(new MouseEvent("mouseover", { bubbles: true, clientX: 10, clientY: 10 }));
            target.elem.dispatchEvent(new MouseEvent("mousemove", { bubbles: true, clientX: 12, clientY: 12 }));
            const color = window.lblHint ? window.lblHint.elem.style.backgroundColor : "";
            check("Tooltip: the color of look stays while the mouse moves", color == "rgb(35, 35, 35)", "color: " + color);
            tip.remove();
            target.remove();
        });

        // *** NOTICE (comp/notice.js)

        test("Notice over a Dialog: it is on top, Escape closes only the notice", async function () {
            const dialog = Dialog({ titleText: "D", removeOnClose: 0 });
            Notice.show({ messageText: "Saved", displayTime: 0 });
            await wait(30);
            const rect = Notice.current.elem.getBoundingClientRect();
            const isOnTop = Notice.current.elem.contains(document.elementFromPoint(rect.left + rect.width / 2, rect.top + rect.height / 2));
            key(document.activeElement || document.body, "keydown", "Escape");
            check("Notice over a Dialog: it is on top, Escape closes only the notice", isOnTop && !Notice.current && dialog.isOpen());
            dialog.remove();
        });

        // *** TOAST (comp/toast.js)

        test("Toast: a double click on the action runs it once", async function () {
            let count = 0;
            const toast = Toast.info("File deleted", { action: { text: "Undo", onClick: function () { count++; } } });
            await wait(30);
            toast.btnAction.elem.click();
            toast.btnAction.elem.click();
            await wait(400);
            check("Toast: a double click on the action runs it once", count === 1, "the action ran " + count + " times");
        });

        test("Toast: offsetTop moves the toasts down, the sides keep offset", async function () {
            const toast = Toast.info("Saved");
            await wait(30);
            Toast.setOptions({ offsetTop: 80 });
            const style = Toast.getContainer(Toast.options.position).elem.style;
            const isRight = style.top === "80px" && style.maxWidth === "calc(100% - " + (Toast.options.offset * 2) + "px)";
            Toast.setOptions({ offsetTop: null });
            check("Toast: offsetTop moves the toasts down, the sides keep offset", isRight, "top: " + style.top + ", maxWidth: " + style.maxWidth);
            toast.close();
        });

        // *** ACTION BUTTON (comp/action-button.js)

        test("ActionButton: a double click on an action calls onAction once", async function () {
            const calls = [];
            const button = ActionButton({ items: ["New file", "New folder"], onAction: function (k) { calls.push(k); } });
            button.openMenu();
            await wait(30);
            button.itemButtons[0].elem.click();
            button.itemButtons[0].elem.click();
            check("ActionButton: a double click on an action calls onAction once", calls.length === 1, "onAction: " + calls.join(", "));
            await wait(300);
            button.remove();
        });

        // *** SEARCH RESULTS (comp/search-results.js)

        test("SearchResults: the arrows choose a row and Escape keeps the list closed", async function () {
            const ITEMS = [{ text: "Dashboard" }, { text: "Orders" }, { text: "Reports" }];
            let selected = "";
            const input = document.createElement("input");
            page.elem.appendChild(input);
            input.style.cssText = "position: absolute; left: 10px; top: 10px; pointer-events: auto;";
            const results = SearchResults({ onSelect: function (self, item) { selected = item.text; } });
            results.attachTo(input);
            input.focus();
            // WHY setItems at every key: a SearchInput calls onSearch at every keyup, with the same text
            results.setItems(ITEMS, "a");
            key(input, "keydown", "ArrowDown");
            results.setItems(ITEMS, "a");
            key(input, "keydown", "ArrowDown");
            results.setItems(ITEMS, "a");
            key(input, "keydown", "Enter");
            check("SearchResults: the arrows choose a row (Enter opens the third one)", selected === "Reports", "opened: " + selected);
            results.setItems(ITEMS, "a");
            key(input, "keydown", "Escape");
            results.setItems(ITEMS, "a");
            check("SearchResults: Escape keeps the list closed for the same text", results.isOpened === 0);
            results.setItems(ITEMS, "ab");
            check("SearchResults: a new text opens it again", results.isOpened === 1);
            results.remove();
            input.remove();
        });

        // *** SORTABLE LIST (comp/sortable-list.js)

        test("SortableList: after a touch drag the next tap works", async function () {
            const clicks = [];
            const list = SortableList({ width: 300, height: 300, dragBy: "row", items: ["One", "Two", "Three"], onItemClick: function (self, item) { clicks.push(item); } });
            await wait(50);
            const label = findByText("One", list.elem);
            const rect = label.getBoundingClientRect();
            const x = rect.left + 5;
            const y = rect.top + rect.height / 2;
            pointer(label, "pointerdown", x, y, "touch");
            for (let i = 1; i <= 8; i++) {
                pointer(document, "pointermove", x, y + i * 10, "touch");
                await wait(16);
            }
            pointer(document, "pointerup", x, y + 80, "touch");
            await wait(400);
            findByText("Three", list.elem).click(); // the next real tap
            check("SortableList: after a touch drag the next tap works", clicks.length === 1, "clicks: " + clicks.length);
            list.remove();
        });

        // *** SELECT FILE (comp/select-file.js)

        test("SelectFile: a low zone hides what does not fit, first the icon, and no text is squeezed", async function () {
            const isShown = (object) => object.elem.offsetHeight > 0;
            const getShown = function (select) {
                return [select.icon, select.title, select.desc, select.hint].map((object) => (isShown(object) ? 1 : 0)).join("");
            };
            const params = { accept: "image/*" };
            const tall = SelectFile({ ...params, zoneHeight: 170 });
            const noIcon = SelectFile({ ...params, zoneHeight: 110 });
            const noHint = SelectFile({ ...params, zoneHeight: 70 });
            const onlyTitle = SelectFile({ ...params, zoneHeight: 40 });
            await wait(50);
            const results = [tall, noIcon, noHint, onlyTitle].map(getShown);
            const titleHeights = [tall, onlyTitle].map((select) => select.title.elem.offsetHeight);
            const titleRect = onlyTitle.title.elem.getBoundingClientRect();
            const zoneRect = onlyTitle.zone.elem.getBoundingClientRect();
            check("SelectFile: a low zone hides what does not fit, first the icon, and no text is squeezed",
                results.join() === "1111,0111,0110,0100" && titleHeights[0] === titleHeights[1]
                    && titleRect.top >= zoneRect.top && titleRect.bottom <= zoneRect.bottom,
                results.join() + " | " + titleHeights.join());
            [tall, noIcon, noHint, onlyTitle].forEach((select) => select.remove());
        });

        test("SelectFile: the same file again does not call onChange", async function () {
            let changes = 0;
            const select = SelectFile({ multiple: 1, onChange: function () { changes++; } });
            const drop = function (names) {
                const transfer = new DataTransfer();
                names.forEach(function (name) { transfer.items.add(new File(["x"], name, { type: "text/plain", lastModified: 1 })); });
                select.zone.elem.dispatchEvent(new DragEvent("drop", { bubbles: true, cancelable: true, dataTransfer: transfer }));
            };
            drop(["a.txt"]);
            drop(["a.txt"]);
            check("SelectFile: the same file again does not call onChange", changes === 1, "onChange: " + changes);
            select.remove();
        });

        // *** PROPERTY PANEL (comp/property-panel.js)

        test("PropertyPanel: leaving a number field without a change keeps the value", async function () {
            const changes = [];
            const panel = PropertyPanel({
                data: { sections: [{ key: "s", title: "S", items: [{ key: "x", type: "number", prefix: "X", value: 12.4 }] }] },
                onChange: function (change) { changes.push(change); },
            });
            await wait(30);
            const field = Array.from(panel.elem.querySelectorAll("input")).find(function (el) { return el.value === "12"; });
            field.focus();
            field.blur();
            key(field, "keydown", "Escape");
            check("PropertyPanel: leaving a number field without a change keeps the value", changes.length === 0 && panel.getValue("x") === 12.4, "changes: " + changes.length + ", value: " + panel.getValue("x"));
            panel.remove();
        });

        // A panel with one color field and an editable group (a static palette), its picker open.
        const openColorPanel = async function (changes, colors = ["#111111", "#222222", "#333333"]) {
            const panel = PropertyPanel({
                data: { sections: [{ key: "s", title: "S", items: [{ key: "fill", type: "color", label: "Fill", value: "#222222" }] }] },
                palettes: [{ key: "mine", name: "Mine", canAdd: 1, colors: colors }, { key: "other", name: "Other", canAdd: 1, colors: [] }],
                onChange: function (change) { changes.push(change); },
            });
            panel.open();
            await wait(30);
            panel.elem.querySelector("[aria-haspopup=dialog]").click();
            await wait(30);
            const picker = Array.from(document.querySelectorAll("[role=dialog]")).pop();
            const swatchOf = function (value) { return picker.querySelector("[aria-label='" + value + "']"); };
            return { panel: panel, picker: picker, swatchOf: swatchOf };
        };

        test("PropertyPanel: the ring of a hovered selected color stays inside the scrolling colors of the picker", async function () {
            const ui = await openColorPanel([]);
            const square = ui.swatchOf("#222222");
            const style = PropertyPanelDefaults.style.colorPicker;
            const grid = square.parentNode;
            const padding = parseFloat(getComputedStyle(grid).paddingLeft);
            const ringAndGrowth = 3 + style.swatchSize * 0.05; // the ring (3) and half of the 1.1 growth
            check("PropertyPanel: the ring of a hovered selected color stays inside the scrolling colors of the picker", padding >= ringAndGrowth, "padding: " + padding + ", needs: " + ringAndGrowth);
            ui.panel.remove();
        });

        test("PropertyPanel: Delete in the menu of a color removes it from its editable group", async function () {
            const changes = [];
            const ui = await openColorPanel(changes);
            ui.swatchOf("#111111").dispatchEvent(new MouseEvent("contextmenu", { bubbles: true, cancelable: true, clientX: 10, clientY: 10 }));
            await wait(10);
            const row = ui.picker.querySelector("[aria-label='Delete #111111 from Mine']");
            if (row) row.click();
            await wait(10);
            const removed = changes.find(function (change) { return change.kind === "removeColor"; });
            const isGone = !ui.swatchOf("#111111");
            check("PropertyPanel: Delete in the menu of a color removes it from its editable group", !!row && !!removed && removed.value === "#111111" && isGone, "menu row: " + !!row + ", change: " + !!removed + ", gone: " + isGone);
            ui.panel.remove();
        });

        // WHY the moves go to window: the dragged color moves in the grid, and the browser stops sending it the pointer
        test("PropertyPanel: Copy to in the menu of a color opens its groups at the side, a click copies", async function () {
            const changes = [];
            const ui = await openColorPanel(changes);
            ui.swatchOf("#111111").dispatchEvent(new MouseEvent("contextmenu", { bubbles: true, cancelable: true, clientX: 10, clientY: 10 }));
            await wait(10);
            const rowCopy = ui.picker.querySelector("[aria-label='Copy #111111 to a color group']");
            const hasListBefore = !!ui.picker.querySelector("[aria-label='Copy #111111 to Other']");
            if (rowCopy) rowCopy.dispatchEvent(new MouseEvent("mouseenter"));
            await wait(10);
            const rowOther = ui.picker.querySelector("[aria-label='Copy #111111 to Other']");
            const isAtTheSide = !!rowOther && rowOther.getBoundingClientRect().left >= rowCopy.getBoundingClientRect().right - 10;
            if (rowOther) rowOther.click();
            await wait(10);
            const added = changes.find(function (change) { return change.kind === "addColor"; });
            check("PropertyPanel: Copy to in the menu of a color opens its groups at the side, a click copies", !!rowCopy && !hasListBefore && isAtTheSide && !!added && added.key === "other" && added.value === "#111111", "Copy to: " + !!rowCopy + ", list before hover: " + hasListBefore + ", at the side: " + isAtTheSide + ", added: " + (added && added.key));
            ui.panel.remove();
        });

        test("PropertyPanel: a color dragged in its editable group sends the new order", async function () {
            const changes = [];
            const ui = await openColorPanel(changes);
            const square = ui.swatchOf("#333333");
            const first = ui.swatchOf("#111111").getBoundingClientRect();
            const start = square.getBoundingClientRect();
            const pointer = function (target, type, x, y) {
                target.dispatchEvent(new PointerEvent(type, { bubbles: true, cancelable: true, pointerId: 1, button: 0, clientX: x, clientY: y }));
            };
            pointer(square, "pointerdown", start.left + 5, start.top + 5);
            pointer(window, "pointermove", start.left - 20, start.top + 5);
            pointer(window, "pointermove", first.left + 2, first.top + 5);
            pointer(window, "pointerup", first.left + 2, first.top + 5);
            await wait(10);
            const order = changes.find(function (change) { return change.kind === "orderColors"; });
            const text = (order) ? order.value.join(" ") : "none";
            check("PropertyPanel: a color dragged in its editable group sends the new order", text === "#333333 #111111 #222222", "order: " + text);
            ui.panel.remove();
        });

        // The tick of the group on: its colors go under the field (the picker stays open)
        const showGroupUnderField = async function (ui) {
            const tick = ui.picker.querySelector("[aria-label^='Show the colors of the selected group']");
            if (tick.getAttribute("aria-checked") !== "true") tick.click();
            await wait(10);
        };

        test("PropertyPanel: the colors under a field are two rows, +N shows the others", async function () {
            const many = [];
            for (let i = 0; i < 40; i++) many.push("#" + (100000 + i * 1111));
            const ui = await openColorPanel([], many);
            await showGroupUnderField(ui);
            const shown = function () { return ui.panel.elem.querySelectorAll("[aria-label$='(Mine)']").length; };
            const before = shown();
            const more = ui.panel.elem.querySelector("[aria-label^='Show '][aria-label$=' more colors']");
            if (more) more.click();
            await wait(10);
            const after = shown();
            const rows = new Set(Array.from(ui.panel.elem.querySelectorAll("[aria-label$='(Mine)']")).slice(0, before).map(function (el) { return Math.round(el.getBoundingClientRect().top); }));
            check("PropertyPanel: the colors under a field are two rows, +N shows the others", !!more && before < 40 && rows.size <= 2 && after === 40, "before: " + before + " in " + rows.size + " rows, +N: " + !!more + ", after: " + after);
            ui.panel.remove();
        });

        test("PropertyPanel: Delete in the menu of a color under a field removes it from its group", async function () {
            const changes = [];
            const ui = await openColorPanel(changes);

        // *** SCALE ON A ZOOMED PAGE (basic.uiScale and the scale param of Tabs, SelectBox, SelectDate, Dialog, Toast, Tooltip)

        // The size of an element on the screen. Two sizes are the same within 1 px.
        const screenSize = function (elem) {
            const rect = elem.getBoundingClientRect();
            return { width: rect.width, height: rect.height };
        };
        const isSameScreenSize = function (a, b) {
            return Math.abs(a.width - b.width) <= 1 && Math.abs(a.height - b.height) <= 1;
        };
        const sizeText = function (size) {
            return size.width.toFixed(1) + " x " + size.height.toFixed(1);
        };

        // measure() on a page zoomed like page.fit() does it, with basic.uiScale = 1 / zoom. Both are put back after it.
        const measureOnZoomedPage = function (zoom, measure) {
            page.zoom = zoom;
            basic.uiScale = 1 / zoom;
            try {
                return measure();
            } finally {
                page.zoom = 1;
                basic.uiScale = 1;
            }
        };

                tabs.remove();
                return sizes;
            };
            const normal = measureTabs();
            const zoomed = measureOnZoomedPage(0.5, measureTabs);

            check("Tabs: on a zoomed page (zoom 0.5, basic.uiScale 2) the bar keeps its size on the screen", isSame,

            const isOver = pill.text === "Basket" && getComputedStyle(pill.elem).opacity === "1" && pillRect.bottom <= boxRect.top && centerGap < 2;
            await wait(bar.floatLabelTime + 300);
            const isHidden = getComputedStyle(pill.elem).opacity === "0";
            check("BottomBar: labelMode float shows the name over the selected item, then hides it", isFirstShown && isOver && isNotCut && isHidden, "first: " + isFirstShown + ", over: " + isOver + " (center gap " + centerGap + "), not cut: " + isNotCut + ", hidden: " + isHidden);
            bar.remove();
        });

        test("BottomBar: the badge param goes to every item; a badge shows after setBadge", async function () {
            const bar = BottomBar({ bottom: 0, items: BOTTOM_BAR_ITEMS, badge: { showZero: 1, dotForOne: 0 } });
            await wait(30);
            const statesBefore = bar.itemObjList.map(function (item) { return item.badge.state; }).join(",");
            const badge = bar.itemObjList[1].badge;
            bar.setBadge(1, 0);
            const zero = badge.state + ":" + badge.label.text;
            bar.setBadge(1, 1);
            const one = badge.state + ":" + badge.label.text;
            bar.setBadge(1, "");
            const removed = badge.state;
            check("BottomBar: the badge param goes to every item; a badge shows after setBadge", statesBefore === "hidden,hidden" && zero === "number:0" && one === "number:1" && removed === "hidden", [statesBefore, zero, one, removed].join(" / "));
            bar.remove();
        });

        test("BottomBar: an item is a button; Enter chooses it like a click", async function () {
            let clickedIndex = -1;
            const bar = BottomBar({ bottom: 0, items: BOTTOM_BAR_ITEMS, onItemClick: function (item, index) { clickedIndex = index; } });
            await wait(30);
            const button = bar.itemObjList[1].icon.elem;
            const isButton = button.getAttribute("role") === "button" && button.getAttribute("aria-label") === "Basket" && button.tabIndex === 0;
            key(button, "keydown", "Enter");
            check("BottomBar: an item is a button; Enter chooses it like a click", isButton && clickedIndex === 1 && bar.selectedIndex === 1, "button: " + isButton + ", onItemClick: " + clickedIndex);
            bar.remove();
        });

        test("Badge: showZero shows 0, dotForOne: 0 shows 1 as a number; the defaults are as before", async function () {
            const holder = Box(0, 0, 60, 60);
            const badge = createIn(holder, function () { return Badge({ value: 0, showZero: 1, dotForOne: 0 }); });
            const plain = createIn(holder, function () { return Badge({ value: 1 }); });
            const zero = badge.state + ":" + badge.label.text;
            badge.setValue(1);
            const one = badge.state + ":" + badge.label.text;
            badge.setValue("");
            const empty = badge.state;
            const plainOne = plain.state;
            plain.setValue(0);
            const plainZero = plain.state;
            const isRight = zero === "number:0" && one === "number:1" && empty === "hidden" && plainOne === "dot" && plainZero === "hidden";
            check("Badge: showZero shows 0, dotForOne: 0 shows 1 as a number; the defaults are as before", isRight, [zero, one, empty, plainOne, plainZero].join(" / "));
            holder.remove();
        });

        // *** APP BAR, PAGE HEADER, SETTINGS ROW (comp/app-bar.js, comp/page-header.js, comp/settings-row.js)

        test("AppBar: the title stands at the left (after the back button) or in the middle of the bar", async function () {
            const BAR_WIDTH = 600;
            const holder = Box(0, 0, BAR_WIDTH, 200, { color: "transparent" });
            const bar = createIn(holder, function () { return AppBar({ titleText: "Settings", titleAlign: "left" }); });
            const placeOfTitle = function () {
                const barRect = bar.elem.getBoundingClientRect();
                const rect = bar.lblTitle.elem.getBoundingClientRect();
                return { left: Math.round(rect.left - barRect.left), right: Math.round(barRect.right - rect.right) };
            };
            const atLeft = placeOfTitle();
            bar.setBackVisible(1);
            const afterBack = placeOfTitle();
            bar.setTitleAlign("center");
            const inMiddle = placeOfTitle();
            const isLeft = atLeft.left === 20 && afterBack.left === 70;
            const isMiddle = inMiddle.left === inMiddle.right && bar.lblTitle.elem.style.textAlign === "center";
            check("AppBar: the title stands at the left (after the back button) or in the middle of the bar", isLeft && isMiddle, JSON.stringify({ atLeft: atLeft, afterBack: afterBack, inMiddle: inMiddle }));
            holder.remove();
        });

        test("PageHeader: the back link calls onBack (a click, Enter, Space; a held key once)", async function () {
            let backs = 0;
            const header = PageHeader({ titleText: "Security", backText: "Settings", onBack: function () { backs++; } });
            header.btnBack.elem.click();
            key(header.btnBack.elem, "keydown", "Enter");
            key(header.btnBack.elem, "keydown", " ");
            key(header.btnBack.elem, "keydown", " ", { repeat: true });
            check("PageHeader: the back link calls onBack (a click, Enter, Space; a held key once)", backs === 3, "onBack: " + backs);
            header.remove();
        });

        test("SettingsRow: setDescText moves the title up from the middle and back", async function () {
            const TEXT_SHIFT = 14; // style.layout.textShift
            const SLIDE_WAIT = 450; // ms: the slide is 0.3 s
            const row = SettingsRow({ width: 600, titleText: "Video Quality" });
            await wait(60); // WHY: setMotion() turns the slide on a moment after the creation (no motion at the first view)
            const middleOfTitle = function () {
                const rowRect = row.elem.getBoundingClientRect();
                const rect = row.lblTitle.elem.getBoundingClientRect();
                return Math.round(rect.top + rect.height / 2 - rowRect.top);
            };
            const inMiddle = middleOfTitle();
            row.setDescText("Remaining disk space: 2.3GB");
            await wait(SLIDE_WAIT);
            const withText = middleOfTitle();
            const textOpacity = getComputedStyle(row.lblDesc.elem).opacity;
            row.setDescText("");
            await wait(SLIDE_WAIT);
            const back = middleOfTitle();
            const isMoved = Math.abs(inMiddle - withText - TEXT_SHIFT) <= 1 && Math.abs(back - inMiddle) <= 1 && textOpacity === "1";
            check("SettingsRow: setDescText moves the title up from the middle and back", isMoved, "middle: " + inMiddle + ", with a text: " + withText + ", again: " + back + ", text opacity: " + textOpacity);
            row.remove();
        });

        test("SettingsRow: a click on a control in the row is not a click of the row", async function () {
            let clicks = 0;
            const row = SettingsRow({
                titleText: "Theme",
                onClick: function () { clicks++; },
                control: function () { return Box({ width: 40, height: 40, clickable: 1 }); },
            });
            row.controlObject.elem.click();
            const afterControl = clicks;
            row.elem.click();
            check("SettingsRow: a click on a control in the row is not a click of the row", afterControl === 0 && clicks === 1, "after the control: " + afterControl + ", after the row: " + clicks);
            row.remove();
        });

        // *** TAP EFFECT (comp/tap-effect.js)

        test("TapEffect.show: one circle in the middle of the place, removed after its time", async function () {
            const X = 200;
            const Y = 150;
            const FADE_START_TIME = 50; // ms: the circle fades 50 ms after the tap
            const removeTime = FADE_START_TIME + TapEffect.options.duration * 1000;
            const circle = TapEffect.show(X, Y);
            if (TapEffect.isReducedMotion()) {
                check("TapEffect.show: no circle with reduced motion", circle === null);
                return;
            }
            const second = TapEffect.show(X + 40, Y); // one at a time
            const rect = circle.elem.getBoundingClientRect();
            const isInMiddle = Math.abs(rect.left + rect.width / 2 - X) < 1 && Math.abs(rect.top + rect.height / 2 - Y) < 1;
            const circleCount = Array.from(page.elem.children).filter(function (el) { return el.style.zIndex === circle.elem.style.zIndex; }).length;
            await wait(removeTime + 60);
            const isGone = !circle.elem.isConnected && TapEffect.current === null;
            check("TapEffect.show: one circle in the middle of the place, removed after its time", second === null && circleCount === 1 && isInMiddle && isGone, "second: " + second + ", circles: " + circleCount + ", in the middle: " + isInMiddle + ", gone: " + isGone);
        });

        test("TapEffect.start: a real tap makes a circle at its place, a code click and a tap after stop() do not", async function () {
            const X = 120;
            const Y = 90;
            const click = function (detail) {
                document.body.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, clientX: X, clientY: Y, detail: detail }));
            };
            const circleCount = function () {
                return Array.from(page.elem.children).filter(function (el) { return el.style.zIndex === String(TapEffectDefaults.zIndex); }).length;
            };
            TapEffect.start();
            click(0); // the keyboard or the code
            const afterCodeClick = circleCount();
            click(1);
            const circle = TapEffect.current;
            const isAtTap = !!circle && Math.abs(circle.left + circle.width / 2 - X) < 1 && Math.abs(circle.top + circle.height / 2 - Y) < 1;
            TapEffect.stop();
            await wait(400);
            click(1);
            const afterStop = circleCount();
            check("TapEffect.start: a real tap makes a circle at its place, a code click and a tap after stop() do not", TapEffect.isReducedMotion() || (afterCodeClick === 0 && isAtTap && afterStop === 0 && TapEffect.isOn === 0), "code click: " + afterCodeClick + ", at the tap: " + isAtTap + ", after stop: " + afterStop);
        });

        // *** PERIOD BAR (comp/period-bar.js)

        test("PeriodBar: selectPrevious shows the month before and calls onChange", async function () {
            let changes = 0;
            const bar = PeriodBar({ monthCount: 12, onChange: function () { changes++; } });
            const today = new Date();
            const lastMonth = new Date(today.getFullYear(), today.getMonth() - 1, 1); // WHY: day 1, so the 31st does not jump over a short month
            const isMoved = bar.selectPrevious();
            const date = bar.getSelectedDate();
            const isLastMonth = date.year === lastMonth.getFullYear() && date.month === lastMonth.getMonth() + 1;
            bar.setValue(11, 1); // silent: no onChange
            const isStopped = bar.selectNext() === 0; // this month is the last one
            check("PeriodBar: selectPrevious shows the month before and calls onChange", isMoved === 1 && isLastMonth && changes === 1 && isStopped, "moved: " + isMoved + ", date: " + date.year + "/" + date.month + ", onChange: " + changes + ", stopped at the end: " + isStopped);
            bar.remove();
        });

        // *** ACTION TAB BAR (comp/action-tab-bar.js)

        test("ActionTabBar: setValue moves the line under the tab, the + calls onAction", async function () {
            let changes = 0;
            let actions = 0;
            const bar = ActionTabBar({
                items: [{ key: "a", text: "A" }, { key: "b", text: "B" }, { key: "c", text: "C" }],
                onChange: function () { changes++; },
                onAction: function () { actions++; },
            });
            const lineLeft = function () { return new DOMMatrix(getComputedStyle(bar.indicator.elem).transform).m41; };
            const startLeft = lineLeft();
            bar.setValue("c");
            bar.indicator.elem.getAnimations().forEach(function (motion) { motion.finish(); }); // WHY: the end of the slide, without waiting
            const moved = lineLeft() - startLeft;
            const expected = 2 * (bar.style.item.width + bar.style.item.gap);
            const isSelected = bar.tabList.elem.children[2].getAttribute("aria-selected") === "true";
            bar.btnAction.elem.click();
            check("ActionTabBar: setValue moves the line under the tab, the + calls onAction", bar.value === "c" && changes === 1 && Math.abs(moved - expected) < 1 && isSelected && actions === 1, "value: " + bar.value + ", onChange: " + changes + ", moved: " + moved + " (" + expected + "), selected: " + isSelected + ", onAction: " + actions);
            bar.remove();
        });

        // *** RUN

        const runTests = async function () {

            for (const item of tests) {
                try {
                    await item.func();
                } catch (error) {
                    check(item.name, false, "error: " + error.message);
                }
                // WHY: a test that failed half way must not leave its windows over the next one
                Dialog.stack.slice().forEach(function (dialog) { dialog.remove(); });
                if (Notice.current) Notice.current.remove();
                if (TapEffect.isOn) TapEffect.stop();
            }

            check("no uncaught errors", uncaught.length === 0, uncaught.join(" | "));

        };

        const showResults = function () {

            startBox(0, 0, "100%", "100%", { color: "white", scrollY: 1 });
                VGroup({ width: "100%", height: "auto", align: "left top", gap: 6, padding: 20 });

                    const failed = results.filter(function (r) { return !r.ok; });
                    Label({ plainText: "behavior test: " + (results.length - failed.length) + "/" + results.length + " passed", fontSize: 20, bold: 1 });

                    results.forEach(function (r) {
                        Label({ plainText: ((r.ok) ? "✓ " : "✗ ") + r.name + ((r.info && !r.ok) ? "  (" + r.info + ")" : ""), fontSize: 14, textColor: (r.ok) ? "seagreen" : "crimson" });
                    });

                endGroup();
            endBox();

        };

        const start = async function () {

            page.color = "white";
            await wait(100);
            await runTests();

            // WHY: the tests leave toasts, menus and layers on page; the results are drawn over a clean page
            Array.from(page.elem.children).forEach(function (el) { el.remove(); });
            showResults();

            const failed = results.filter(function (r) { return !r.ok; });
            const summary = "behavior test: " + (results.length - failed.length) + "/" + results.length + " passed" + ((failed.length) ? " - " + failed.length + " FAILED" : " - ALL PASS");
            document.title = summary;
            console.log(summary);
            failed.forEach(function (r) { console.error("FAIL: " + r.name + " " + r.info); });

        };

        </script>

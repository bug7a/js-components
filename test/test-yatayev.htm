<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<style>
 .house-shape {
  position: relative;
  width: 300px;
  height: 100px;
  background: black; /* Bu aslında border rengimiz olacak */
  
  /* Ev/Ok şekli: Sol uç sivri, sağ taraf düz */
  /* Koordinatlar: (x y) */
  clip-path: polygon(30% 0%, 100% 0%, 100% 100%, 30% 100%, 0% 50%);
  
  display: flex;
  align-items: center;
  justify-content: center;
}

.house-shape::after {
  content: "";
  position: absolute;
  /* Border kalınlığı kadar içeriden başlatıyoruz (Örn: 2px) */
  top: 2px;
  bottom: 2px;
  left: 3px; 
  right: 0; /* Sağ tarafın border ile kapanmaması için 0 */
  
  /* İç dolgu: Mavi'den şeffafa */
  background: linear-gradient(to right, #0000ff 0%, #0000ff 20%, transparent 100%);
  
  /* İçerideki şekli dışarıyla aynı formda kesiyoruz */
  clip-path: polygon(30% 0%, 100% 0%, 100% 100%, 30% 100%, 0% 50%);
  z-index: 1;
}

.content {
  position: relative;
  z-index: 2;
  color: white;
  margin-left: 40px; /* Üçgen kısmından uzaklaştırmak için */
  font-family: sans-serif;
}
</style>
</head>
<body>

<div class="house-shape">
  <div class="content">İçerik Buraya</div>
</div>

</body>
</html>

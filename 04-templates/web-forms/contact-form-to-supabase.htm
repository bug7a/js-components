        <script type="module">

        // This example will post data to your SUPABASE table. (https://supabase.com/)
        // or you can write your custom service on your server.
        // To get the form as an e-mail instead: upload service/send-form-mail.php to your server, write its
        // address to SERVICE_URL and call sendFormToMailService(json) in onSendClick. (See service/readme.md)

        // *** CONSTANTS:
        const SERVICE_URL = ""; // Ex: "https://your-site.com/service/send-form-mail.php"
        const FORM_NAME = "contact";            // Which form is this? (Written by the mail service.)
        const FORM_MAIL_TITLE = "Contact Form"; // Title on top of the mail.
        const SUPABASE_PROJECT_URL = "https://xhzzgxhjyoqcsftamtyz.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhoenpneGhqeW9xY3NmdGFtdHl6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDUzMTg2MDAsImV4cCI6MjA2MDg5NDYwMH0.XptujcYMNgl9XIzIQ2_CUig9JzkYOCKONfYAmMPd_wc";
        const FORM_TITLE = "Get in Touch";
        const FORM_DESCRIPTION = "Feel free to share any questions, suggestions, or feedback with us. Fill out the form and we’ll get back to you as soon as possible.";

        // *** VARIABLES:
        let background, form, waiting;
        let firstNameInput, lastNameInput, emailInput, phoneInput, subjectInput, messageTextarea;

        // Load supabase client on load:
        import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'
        const supabase = createClient(SUPABASE_PROJECT_URL, SUPABASE_ANON_KEY);

        // First running function.
        window.onload = function() {

            page.color = "white";

            // BOX: Background 
            //background = Box(0, 0, "100%", "100%", { round: 4, border: 0, });
            //that.elem.style.background = "linear-gradient(to bottom, white, lightgray)";

            // FORM:
            form = Form({
                minWidth: 700,
                maxWidth: 700,
                buttonColor:  "#65A293",
                buttonText: "SEND",
                showDetailWarning: 1,
                missingEntryText: "{{count}} missing entry",
                missingEntriesText: "{{count}} missing entries",
                warningText: "<b>{{name}}</b> can't be empty",
                errorText: "<b>{{name}}</b> is not valid",
                minimalButton: 0,
                doubleInputAlwaysHorizontal: 0,
                onSendClick: function(json) {

                    sendFormToSupabase();
                    // NOTE: To create a table on supabase (use: contact-form-table.sql)
                    //sendFormToMailService(json); // Sends the form as an e-mail (service/send-form-mail.php)

                },
                onChange: function(self, input) {
                    console.log(input.titleText);
                },
            });

            // ICON: Logo
            /*
            Icon({
                width: 80,
                height: 80,
            });
            that.load("assets/logo.png");
            form.addTitle(that);
            */

            // LABEL: Title
            Label({
                text: FORM_TITLE,
                textColor: "#373836",
                fontSize: 26,
            });
            that.elem.style.fontFamily = "opensans-bold";
            form.addTitle(that);

            // LABEL: Descriptiona
            if (FORM_DESCRIPTION != "") {
                Label({
                    text: FORM_DESCRIPTION,
                    fontSize: 16,
                    textColor: "#999999",
                });
                that.elem.style.fontStyle = "italic";
                form.addTitle(that);
            }

            // Title alignment:
            //form.titleGroup.align = "center top";

             // Common input params:
            const inputStyle = {
                width: "100%",
                /*
                backgroundColor: "white",
                focusBackgroundColor: "#F3E7C2", // "#F1E2C4", "#F4FAFF",
                lineColor: "transparent",
                focusLineColor: "#A5513A", // "#F1E2C4", "#588ABE",
                */
            };

            // INPUT: First Name
            firstNameInput = TextField({
                key: "1",
                ...inputStyle,
                required: 1, // 1
                titleText: "FIRST NAME",
                placeholder: "Jack",
                leftPadding: 20,
            });
            styleInput(that);

            // INPUT: Last Name
            lastNameInput = TextField({
                key: "2",
                ...inputStyle,
                required: 0,
                titleText: "LAST NAME",
                placeholder: "Brown",
                leftPadding: 20,
            });
            styleInput(that);
            form.addDoubleInput(firstNameInput, lastNameInput);

            // INPUT: Email
            emailInput = EmailField({
                key: "3",
                ...inputStyle,
                required: 1, // 1
                titleText: "YOUR EMAIL",
                placeholder: "example@site.com",
                warningText: "Invalid email format",
                warningColor: "#E5885E", // "#F1BF3C"
                maxLength: 35,
            });
            styleInput(that);
            form.addInput(emailInput);
            //box.inputList.push(that);

            // INPUT: Phone        
            phoneInput = PhoneField({
                key: "4",
                ...inputStyle,
                required: 0,
                titleText: "PHONE NUMBER",
                placeholder: "(auto)",
                warningText: "Invalid phone number format",
                warningColor: "#E5885E", // "#F1BF3C"
                countryCode: "+90",
                phoneMask: " (___) ___-____",
                unitText: "TR",
                //animatedWarningBall: 0,
            });
            styleInput(that);
            form.addInput(phoneInput);

            // INPUT: Subject
            subjectInput = TextField({
                key: "5",
                ...inputStyle,
                titleText: "SUBJECT",
                placeholder: "What's your message about?",
                descriptionText: "",
                required: 0,
            });
            styleInput(that);
            form.addInput(subjectInput);

            // INPUT: Textarea
            messageTextarea = TextAreaField({
                key: "6",
                ...inputStyle,
                required: 1, // 1
                titleText: "MESSAGE",
                placeholder: "How can we help you?",
                minCharCount: 80, // 80, 0
                showCount: 1, // 1, 0
                lengthText: "length: ",
                warningText: "The entered text must be longer than 80",
                warningColor: "#E5885E", // "#F1BF3C"
                maxLength: 255,
                height: 170, // 170 (4line)
                rightPadding: 5,
                unitStyle: {
                    padding: [12, 4],
                    color: "#373836EE",
                    textColor: "white",
                },
            });
            styleInput(that);
            form.addInput(messageTextarea);

            // WAITING: Create object 1 time. A cover on the page while the form is sent: the moving clock.
            //          (LoadingScreen: open() / close())
            waiting = createIn(page, function() {
                return LoadingScreen({
                    opened: 0,
                    minDuration: 0,
                    fadeDuration: 0.2,
                    style: {
                        box: { color: "rgba(0, 0, 0, 0.85)" },
                    },
                });
            });

        };

        const sendFormToSupabase = async function() {

            waiting.open();

            // Load supabase client on send:
            //const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2');
            //const supabase = createClient(SUPABASE_PROJECT_URL, SUPABASE_ANON_KEY);

            const { data, error } = await supabase
            .from('contactTable')
            .insert([
                { 
                    first_name: firstNameInput.getValue(), 
                    last_name: lastNameInput.getValue(), 
                    email: emailInput.getValue(), 
                    phone: phoneInput.getValue(), 
                    subject: subjectInput.getValue(), 
                    message: messageTextarea.getValue() 
                },
            ]);

            waiting.close();

            if (error) {

                form.showMessage({
                    iconColor: "indianred",
                    iconFile: "assets/error.png",
                    messageText: "Data could not be sent.",
                    buttonText: "CLOSE",
                    backgroundColor: "rgba(255,255,255,0.85)",
                    onClose: function() {},
                });
                //console.error("Error: ", error.message);

            } else {

                form.showMessage({
                    iconColor: "#3C8553",
                    iconFile: "assets/success.png",
                    messageText: "Data sent successfully.",
                    buttonText: "OKAY",
                    backgroundColor: "rgba(255,255,255,0.85)",
                    onClose: function() {

                        // Clean the form.
                        firstNameInput.setValue(""); 
                        lastNameInput.setValue(""); 
                        emailInput.setValue(""); 
                        phoneInput.setValue("");
                        subjectInput.setValue("");
                        messageTextarea.setValue("");

                        form.refresh();

                    },
                });

            }

        };

        // Sends the form as an e-mail with service/send-form-mail.php. (json: the JSON of the Form)
        const sendFormToMailService = async function(json) {

            waiting.open();

            let isSent = false;

            try {
                const response = await fetch(SERVICE_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ formName: FORM_NAME, formTitle: FORM_MAIL_TITLE, fields: json }),
                });
                isSent = response.ok;
            } catch (error) {
                console.error(error);
                isSent = false;
            }

            waiting.close();

            if (isSent) {

                form.showMessage({
                    iconColor: "#3C8553",
                    iconFile: "assets/success.png",
                    messageText: "Data sent successfully.",
                    buttonText: "OKAY",
                    backgroundColor: "rgba(255,255,255,0.85)",
                    onClose: function() {

                        // Clean the form.
                        firstNameInput.setValue("");
                        lastNameInput.setValue("");
                        emailInput.setValue("");
                        phoneInput.setValue("");
                        subjectInput.setValue("");
                        messageTextarea.setValue("");

                        form.refresh();

                    },
                });

            } else {

                form.showMessage({
                    iconColor: "indianred",
                    iconFile: "assets/error.png",
                    messageText: "Data could not be sent.",
                    buttonText: "CLOSE",
                    backgroundColor: "rgba(255,255,255,0.85)",
                    onClose: function() {},
                });

            }

        };

        // Style
        const styleInput = function(obj) {
            /*
            //obj.background.setMotion("background-color 0.2s");
            obj.background.round = 4;
            obj.background.border = 1;
            obj.background.borderColor = "rgba(0,0,0,0.2)";
            if (obj.type != "textarea") {
                // Onlt for textarea
            } else {
                //obj.inputGroup.gap = 4;
                //obj.input.color = "whitesmoke";
                //obj.input.border = 1;
                //obj.input.borderColor = "lightgray";
                //obj.input.inputElement.style.padding = "0px 6px";
                //obj.input.inputElement.style.marginLeft = "-6px";
            }
            */
        };

        </script>

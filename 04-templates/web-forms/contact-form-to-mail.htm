        <script type="module">

        // This example will post form data (JSON) to your custom service URL.
        // Any 2xx response is accepted as success.
        // To get the form as an e-mail: upload service/send-form-mail.php to your server and write its
        // address to SERVICE_URL. Nothing else is needed. (See service/readme.md)

        // *** CONSTANTS:
        const SERVICE_URL = "https://your-site.com/service/send-form-mail.php"; // Your service URL
        
        const FORM_NAME = "contact";            // Which form is this? (Written by the mail service.)
        const FORM_MAIL_TITLE = "Contact Form"; // Title on top of the mail.
        const SERVICE_TIMEOUT = 15000; // ms
        const FORM_TITLE = "Get in Touch";
        const FORM_DESCRIPTION = "Feel free to share any questions, suggestions, or feedback with us. Fill out the form and we’ll get back to you as soon as possible.";

        // *** VARIABLES:
        let background, form, waiting;
        let firstNameInput, lastNameInput, emailInput, phoneInput, subjectInput, messageTextarea;

        // First running function.
        window.onload = function() {

            page.color = "white";

            // BOX: Background 
            //background = Box(0, 0, "100%", "100%", { round: 4, border: 0, });
            //that.elem.style.background = "linear-gradient(to bottom, white, lightgray)";

            // FORM:
            form = Form({
                minWidth: 700,
                maxWidth: 700,
                buttonColor:  "#65A293",
                buttonText: "SEND",
                showDetailWarning: 1,
                missingEntryText: "{{count}} missing entry",
                missingEntriesText: "{{count}} missing entries",
                warningText: "<b>{{name}}</b> can't be empty",
                errorText: "<b>{{name}}</b> is not valid",
                minimalButton: 0,
                doubleInputAlwaysHorizontal: 0,
                onSendClick: function(self, json) {

                    sendFormToService();

                },
                onChange: function(self, input) {
                    console.log(input.titleText);
                },
            });

            // ICON: Logo
            /*
            Icon({
                width: 80,
                height: 80,
            });
            that.load("assets/logo.png");
            form.addTitle(that);
            */

            // LABEL: Title
            Label({
                text: FORM_TITLE,
                textColor: "#373836",
                fontSize: 26,
            });
            that.elem.style.fontFamily = "opensans-bold";
            form.addTitle(that);

            // LABEL: Descriptiona
            if (FORM_DESCRIPTION != "") {
                Label({
                    text: FORM_DESCRIPTION,
                    fontSize: 16,
                    textColor: "#999999",
                });
                //that.elem.style.fontStyle = "italic";
                form.addTitle(that);
            }

            // Title alignment:
            //form.titleGroup.align = "center top";

             // Common input params:
            const inputStyle = {
                width: "100%",
                /*
                backgroundColor: "white",
                focusBackgroundColor: "#F3E7C2", // "#F1E2C4", "#F4FAFF",
                lineColor: "transparent",
                focusLineColor: "#A5513A", // "#F1E2C4", "#588ABE",
                */
                backgroundColor: "#F6F6F6",
                focusBackgroundColor: "#F6F6F6",
                lineColor: Black(0),
                focusLineColor: Black(0), // "#F1E2C4", "#588ABE",
                backBorderColor: Black(0),
                focusBackBorderColor: Black(0.4),
                backBorderTopRound: 8,
                backBorderBottomRound: 8,
                warningBallType: "icon", // "color", "icon"
            };

            // INPUT: First Name
            firstNameInput = TextField({
                key: "1",
                ...inputStyle,
                required: 1, // 1
                titleText: "FIRST NAME",
                placeholder: "Jack",
                leftPadding: 20,
            });
            styleInput(that);

            // INPUT: Last Name
            lastNameInput = TextField({
                key: "2",
                ...inputStyle,
                required: 0,
                titleText: "LAST NAME",
                placeholder: "Brown",
                leftPadding: 20,
            });
            styleInput(that);
            form.addDoubleInput(firstNameInput, lastNameInput);

            // INPUT: Email
            emailInput = EmailField({
                key: "3",
                ...inputStyle,
                required: 1, // 1
                titleText: "YOUR EMAIL",
                placeholder: "example@site.com",
                warningText: "Invalid email format",
                warningColor: "#E5885E", // "#F1BF3C"
                maxLength: 35,
            });
            styleInput(that);
            form.addInput(emailInput);
            //box.inputList.push(that);

            // INPUT: Phone        
            phoneInput = PhoneField({
                key: "4",
                ...inputStyle,
                required: 0,
                titleText: "PHONE NUMBER",
                placeholder: "(auto)",
                warningText: "Invalid phone number format",
                warningColor: "#E5885E", // "#F1BF3C"
                countryCode: "+90",
                phoneMask: " (___) ___-____",
                unitText: "TR",
                //animatedWarningBall: 0,
            });
            styleInput(that);
            form.addInput(phoneInput);

            // INPUT: Subject
            subjectInput = TextField({
                key: "5",
                ...inputStyle,
                titleText: "SUBJECT",
                placeholder: "What's your message about?",
                descriptionText: "",
                required: 0,
            });
            styleInput(that);
            form.addInput(subjectInput);

            // INPUT: Textarea
            messageTextarea = TextAreaField({
                key: "6",
                ...inputStyle,
                required: 1, // 1
                titleText: "MESSAGE",
                placeholder: "How can we help you?",
                minCharCount: 80, // 80, 0
                showCount: 1, // 1, 0
                lengthText: "length: ",
                warningText: "The entered text must be longer than 80",
                warningColor: "#E5885E", // "#F1BF3C"
                maxLength: 255,
                height: 170, // 170 (4line)
                rightPadding: 5,
                unitStyle: {
                    padding: [12, 4],
                    color: "#373836EE",
                    textColor: "white",
                },
            });
            styleInput(that);
            form.addInput(messageTextarea);

            // WAITING: Create object 1 time. A cover on the page while the form is sent: the moving clock.
            //          (LoadingScreen: open() / close())
            waiting = createIn(page, function() {
                return LoadingScreen({
                    opened: 0,
                    minDuration: 0,
                    fadeDuration: 0.2,
                    style: {
                        box: { color: "rgba(0, 0, 0, 0.85)" },
                    },
                });
            });

        };

        const sendFormToService = async function() {

            waiting.open();

            // WHY: The mail service writes the titles to the mail, so the fields are sent with their titles.
            const formData = {
                formName: FORM_NAME,
                formTitle: FORM_MAIL_TITLE,
                fields: [
                    { key: "first_name", type: "text", titleText: "FIRST NAME", value: firstNameInput.getValue() },
                    { key: "last_name", type: "text", titleText: "LAST NAME", value: lastNameInput.getValue() },
                    { key: "email", type: "email", titleText: "E-MAIL", value: emailInput.getValue() },
                    { key: "phone", type: "text", titleText: "PHONE", value: phoneInput.getValue() },
                    { key: "subject", type: "text", titleText: "SUBJECT", value: subjectInput.getValue() },
                    { key: "message", type: "textarea", titleText: "MESSAGE", value: messageTextarea.getValue() },
                ],
            };

            // Cancel the request if the service does not respond in time
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), SERVICE_TIMEOUT);

            let error = null;

            try {
                const response = await fetch(SERVICE_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(formData),
                    signal: controller.signal,
                });
                if (!response.ok) {
                    error = new Error("HTTP error: " + response.status);
                }
            } catch (e) {
                error = e; // Network error, CORS error or timeout
            }

            clearTimeout(timeoutId);
            waiting.close();

            if (error) {
                //console.error("Error: ", error.message);

                form.showMessage({
                    iconColor: "indianred",
                    iconFile: "assets/error.png",
                    messageText: "Data could not be sent.",
                    buttonText: "CLOSE",
                    backgroundColor: "rgba(255,255,255,0.85)",
                    onClose: function() {},
                });

            } else {

                form.showMessage({
                    iconColor: "#3C8553",
                    iconFile: "assets/success.png",
                    messageText: "Data sent successfully.",
                    buttonText: "OKAY",
                    backgroundColor: "rgba(255,255,255,0.85)",
                    onClose: function() {

                        // Clean the form.
                        firstNameInput.setValue(""); 
                        lastNameInput.setValue(""); 
                        emailInput.setValue(""); 
                        phoneInput.setValue("");
                        subjectInput.setValue("");
                        messageTextarea.setValue("");

                        form.refresh();

                    },
                });

            }

        };

        // Style
        const styleInput = function(obj) {
            /*
            //obj.background.setMotion("background-color 0.2s");
            obj.background.round = 4;
            obj.background.border = 1;
            obj.background.borderColor = "rgba(0,0,0,0.2)";
            if (obj.type != "textarea") {
                // Onlt for textarea
            } else {
                //obj.inputGroup.gap = 4;
                //obj.input.color = "whitesmoke";
                //obj.input.border = 1;
                //obj.input.borderColor = "lightgray";
                //obj.input.inputElement.style.padding = "0px 6px";
                //obj.input.inputElement.style.marginLeft = "-6px";
            }
            */
        };

        </script>

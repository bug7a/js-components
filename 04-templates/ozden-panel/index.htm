        <script>

        let loginPage = null;
        let userData = null;

        // PAGE FIT: İçerik tasarım genişliği.
        // Ekran bu değerden genişse panel normal boyutta görünür (zoom 1).
        // Daha dar ekranlarda, yerleşim bozulmasın diye panelin tamamı küçülür (zoom out).
        const PAGE_FIT_WIDTH = 650;
        const FINGER_HEIGHT = 44; // px on the screen: a row of the left menu that a finger can hit

        // NOTE: page.fit(650) -> ekran >= 650px ise zoom 1, değilse zoom = ekranGenisligi / 650.
        const fitPageWidth = function() {
            page.fit(PAGE_FIT_WIDTH);
        };

        window.onload = function() {

            Theme.applyToPage(); // Page background (Settings > Appearance > Theme)

            // Önce sayfayı sığdır, sonra arayüzü kur.
            // WHY: Nesneler, doğru page.width değeri ile oluşturulsun.
            fitPageWidth();
            page.onResize(fitPageWidth);
            // WHY: Bu onResize, bileşenlerinkinden önce eklendi. Böylece ekran boyutu değişince
            //      önce zoom ayarlanır, bileşenler de güncel page.width değerine göre yerleşir.

            checkIfLoggedIn({
                onSuccess: initAdminPanel, // Show Panel Home Page
                onFail: initLoginView,
            });

        };

        const fillTestData = function() {

            // TEST DATA: Fill the user data
            loginPage.loginEmail.setInputValue("bugra.ozden@gmail.com");
            loginPage.loginPassword.setInputValue("123456");
            // Call manuel to check form with out edit
            loginPage.loginEmail.onEdit();

        };

        const initLoginView = function() {
                
            // Show Login Page
            const loginParams = {
                panelWidth: 420,
                primaryColor: "#2C5A38",
                panelName: "MY PANEL v25.08.11",
                onLoginClick: onLoginClick,
                onSignupClick: onSignupClick,
                showPasswordIconFile: "../../comp/password-input-b/show-btn.png",
                hidePasswordIconFile: "../../comp/password-input-b/hide-btn.png",
                signupPasswordParams: {
                    minChar: 8,
                    minCharWarningText: "Password must be at least 8 characters",
                    mustUseNumber: 1,
                    mustUseLetter: 1,
                    mustUseUppercase: 0,
                    mustUseLowercase: 0,
                    mustUseSpecialChar: 0,
                }
            };

            // WHY: The login page is dark by itself. The light theme uses the light style of the
            //      component (comp/login-page-v2.js). mergeIntoIfMissing fills only what is not set above.
            if (!T.isDark) mergeIntoIfMissing(loginParams, LoginPageLightStyle);

            loginPage = LoginPage(loginParams);

            // WHY: The panel name of the login page is written in white inside the component.
            if (!T.isDark && loginPage.title) loginPage.title.textColor = Black(0.35);

            // Add custom login buttons: their logos are drawn by LoginPage, the apple in the text color of its button
            // (dark on the light theme, light on the dark one; the user, 2026-11-05)
            loginPage.createButtonWithIcon("Sign in with Google", LoginPage.GOOGLE_LOGO, onLoginWithGoogle);
            loginPage.createButtonWithIcon("Sign in with Apple", LoginPage.getAppleLogo(loginPage.style.customLoginButton.textColor), onLoginWithApple);

            // TEST
            fillTestData();

        };

        const initAdminPanel = function() {

            if (!userData) { logout(); return 0; }

            // Main Content
            window.mainView = MainView();

            // Top Bar
            window.topBar = TopBar({
                panelIcon: "assets/panel-icon.png",
                panelName: "MY PANEL",
                backgroundColor: "#2C5A38", //"#3D7A6B", // "#344f6c", "#583432", "#2C5A38"
                tab_border: 1, // 1, 0
            });

            // Saved settings: panel name, panel color (pages/settings.js)
            const settings = SettingsPage.load();
            SettingsPage.applyToPanel(settings);

            // Notifications: badge count on the bell and a test feed (pages/notifications.js)
            // TODO: Connect to your notification service instead of the test feed.
            NotificationsPage.startTestFeed(45000);

            // Right Content
            window.rightView = RightView();

            // Menu items
            const menuItems = [
                { key: HomePage.KEY, type: "button", text: "Home", icon: "assets/left-menu/home.png" },
                { key: ReportsPage.KEY, type: "button", text: "Reports", icon: "assets/left-menu/reports.png" },
                { key: OrdersPage.KEY, type: "button", text: "Orders", icon: "assets/top-bar/bookmark.png" },
                { key: ProductsPage.KEY, type: "button", text: "Products", icon: "assets/left-menu/extension.png" },
                { key: CustomersPage.KEY, type: "button", text: "Customers", icon: "assets/top-bar/user.png" },
                { key: "divider1", type: "header", text: "CONTENTS" },
                //{ key: UsersPage.KEY, type: "button", text: "Users", icon: "assets/left-menu/data-table.png" },
                { key: UserListPage.KEY, type: "button", text: "User List", icon: "assets/top-bar/user.png" },
                { key: RolesPage.KEY, type: "button", text: "Roles & Permissions", icon: "assets/maybe.png" },
                { key: ActivityPage.KEY, type: "button", text: "Activity Log", icon: "assets/top-bar/filter.png" },
                { key: ContentsPage.KEY, type: "button", text: "Contents", icon: "assets/left-menu/data-table.png" },
                { key: MediaPage.KEY, type: "button", text: "Media Library", icon: "assets/left-menu/dashboard.png" },
                { key: "divider1", type: "header", text: "MODULES" },
                { key: "module6", type: "button", text: "Energy Hub (Full)", icon: "assets/left-menu/bolt.png", dontSelect: 1 },
                { key: "module7", type: "button", text: "3D Printers (Right)", icon: "assets/left-menu/extension.png", dontSelect: 1 },
                { key: "module8", type: "button", text: "Cold Rooms (Main)", icon: "assets/left-menu/dashboard.png" },
                { key: "module9", type: "button", text: "Elevator Fleet", icon: "assets/left-menu/url.png" },
                { key: "module10", type: "button", text: "Greenhouse", icon: "assets/left-menu/code.png" },
                { key: "module11", type: "button", text: "Arduino Projects", icon: "assets/left-menu/extension.png" },
                // WHY: Boş örnek modüller (1-3) listenin sonunda dursun; dolu modüller önce gelsin.
                { key: "module1", type: "button", text: "Module 1 (Main)", icon: "assets/left-menu/brick.png" },
                { key: "module2", type: "button", text: "Module 2 (Full)", icon: "assets/left-menu/brick.png", dontSelect: 1 },
                { key: "module3", type: "button", text: "Module 3 (Right)", icon: "assets/left-menu/brick.png", dontSelect: 1 },
                { key: "divider1", type: "header", text: "URL MODULES" },
                { key: "url1", type: "button", text: "HandBook", icon: "assets/left-menu/bolt.png", dontSelect: 1 },
                { key: "url2", type: "button", text: "Personal Expense", icon: "assets/left-menu/code.png", dontSelect: 1 },
                { key: "url3", type: "button", text: "ToDo List", icon: "assets/left-menu/code.png", dontSelect: 1 },
            ];

            // Left Menu
            // WHY: The menu keeps its own default look (dark, red selection) in every theme, so
            //      it reads its own ink keys instead of Ink()/T.invertIcon, which follow the page.
            // WHY: page.fit() zooms the page: on a phone the 40 px rows of the menu were 24 px high on the screen.
            const isTouchScreen = window.matchMedia("(hover: none)").matches;
            window.leftMenu = LeftMenu({
                itemHeight: isTouchScreen ? Math.max(40, Math.round(FINGER_HEIGHT / page.zoom)) : 40,
                backgroundColor: T.menu,
                selectedColor: T.menuSelected,
                titleColor: T.menuTitle,
                textColor: T.menuTextColor,
                selectedTextColor: T.menuSelectedTextColor,
                hoverColor: T.menuHoverColor,
                invertIconColor: T.menuInvertIcon,
                items: menuItems,
                onItemClick: function(item) {
                    //println("Clicked Key: " + item.key);
                    openPageByKey(item.key);
                }
            });

            // Add item to bottom
            leftMenu.addItemToBottom({ key: SettingsPage.KEY, type: "button", text: "Settings", icon: "assets/left-menu/setting.png" });

            // Pages for the search on the top bar
            topBar.setSearchPages(menuItems.concat([{ key: SettingsPage.KEY, type: "button", text: "Settings" }]));

            
            // Add random items to top
            /*
            for(var i = 0; i < 30; i++) {
                leftMenu.addItemToTop({ key: "aaa" + i, type: "button", text: "Settings" + i, icon: "assets/data-table.png" });
            }
            */

            // Full Content
            window.fullView = FullView();

            // Waiting
            // NOTE: waiting.setMessage("Saving..."); waiting.open(); ... waiting.close(); (comp-m4 LoadingScreen)
            window.waiting = Theme.createWaiting();

            // Open the start page (Settings > Appearance)
            // WHY: After a theme change the panel is loaded again. The user stays on the same page.
            const startPageKey = Theme.takeOpenPageKey() || settings.startPage;
            leftMenu.setSelectedItem(startPageKey);
            openPageByKey(startPageKey);

        };

        window.openPageByKey = function(key) {

            if (!userData) { logout(); return 0; }

            // Eğer sayfa zaten açıkken çağırılır ise, sadece sayfayı kapatır ve 0 döner.
            const shouldOpenRightView = () => {

                if (rightView.isShown(key)) {
                    rightView.hide();
                    rightView.clean();
                    return 0;

                } else {
                    return 1;
                    // Sayfa kapalı ve açmak için uygun.
                }

            };

            switch (key) {

                case "logout":
                    logout();
                    break;

                case HomePage.KEY:
                    HomePage();
                    break;

                case ContentsPage.KEY:
                    ContentsPage();
                    break;

                case MediaPage.KEY:
                    MediaPage();
                    break;

                case RolesPage.KEY:
                    RolesPage();
                    break;

                case ActivityPage.KEY:
                    ActivityPage();
                    break;

                case NotificationsPage.KEY:
                    if(shouldOpenRightView()) { // If 0 then just close the page
                        NotificationsPage();
                    }
                    break;

                case ReportsPage.KEY:
                    ReportsPage();
                    break;

                case OrdersPage.KEY:
                    OrdersPage();
                    break;

                case ProductsPage.KEY:
                    ProductsPage();
                    break;

                case SettingsPage.KEY:
                    SettingsPage();
                    break;

                case UsersPage.KEY:
                    UsersPage();
                    break;

                case CustomersPage.KEY:
                    CustomersPage();
                    break;

                case UserListPage.KEY:
                    UserListPage();
                    break;

                case UserActionsPage.KEY:
                    if(shouldOpenRightView()) { // If 0 then just close the page
                        UserActionsPage();
                    }
                    break;

                case "module1":
                    ModulePage({
                        pageKey: key,
                        moduleURL: "module1/empty-main.htm",
                        container: mainView,
                    });
                    break;

                case "module10":
                    ModulePage({
                        pageKey: key,
                        moduleURL: "module10/greenhouse.htm",
                        container: mainView,
                    });
                    break;

                case "module11":
                    ModulePage({
                        pageKey: key,
                        moduleURL: "module11/arduino-projects.htm",
                        container: mainView,
                    });
                    break;

                case "module9":
                    ModulePage({
                        pageKey: key,
                        moduleURL: "module9/elevator-fleet.htm",
                        container: mainView,
                    });
                    break;

                case "module8":
                    ModulePage({
                        pageKey: key,
                        moduleURL: "module8/cold-rooms.htm",
                        container: mainView,
                    });
                    break;

                case "module2":
                    ModulePage({
                        pageKey: key,
                        moduleURL: "module2/empty-full.htm",
                        container: fullView,
                    });
                    //fullView.color = "white";
                    break;

                case "module6":
                    ModulePage({
                        pageKey: key,
                        moduleURL: "module6/energy-hub.htm",
                        container: fullView,
                    });
                    break;

                case "module7":
                    if(shouldOpenRightView()) { // If 0 then just close the page
                        ModulePage({
                            pageKey: key,
                            moduleURL: "module7/3d-printers.htm",
                            container: rightView,
                        });
                        rightView.setWidth(520);
                    }
                    break;

                case "module3":
                    if(shouldOpenRightView()) { // If 0 then just close the page
                        ModulePage({
                            pageKey: key,
                            moduleURL: "module3/empty-right.htm",
                            container: rightView,
                        });
                        rightView.setWidth(800);
                    }
                    break;

                case "module4":
                    if (!mainView.isShown(key)) { // If already opened dont open again.
                        ModulePage({
                            pageKey: key,
                            moduleURL: "module4/empty-main-topbar.htm",
                            container: mainView,
                        });

                        leftMenu.clearSelection(); // mainView da açılacağı için, left menu deki seçimi temizle.
                    }
                    break;

                case "module5":
                    if(shouldOpenRightView()) { // If 0 then just close the page
                        ModulePage({
                            pageKey: key,
                            moduleURL: "module5/empty-right-topbar.htm",
                            container: rightView,
                        });
                        rightView.setWidth(600);
                    }
                    break;
                
                case "url1":
                    ModulePage({
                        pageKey: key,
                        moduleURL: "https://bug7a.github.io/basic.js-handbook/",
                        container: mainView,
                    });
                    break;

                case "url2":
                    if(shouldOpenRightView()) { // If 0 then just close the page
                        ModulePage({
                            pageKey: key,
                            moduleURL: "https://bug7a.github.io/expense/",
                            container: rightView,
                        });
                        rightView.setWidth(450);
                    }
                    break;

                case "url3":
                    if(shouldOpenRightView()) { // If 0 then just close the page
                        ModulePage({
                            pageKey: key,
                            moduleURL: "https://bug7a.github.io/javascript-single-page-application-example/sample1.htm",
                            container: rightView,
                        });
                        rightView.setWidth(450);
                        // WHY only dark: the page is light; inverted it fits a dark theme (on the light theme it was black)
                        if (T.isDark) rightView.page.elem.style.filter = "invert(100%)";
                        rightView.page.elem.style.borderLeft = "1px solid rgba(0,0,0,0.15)";
                    }
                    break;

            }

        };

        const checkIfLoggedIn = function(callback) {

            // callback: { onSuccess: func, onFail: func }

            // TODO: Check logged in with your service

            // TEST LOGIN:
            userData = basic.storage.load("appid_login");

            if (userData) {
                callback.onSuccess();
            } else {
                callback.onFail();
            }

        };

        window.logout = function() {

            // TEST LOGIN:
            userData = null;
            UserActionsPage.clearSession(); // (only the Sign Out of the profile cleared it: an old "Signed in" time was shown)
            basic.storage.save("appid_login", userData);

            // Try to logout with your service
            window.location.reload();

        };

        // Actions
        const onLoginClick = function() {

            const email = loginPage.loginEmail.getInputValue();
            const password = loginPage.loginPassword.getInputValue();

            if (!email || !password) { loginPage.showAlert("Please enter email and password"); return; }

            const onSuccess = function() {

                window.location.reload();

            };

            const onFail = function(message) {
                loginPage.showAlert("Login failed: " + message);
            };

            loginPage.waiting.show();

            try {
                
                // TEST LOGIN:
                userData = { user: "test" };
                basic.storage.save("appid_login", userData);

                // TODO: Try to login with your service
                onSuccess();
                //onFail();


            } catch (e) {
                loginPage.showAlert("Login error");

            } finally {
                loginPage.waiting.hide();
            }

        };

        const onSignupClick = function() {

            const email = loginPage.signupEmail.getInputValue();
            const p1 = loginPage.signupPassword.getInputValue();
            const p2 = loginPage.signupPassword2.getInputValue();

            if (!email || !p1 || !p2) { loginPage.showAlert("Please fill all fields"); return; }
            if (p1 !== p2) { loginPage.showAlert("Passwords do not match"); return; }

            const onSuccess = function() {

                loginPage.showAlert("Sign up successful. Check your email to confirm.", "#5DB182");
                loginPage.signupPassword.setInputValue("");
                loginPage.signupPassword2.setInputValue("");
                loginPage.loginEmail.setInputValue(loginPage.signupEmail.getInputValue());
                loginPage.setActiveTab(0); // (it also selects the tab on the tab bar)

            };

            const onFail = function(message) {
                loginPage.showAlert("Sign up failed: " + message);
            };

            loginPage.waiting.show();

            try {
                
                // TODO: Try to Signup with your service
                onSuccess();
                //onFail();
                
            } catch (e) {
                loginPage.showAlert("Sign up error");

            } finally {
                loginPage.waiting.hide();
            }

        };

        const onLoginWithGoogle = function() {

            // TODO: Login with Google
            loginPage.showAlert("Logged in with Google.", "#5DB182");

        };

        const onLoginWithApple = function() {

            // TODO: Login with Apple
            loginPage.showAlert("Logged in with Apple.", "#5DB182");

        };


        </script>

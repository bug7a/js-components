<!DOCTYPE html>
<html lang="en">

<head>
    <title>SearchInput light / dark draft</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- LIBRARY FILES (a draft: no component, only basic.js objects) -->
    <link rel="preload" href="../basic/font/open-sans/OpenSans-Regular.ttf" as="font" crossorigin="anonymous">
    <link rel="preload" href="../basic/font/open-sans/OpenSans-Bold.ttf" as="font" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="../basic/basic.css">
    <script src="../basic/basic.js" type="text/javascript" charset="utf-8"></script>

    <script>

        /* Bismillah */

        // DRAFT DESIGN of comp/search-input.js (SearchInput): the NEW "light" and "dark" looks of the kit, every state
        // side by side. A new design, not a copy of a package: it will take the place of "light" and be the "dark" the
        // component does not have yet. A 44 px white field with one thin line and round 6 corners, a 15 px text, a line
        // search icon, a clear button that is a soft circle with a dark cross; under the mouse the edge gets stronger
        // (a proposal: the component has no hoverBorderColor yet), while typing it turns to the accent of the kit
        // (2 px). The last rows show other clear buttons to choose from. Plain basic.js objects (no SearchInput here);
        // under the mouse and while typing are still frames of those moments. The tokens at the top are the same in
        // every draft of the new look.
        // http://127.0.0.1:5505/_basic-designer/index.htm?page=_designs/search-input.htm

        // THE TOKENS OF THE NEW LIGHT / DARK LOOK (the same in every draft of it)
        const LIGHT_TOKENS = {
            page: "#FFFFFF", // the page the component sits on
            surface: "#FFFFFF", // a field, a list, the face of a button
            soft: "#F2F3F0", // under the mouse, the ground of an icon, a quiet field
            softer: "#E6E7E3", // pressed, a track
            line: Black(0.12), // the edge of a surface
            lineStrong: Black(0.3), // the edge under the mouse
            text: Black(0.88),
            textSoft: Black(0.55),
            textFaint: Black(0.38), // a placeholder
            accent: "#3D7A6B", // the one color: a selected row, a fill, the main button, the edge while typing
            accentHover: "#356C5E",
            accentPress: "#2E5F53",
            accentSoft: "#E4EFEB", // a tint of the accent on the surface
            onAccent: "#FFFFFF", // a text or a mark on the accent
            danger: "#D9534F",
            warning: "#E5885E",
            focusRing: "rgba(61, 122, 107, 0.5)", // the ring of the keyboard focus
        };
        const DARK_TOKENS = {
            page: "#1A1A19",
            surface: "#232322",
            soft: "#2C2C2B",
            softer: "#363635",
            line: White(0.12),
            lineStrong: White(0.32),
            text: White(0.9),
            textSoft: White(0.55),
            textFaint: White(0.38),
            accent: "#65A293",
            accentHover: "#74B0A2",
            accentPress: "#5A9385",
            accentSoft: "rgba(101, 162, 147, 0.2)",
            onAccent: "#0F1F1B",
            danger: "#E0605A",
            warning: "#F0A07A",
            focusRing: "rgba(101, 162, 147, 0.55)",
        };

        const PAGE_COLOR = "#F4F5F2"; // the ground of the draft, not of the fields
        const PAGE_TEXT = { title: Black(0.8), note: Black(0.5), state: Black(0.45), stateTitle: Black(0.4) }; // the texts of the draft
        const STATE_COLUMN_WIDTH = 250;
        const ROW_HEIGHT = 64;
        const HEADER_HEIGHT = 24;
        const CARD_PADDING = 24;
        const COLUMN_GAP = 24;

        // THE SIZES (the same in both looks)
        const SIZE = {
            width: 300,
            height: 44,
            round: 6,
            fontSize: 15,
            textOffsetY: -1, // the text a little up: the small letters of Open Sans sit low in their line
            searchIcon: { size: 18, left: 14, gap: 8 }, // searchIconSize, searchIconLeft, searchIconGap
            clearIcon: { size: 20, right: 12 }, // (20 px) clearIconRight
            textEndSpace: 6, // px between the end of the text and the clear icon
            textUnderEnd: 20, // while not typing a cut text goes this far under the clear icon (SearchInput.TEXT_UNDER_END)
            textFadeWidth: 24, // a cut text fades out over this width (textFadeWidth)
            focusEdgeWidth: 2, // the edge while typing: the 1 px edge and a 1 px line inside it (focusBorderWidth)
            hoverRingWidth: 1, // animated: the line inside the edge under the mouse
            focusRingWidth: 2, // animated: the line while typing
            caretHeight: 18,
        };
        const ANIMATED_ICON = { hoverScale: 1.08, focusScale: 1.06, focusTilt: -12, opacityGain: 0.25 }; // animated: the search icon under the mouse (x2 while typing)

        // THE LIGHT LOOK: a white field, one thin line, the accent while typing
        const LIGHT = {
            page: { color: LIGHT_TOKENS.page, textColor: LIGHT_TOKENS.textSoft },
            field: { color: LIGHT_TOKENS.surface, border: 1, borderColor: LIGHT_TOKENS.line, bottomLine: "1px solid " + LIGHT_TOKENS.line }, // color, border, borderColor, borderBottomStyle
            hoverBorderColor: LIGHT_TOKENS.lineStrong, // the edge under the mouse (a proposal: a new param of SearchInput, as TextField has it)
            focusBorderColor: LIGHT_TOKENS.accent, // the edge while typing (focusBorderColor)
            text: { color: LIGHT_TOKENS.text, placeholderColor: LIGHT_TOKENS.textFaint, caretColor: LIGHT_TOKENS.text }, // textColor, placeholderColor
            searchIcon: { color: "#000000", opacity: 0.55 }, // the line icon (its color is in the drawing), searchIconOpacity
            clearIcon: { circleColor: LIGHT_TOKENS.softer, crossColor: Black(0.65), opacity: 1 }, // a soft circle with a dark cross (its colors are in the drawing), clearIconOpacity
            otherClearIcons: { // the last rows: other clear buttons to choose from
                cross: { color: Black(0.55) }, // only a line cross
                grayCircle: { circleColor: "#A3A3A0", crossColor: "#FFFFFF" }, // a filled gray circle with a white cross (the first draft)
            },
            animated: { hoverRingColor: Black(0.08), focusRingColor: LIGHT_TOKENS.focusRing }, // animated: 1 (hoverRingColor, focusRingColor)
        };

        // THE DARK LOOK: the same shape on the dark surface, light text and icons
        const DARK = {
            page: { color: DARK_TOKENS.page, textColor: DARK_TOKENS.textSoft },
            field: { color: DARK_TOKENS.surface, border: 1, borderColor: DARK_TOKENS.line, bottomLine: "1px solid " + DARK_TOKENS.line },
            hoverBorderColor: DARK_TOKENS.lineStrong,
            focusBorderColor: DARK_TOKENS.accent,
            text: { color: DARK_TOKENS.text, placeholderColor: DARK_TOKENS.textFaint, caretColor: DARK_TOKENS.text },
            searchIcon: { color: "#FFFFFF", opacity: 0.55 },
            clearIcon: { circleColor: White(0.14), crossColor: White(0.85), opacity: 1 },
            otherClearIcons: {
                cross: { color: White(0.6) },
                grayCircle: { circleColor: "#7A7A78", crossColor: "#141414" },
            },
            animated: { hoverRingColor: White(0.08), focusRingColor: DARK_TOKENS.focusRing },
        };

        // THE STATES (one row each)
        const STATES = [
            { name: "Empty (the placeholder)", text: "" },
            { name: "With a text (the clear button shows)", text: "fishing boat" },
            { name: "Under the mouse (hover): a stronger edge (a proposal: hoverBorderColor)", text: "", hover: 1 },
            { name: "Typing (focus): the 2 px edge in the accent", text: "fishing boat", focus: 1 },
            { name: "Under the mouse, animated: 1 (the stronger edge, a thin line inside it, the icon a little bigger and clearer)", text: "", hover: 1, animated: 1 },
            { name: "Typing, animated: 1 (the line of the focus ring, the icon tilted)", text: "fishing", focus: 1, animated: 1 },
            { name: "A long text, not typing: it goes on under the clear button and fades out there", text: "Search results for the fishing company of the north sea" },
            { name: "Another clear button to choose: only a line cross", text: "fishing boat", clearStyle: "cross" },
            { name: "Another clear button to choose: a filled gray circle with a white cross (the first draft)", text: "fishing boat", clearStyle: "grayCircle" },
        ];

        const start = function () {

            page.color = PAGE_COLOR;

            // BOX: Scrolling page
            startBox(0, 0, "100%", "100%", { color: "transparent", scrollY: 1, scrollX: 1 });

                VGroup({ width: "max-content", height: "auto", align: "left top", gap: 22, padding: 40, clipContent: 0 });

                    Label({ text: "SearchInput · the new light / dark · draft (comp/search-input.js)", fontSize: 20, bold: 1, textColor: PAGE_TEXT.title });
                    Label({ text: "A new design for the light package and for the dark one the component does not have yet. Every row is a state.", fontSize: 13, textColor: PAGE_TEXT.note });

                    // GROUP: The names of the states, then a card for every look
                    HGroup({ width: "auto", height: "auto", align: "left top", gap: COLUMN_GAP, clipContent: 0 });
                        drawStateColumn();
                        drawLookCard(LIGHT, "light (new)");
                        drawLookCard(DARK, "dark (new)");
                    endGroup();

                endGroup();

            endBox();

        };

        // GROUP: The names of the states, one per row (the rows of the cards have the same heights)
        const drawStateColumn = function () {
            const column = VGroup({ width: STATE_COLUMN_WIDTH, height: "auto", align: "left top", gap: 0, padding: [0, CARD_PADDING] });
                Label({ height: HEADER_HEIGHT, text: "state", fontSize: 12, textColor: PAGE_TEXT.stateTitle });
                STATES.forEach(function (state) {
                    HGroup({ width: "100%", height: ROW_HEIGHT, align: "left center" });
                        Label({ width: "100%", text: state.name, fontSize: 12, textColor: PAGE_TEXT.state, css: { lineHeight: "1.3" } });
                    endGroup();
                });
            endGroup();
            return column;
        };

        // GROUP: A card in the color of the page of a look: its name, then one row per state
        const drawLookCard = function (look, name) {
            const card = VGroup({ width: "auto", height: "auto", align: "left top", gap: 0, padding: CARD_PADDING, color: look.page.color, round: 10, border: 1, borderColor: Black(0.08), clipContent: 0 });
                Label({ height: HEADER_HEIGHT, text: name, fontSize: 13, bold: 1, textColor: look.page.textColor, css: { whiteSpace: "nowrap" } });
                STATES.forEach(function (state) {
                    // GROUP: A row: the field in this state
                    HGroup({ width: SIZE.width, height: ROW_HEIGHT, align: "left center", clipContent: 0 });
                        drawField(look, state);
                    endGroup();
                });
            endGroup();
            return card;
        };

        // BOX: The field in one state: its edge and lines, the search icon, the text (or the placeholder) with its caret, the clear icon
        const drawField = function (look, state) {
            const _f = look.field;
            const field = Box({ width: SIZE.width, height: SIZE.height, color: _f.color, round: SIZE.round, border: _f.border, borderColor: getEdgeColor(look, state), clipContent: 0, position: "relative" });
            field.shrink = 0;
            field.css = { borderBottom: getBottomLine(look, state), boxShadow: getInnerLine(look, state) };
            createIn(field, function () {
                drawSearchIcon(look, state);
                drawText(look, state);
                if (state.text) drawClearIcon(look, state);
            });
            return field;
        };

        // *** THE EDGE AND THE LINES OF A STATE (as the component paints them)

        const getEdgeColor = function (look, state) {
            if (state.focus) return look.focusBorderColor;
            if (state.hover) return look.hoverBorderColor;
            return look.field.borderColor;
        };

        // While typing the edge is the focus color on every side; the bottom line of the package comes back after it
        const getBottomLine = function (look, state) {
            if (state.focus) return look.field.border + "px solid " + look.focusBorderColor;
            return look.field.bottomLine;
        };

        // animated: a line inside the edge under the mouse and while typing; not animated: the inner part of the 2 px focus edge
        const getInnerLine = function (look, state) {
            if (state.animated && state.focus) return "inset 0 0 0 " + SIZE.focusRingWidth + "px " + look.animated.focusRingColor;
            if (state.animated && state.hover) return "inset 0 0 0 " + SIZE.hoverRingWidth + "px " + look.animated.hoverRingColor;
            if (state.focus) return "inset 0 0 0 " + (SIZE.focusEdgeWidth - look.field.border) + "px " + look.focusBorderColor;
            return "none";
        };

        // *** THE PARTS

        // ICON: The search icon at the left (animated: bigger under the mouse, tilted while typing, clearer in both)
        const drawSearchIcon = function (look, state) {
            const _i = SIZE.searchIcon;
            const icon = Icon(_i.left, (SIZE.height - _i.size) / 2, _i.size, _i.size, { opacity: getSearchIconOpacity(look, state) });
            icon.load(getSearchIconFile(look.searchIcon.color));
            icon.css = { transform: getSearchIconTransform(state) };
            return icon;
        };

        const getSearchIconOpacity = function (look, state) {
            let gain = 0;
            if (state.animated && state.hover) gain = ANIMATED_ICON.opacityGain;
            if (state.animated && state.focus) gain = ANIMATED_ICON.opacityGain * 2;
            return Math.min(1, look.searchIcon.opacity + gain);
        };

        const getSearchIconTransform = function (state) {
            if (state.animated && state.focus) return "scale(" + ANIMATED_ICON.focusScale + ") rotate(" + ANIMATED_ICON.focusTilt + "deg)";
            if (state.animated && state.hover) return "scale(" + ANIMATED_ICON.hoverScale + ")";
            return "none";
        };

        // GROUP: The text (or the placeholder) after the search icon, its caret while typing; a long text is cut at the
        // right (under the clear icon while not typing) and fades out there
        const drawText = function (look, state) {
            const left = SIZE.searchIcon.left + SIZE.searchIcon.size + SIZE.searchIcon.gap;
            const underEnd = state.focus ? 0 : SIZE.textUnderEnd;
            const width = SIZE.width - left - SIZE.clearIcon.right - SIZE.clearIcon.size - SIZE.textEndSpace + underEnd;
            const hasText = !!state.text;
            const text = HGroup({ left: left, top: 0, width: width, height: "100%", align: "left center", gap: 1, clipContent: 1 });
            text.css = { transform: "translateY(" + SIZE.textOffsetY + "px)", maskImage: getTextFade(underEnd), webkitMaskImage: getTextFade(underEnd) };
                Label({ text: hasText ? state.text : "Search", fontSize: SIZE.fontSize, textColor: hasText ? look.text.color : look.text.placeholderColor, css: { whiteSpace: "nowrap", flexShrink: "0" } });
                if (state.focus) Box({ width: 1, height: SIZE.caretHeight, color: look.text.caretColor, position: "relative" });
            endGroup();
            return text;
        };

        // The fade at the right end of a cut text (the component fades only a cut side; here every text can be cut there)
        const getTextFade = function (underEnd) {
            const endFade = (SIZE.textFadeWidth + underEnd) + "px";
            return "linear-gradient(to right, #000 0px, #000 calc(100% - " + endFade + "), transparent 100%)";
        };

        // ICON: The clear button at the right (shown while there is a text): the soft circle, or one of the others to choose
        const drawClearIcon = function (look, state) {
            const _c = SIZE.clearIcon;
            const icon = Icon({ right: _c.right, top: (SIZE.height - _c.size) / 2, width: _c.size, height: _c.size, opacity: look.clearIcon.opacity });
            icon.load(getClearIconFileOf(look, state.clearStyle));
            return icon;
        };

        const getClearIconFileOf = function (look, clearStyle) {
            if (clearStyle === "cross") return getCrossIconFile(look.otherClearIcons.cross.color);
            if (clearStyle === "grayCircle") return getClearIconFile(look.otherClearIcons.grayCircle.circleColor, look.otherClearIcons.grayCircle.crossColor);
            return getClearIconFile(look.clearIcon.circleColor, look.clearIcon.crossColor);
        };

        // *** THE ICONS (lines of 24 x 24; the colors are in the drawing)

        const getSearchIconFile = function (color) {
            return "data:image/svg+xml;utf8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="' + color + '" stroke-width="2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L20 20"/><\/svg>');
        };

        const getClearIconFile = function (circleColor, crossColor) {
            return "data:image/svg+xml;utf8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="' + circleColor + '"/><path d="M9 9l6 6M15 9l-6 6" fill="none" stroke="' + crossColor + '" stroke-width="2" stroke-linecap="round"/><\/svg>');
        };

        // Only a line cross, as big as the search icon
        const getCrossIconFile = function (color) {
            return "data:image/svg+xml;utf8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="' + color + '" stroke-width="2" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/><\/svg>');
        };

    </script>

</head>

<!DOCTYPE html>
<html lang="en">

<head>
    <title>ItemList light / dark draft</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- LIBRARY FILES (a draft: no component, only basic.js objects) -->
    <link rel="preload" href="../basic/font/open-sans/OpenSans-Regular.ttf" as="font" crossorigin="anonymous">
    <link rel="preload" href="../basic/font/open-sans/OpenSans-Bold.ttf" as="font" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="../basic/basic.css">
    <script src="../basic/basic.js" type="text/javascript" charset="utf-8"></script>

    <script>

        /* Bismillah */

        // DRAFT DESIGN of comp/item-list.js (ItemList): the NEW "light" and "dark" looks of the kit (ItemList has no light
        // package yet; its dark package today is the dark twin of modern: _designs/item-list-dark.htm). A new design:
        // a white box with one thin line and round 10 corners, flat rows of 56 px, the row under the mouse in the soft
        // gray, the selected one in a tint of the accent with a full mark. A whole list in each look, on the page of
        // that look: five rows, one selected (Strawberry), one under the mouse (Apple), the others normal (still frames).
        // The two looks have their own drawing lines, so basic-designer changes one without the other ("All N from
        // this line" stays inside a look; "This object only" changes one row). No ItemList here: plain basic.js objects.
        // The tokens at the top are the same in every draft of the new look. The other states (focus, disabled,
        // section, empty) come later.
        // http://127.0.0.1:5505/_basic-designer/index.htm?page=_designs/item-list.htm

        // THE TOKENS OF THE NEW LIGHT / DARK LOOK (the same in every draft of it)
        const LIGHT_TOKENS = {
            page: "#FFFFFF", // the page the component sits on
            surface: "#FFFFFF", // a field, a list, the face of a button
            soft: "#F2F3F0", // under the mouse, the ground of an icon, a quiet field
            softer: "#E6E7E3", // pressed, a track
            line: Black(0.12), // the edge of a surface
            lineStrong: Black(0.3), // the edge under the mouse
            text: Black(0.88),
            textSoft: Black(0.55),
            textFaint: Black(0.38), // a placeholder
            accent: "#3D7A6B", // the one color: a selected row, a fill, the main button, the edge while typing
            accentHover: "#356C5E",
            accentPress: "#2E5F53",
            accentSoft: "#E4EFEB", // a tint of the accent on the surface
            onAccent: "#FFFFFF", // a text or a mark on the accent
            danger: "#D9534F",
            warning: "#E5885E",
            focusRing: "rgba(61, 122, 107, 0.5)", // the ring of the keyboard focus
        };
        const DARK_TOKENS = {
            page: "#1A1A19",
            surface: "#232322",
            soft: "#2C2C2B",
            softer: "#363635",
            line: White(0.12),
            lineStrong: White(0.32),
            text: White(0.9),
            textSoft: White(0.55),
            textFaint: White(0.38),
            accent: "#65A293",
            accentHover: "#74B0A2",
            accentPress: "#5A9385",
            accentSoft: "rgba(101, 162, 147, 0.2)",
            onAccent: "#0F1F1B",
            danger: "#E0605A",
            warning: "#F0A07A",
            focusRing: "rgba(101, 162, 147, 0.55)",
        };

        const PAGE_COLOR = "#F4F5F2"; // the ground of the draft, not of the list
        const PAGE_TEXT = { title: Black(0.8), note: Black(0.5) }; // the texts of the draft, not of the list
        const LIST_WIDTH = 360;
        const CARD_PADDING = 30;
        const CARD_GAP = 40;
        const FRUITS_PATH = "../assets/fruids/";

        // THE LIGHT LOOK: a white box with one thin line, flat rows; the row under the mouse in the soft gray, the selected
        // one in a tint of the accent with a full mark
        const LIGHT = {
            page: { color: LIGHT_TOKENS.page, textColor: LIGHT_TOKENS.textSoft }, // the light page the list sits on
            box: { color: LIGHT_TOKENS.surface, border: 1, borderColor: LIGHT_TOKENS.line, round: 10, padding: 6 },
            list: { gap: 2 }, // between the rows: the colors of two rows never meet
            row: { height: 56, padding: [12, 10], gap: 12, color: "transparent", round: 8 },
            hover: { color: LIGHT_TOKENS.soft },
            selected: { color: LIGHT_TOKENS.accentSoft, titleColor: LIGHT_TOKENS.text },
            icon: { size: 36, round: 8, color: LIGHT_TOKENS.soft },
            title: { fontSize: 15, textColor: LIGHT_TOKENS.text, fontFamily: "opensans" },
            desc: { fontSize: 13, textColor: LIGHT_TOKENS.textSoft },
            check: { size: 20, color: LIGHT_TOKENS.accent, iconColor: LIGHT_TOKENS.onAccent, borderColor: Black(0.25) }, // an empty circle; full on the selected row
        };

        // THE DARK LOOK: the same shapes on the dark surface
        const DARK = {
            page: { color: DARK_TOKENS.page, textColor: DARK_TOKENS.textSoft }, // the dark page the list sits on
            box: { color: DARK_TOKENS.surface, border: 1, borderColor: DARK_TOKENS.line, round: 10, padding: 6 },
            list: { gap: 2 },
            row: { height: 56, padding: [12, 10], gap: 12, color: "transparent", round: 8 },
            hover: { color: White(0.07) },
            selected: { color: DARK_TOKENS.accentSoft, titleColor: DARK_TOKENS.text },
            icon: { size: 36, round: 8, color: White(0.07) },
            title: { fontSize: 15, textColor: DARK_TOKENS.text, fontFamily: "opensans" },
            desc: { fontSize: 13, textColor: DARK_TOKENS.textSoft },
            check: { size: 20, color: DARK_TOKENS.accent, iconColor: DARK_TOKENS.onAccent, borderColor: White(0.3) },
        };

        // THE ITEMS of both lists: selected and hover are the still frames
        const ITEMS = [
            { title: "Broccoli", desc: "Vegetable", iconFile: FRUITS_PATH + "brokoli.png" },
            { title: "Strawberry", desc: "Fruit", iconFile: FRUITS_PATH + "cilek.png", selected: 1 },
            { title: "Tomato", desc: "Vegetable", iconFile: FRUITS_PATH + "domates.png" },
            { title: "Apple", desc: "Fruit", iconFile: FRUITS_PATH + "elma.png", hover: 1 },
            { title: "Carrot", desc: "Vegetable", iconFile: FRUITS_PATH + "havuc.png" },
        ];
        const ITEMS_NOTE = "Strawberry is selected, Apple is under the mouse.";

        const start = function () {

            page.color = PAGE_COLOR;

            // BOX: Scrolling page
            startBox(0, 0, "100%", "100%", { color: "transparent", scrollY: 1, scrollX: 1 });

                VGroup({ width: "max-content", height: "auto", align: "left top", gap: 22, padding: 40, clipContent: 0 });

                    Label({ text: "ItemList · the new light / dark · draft (comp/item-list.js)", fontSize: 20, bold: 1, textColor: PAGE_TEXT.title });
                    Label({ text: "A new design for the light and dark packages, the whole list in each. The other states (focus, disabled, section, empty list) come after this look is settled.", fontSize: 13, textColor: PAGE_TEXT.note });

                    // GROUP: The two themes side by side
                    HGroup({ width: "auto", height: "auto", align: "left top", gap: CARD_GAP, clipContent: 0 });
                        drawLightList();
                        drawDarkList();
                    endGroup();

                endGroup();

            endBox();

        };

        // *** THE LIGHT THEME

        // GROUP: The light page and the box of the list with its rows
        const drawLightList = function () {
            const card = VGroup({ width: "auto", height: "auto", align: "left top", gap: 14, padding: CARD_PADDING, color: LIGHT.page.color, round: 10, border: 1, borderColor: Black(0.08), clipContent: 0 });
                Label({ text: "light (new)", fontSize: 12, textColor: LIGHT.page.textColor });
                // GROUP: The box of the list (style.box, style.list)
                VGroup({ width: LIST_WIDTH, height: "auto", align: "left top", gap: LIGHT.list.gap, padding: LIGHT.box.padding, color: LIGHT.box.color, border: LIGHT.box.border, borderColor: LIGHT.box.borderColor, round: LIGHT.box.round, clipContent: 0 });
                    ITEMS.forEach(drawLightRow);
                endGroup();
                Label({ text: ITEMS_NOTE, fontSize: 12, textColor: LIGHT.page.textColor });
            endGroup();
            return card;
        };

        // GROUP: One row of the light list (style.row): its icon, its texts and its mark; gray under the mouse, the selected one its own gray
        const drawLightRow = function (item) {
            const look = getRowLook(LIGHT, item);
            const row = HGroup({ width: "100%", height: LIGHT.row.height, align: "left center", gap: LIGHT.row.gap, padding: LIGHT.row.padding, color: look.color, round: LIGHT.row.round, clipContent: 0 });
                // ICON: The picture of the item on its own color (style.icon)
                const icon = Icon({ width: LIGHT.icon.size, height: LIGHT.icon.size, color: LIGHT.icon.color, round: LIGHT.icon.round });
                icon.shrink = 0;
                icon.load(item.iconFile);
                // GROUP: The texts (they take the rest of the row; a long text is cut with ...)
                const texts = VGroup({ width: "auto", height: "auto", align: "left center", gap: 0 });
                texts.css = { flex: "1 1 0", minWidth: "0", alignItems: "stretch" };
                    Label({ text: item.title, width: "100%", fontSize: LIGHT.title.fontSize, fontFamily: LIGHT.title.fontFamily, textColor: look.titleColor, ellipsis: 1 });
                    Label({ text: item.desc, width: "100%", fontSize: LIGHT.desc.fontSize, textColor: LIGHT.desc.textColor, ellipsis: 1 });
                endGroup();
                // LABEL: The mark (style.check): an empty circle, full with a tick on the selected row
                const check = Label({ width: LIGHT.check.size, height: LIGHT.check.size, round: 100, border: 2, color: look.checkColor, borderColor: look.checkBorderColor, text: look.checkText });
                check.shrink = 0;
                check.css = { display: "flex", alignItems: "center", justifyContent: "center" };
            endGroup();
            return row;
        };

        // *** THE DARK THEME

        // GROUP: The dark page and the box of the list with its rows
        const drawDarkList = function () {
            const card = VGroup({ width: "auto", height: "auto", align: "left top", gap: 14, padding: CARD_PADDING, color: DARK.page.color, round: 10, border: 1, borderColor: Black(0.08), clipContent: 0 });
                Label({ text: "dark (new)", fontSize: 12, textColor: DARK.page.textColor });
                // GROUP: The box of the list (style.box, style.list)
                VGroup({ width: LIST_WIDTH, height: "auto", align: "left top", gap: DARK.list.gap, padding: DARK.box.padding, color: DARK.box.color, border: DARK.box.border, borderColor: DARK.box.borderColor, round: DARK.box.round, clipContent: 0 });
                    ITEMS.forEach(drawDarkRow);
                endGroup();
                Label({ text: ITEMS_NOTE, fontSize: 12, textColor: DARK.page.textColor });
            endGroup();
            return card;
        };

        // GROUP: One row of the dark list (style.row): its icon, its texts and its mark; lighter under the mouse, the selected one its own tone
        const drawDarkRow = function (item) {
            const look = getRowLook(DARK, item);
            const row = HGroup({ width: "100%", height: DARK.row.height, align: "left center", gap: DARK.row.gap, padding: DARK.row.padding, color: look.color, round: DARK.row.round, clipContent: 0 });
                // ICON: The picture of the item on its own color (style.icon)
                const icon = Icon({ width: DARK.icon.size, height: DARK.icon.size, color: DARK.icon.color, round: DARK.icon.round });
                icon.shrink = 0;
                icon.load(item.iconFile);
                // GROUP: The texts (they take the rest of the row; a long text is cut with ...)
                const texts = VGroup({ width: "auto", height: "auto", align: "left center", gap: 0 });
                texts.css = { flex: "1 1 0", minWidth: "0", alignItems: "stretch" };
                    Label({ text: item.title, width: "100%", fontSize: DARK.title.fontSize, fontFamily: DARK.title.fontFamily, textColor: look.titleColor, ellipsis: 1 });
                    Label({ text: item.desc, width: "100%", fontSize: DARK.desc.fontSize, textColor: DARK.desc.textColor, ellipsis: 1 });
                endGroup();
                // LABEL: The mark (style.check): an empty circle, full with a tick on the selected row
                const check = Label({ width: DARK.check.size, height: DARK.check.size, round: 100, border: 2, color: look.checkColor, borderColor: look.checkBorderColor, text: look.checkText });
                check.shrink = 0;
                check.css = { display: "flex", alignItems: "center", justifyContent: "center" };
            endGroup();
            return row;
        };

        // *** THE LOOK OF A ROW IN ITS STATE (as the component paints it: row < hover < selected)

        const getRowLook = function (theme, item) {
            const look = {
                color: theme.row.color,
                titleColor: theme.title.textColor,
                checkColor: "transparent",
                checkBorderColor: theme.check.borderColor,
                checkText: "",
            };
            if (item.hover) look.color = theme.hover.color;
            if (!item.selected) return look;
            look.color = theme.selected.color;
            look.titleColor = theme.selected.titleColor;
            look.checkColor = theme.check.color;
            look.checkBorderColor = theme.check.color;
            look.checkText = getCheckSvg(theme.check.iconColor, theme.check.size * 0.6);
            return look;
        };

        // The mark of ItemList.getCheckSvg
        const getCheckSvg = function (color, size) {
            return '<svg xmlns="http://www.w3.org/2000/svg" width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="' + color + '" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/><\/svg>';
        };

    </script>

</head>

<body>
</body>

</html>

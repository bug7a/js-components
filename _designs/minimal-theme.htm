                    drawComponent({ title: "SmartTable", note: "A head with a line under it, thin lines between the rows; a row under the mouse or selected gets the line of ItemList.", cellWidth: 340, states: TABLE_STATES, drawCell: drawTableCell });
                    drawComponent({ title: "TreeView", note: "The rows of ItemList, moved in by their level, a chevron before a folder.", cellWidth: 290, states: TREE_STATES, drawCell: drawTreeCell });
                    drawComponent({ title: "MenuBar · ToolBar · StatusBar", note: "The bars of a window: one line between them and the page; the buttons are quiet buttons.", cellWidth: 380, states: BAR_STATES, drawCell: drawBarCell });
                    drawComponent({ title: "Tooltip · ContextMenu · Dialog · Toast", note: "Things over the page need a ground: the ground of the window and a line, still no shadow.", cellWidth: 380, states: OVERLAY_STATES, drawCell: drawOverlayCell });
                    drawComponent({ title: "DatePicker", note: "The field of SelectBox with a 14 px line calendar; the calendar on the ground of the window, 28 px days: a line around today, the chosen day in ink.", cellWidth: 300, states: DATE_STATES, drawCell: drawDateCell });
                    drawComponent({ title: "TimePicker", note: "The same field with a line clock; two columns of 28 px cells, the chosen ones in ink, a thin scroll bar beside the cells.", cellWidth: 260, states: TIME_STATES, drawCell: drawTimeCell });
                    drawComponent({ title: "ColorPicker", note: "A 16 px swatch in the field; a palette of 22 px swatches with a soft line, a dot on the chosen one.", cellWidth: 260, states: COLOR_STATES, drawCell: drawColorCell });
                    drawComponent({ title: "FilePicker", note: "A dashed line of 3:1 (a click chooses a file), darker under the mouse, ink while a file is over it; 42 px rows.", cellWidth: 340, states: FILE_STATES, drawCell: drawFileCell });
                    drawComponent({ title: "Accordion", note: "A soft line around the sections and between them, 32 px rows, a faint row under the mouse.", cellWidth: 320, states: ACCORDION_STATES, drawCell: drawAccordionCell });
                    drawComponent({ title: "SliderField", note: "A 28 px field, a faint fill for the value and a 2 px handle that never crosses the label or the value.", cellWidth: 260, states: SLIDER_FIELD_STATES, drawCell: drawSliderFieldCell });
                    drawComponent({ title: "StepBar", note: "20 px circles: ink for the steps behind and the step of now, a soft line for the next ones; the keyboard: a ring around the circle.", cellWidth: 340, states: STEP_STATES, drawCell: drawStepCell });
                    drawComponent({ title: "TagInput", note: "20 px tags with a soft line in a 28 px field; the typed part of a suggestion in bold.", cellWidth: 300, states: TAG_STATES, drawCell: drawTagCell });
                    drawComponent({ title: "Splitter", note: "The soft line; 2 px of ink under the mouse, 2 px of the focus color for the keyboard.", cellWidth: 300, states: SPLITTER_STATES, drawCell: drawSplitterCell });
                    drawComponent({ title: "SidePanel · LoadingScreen · GraphBox", note: "A panel with a line and no shadow, a loading screen with the ring of the minimal button, a chart in the colors of the theme.", cellWidth: 340, states: PANEL_STATES, drawCell: drawPanelCell });

                endGroup();

            endBox();

        };

        // *** THE GRID

        // GROUP: A white card: the name of the component, a note and the grid of its states
        const drawComponent = function (spec) {
            const card = VGroup({ width: "auto", height: "auto", align: "left top", gap: CARD.gap, padding: CARD.padding, color: "white", round: CARD.round, border: 1, borderColor: CARD.line, clipContent: 0 });
                VGroup({ hug: 1, align: "left top", gap: 2 });
                    Label({ text: spec.title, fontSize: 18, fontFamily: FONT.bold, textColor: "#232323" });
                    Label({ text: spec.note, fontSize: 13, textColor: CAPTION_COLOR });
                endGroup();
                drawGrid(spec);
            endGroup();
            return card;
        };

        // GROUP: The column titles, then a row per state
        const drawGrid = function (spec) {
            const grid = VGroup({ hug: 1, align: "left top", gap: 0, round: GRID.round, border: 1, borderColor: GRID.line });
                drawGridHeader(spec);
                spec.states.forEach(function (state) {
                    drawGridRow(spec, state);
                });
            endGroup();
            return grid;
        };

        const drawGridHeader = function (spec) {
            const header = HGroup({ hug: 1, align: "left center", gap: 0 });
                drawCaption("State", GRID.titleWidth);
                THEMES.forEach(function (theme) {
                    drawCaption(theme.name, spec.cellWidth);
                });
            endGroup();
            return header;
        };

        const drawCaption = function (text, width) {
            return Label({ width: width, text: text.toUpperCase(), fontSize: SIZE.caption, fontFamily: FONT.bold, textColor: CAPTION_COLOR, padding: [14, 10], css: { letterSpacing: "0.3px" } });
        };

        // GROUP: The name of a state and its cell in every package (the cells of a row are as high as the highest)
        const drawGridRow = function (spec, state) {
            const row = HGroup({ hug: 1, align: "left top", gap: 0, clipContent: 0 });
            row.css = { alignItems: "stretch", borderTop: "1px solid " + GRID.line };
                Label({ width: GRID.titleWidth, text: state.name, fontSize: SIZE.small, textColor: Black(0.6), padding: [14, 14] });
                THEMES.forEach(function (theme) {
                    drawCell(spec, state, theme);
                });
            endGroup();
            return row;
        };

        // GROUP: One state in one package, on the ground of its window
        const drawCell = function (spec, state, theme) {
            const cell = HGroup({ width: spec.cellWidth, height: "auto", align: "left center", gap: GRID.cellGap, padding: GRID.cellPadding, color: theme.ground, clipContent: 0 });
                spec.drawCell(state, theme);
            endGroup();
            return cell;
        };

        // *** TOKENS

        const drawTokenCell = function (state, theme) {
            if (state.type) return drawTypeSamples(theme);
            if (state.sizes) return drawSizeSamples(theme);
            state.tokens.forEach(function (name) {
                drawSwatch(name, theme[name], theme);
            });
        };

        // GROUP: A color tile with its name and its value
        const drawSwatch = function (name, value, theme) {
            const group = VGroup({ width: SWATCH.width, height: "auto", align: "left top", gap: 3 });
                Box({ width: SWATCH.width, height: SWATCH.height, color: value, round: SIZE.round, border: 1, borderColor: theme.line, position: "relative" });
                Label({ text: name, fontSize: SIZE.caption, fontFamily: FONT.bold, textColor: theme.text });
                Label({ text: value, fontSize: 10, textColor: theme.softText });
            endGroup();
            return group;
        };

        const drawTypeSamples = function (theme) {
            const group = VGroup({ hug: 1, align: "left top", gap: 6 });
                Label({ text: "Control text · 13", fontSize: SIZE.text, textColor: theme.text });
                Label({ text: "Field title, value, description · 12", fontSize: SIZE.small, textColor: theme.softText });
                Label({ text: "SECTION · 11 BOLD", fontSize: SIZE.caption, fontFamily: FONT.bold, textColor: theme.faintText, css: { letterSpacing: "0.3px" } });
            endGroup();
            return group;
        };

        const drawSizeSamples = function (theme) {
            const group = HGroup({ hug: 1, align: "left center", gap: 14 });
                Label({ width: 56, height: SIZE.control, text: "28", fontSize: SIZE.small, textColor: theme.softText, textAlign: "center", border: SIZE.line, borderColor: theme.line, round: SIZE.round, lineHeight: (SIZE.control - 2) + "px" });
                Box({ width: CHECK.size, height: CHECK.size, color: "transparent", border: SIZE.line, borderColor: theme.line, round: CHECK.round, position: "relative" });
                drawIcon("folder", theme.text);
                Label({ text: "control 28 · round 4 · line 1<br>mark 14 · icon 14", fontSize: SIZE.caption, textColor: theme.softText, lineHeight: "1.5" });
            endGroup();
            return group;
        };

        // *** SMART BUTTON

        const drawButtonCell = function (state, theme) {
            const group = HGroup({ hug: 1, align: "left center", gap: 8, clipContent: 0 });
                BUTTON_KINDS.forEach(function (kind) {
                    drawButton(kind, state, theme);
                });
            endGroup();
            return group;
        };

        // GROUP: A button in one state
        const drawButton = function (kind, state, theme) {
            const isIconOnly = (kind.text == "");
            const button = HGroup({
                width: isIconOnly ? SIZE.control : "auto",
                height: SIZE.control,
                align: "center center",
                gap: BUTTON.gap,
                padding: isIconOnly ? 0 : BUTTON.padding,
                color: getButtonFill(kind, state, theme),
                round: SIZE.round,
                border: SIZE.line,
                borderColor: getButtonLine(kind, state, theme),
                clipContent: 0,
            });
            button.css = { position: "relative" };
            if (state.pressed) button.css = { transform: "scale(" + BUTTON.pressScale + ")" };
            if (state.focus) button.boxShadow = getFocusRing(theme);
            if (state.disabled) button.opacity = SIZE.disabledOpacity;

                const textColor = getButtonTextColor(kind, theme);
                const contentOpacity = state.waiting ? BUTTON.waitingOpacity : 1;
                if (kind.icon) drawIcon(kind.icon, textColor).opacity = contentOpacity;
                if (!isIconOnly) Label({ text: kind.text, fontSize: SIZE.text, textColor: textColor, opacity: contentOpacity, css: { whiteSpace: "nowrap" } });
                if (state.waiting) drawSpinner(textColor);

            endGroup();
            return button;
        };

        const getButtonFill = function (kind, state, theme) {
            if (kind.kind != "primary") return "transparent";
            if (state.hover || state.pressed) return theme.inkHover;
            return theme.ink;
        };

        const getButtonLine = function (kind, state, theme) {
            const isActive = (state.hover || state.pressed);
            if (kind.kind == "primary") return getButtonFill(kind, state, theme);
            if (kind.kind == "danger") return isActive ? theme.danger : theme.dangerLine;
            if (kind.kind == "quiet") return isActive ? theme.line : "transparent";
            return isActive ? theme.lineHover : theme.line;
        };

        const getButtonTextColor = function (kind, theme) {
            if (kind.kind == "primary") return theme.onInk;
            if (kind.kind == "danger") return theme.danger;
            return theme.text;
        };

        // LABEL: A turning ring over the faded content (the button keeps its size while it waits)
        const drawSpinner = function (color) {
            const spinner = Label({ width: BUTTON.spinnerSize, height: BUTTON.spinnerSize, text: getSpinnerSvg(color), css: { lineHeight: "0" } });
            spinner.css = { position: "absolute", left: "50%", top: "50%", transform: "translate(-50%, -50%)" };
            return spinner;
        };

        const getSpinnerSvg = function (color) {
            return '<svg viewBox="0 0 16 16" width="100%" height="100%" style="display: block">' +
                '<circle cx="8" cy="8" r="6.5" fill="none" stroke="' + color + '" stroke-opacity="0.25" stroke-width="1.5"/>' +
                '<path d="M8 1.5a6.5 6.5 0 0 1 6.5 6.5" fill="none" stroke="' + color + '" stroke-width="1.5" stroke-linecap="round"/>' +
                "<\/svg>";
        };

        // *** INPUT B

        const drawFieldCell = function (state, theme) {
            const field = VGroup({ width: FIELD.width, height: "auto", align: "left top", gap: FIELD.titleGap, clipContent: 0 });
            if (state.disabled) field.opacity = SIZE.disabledOpacity;
                Label({ text: state.title, fontSize: SIZE.small, textColor: theme.softText });
                drawFieldBox(state, theme);
                if (state.error) Label({ text: state.error, fontSize: SIZE.small, textColor: theme.danger });
            endGroup();
            return field;
        };

        // GROUP: The line around the text (a textarea is higher and its text starts at the top)
        const drawFieldBox = function (state, theme) {
            const box = HGroup({
                width: "100%",
                height: state.textarea ? FIELD.textareaHeight : SIZE.control,
                align: state.textarea ? "left top" : "left center",
                gap: BUTTON.gap,
                padding: state.textarea ? FIELD.textareaPadding : FIELD.padding,
                color: "transparent",
                round: SIZE.round,
                border: SIZE.line,
                borderColor: getFieldLine(state, theme),
            });
                drawFieldText(state, theme);
                if (state.focus) drawCaret(theme);
                if (state.password) drawIcon("eye", theme.softText);
            endGroup();
            return box;
        };

        const drawFieldText = function (state, theme) {
            const hasValue = !!state.value;
            const text = hasValue ? state.value : state.placeholder;
            const label = Label({ text: text, fontSize: SIZE.text, textColor: hasValue ? theme.text : theme.faintText });
            if (state.password) label.grow = 1;
            if (state.textarea) label.props({ width: "100%", lineHeight: "1.45" });
            return label;
        };

        // BOX: The text cursor, right after the text (the gap of the group is for the icons)
        const drawCaret = function (theme) {
            const caret = Box({ width: 1, height: FIELD.caretHeight, color: theme.ink, position: "relative" });
            caret.css = { marginLeft: (1 - BUTTON.gap) + "px" };
            return caret;
        };

        const getFieldLine = function (state, theme) {
            if (state.error) return theme.danger;
            if (state.focus) return theme.ink;
            if (state.hover) return theme.edgeHover;
            return theme.edge;
        };

        // *** SEARCH INPUT

        const drawSearchCell = function (state, theme) {
            const search = HGroup({ width: SEARCH.width, height: SIZE.control, align: "left center", gap: SEARCH.gap, padding: SEARCH.padding, color: "transparent", round: SEARCH.round, border: SIZE.line, borderColor: getFieldLine(state, theme) });
                drawIcon("search", theme.softText);
                drawSearchText(state, theme);
                if (state.focus) drawCaret(theme);
                if (state.value) drawIcon("close", theme.softText, 12);
            endGroup();
            return search;
        };

        const drawSearchText = function (state, theme) {
            const hasValue = !!state.value;
            const text = hasValue ? state.value : state.placeholder;
            return Label({ text: text, fontSize: SIZE.text, textColor: hasValue ? theme.text : theme.faintText });
        };

        // *** SELECT BOX

        const drawSelectCell = function (state, theme) {
            const group = VGroup({ width: SELECT.width, height: "auto", align: "left top", gap: SELECT.panelGap, clipContent: 0 });
            if (state.disabled) group.opacity = SIZE.disabledOpacity;
                drawSelectField(state, theme);
                if (state.isOpen) drawSelectPanel(state, theme);
            endGroup();
            return group;
        };

        // GROUP: The field: the chosen option (or the placeholder) and the chevron
        const drawSelectField = function (state, theme) {
            const field = HGroup({ width: "100%", height: SIZE.control, align: "left center", gap: BUTTON.gap, padding: SELECT.padding, color: "transparent", round: SIZE.round, border: SIZE.line, borderColor: getSelectLine(state, theme) });
                drawSearchText(state, theme).grow = 1;
                const chevron = drawIcon("chevronDown", theme.softText);
                if (state.isOpen) chevron.css = { transform: "rotate(180deg)" };
            endGroup();
            return field;
        };

        const getSelectLine = function (state, theme) {
            if (state.isOpen) return theme.ink;
            if (state.hover) return theme.edgeHover;
            return theme.edge;
        };

        // GROUP: The open list under the field: the rows of ItemList
        const drawSelectPanel = function (state, theme) {
            const panel = drawListFrame(theme, "100%");
                SELECT_OPTIONS.forEach(function (option) {
                    drawListRow({ title: option, selected: (option == state.value), hover: (option == state.hoverOption) }, theme);
                });
            endGroup();
            return panel;
        };

        // *** CHECK BOX, RADIO BUTTON, TOGGLE

        const drawChoiceCell = function (state, theme) {
            drawChoice(state, theme, "Remember me", drawCheckMark);
            drawChoice(state, theme, "Monthly", drawRadioMark);
            drawChoice(state, theme, "Sounds", drawToggleMark);
        };

        // GROUP: A mark and its text
        const drawChoice = function (state, theme, text, drawMark) {
            const choice = HGroup({ hug: 1, align: "left center", gap: CHECK.gap, clipContent: 0 });
            if (state.disabled) choice.opacity = SIZE.disabledOpacity;
                const mark = drawMark(state, theme);
                if (state.focus) mark.boxShadow = getFocusRing(theme);
                Label({ text: text, fontSize: SIZE.text, textColor: theme.text, css: { whiteSpace: "nowrap" } });
            endGroup();
            return choice;
        };

        const getMarkLine = function (state, theme) {
            if (state.on) return theme.ink;
            if (state.hover) return theme.edgeHover;
            return theme.edge;
        };

        // GROUP: The square of a CheckBox, an ink tick in it when on
        const drawCheckMark = function (state, theme) {
            const mark = HGroup({ width: CHECK.size, height: CHECK.size, align: "center center", color: "transparent", border: SIZE.line, borderColor: getMarkLine(state, theme), round: CHECK.round });
                if (state.on) drawIcon("check", theme.ink, CHECK.tickSize, CHECK.tickStroke);
            endGroup();
            return mark;
        };

        // GROUP: The circle of a RadioButton, an ink dot in it when on
        const drawRadioMark = function (state, theme) {
            const mark = HGroup({ width: CHECK.size, height: CHECK.size, align: "center center", color: "transparent", border: SIZE.line, borderColor: getMarkLine(state, theme), round: 100 });
                if (state.on) Box({ width: CHECK.dotSize, height: CHECK.dotSize, color: theme.ink, round: 100, position: "relative" });
            endGroup();
            return mark;
        };

        // GROUP: The track of a Toggle: its knob at the left (off, in the line color) or at the right (on, in ink)
        const drawToggleMark = function (state, theme) {
            const track = HGroup({ width: TOGGLE.width, height: TOGGLE.height, align: state.on ? "right center" : "left center", padding: [TOGGLE.space, 0], color: "transparent", border: SIZE.line, borderColor: getMarkLine(state, theme), round: 100 });
                Box({ width: TOGGLE.knob, height: TOGGLE.knob, color: state.on ? theme.ink : theme.lineHover, round: 100, position: "relative" });
            endGroup();
            return track;
        };

        // *** SLIDER

        const drawSliderCell = function (state, theme) {
            const slider = Box({ width: SLIDER.width, height: SLIDER.height, color: "transparent", position: "relative", clipContent: 0 });
            if (state.dragging) slider.css = { marginTop: SLIDER.bubbleRoom + "px" };
            if (state.disabled) slider.opacity = SIZE.disabledOpacity;
            createIn(slider, function () {
                const from = state.from || 0;
                drawTrack(0, 1, theme.track, SLIDER);
                drawTrack(from, state.value, theme.ink, SLIDER);
                if (state.from !== undefined) drawThumb(state.from, state, theme);
                drawThumb(state.value, state, theme);
                if (state.dragging) drawValueBubble(state.value, theme);
            });
            return slider;
        };

        // BOX: A part of the track, from one value to another (0 - 1)
        const drawTrack = function (from, to, color, look) {
            const track = Box({ color: color, round: look.trackHeight / 2 });
            track.css = { left: (from * 100) + "%", top: "calc(50% - " + (look.trackHeight / 2) + "px)", width: ((to - from) * 100) + "%", height: look.trackHeight + "px" };
            return track;
        };

        // BOX: The knob: the ground of the window with an ink line
        const drawThumb = function (value, state, theme) {
            const size = state.hover ? SLIDER.thumbHoverSize : SLIDER.thumbSize;
            const thumb = Box({ width: size, height: size, color: theme.ground, border: SIZE.line, borderColor: theme.ink, round: 100 });
            thumb.css = { left: "calc(" + (value * 100) + "% - " + (size / 2) + "px)", top: "calc(50% - " + (size / 2) + "px)" };
            if (state.focus) thumb.boxShadow = getFocusRing(theme);
            return thumb;
        };

        // LABEL: The value over the knob while it is dragged
        const drawValueBubble = function (value, theme) {
            const bubble = Label({ text: Math.round(value * 100), fontSize: SIZE.caption, textColor: theme.onInk, color: theme.ink, round: 3, padding: SLIDER.bubblePadding });
            bubble.css = { left: (value * 100) + "%", top: "-" + SLIDER.bubbleRoom + "px", transform: "translateX(-50%)" };
            return bubble;
        };

        // *** PROGRESS BAR

        const drawProgressCell = function (state, theme) {
            const group = VGroup({ width: PROGRESS.width, height: "auto", align: "left top", gap: PROGRESS.gap });
                HGroup({ width: "100%", height: "auto", align: "left center" });
                    Label({ text: "Uploading files", fontSize: SIZE.small, textColor: theme.text, grow: 1 });
                    Label({ text: Math.round(state.value * 100) + " %", fontSize: SIZE.small, textColor: theme.softText });
                endGroup();
                const track = Box({ width: "100%", height: PROGRESS.trackHeight, color: "transparent", position: "relative" });
                createIn(track, function () {
                    drawTrack(0, 1, theme.track, PROGRESS);
                    drawTrack(0, state.value, state.error ? theme.danger : theme.ink, PROGRESS);
                });
                if (state.error) Label({ text: state.error, fontSize: SIZE.small, textColor: theme.danger });
            endGroup();
            return group;
        };

        // *** ITEM LIST

        const drawListCell = function (state, theme) {
            if (state.isEmpty) return drawEmptyList(theme);
            const list = drawListFrame(theme, LIST.width);
                state.rows.forEach(function (row) {
                    drawListRow(row, theme);
                });
            endGroup();
            return list;
        };

        // GROUP: The line around a list (no fill: the window shows through). Ended by the caller.
        const drawListFrame = function (theme, width) {
            return VGroup({ width: width, height: "auto", align: "left top", gap: 0, padding: LIST.padding, color: theme.ground, round: SIZE.round, border: SIZE.line, borderColor: theme.line, clipContent: 0 });
        };

        // GROUP: A row (or a section title): a line around it only when it is under the mouse, selected or focused
        const drawListRow = function (row, theme) {
            if (row.section) return drawListSection(row.section, theme);
            const isTall = !!row.desc;
            const group = HGroup({
                width: "100%",
                height: isTall ? LIST.tallRowHeight : SIZE.control,
                align: "left center",
                gap: LIST.gap,
                padding: LIST.rowPadding,
                color: "transparent",
                round: LIST.rowRound,
                border: SIZE.line,
                borderColor: getRowLine(row, theme),
                clipContent: 0,
            });
            if (row.focus) group.boxShadow = getFocusRing(theme);
            if (row.disabled) group.opacity = SIZE.disabledOpacity;
                const textColor = row.selected ? theme.ink : theme.text;
                if (row.icon) drawIcon(row.icon, row.selected ? theme.ink : theme.softText).shrink = 0;
                drawRowTexts(row, textColor, theme);
                if (row.selected) drawIcon("check", theme.ink).shrink = 0;
            endGroup();
            return group;
        };

        const getRowLine = function (row, theme) {
            if (row.selected) return theme.ink;
            if (row.hover) return theme.lineHover;
            return "transparent";
        };

        const drawRowTexts = function (row, textColor, theme) {
            const texts = VGroup({ width: "auto", height: "auto", align: "left center", gap: 0, grow: 1 });
            // WHY: a long title would widen the row out of the list; from 0 the texts only take the free room.
            texts.css = { minWidth: "0", flexBasis: "0" };
                Label({ width: "100%", text: row.title, fontSize: SIZE.text, textColor: textColor, ellipsis: 1 });
                if (row.desc) Label({ width: "100%", text: row.desc, fontSize: SIZE.small, textColor: theme.softText, ellipsis: 1 });
            endGroup();
            return texts;
        };

        const drawListSection = function (text, theme) {
            return Label({ width: "100%", text: text.toUpperCase(), fontSize: SIZE.caption, fontFamily: FONT.bold, textColor: theme.faintText, padding: LIST.sectionPadding, css: { letterSpacing: "0.3px" } });
        };

        // GROUP: A dashed frame with an icon and a short text in its middle
        const drawEmptyList = function (theme) {
            const empty = VGroup({ width: LIST.width, height: 96, align: "center center", gap: 6, color: "transparent", round: SIZE.round, border: SIZE.line, borderColor: theme.line });
            empty.css = { borderStyle: "dashed" };
                drawIcon("folder", theme.faintText, 20);
                Label({ text: "No items yet", fontSize: SIZE.small, textColor: theme.softText });
            endGroup();
            return empty;
        };

        // *** TABS

        const drawTabsCell = function (state, theme) {
            const bar = HGroup({ width: TABS.width, height: "auto", align: "left bottom", gap: 0, clipContent: 0 });
            bar.css = { borderBottom: SIZE.line + "px solid " + theme.line };
                TAB_NAMES.forEach(function (name, index) {
                    drawTab(name, index, state, theme);
                });
            endGroup();
            return bar;
        };

        // GROUP: A tab: its text and the line under it (ink when selected)
        const drawTab = function (name, index, state, theme) {
            const isSelected = (index == state.selected);
            const isTarget = (index == 1); // the hover and the focus are drawn on the second tab
            const tab = VGroup({ hug: 1, align: "left top", gap: 0, round: SIZE.round, clipContent: 0 });

        const drawSectionObjects = function (theme) {
            const objects = VGroup({ width: "100%", height: "auto", align: "left top", gap: ACCORDION.contentGap, padding: ACCORDION.contentPadding });
                drawChoice({}, theme, "Open with the system", drawCheckMark);
                drawChoice({ on: 1 }, theme, "Look for updates", drawCheckMark);
            endGroup();
            return objects;
        };

        // *** SLIDER FIELD

        // BOX: A field: the fill of the value, the handle at its end, the label, the value, the dots of the steps
        const drawSliderFieldCell = function (state, theme) {
            const field = Box({ width: SLIDER_FIELD.width, height: SIZE.control, color: "transparent", round: SIZE.round, border: SIZE.line, borderColor: (state.focus) ? theme.focus : theme.edge, position: "relative" });
            if (state.focus) field.boxShadow = "inset 0 0 0 " + SIZE.line + "px " + theme.focus;
            if (state.disabled) field.opacity = SIZE.disabledOpacity;
            createIn(field, function () {
                const track = getSliderFieldTrack();
                const fillWidth = track.start + state.value * (track.end - track.start);
                Box({ left: 0, top: 0, width: fillWidth, height: "100%", color: getSliderFieldFill(state, theme), css: { borderRadius: SLIDER_FIELD.fillRound + "px 0 0 " + SLIDER_FIELD.fillRound + "px" } });
                drawSliderFieldTicks(fillWidth, track.end, theme);
                Box({ left: fillWidth - SLIDER_FIELD.handleInset - SLIDER_FIELD.handleWidth, top: (SIZE.control - 2 - SLIDER_FIELD.handleHeight) / 2, width: SLIDER_FIELD.handleWidth, height: SLIDER_FIELD.handleHeight, color: getSliderFieldHandle(state, theme), round: 1 });
                Label({ left: SLIDER_FIELD.labelPadding, top: 0, height: "100%", text: SLIDER_FIELD.labelText, fontSize: SIZE.small, textColor: theme.softText, lineHeight: (SIZE.control - 2) + "px" });
                Label({ left: "auto", top: 0, height: "100%", text: Math.round(state.value * 100) + " px", fontSize: SIZE.text, textColor: theme.text, lineHeight: (SIZE.control - 2) + "px", css: { right: SLIDER_FIELD.labelPadding + "px" } });
            });
            return field;
        };

        // Where the end of the fill moves: after the label (aroundLabel), before the value (beforeValue)
        const getSliderFieldTrack = function () {
            const inner = SLIDER_FIELD.width - 2;
            const start = SLIDER_FIELD.labelPadding + SLIDER_FIELD.labelWidth + SLIDER_FIELD.labelSpace;
            const end = inner - SLIDER_FIELD.labelPadding - SLIDER_FIELD.valueWidth - SLIDER_FIELD.valueSpace;
            return { start: start, end: end };
        };

        const getSliderFieldFill = function (state, theme) {
            if (state.dragging) return theme.fillActive;
            if (state.hover) return theme.fillHover;
            return theme.fill;
        };

        const getSliderFieldHandle = function (state, theme) {
            if (state.dragging) return theme.ink;
            if (state.hover) return theme.edgeHover;
            return theme.edge;
        };

        // BOX: The dots of the steps in the empty part
        const drawSliderFieldTicks = function (from, to, theme) {
            const space = (to - from) / (SLIDER_FIELD.tickCount + 1);
            const top = (SIZE.control - 2 - SLIDER_FIELD.tickSize) / 2;
            for (let i = 1; i <= SLIDER_FIELD.tickCount; i++) {
                Box({ left: Math.round(from + space * i), top: top, width: SLIDER_FIELD.tickSize, height: SLIDER_FIELD.tickSize, color: theme.line, round: 1 });
            }
        };

        // *** STEP BAR

        const drawStepCell = function (state, theme) {
            const bar = HGroup({ width: STEP_BAR.width, height: "auto", align: "left top", gap: 0, clipContent: 0 });
                STEP_NAMES.forEach(function (name, index) {
                    drawStep(name, index, state, theme);
                });
            endGroup();
            return bar;
        };

        // GROUP: A step: the halves of the line to its neighbours, its circle and its title
        const drawStep = function (name, index, state, theme) {
            const isDone = (index < state.current);
            const isNow = (index === state.current);
            const step = VGroup({ width: "auto", height: "auto", align: "center top", gap: STEP_BAR.titleSpace, clipContent: 0, css: { flex: "1 1 0", minWidth: "0", position: "relative" } });
                if (index > 0) drawStepLine((isDone || isNow) ? theme.ink : theme.line, "left");
                if (index < STEP_NAMES.length - 1) drawStepLine((isDone) ? theme.ink : theme.line, "right");
                drawStepCircle(index, isDone, isNow, state, theme);
                Label({ text: name, fontSize: SIZE.small, fontFamily: (isNow) ? FONT.bold : FONT.regular, textColor: (isDone || isNow) ? theme.text : theme.softText });
            endGroup();
            return step;
        };

        // BOX: The half of the line on one side of the circle (STEP_BAR.lineSpace away from it)
        const drawStepLine = function (color, side) {
            const length = "calc(50% - " + (STEP_BAR.circle / 2 + STEP_BAR.lineSpace) + "px)";
            const top = (STEP_BAR.circle - SIZE.line) / 2;
            const place = (side === "left") ? { left: "0px" } : { left: "auto", right: "0px" };
            return Box({ height: SIZE.line, color: color, css: Object.assign({ position: "absolute", top: top + "px", width: length }, place) });
        };

        // GROUP: The circle: ink behind and now (a check behind), a soft line ahead; the ring of the mouse or of the keyboard
        const drawStepCircle = function (index, isDone, isNow, state, theme) {
            const isReached = (isDone || isNow);
            const circle = HGroup({ width: STEP_BAR.circle, height: STEP_BAR.circle, align: "center center", round: 100, color: (isReached) ? theme.ink : "transparent", border: SIZE.line, borderColor: (isReached) ? theme.ink : theme.line, clipContent: 0 });
            if (index === state.hoverIndex) circle.boxShadow = "0 0 0 " + STEP_BAR.hoverRing + "px " + theme.hover;
            if (index === state.focusIndex) circle.css = { outline: STEP_BAR.ringWidth + "px solid " + theme.focus, outlineOffset: STEP_BAR.ringSpace + "px" };
                if (isDone) drawIcon("check", theme.onInk, STEP_BAR.checkSize, 2.5);
                if (!isDone) Label({ text: String(index + 1), fontSize: SIZE.caption, textColor: (isNow) ? theme.onInk : theme.softText });
            endGroup();
            return circle;
        };

        // *** TAG INPUT

        const drawTagCell = function (state, theme) {
            const group = VGroup({ width: TAG_INPUT.width, height: "auto", align: "left top", gap: PICKER.panelGap, clipContent: 0 });
                drawTagField(state, theme);
                if (state.error) Label({ text: state.error, fontSize: SIZE.caption, textColor: theme.danger });
                if (state.suggestions) drawSuggestions(state, theme);
            endGroup();
            return group;
        };

        // GROUP: The field: the tags, the typed text (or the placeholder), the text cursor
        const drawTagField = function (state, theme) {
            const field = HGroup({ width: "100%", height: SIZE.control, align: "left center", gap: TAG_INPUT.gap, padding: TAG_INPUT.padding, color: "transparent", round: SIZE.round, border: SIZE.line, borderColor: getTagLine(state, theme) });
                state.tags.forEach(function (tag) {
                    drawTag(tag, (tag === state.chosenTag), theme);
                });
                if (state.value) Label({ text: state.value, fontSize: SIZE.text, textColor: theme.text });
                if (state.placeholder) Label({ text: state.placeholder, fontSize: SIZE.text, textColor: theme.faintText, css: { marginLeft: "4px" } });
                if (state.focus && !state.chosenTag) drawCaret(theme).css = { marginLeft: (1 - TAG_INPUT.gap) + "px" };
            endGroup();
            return field;
        };

        const getTagLine = function (state, theme) {
            if (state.error) return theme.danger;
            if (state.focus) return theme.ink;
            return theme.edge;
        };

        // GROUP: A tag: a soft line around its text and a cross (ink when the keyboard chose it)
        const drawTag = function (text, isChosen, theme) {
            const tag = HGroup({ width: "auto", height: TAG_INPUT.tagHeight, align: "left center", gap: TAG_INPUT.tagGap, padding: TAG_INPUT.tagPadding, color: (isChosen) ? theme.ink : "transparent", round: TAG_INPUT.tagRound, border: SIZE.line, borderColor: (isChosen) ? theme.ink : theme.line });
                Label({ text: text, fontSize: SIZE.small, textColor: (isChosen) ? theme.onInk : theme.text });
                drawIcon("close", (isChosen) ? theme.onInk : theme.softText, TAG_INPUT.crossSize);
            endGroup();
            return tag;
        };

        // GROUP: The suggestions under the field: rows of ItemList, the typed part in bold
        const drawSuggestions = function (state, theme) {
            const list = drawListFrame(theme, "100%");
                state.suggestions.forEach(function (word) {
                    const typed = word.slice(0, state.value.length);
                    const rest = word.slice(state.value.length);
                    const row = HGroup({ width: "100%", height: SIZE.control, align: "left center", gap: 0, padding: LIST.rowPadding });
                        Label({ text: '<span style="font-family: ' + FONT.bold + '">' + typed + "<\/span>" + rest, fontSize: SIZE.text, textColor: theme.text });
                    endGroup();
                });
            endGroup();
            return list;
        };

        // *** SPLITTER

        // GROUP: Two areas and the line between them
        const drawSplitterCell = function (state, theme) {
            const areas = HGroup({ width: SPLITTER.width, height: SPLITTER.height, align: "left top", gap: 0, color: "transparent", round: SIZE.round, border: SIZE.line, borderColor: theme.line });
                Box({ width: SPLITTER.firstWidth, height: "100%", color: "transparent", position: "relative" });
                Box({ width: getSplitterLineSize(state), height: "100%", color: getSplitterLineColor(state, theme), position: "relative" });
                Box({ width: "auto", height: "100%", color: "transparent", position: "relative", grow: 1 });
            endGroup();
            return areas;
        };

        const getSplitterLineSize = function (state) {
            if (state.active || state.focus) return SPLITTER.activeSize;
            return SIZE.line;
        };

        const getSplitterLineColor = function (state, theme) {
            if (state.active) return theme.ink;
            if (state.focus) return theme.focus;
            return theme.line;
        };

        // *** SIDE PANEL, LOADING SCREEN, GRAPH BOX

        const drawPanelCell = function (state, theme) {
            if (state.draw === "sidePanel") return drawSidePanel(theme);
            if (state.draw === "loading") return drawLoadingScreen(theme);
            return drawChart(theme);
        };

        // GROUP: A window under its cover, the panel at its right: a line and no shadow, as the minimal Dialog
        const drawSidePanel = function (theme) {
            const windowBox = HGroup({ width: SIDE_PANEL.width, height: SIDE_PANEL.height, align: "right top", gap: 0, color: theme.cover, round: SIZE.round });
                const panel = VGroup({ width: SIDE_PANEL.panelWidth, height: "100%", align: "left top", gap: 0, color: theme.ground });
                panel.css = { borderLeft: SIZE.line + "px solid " + theme.edge };
                    const header = HGroup({ width: "100%", height: SIDE_PANEL.headerHeight, align: "left center", gap: 0, padding: SIDE_PANEL.headerPadding });
                    header.css = { borderBottom: SIZE.line + "px solid " + theme.line };
                        Label({ text: "Filters", fontSize: SIDE_PANEL.titleSize, fontFamily: FONT.bold, textColor: theme.text, grow: 1 });
                        drawIcon("close", theme.softText);
                    endGroup();
                    VGroup({ width: "100%", height: "auto", align: "left top", gap: SIDE_PANEL.bodyGap, padding: SIDE_PANEL.bodyPadding });
                        drawChoice({ on: 1 }, theme, "Only the new ones", drawCheckMark);
                        drawChoice({}, theme, "With a picture", drawCheckMark);
                    endGroup();
                endGroup();
            endGroup();
            return windowBox;
        };

        // GROUP: The loading screen: a title, a message, the ring of the minimal button and a 2 px progress bar
        const drawLoadingScreen = function (theme) {
            const screen = VGroup({ width: LOADING.width, height: LOADING.height, align: "center center", gap: LOADING.gap, color: theme.ground, round: SIZE.round, border: SIZE.line, borderColor: theme.line });
                Label({ text: "My App", fontSize: LOADING.titleSize, fontFamily: FONT.bold, textColor: theme.text });
                Label({ text: "Loading the data...", fontSize: SIZE.text, textColor: theme.softText });
                Label({ width: LOADING.ringSize, height: LOADING.ringSize, text: getLoadingRingSvg(theme.ink), css: { lineHeight: "0" } });
                drawLoadingProgress(theme);
            endGroup();
            return screen;
        };

        // A faint circle and a quarter of it in ink (the ring of the minimal SmartButton, still, with a 2 px line)
        const getLoadingRingSvg = function (color) {
            const middle = LOADING.ringSize / 2;
            const radius = middle - LOADING.ringLine / 2;
            const arc = "M" + middle + " " + (middle - radius) + " A" + radius + " " + radius + " 0 0 1 " + (middle + radius) + " " + middle;
            return '<svg viewBox="0 0 ' + LOADING.ringSize + " " + LOADING.ringSize + '" width="100%" height="100%" style="display: block">' +
                '<circle cx="' + middle + '" cy="' + middle + '" r="' + radius + '" fill="none" stroke="' + color + '" stroke-opacity="0.2" stroke-width="' + LOADING.ringLine + '"/>' +
                '<path d="' + arc + '" fill="none" stroke="' + color + '" stroke-width="' + LOADING.ringLine + '" stroke-linecap="round"/>' +
                "<\/svg>";
        };

        // BOX: The track of the progress, its done part in ink
        const drawLoadingProgress = function (theme) {
            const track = Box({ width: LOADING.progressWidth, height: LOADING.progressHeight, color: theme.track, round: 1, position: "relative" });
            createIn(track, function () {
                Box({ left: 0, top: 0, width: LOADING.progressWidth * LOADING.progress, height: "100%", color: theme.ink, round: 1 });
            });
            return track;
        };

        // GROUP: A bar chart: a line around it, a 13 px title, a faint grid with 11 px numbers, bars in the first color of the data
        const drawChart = function (theme) {
            const chart = VGroup({ width: CHART.width, height: "auto", align: "left top", gap: CHART.gap, padding: CHART.padding, color: theme.ground, round: SIZE.round, border: SIZE.line, borderColor: theme.line });
                Label({ text: "Sales", fontSize: SIZE.text, fontFamily: FONT.bold, textColor: theme.text });
                const plot = Box({ width: "100%", height: CHART.plotHeight, color: "transparent", position: "relative", clipContent: 0 }); // WHY: the numbers of the top and the bottom line stand over its edges
                createIn(plot, function () {
                    drawChartGrid(theme);
                    drawChartBars(theme);
                });
                drawChartLabels(theme);
            endGroup();
            return chart;
        };

        const getPlotWidth = function () {
            return CHART.width - CHART.padding * 2 - SIZE.line * 2;
        };

        // The lines of the grid and their numbers (the line of 0 is the axis: the soft line of the theme)
        const drawChartGrid = function (theme) {
            CHART.ticks.forEach(function (tick) {
                const top = Math.round(CHART.plotHeight - (tick / CHART.max) * CHART.plotHeight);
                Box({ left: CHART.axisWidth, top: Math.min(top, CHART.plotHeight - 1), width: getPlotWidth() - CHART.axisWidth, height: 1, color: (tick === 0) ? theme.line : theme.grid });
                Label({ left: 0, top: top - 8, width: CHART.axisWidth - 6, text: String(tick), fontSize: SIZE.caption, textColor: theme.softText, textAlign: "right" });
            });
        };

        // A bar per value, round at its top
        const drawChartBars = function (theme) {
            const slot = (getPlotWidth() - CHART.axisWidth) / CHART.values.length;
            CHART.values.forEach(function (value, index) {
                const height = Math.round((value / CHART.max) * CHART.plotHeight);
                const left = Math.round(CHART.axisWidth + slot * index + (slot - CHART.barWidth) / 2);
                Box({ left: left, top: CHART.plotHeight - height, width: CHART.barWidth, height: height, color: theme.chart, css: { borderRadius: CHART.barRound + "px " + CHART.barRound + "px 0 0" } });
            });
        };

        // GROUP: The names of the bars under them
        const drawChartLabels = function (theme) {
            const slot = (getPlotWidth() - CHART.axisWidth) / CHART.values.length;
            const labels = HGroup({ width: "100%", height: "auto", align: "left top", gap: 0 });
            labels.css = { paddingLeft: CHART.axisWidth + "px", marginTop: (-CHART.gap + 4) + "px" };
                CHART.labels.forEach(function (text) {
                    Label({ width: slot, text: text, fontSize: SIZE.caption, textColor: theme.softText, textAlign: "center" });
                });
            endGroup();
            return labels;
        };

    </script>

<!DOCTYPE html>
<html lang="en">

<head>
    <title>ProgressBar draft</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- LIBRARY FILES (a draft: no component, only basic.js objects) -->
    <link rel="preload" href="../basic/font/open-sans/OpenSans-Regular.ttf" as="font" crossorigin="anonymous">
    <link rel="preload" href="../basic/font/open-sans/OpenSans-Bold.ttf" as="font" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="../basic/basic.css">
    <script src="../basic/basic.js" type="text/javascript" charset="utf-8"></script>

    <script>

        /* Bismillah */

        // DRAFT DESIGN of comp/progress-bar.js (ProgressBar): every state of the packages side by side, each package on a
        // card in the color of its page. "light" and "dark" are the NEW looks of the kit (a new design, not copies: they
        // will take the place of the "light" package, its old name "classic", and be the "dark" the component does not
        // have; ozdenDark is the dark of ozden): a thin round track of 10 px with no edge, the bar in the accent, the
        // second part a lighter accent, a 14 px title and a 13 px value. "modern" and "ozden" (the look of SmartButton)
        // are copies of their packages. Plain basic.js objects (no ProgressBar here); the moving bar and the stripes
        // are still frames. The tokens at the top are the same in every draft of the new look.
        // http://127.0.0.1:5505/_basic-designer/index.htm?page=_designs/progress-bar.htm

        // THE TOKENS OF THE NEW LIGHT / DARK LOOK (the same in every draft of it)
        const LIGHT_TOKENS = {
            page: "#FFFFFF", // the page the component sits on
            surface: "#FFFFFF", // a field, a list, the face of a button
            soft: "#F2F3F0", // under the mouse, the ground of an icon, a quiet field
            softer: "#E6E7E3", // pressed, a track
            line: Black(0.12), // the edge of a surface
            lineStrong: Black(0.3), // the edge under the mouse
            text: Black(0.88),
            textSoft: Black(0.55),
            textFaint: Black(0.38), // a placeholder
            accent: "#3D7A6B", // the one color: a selected row, a fill, the main button, the edge while typing
            accentHover: "#356C5E",
            accentPress: "#2E5F53",
            accentSoft: "#E4EFEB", // a tint of the accent on the surface
            onAccent: "#FFFFFF", // a text or a mark on the accent
            danger: "#D9534F",
            warning: "#E5885E",
            focusRing: "rgba(61, 122, 107, 0.5)", // the ring of the keyboard focus
        };
        const DARK_TOKENS = {
            page: "#1A1A19",
            surface: "#232322",
            soft: "#2C2C2B",
            softer: "#363635",
            line: White(0.12),
            lineStrong: White(0.32),
            text: White(0.9),
            textSoft: White(0.55),
            textFaint: White(0.38),
            accent: "#65A293",
            accentHover: "#74B0A2",
            accentPress: "#5A9385",
            accentSoft: "rgba(101, 162, 147, 0.2)",
            onAccent: "#0F1F1B",
            danger: "#E0605A",
            warning: "#F0A07A",
            focusRing: "rgba(101, 162, 147, 0.55)",
        };

        const PAGE_COLOR = "#F4F5F2"; // the ground of the draft, not of the bars
        const PAGE_TEXT = { title: Black(0.8), note: Black(0.5), state: Black(0.45), stateTitle: Black(0.4) }; // the texts of the draft
        const BAR_WIDTH = 300;
        const ROW_GAP = 10; // the component: between the title and the value text, the track and the value text
        const STATE_COLUMN_WIDTH = 190;
        const ROW_HEIGHT = 64; // a state without a limit text (one with it: its own rowHeight)
        const HEADER_HEIGHT = 24;
        const CARD_PADDING = 24;
        const COLUMN_GAP = 24;
        const SOFT_BLUE = "#7BA7D9"; // a limit with its own color (the ozden sample)
        const LIGHT_PAGE = { color: LIGHT_TOKENS.page, textColor: LIGHT_TOKENS.textSoft }; // the page of a light package
        const DARK_PAGE = { color: DARK_TOKENS.page, textColor: DARK_TOKENS.textSoft }; // the dark card of the kit

        // THE STYLE PACKAGES: light and dark are the new design; modern and ozden are copies of ProgressBar.styles
        const LOOKS = {
            // A thin round track with no edge, the bar in the accent; the second part the accent at 35 %; a limit is a
            // 2 px line in a soft gray with its text under it
            light: {
                name: "light (new)",
                page: LIGHT_PAGE,
                gap: 6,
                track: { height: 10, color: LIGHT_TOKENS.softer, round: 100, border: 0, borderColor: "transparent" },
                darkTrack: { color: "#2E2E2D", borderColor: "transparent", limitColor: White(0.7) },
                bar: { color: LIGHT_TOKENS.accent, fillOpacity: 1, border: 0, borderColor: "", boxShadow: "none", innerRound: "", joinEdge: 1 },
                secondBar: { color: "", fillOpacity: 0.35, lighten: 0, borderOpacity: 0.45 },
                stripes: { color: "rgba(255, 255, 255, 0.35)", size: 14 },
                limit: { shape: "line", color: Black(0.45), width: 2, round: 1, overhang: 4, dotSize: 6, dotOpacity: 1, barColor: "white", secondBarColor: "", textSize: 12, textColor: LIGHT_TOKENS.textSoft, textSpace: 6 },
                successColor: "#5DB36B",
                errorColor: LIGHT_TOKENS.danger,
                title: { fontSize: 14, textColor: LIGHT_TOKENS.text },
                valueText: { fontSize: 13, textColor: LIGHT_TOKENS.textSoft },
            },
            // The same shapes on the dark page
            dark: {
                name: "dark (new)",
                page: DARK_PAGE,
                gap: 6,
                track: { height: 10, color: DARK_TOKENS.softer, round: 100, border: 0, borderColor: "transparent" },
                darkTrack: { color: "#111110", borderColor: White(0.2), limitColor: White(0.7) },
                bar: { color: DARK_TOKENS.accent, fillOpacity: 1, border: 0, borderColor: "", boxShadow: "none", innerRound: "", joinEdge: 1 },
                secondBar: { color: "", fillOpacity: 0.35, lighten: 0, borderOpacity: 0.45 },
                stripes: { color: "rgba(255, 255, 255, 0.25)", size: 14 },
                limit: { shape: "line", color: White(0.5), width: 2, round: 1, overhang: 4, dotSize: 6, dotOpacity: 1, barColor: "#141414", secondBarColor: "", textSize: 12, textColor: DARK_TOKENS.textSoft, textSpace: 6 },
                successColor: "#7FCB8F",
                errorColor: "#FF7B72",
                title: { fontSize: 14, textColor: DARK_TOKENS.text },
                valueText: { fontSize: 13, textColor: DARK_TOKENS.textSoft },
            },
            modern: {
                name: "modern",
                page: LIGHT_PAGE,
                gap: 8,
                track: { height: 10, color: "#DFECEC", round: 100, border: 0, borderColor: "transparent" },
                darkTrack: { color: "#242424", borderColor: White(0.4), limitColor: White(0.7) },
                bar: { color: "cadetblue", fillOpacity: 1, border: 0, borderColor: "", boxShadow: "none", innerRound: "", joinEdge: 1 },
                secondBar: { color: Black(0.35), fillOpacity: 0.2, lighten: 0, borderOpacity: 0.45 },
                stripes: { color: "rgba(255, 255, 255, 0.35)", size: 14 },
                limit: { shape: "line", color: "indianred", width: 1, round: 0, overhang: 6, dotSize: 6, dotOpacity: 1, barColor: "white", secondBarColor: "", textSize: 13, textColor: Black(0.7), textSpace: 6 },
                successColor: "#6FCF97",
                errorColor: "tomato",
                title: { fontSize: 16, textColor: Black(0.85) },
                valueText: { fontSize: 14, textColor: "cadetblue" },
            },
            ozden: {
                name: "ozden",
                page: LIGHT_PAGE,
                gap: 8,
                track: { height: 16, color: "#F2F2F2", round: 100, border: 2, borderColor: "rgba(0, 0, 0, 0.1)" },
                darkTrack: { color: Black(0.85), borderColor: "transparent", limitColor: White(0.7) },
                bar: { color: "#5BBAC1", fillOpacity: 1, border: 1, borderColor: "rgba(0, 0, 0, 0.35)", boxShadow: "inset 0 -2px 0 rgba(0, 0, 0, 0.25)", innerRound: 0, joinEdge: 0 },
                secondBar: { color: "", fillOpacity: 0.2, lighten: 0.5, borderOpacity: 0.45 },
                stripes: { color: "rgba(255, 255, 255, 0.55)", size: 14 },
                limit: { shape: "dot", color: "rgba(0, 0, 0, 0.7)", width: 4, round: 2, overhang: 4, dotSize: 6, dotOpacity: 0.85, barColor: "white", secondBarColor: "", textSize: 14, textColor: "rgba(0, 0, 0, 0.7)", textSpace: 8 },
                successColor: "#7BC362",
                errorColor: "#DE815B",
                title: { fontSize: 15, textColor: "#232323" },
                valueText: { fontSize: 14, textColor: "rgba(35, 35, 35, 0.6)" },
            },
        };

        // THE STATES (one row each). valuePosition: "top", "right", "none"
        const STATES = [
            { name: "Title and value (top)", titleText: "Uploading", value: 40, valuePosition: "top" },
            { name: "Value at the right", value: 65, valuePosition: "right" },
            { name: "No value text", value: 25, valuePosition: "none" },
            { name: "Empty (0)", titleText: "Waiting", value: 0, valuePosition: "top" },
            { name: "Complete (100)", titleText: "Done", value: 100, valuePosition: "top" },
            { name: "Two parts (70 + 5)", titleText: "Storage", value: 70, secondValue: 5, valuePosition: "top", valueText: "70% + 5%" },
            { name: "Stripes on the value", value: 55, valuePosition: "right", stripes: 1 },
            { name: "Stripes on both parts", value: 45, secondValue: 20, valuePosition: "right", stripes: 1, secondStripes: 1, valueText: "45% + 20%" },
            { name: "Limits (lines or dots)", value: 60, valuePosition: "none", limits: [{ value: 30, color: SOFT_BLUE }, { value: 80 }] },
            { name: "A limit with its text", titleText: "Speed", value: 85, valuePosition: "top", limits: [{ value: 80, text: "limit 80" }], rowHeight: 96 },
            { name: "Status: success", titleText: "Saved", value: 100, valuePosition: "top", status: "success" },
            { name: "Status: error", titleText: "Failed", value: 35, valuePosition: "top", status: "error" },
            { name: "Indeterminate (a still frame)", titleText: "Connecting...", valuePosition: "top", indeterminate: 1 },
            { name: "Another main color", value: 50, secondValue: 10, valuePosition: "right", barColor: "#40A5AF", valueText: "50% + 10%" },
            { name: "A dark track (darkTrack: 1)", value: 40, secondValue: 20, valuePosition: "right", darkTrack: 1, valueText: "40% + 20%", limits: [{ value: 80 }] },
        ];
        const INDETERMINATE_WIDTH = 35; // % of the track (the moving bar)
        const INDETERMINATE_LEFT = 30; // % (where the still frame shows it)

        const start = function () {

            page.color = PAGE_COLOR;

            // BOX: Scrolling page
            startBox(0, 0, "100%", "100%", { color: "transparent", scrollY: 1, scrollX: 1 });

                VGroup({ width: "max-content", height: "auto", align: "left top", gap: 22, padding: 40, clipContent: 0 });

                    Label({ text: "ProgressBar · draft (comp/progress-bar.js)", fontSize: 20, bold: 1, textColor: PAGE_TEXT.title });
                    Label({ text: "light and dark are a new design (in place of the light package, its old name classic, and for the dark the component does not have); modern and ozden are copies. Every row is a state.", fontSize: 13, textColor: PAGE_TEXT.note });

                    // GROUP: The names of the states, then a card for every package
                    HGroup({ width: "auto", height: "auto", align: "left top", gap: COLUMN_GAP, clipContent: 0 });
                        drawStateColumn();
                        Object.keys(LOOKS).forEach(function (name) {
                            drawLookCard(LOOKS[name]);
                        });
                    endGroup();

                endGroup();

            endBox();

        };

        const getRowHeight = function (state) {
            return state.rowHeight || ROW_HEIGHT;
        };

        // GROUP: The names of the states, one per row (the rows of the cards have the same heights)
        const drawStateColumn = function () {
            const column = VGroup({ width: STATE_COLUMN_WIDTH, height: "auto", align: "left top", gap: 0, padding: [0, CARD_PADDING] });
                Label({ height: HEADER_HEIGHT, text: "state", fontSize: 12, textColor: PAGE_TEXT.stateTitle });
                STATES.forEach(function (state) {
                    HGroup({ width: "100%", height: getRowHeight(state), align: "left center" });
                        Label({ width: "100%", text: state.name, fontSize: 12, textColor: PAGE_TEXT.state, css: { lineHeight: "1.3" } });
                    endGroup();
                });
            endGroup();
            return column;
        };

        // GROUP: A card in the color of the page of a package: its name, then one row per state
        const drawLookCard = function (look) {
            const card = VGroup({ width: "auto", height: "auto", align: "left top", gap: 0, padding: CARD_PADDING, color: look.page.color, round: 10, border: 1, borderColor: Black(0.08), clipContent: 0 });
                Label({ height: HEADER_HEIGHT, text: look.name, fontSize: 13, bold: 1, textColor: look.page.textColor, css: { whiteSpace: "nowrap" } });
                STATES.forEach(function (state) {
                    // GROUP: A row: the bar in this state
                    HGroup({ width: BAR_WIDTH, height: getRowHeight(state), align: "left center", clipContent: 0 });
                        drawBar(look, state);
                    endGroup();
                });
            endGroup();
            return card;
        };

        // GROUP: One bar as the component draws it: the top row (title, value), the track with the bars over it,
        // the limit lines, the value at the right
        const drawBar = function (look, state) {

            const valuePosition = state.valuePosition || "top";
            const valueText = state.valueText || (state.value + "%");

            const bar = VGroup({ width: BAR_WIDTH, height: "auto", align: "left top", gap: look.gap, clipContent: 0 });

                // GROUP: Top row (title, value text)
                if (state.titleText || valuePosition == "top") {
                    HGroup({ width: "100%", height: "auto", align: "left center", gap: ROW_GAP });
                        if (state.titleText) Label({ ...look.title, text: state.titleText, css: { flex: "1 1 auto" } });
                        if (valuePosition == "top" && !state.indeterminate) Label({ ...look.valueText, text: valueText, css: { marginLeft: "auto", whiteSpace: "nowrap" } });
                    endGroup();
                }

                // GROUP: Bar row (track, value text)
                HGroup({ width: "100%", height: "auto", align: "left center", gap: ROW_GAP, clipContent: 0 });
                    drawTrackArea(look, state);
                    if (valuePosition == "right") Label({ ...look.valueText, text: valueText, textAlign: "right", css: { whiteSpace: "nowrap", minWidth: "3em" } });
                endGroup();

            endGroup();

            return bar;

        };

        // BOX: The track, the two parts over it and the limits (a line is longer than the track; a dot is inside it)
        const drawTrackArea = function (look, state) {

            const _t = look.track;
            const _l = look.limit;
            const limits = state.limits || [];
            const isDot = (_l.shape == "dot");
            const hasText = limits.some(function (limit) { return limit.text; });
            const overhang = (limits.length && !isDot) ? _l.overhang : 0;
            const textRoom = hasText ? _l.textSpace + Math.ceil(_l.textSize * 1.4) : 0;

            const area = startBox({ width: "auto", height: _t.height + overhang * 2 + textRoom, color: "transparent", clipContent: 0 });
            area.css = { flex: "1 1 0", minWidth: "0", position: "relative" };

                // BOX: Track (its colors, or the dark ones)
                const trackColors = state.darkTrack ? look.darkTrack : _t;
                Box({ left: 0, top: overhang, width: "100%", height: _t.height, color: trackColors.color, round: _t.round, border: _t.border, borderColor: trackColors.borderColor });

                // BOX: Bar layer (as big as the track; it clips the bars). WHY a size container: the dots are placed in cqw
                startBox({ left: 0, top: overhang, width: "100%", height: _t.height, color: "transparent", round: _t.round, css: { containerType: "inline-size" } });

                    drawParts(look, state);

                endBox();

                limits.forEach(function (limit) {
                    if (!isDot) drawLimitLine(look, limit);
                    drawLimitText(look, limit, overhang);
                });

            endBox();

            return area;

        };

        // The second part and the bar: their colors from the main color and their ends, as the component paints them;
        // the dots of the limits: on the track under the parts, and inside each part
        const drawParts = function (look, state) {

            const _b = look.bar;
            const _sb = look.secondBar;
            const mainColor = getMainColor(look, state);
            const edgeColor = _b.borderColor || mainColor;

            drawDots(look, state, "track", 0);

            if (state.indeterminate) {
                const moving = Box({ top: 0, width: INDETERMINATE_WIDTH + "%", height: "100%", color: getFill(mainColor, _b.fillOpacity), round: look.track.round, border: _b.border, borderColor: edgeColor, boxShadow: _b.boxShadow });
                moving.css = { left: INDETERMINATE_LEFT + "%" };
                return;
            }

            // BOX: Second part (from 0 to value + secondValue, under the bar)
            if (state.secondValue) {
                const secondEdge = (_sb.color || _sb.lighten) ? edgeColor : (_b.borderColor || Alpha(mainColor, _sb.borderOpacity));
                const second = Box({ left: 0, top: 0, width: (state.value + state.secondValue) + "%", height: "100%", color: getSecondColor(_sb, mainColor), border: _b.border, borderColor: secondEdge, boxShadow: _b.boxShadow });
                setEnds(second, look, 1, state.value + state.secondValue >= 100);
                if (state.secondStripes) paintStripes(second, look);
                createIn(second, function () { drawDots(look, state, "second", _b.border); });
            }

            // BOX: Bar (the value); joinEdge 0: no edge where the second part starts
            if (state.value > 0) {
                const valueBar = Box({ left: 0, top: 0, width: state.value + "%", height: "100%", color: getFill(mainColor, _b.fillOpacity), border: _b.border, borderColor: edgeColor, boxShadow: _b.boxShadow });
                setEnds(valueBar, look, 1, state.value >= 100);
                if (state.secondValue && _b.joinEdge == 0) valueBar.css = { borderRightWidth: "0px" };
                if (state.stripes) paintStripes(valueBar, look);
                createIn(valueBar, function () { drawDots(look, state, "bar", _b.border); });
            }

        };

        // BOX: The dots of the limits (limit.shape "dot") in a part, in the color of that part: a part shows them
        // where it is. edge: a dot inside a part starts inside its edge
        const drawDots = function (look, state, part, edge) {
            const _l = look.limit;
            if (_l.shape != "dot") return;
            (state.limits || []).forEach(function (limit) {
                const dot = Box({ top: (look.track.height - _l.dotSize) / 2 - edge, width: _l.dotSize, height: _l.dotSize, round: _l.dotSize / 2, color: getDotColor(look, state, part, limit), opacity: _l.dotOpacity });
                dot.css = { left: "calc(" + limit.value + "cqw - " + (edge + _l.dotSize / 2) + "px)" };
            });
        };

        // A dot: white on the bar, the main color on the second part; on the track its own color or the color of the track
        const getDotColor = function (look, state, part, limit) {
            const _l = look.limit;
            if (part == "bar") return _l.barColor;
            if (part == "second") return _l.secondBarColor || getMainColor(look, state);
            if (limit.color) return limit.color;
            return state.darkTrack ? look.darkTrack.limitColor : _l.color;
        };

        // An end at an end of the track is as round as the track; an end in the middle has bar.innerRound ("": the
        // round of the track)
        const setEnds = function (part, look, isLeftAtEnd, isRightAtEnd) {
            const innerRound = (look.bar.innerRound === "") ? look.track.round : look.bar.innerRound;
            const left = (isLeftAtEnd ? look.track.round : innerRound) + "px";
            const right = (isRightAtEnd ? look.track.round : innerRound) + "px";
            part.css = { borderRadius: left + " " + right + " " + right + " " + left };
        };

        // The second part: its own color, the main color mixed with white (lighten), or the main color at fillOpacity
        const getSecondColor = function (secondBar, mainColor) {
            if (secondBar.color) return secondBar.color;
            if (secondBar.lighten) return "color-mix(in srgb, " + mainColor + " " + Math.round((1 - secondBar.lighten) * 100) + "%, white)";
            return getFill(mainColor, secondBar.fillOpacity);
        };

        // BOX: A limit line (over and under the track)
        const drawLimitLine = function (look, limit) {
            const _l = look.limit;
            const line = Box({ top: 0, width: _l.width, height: look.track.height + _l.overhang * 2, color: limit.color || _l.color, round: _l.round });
            line.css = { left: "calc(" + limit.value + "% - " + (_l.width / 2) + "px)" };
        };

        // LABEL: The text of a limit, under its line (or under the track)
        const drawLimitText = function (look, limit, overhang) {
            if (!limit.text) return;
            const _l = look.limit;
            const text = Label({ top: look.track.height + overhang * 2 + _l.textSpace, text: limit.text, fontSize: _l.textSize, textColor: limit.color || _l.textColor });
            text.css = { left: limit.value + "%", transform: "translateX(-50%)", whiteSpace: "nowrap" };
        };

        // The stripes, still (the component moves them)
        const paintStripes = function (part, look) {
            const _st = look.stripes;
            part.css = {
                backgroundImage: "linear-gradient(45deg, " + _st.color + " 25%, transparent 25%, transparent 50%, " + _st.color + " 50%, " + _st.color + " 75%, transparent 75%, transparent)",
                backgroundSize: _st.size + "px " + _st.size + "px",
            };
        };

        const getMainColor = function (look, state) {
            if (state.status == "success") return look.successColor;
            if (state.status == "error") return look.errorColor;
            return state.barColor || look.bar.color;
        };

        const getFill = function (color, opacity) {
            return (opacity < 1) ? Alpha(color, opacity) : color;
        };

    </script>

</head>

</body>

<!DOCTYPE html>
<html lang="en">

<head>
    <title>ItemList modern draft</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- LIBRARY FILES (a draft: no component, only basic.js objects) -->
    <link rel="preload" href="../basic/font/open-sans/OpenSans-Regular.ttf" as="font" crossorigin="anonymous">
    <link rel="preload" href="../basic/font/open-sans/OpenSans-Bold.ttf" as="font" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="../basic/basic.css">
    <script src="../basic/basic.js" type="text/javascript" charset="utf-8"></script>

    <script>

        /* Bismillah */

        // DRAFT DESIGN of comp/item-list.js (ItemList), the "modern" package, 2026-11-04.
        // The whole list (a vertical list with its search box and sections, a grid of tiles), then every state (a
        // row) of a list row and of a tile (the columns), drawn with plain basic.js objects (no ItemList here). Under
        // the mouse, pressed and the keyboard focus are still frames of those moments.
        // The values below are copies of ItemList.styles.modern, filled from ItemListDefaults.style where modern has
        // no key of its own (marked "default"): keep them in step with item-list.js when it changes.
        // The dark package: _designs/item-list-dark.htm.
        // http://127.0.0.1:5505/_basic-designer/index.htm?page=_designs/item-list-modern.htm

        const PAGE_COLOR = "#F4F5F2"; // the ground of the modern sample (02-comp-examples/item-list.htm)
        const LIST_WIDTH = 360;
        const ROW_WIDTH = 342; // LIST_WIDTH - 2 * box.padding - 2 * box.border
        const STATE_COLUMN_WIDTH = 190;
        const COLUMN_GAP = 30;
        const PAGE_TEXT = { title: Black(0.8), part: Black(0.5), column: Black(0.6), state: Black(0.45), stateTitle: Black(0.4) }; // the texts of the draft, not of the list

        // THE LOOK (a copy of ItemList.styles.modern)
        const LOOK = {
            box: { color: "transparent", border: 1, borderColor: "rgba(20, 20, 20, 0.45)", round: 8, padding: 8 }, // only padding is modern's own: the rest is the default
            list: { gap: 8 },
            row: {
                height: 64,
                padding: [14, 10],
                gap: 14,
                color: "white",
                border: 1,
                borderColor: Black(0.08),
                round: 12,
                boxShadow: "0px 1px 2px rgba(0, 0, 0, 0.04)",
            },
            tile: {
                width: 132,
                padding: [12, 14],
                gap: 8,
                spacing: 8, // between the tiles
                listPadding: 8, // around the tiles
                iconSize: 56,
                hover: { color: "#F7F8F6", borderColor: Black(0.14) },
            },
            section: { padding: [14, 6], fontSize: 13, fontFamily: "opensans-bold", textColor: Black(0.45) }, // fontFamily: default
            hover: { color: "#F7F8F6", borderColor: Black(0.14) },
            pressed: { color: null }, // default: no color of its own (the row keeps its hover look)
            selected: { color: "#EEF6F3", borderColor: "#3D7A6B" },
            disabled: { opacity: 0.4 }, // default
            focus: { ringColor: "rgba(61, 122, 107, 0.6)" }, // a 2 px line inside the edge (only for the keyboard)
            icon: { size: 40, round: 10, color: "#F1F2EF" },
            title: { fontSize: 15, textColor: Black(0.85), fontFamily: "opensans-bold" },
            desc: { fontSize: 13, textColor: Black(0.5) },
            check: { size: 20, color: "#3D7A6B", iconColor: "white", borderColor: Black(0.2) },
            empty: { fontSize: 14, textColor: Black(0.45), top: 24 }, // top: EMPTY_TEXT_TOP of the component
            search: {
                height: 40,
                padding: [8, 8, 8, 4], // left, top, right, bottom
                fontSize: 15,
                color: "white",
                textColor: "rgba(0, 0, 0, 0.8)", // default
                placeholderColor: "#757575", // "" in the package: the color of the browser
                border: 1,
                borderColor: Black(0.1),
                bottomLine: "1px solid " + Black(0.1),
                round: 10,
                iconSize: 18,
                iconLeft: 16, // SearchInput: searchIconLeft
                iconGap: 8, // SearchInput: searchIconGap
                clearIconSize: 20,
                clearIconOpacity: 0.6,
                isIconWhite: 0, // invertIconColor
            },
            scrollBar: { width: 4, round: 3, padding: 2, color: "#A0A0A0", opacity: 0.4 }, // shown only while scrolling (neverHide: 0)
        };

        // THE ICONS (the icons of SearchInput; the pictures of the sample page)
        const ICON_SEARCH = "data:image/svg+xml;utf8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M23.707 22.293l-5.969-5.969a10.016 10.016 0 10-1.414 1.414l5.969 5.969a1 1 0 001.414-1.414zM10 18a8 8 0 118-8 8.009 8.009 0 01-8 8z"/><\/svg>');
        const ICON_CLEAR = "data:image/svg+xml;utf8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"><path d="m336-280 144-144 144 144 56-56-144-144 144-144-56-56-144 144-144-144-56 56 144 144-144 144 56 56ZM480-80q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q134 0 227-93t93-227q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93Zm0-320Z"/><\/svg>');
        const FRUITS_PATH = "../assets/fruids/";
        const DRINKS_PATH = "../assets/categories/";

        // THE WHOLE LIST: selection "multiple", a section over each group
        const WHOLE_LIST = [
            { section: "FRUITS" },
            { title: "Strawberry", desc: "Fruit", iconFile: FRUITS_PATH + "cilek.png", selected: 1 },
            { title: "Apple", desc: "Fruit", iconFile: FRUITS_PATH + "elma.png", hover: 1 },
            { title: "Banana", desc: "Fruit", iconFile: FRUITS_PATH + "muz.png" },
            { title: "Lemon", desc: "Fruit", iconFile: FRUITS_PATH + "limon.png", disabled: 1 },
            { section: "VEGETABLES" },
            { title: "Broccoli", desc: "Vegetable", iconFile: FRUITS_PATH + "brokoli.png", selected: 1, focus: 1 },
            { title: "Carrot", desc: "Vegetable", iconFile: FRUITS_PATH + "havuc.png" },
        ];
        const WHOLE_GRID = [
            { title: "Cappuccino", desc: "Hot", iconFile: DRINKS_PATH + "cappuccino.png", selected: 1 },
            { title: "Coffee", desc: "Hot", iconFile: DRINKS_PATH + "coffee.png", hover: 1 },
            { title: "Tea", desc: "Hot", iconFile: DRINKS_PATH + "tea.png" },
            { title: "Frappe", desc: "Cold", iconFile: DRINKS_PATH + "frappe.png" },
            { title: "Milkshake", desc: "Cold", iconFile: DRINKS_PATH + "milkshake.png", disabled: 1 },
            { title: "Orange juice", desc: "Cold", iconFile: DRINKS_PATH + "orange-juice.png", selected: 1 },
        ];

        // THE STATES (one row each). part: "item" (a row and a tile), "section", "empty", "search"
        const ROW_ITEM = { title: "Broccoli", desc: "Vegetable", iconFile: FRUITS_PATH + "brokoli.png" };
        const TILE_ITEM = { title: "Cappuccino", desc: "Hot", iconFile: DRINKS_PATH + "cappuccino.png" };
        const STATES = [
            { name: "Normal: icon, title, description", part: "item" },
            { name: "selection: \"none\" (no check mark)", part: "item", noCheck: 1 },
            { name: "Only a title (a string item)", part: "item", row: { title: "Apple" }, tile: { title: "Apple" } },
            { name: "Long text (cut with ...)", part: "item", row: { title: "Watermelon from the garden of my grandmother", desc: "Fruit · summer · 12 kg · sweet and red inside", iconFile: FRUITS_PATH + "karpuz.png" }, tile: { title: "Chocolate milk shake", desc: "Cold · with cream", iconFile: DRINKS_PATH + "chocolate-milk.png" } },
            { name: "Under the mouse (hover)", part: "item", hover: 1 },
            { name: "Pressed (pressed.color: null, so the hover look)", part: "item", hover: 1, pressed: 1 },
            { name: "Keyboard focus", part: "item", focus: 1 },
            { name: "Selected", part: "item", selected: 1 },
            { name: "Selected, keyboard focus", part: "item", selected: 1, focus: 1 },
            { name: "Disabled", part: "item", disabled: 1 },
            { name: "Disabled, selected", part: "item", disabled: 1, selected: 1 },
            { name: "Section (a title between the items)", part: "section", text: "VEGETABLES" },
            { name: "Empty list", part: "empty", text: "No items" },
            { name: "Search: no result", part: "empty", text: "No results", searchText: "kiwi" },
            { name: "Search box (showSearch: 1)", part: "search" },
            { name: "Search box with a text (the clear icon)", part: "search", searchText: "berry" },
        ];

        const start = function () {

            page.color = PAGE_COLOR;

            // BOX: Scrolling page
            startBox(0, 0, "100%", "100%", { color: "transparent", scrollY: 1, scrollX: 1 });

                VGroup({ width: "max-content", height: "auto", align: "left top", gap: 22, padding: 40, clipContent: 0 });

                    Label({ text: "ItemList · modern · draft (comp/item-list.js)", fontSize: 20, bold: 1, textColor: PAGE_TEXT.title });

                    drawPartTitle("The whole list: layout \"vertical\", selection \"multiple\", showSearch: 1 · layout \"grid\"");

                    // GROUP: The vertical list and the grid side by side
                    HGroup({ width: "auto", height: "auto", align: "left top", gap: 40, clipContent: 0 });
                        drawWholeList();
                        drawWholeGrid();
                    endGroup();

                    drawPartTitle("Every state");

                    // GROUP: The names of the columns
                    HGroup({ width: "auto", height: "auto", align: "left top", gap: COLUMN_GAP });
                        Label({ width: STATE_COLUMN_WIDTH, text: "state", fontSize: 12, textColor: PAGE_TEXT.stateTitle });
                        Label({ width: ROW_WIDTH, text: "a row (layout: \"vertical\")", fontSize: 13, bold: 1, textColor: PAGE_TEXT.column });
                        Label({ text: "a tile (\"grid\", \"horizontal\")", fontSize: 13, bold: 1, textColor: PAGE_TEXT.column, css: { whiteSpace: "nowrap" } });
                    endGroup();

                    STATES.forEach(drawStateRow);

                endGroup();

            endBox();

        };

        const drawPartTitle = function (text) {
            return Label({ text: text, fontSize: 13, bold: 1, textColor: PAGE_TEXT.part, css: { marginTop: "10px" } });
        };

        // *** THE WHOLE LIST

        // GROUP: The box of the list: its search box, then its rows (the scroll bar while scrolling)
        const drawWholeList = function () {
            const list = drawListBox(LIST_WIDTH);
                drawSearchArea("");
                VGroup({ width: "100%", height: "auto", align: "left top", gap: LOOK.list.gap, padding: LOOK.box.padding, clipContent: 0 });
                    WHOLE_LIST.forEach(function (item) {
                        if (item.section) drawSection(item.section);
                        else drawRow(item, item);
                    });
                endGroup();
                drawScrollBar();
            endGroup();
            return list;
        };

        // GROUP: The box of the grid: tiles that wrap
        const drawWholeGrid = function () {
            const tile = LOOK.tile;
            const columns = 3;
            const width = columns * tile.width + (columns - 1) * tile.spacing + 2 * tile.listPadding + 2 * LOOK.box.border;
            const grid = drawListBox(width);
                HGroup({ width: "100%", height: "auto", align: "left top", gap: tile.spacing, padding: tile.listPadding, wrap: 1, clipContent: 0 });
                    WHOLE_GRID.forEach(function (item) {
                        drawTile(item, item);
                    });
                endGroup();
            endGroup();
            return grid;
        };

        // GROUP: The box of the component (style.box)
        const drawListBox = function (width) {
            const box = VGroup({ width: width, height: "auto", align: "left top", gap: 0, color: LOOK.box.color, border: LOOK.box.border, borderColor: LOOK.box.borderColor, round: LOOK.box.round });
            box.position = "relative";
            return box;
        };

        // BOX: The scroll bar of basic/scroll-bar.js, a still frame while scrolling
        const drawScrollBar = function () {
            const _b = LOOK.scrollBar;
            const searchAreaHeight = LOOK.search.height + LOOK.search.padding[1] + LOOK.search.padding[3];
            const bar = Box({ width: _b.width, height: 140, color: _b.color, round: _b.round, opacity: _b.opacity });
            bar.position = "absolute";
            bar.right = _b.padding;
            bar.top = searchAreaHeight + 40;
            return bar;
        };

        // *** THE STATES

        // GROUP: A state: its name, its row and its tile
        const drawStateRow = function (state) {
            const stateRow = HGroup({ width: "auto", height: "auto", align: "left center", gap: COLUMN_GAP, clipContent: 0 });
                Label({ width: STATE_COLUMN_WIDTH, text: state.name, fontSize: 12, textColor: PAGE_TEXT.state });
                HGroup({ width: ROW_WIDTH, height: "auto", align: "left center", clipContent: 0 });
                    drawStatePart(state);
                endGroup();
                HGroup({ width: LOOK.tile.width, height: "auto", align: "left center", clipContent: 0 });
                    if (state.part == "item") drawTile(state.tile || TILE_ITEM, state);
                endGroup();
            endGroup();
            return stateRow;
        };

        const drawStatePart = function (state) {
            if (state.part == "section") return drawSection(state.text);
            if (state.part == "empty") return drawEmptyList(state);
            if (state.part == "search") return drawSearchBox(state.searchText);
            return drawRow(state.row || ROW_ITEM, state);
        };

        // *** A ROW (layout: "vertical")

        // GROUP: An item row: its icon, its texts, its check mark
        const drawRow = function (item, state) {
            const look = getItemLook(state, LOOK.hover);
            const row = HGroup({ width: "100%", height: LOOK.row.height, align: "left center", gap: LOOK.row.gap, padding: LOOK.row.padding, clipContent: 0 });
            paintItemBox(row, look, state);
                if (item.iconFile) drawItemIcon(item, LOOK.icon.size);
                drawTexts(item, 0);
                if (!state.noCheck) drawCheck(state.selected);
            endGroup();
            return row;
        };

        // *** A TILE (layout: "grid", "horizontal")

        // GROUP: An item tile: its icon on top, its texts under it, its check mark at the top right corner
        const drawTile = function (item, state) {
            const tile = LOOK.tile;
            const look = getItemLook(state, tile.hover);
            const box = VGroup({ width: tile.width, height: "auto", align: "center top", gap: tile.gap, padding: tile.padding, clipContent: 0 });
            paintItemBox(box, look, state);
                if (item.iconFile) drawItemIcon(item, tile.iconSize);
                drawTexts(item, 1);
                if (!state.noCheck) {
                    const check = drawCheck(state.selected);
                    check.position = "absolute";
                    check.top = 6;
                    check.right = 6;
                }
            endGroup();
            return box;
        };

        // *** THE PARTS OF AN ITEM

        // The colors of an item in its state: row < hover < selected (the selected look wins under the mouse)
        const getItemLook = function (state, hoverLook) {
            const look = Object.assign({}, LOOK.row, state.hover ? hoverLook : {}, state.selected ? LOOK.selected : {});
            if (state.pressed && LOOK.pressed.color) look.color = LOOK.pressed.color;
            return look;
        };

        const paintItemBox = function (box, look, state) {
            box.position = "relative";
            box.color = look.color;
            box.border = look.border;
            box.borderColor = look.borderColor;
            box.round = look.round;
            if (look.boxShadow) box.boxShadow = look.boxShadow;
            if (state.disabled) box.opacity = LOOK.disabled.opacity;
            if (state.focus) box.css = { outline: "2px solid " + LOOK.focus.ringColor, outlineOffset: "-2px" };
        };

        // ICON: The picture of an item on its own color (style.icon)
        const drawItemIcon = function (item, size) {
            const icon = Icon({ width: size, height: size, color: LOOK.icon.color, round: LOOK.icon.round });
            icon.shrink = 0;
            icon.load(item.iconFile);
            return icon;
        };

        // GROUP: The title and the description
        const drawTexts = function (item, isTile) {
            const texts = VGroup({ width: isTile ? "100%" : "auto", height: "auto", align: isTile ? "center top" : "left center", gap: 0 });
            texts.css = { flex: isTile ? "" : "1 1 0", minWidth: "0", alignItems: "stretch" };
                Label({ text: item.title, width: "100%", fontSize: LOOK.title.fontSize, fontFamily: LOOK.title.fontFamily, textColor: LOOK.title.textColor, ellipsis: 1, textAlign: isTile ? "center" : "left" });
                if (item.desc) Label({ text: item.desc, width: "100%", fontSize: LOOK.desc.fontSize, textColor: LOOK.desc.textColor, ellipsis: 1, textAlign: isTile ? "center" : "left" });
            endGroup();
            return texts;
        };

        // LABEL: The check mark: an empty circle, or a full one with a white mark (selected)
        const drawCheck = function (isOn) {
            const _c = LOOK.check;
            const check = Label({
                width: _c.size,
                height: _c.size,
                round: 100,
                border: 2,
                color: isOn ? _c.color : "transparent",
                borderColor: isOn ? _c.color : _c.borderColor,
                text: isOn ? getCheckSvg(_c.iconColor, _c.size * 0.6) : "",
            });
            check.shrink = 0;
            check.css = { display: "flex", alignItems: "center", justifyContent: "center" };
            return check;
        };

        // The mark of ItemList.getCheckSvg
        const getCheckSvg = function (color, size) {
            return '<svg xmlns="http://www.w3.org/2000/svg" width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="' + color + '" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/><\/svg>';
        };

        // *** THE OTHER PARTS

        // GROUP: A section title (style.section)
        const drawSection = function (text) {
            const _s = LOOK.section;
            const section = HGroup({ width: "100%", height: "auto", align: "left center", padding: _s.padding });
                Label({ text: text, width: "100%", fontSize: _s.fontSize, fontFamily: _s.fontFamily, textColor: _s.textColor, ellipsis: 1 });
            endGroup();
            return section;
        };

        // GROUP: The box of an empty list with its text ("No items", or "No results" under a search)
        const drawEmptyList = function (state) {
            const list = drawListBox("100%");
                if (state.searchText) drawSearchArea(state.searchText);
                VGroup({ width: "100%", height: 80, align: "center top", padding: [20, LOOK.empty.top] });
                    Label({ text: state.text, fontSize: LOOK.empty.fontSize, textColor: LOOK.empty.textColor, textAlign: "center" });
                endGroup();
            endGroup();
            return list;
        };

        // GROUP: The search area over the rows (style.search.padding around the search box)
        const drawSearchArea = function (searchText) {
            const _s = LOOK.search;
            const area = HGroup({ width: "100%", height: _s.height + _s.padding[1] + _s.padding[3], align: "left top", padding: _s.padding });
                drawSearchBox(searchText);
            endGroup();
            return area;
        };

        // GROUP: The SearchInput of style.search: its icon, the placeholder or the typed text, the clear icon
        const drawSearchBox = function (searchText) {
            const _s = LOOK.search;
            const search = HGroup({ width: "100%", height: _s.height, align: "left center", gap: _s.iconGap, padding: [_s.iconLeft, 0], color: _s.color, round: _s.round, border: _s.border, borderColor: _s.borderColor });
            search.css = { borderBottom: _s.bottomLine };
                const icon = Icon({ width: _s.iconSize, height: _s.iconSize });
                icon.shrink = 0;
                icon.load(ICON_SEARCH);
                if (_s.isIconWhite) icon.css = { filter: "invert(100%)" };
                Label({ text: searchText || "Search", fontSize: _s.fontSize, textColor: searchText ? _s.textColor : _s.placeholderColor, css: { flex: "1 1 0" } });
                if (searchText) drawClearIcon();
            endGroup();
            return search;
        };

        // ICON: The clear icon of SearchInput (shown while there is a text)
        const drawClearIcon = function () {
            const _s = LOOK.search;
            const clear = Icon({ width: _s.clearIconSize, height: _s.clearIconSize, opacity: _s.clearIconOpacity });
            clear.shrink = 0;
            clear.load(ICON_CLEAR);
            if (_s.isIconWhite) clear.css = { filter: "invert(100%)" };
            return clear;
        };

    </script>
</head>

<body></body>

</html>

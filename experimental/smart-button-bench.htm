<!DOCTYPE html>
<html lang="en">
<head>

    <title>SmartButton - bench: disabled and waiting</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preload" href="../basic/font/open-sans/OpenSans-Regular.ttf" as="font" crossorigin="anonymous">
    <link rel="preload" href="../basic/font/open-sans/OpenSans-Bold.ttf" as="font" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="../basic/basic.css">
    <script src="../basic/basic.js" type="text/javascript" charset="utf-8"></script>

    <script src="../comp/smart-button.js" type="text/javascript" charset="utf-8"></script>

    <script>

    /* Bismillah */

    // BENCH (2026-10-29): the look of a disabled SmartButton (enabled: 0) and of its waiting cover with the clock.
    // CHOSEN (the user, 2026-10-29): D2 and W3, now the defaults of the component; D0 / W0 show the looks of before.
    // The other options are drawn on the look of before (their style), as they were compared.
    // Every row is one option on the same buttons (the ozden button set); the first row of each part is how it
    // is now. The options are only CSS of this page (classes with !important), the component is not changed.
    // The chosen one goes into comp/smart-button.js.

    // *** THE COLORS AND SIZES
    const PAGE_COLOR = "#F0F1EE";
    const INK = "#232323";
    const ROUND = 4;
    const BUTTON_HEIGHT = 40;
    const BOTTOM_LINE = "inset 0 -2px 0 rgba(0, 0, 0, 0.25)";
    const LINE = "rgba(35, 35, 35, 0.4)";

    // *** THE ICONS (the same drawings as smart-button-3-ozden.htm)
    const svgData = function (inner) {
        return "data:image/svg+xml;utf8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">' + inner + "<\/svg>");
    };
    const penIcon = function (color) {
        return svgData('<path d="M3.5 6h7M3.5 10h4" stroke="' + color + '" stroke-width="2.2" stroke-linecap="round"/>' +
            '<path d="M16.6 5.2a2.3 2.3 0 0 1 3.3 3.3l-9.6 9.6-4.8 1.5 1.5-4.8z" fill="' + color + '" stroke="' + color + '" stroke-width="1.6" stroke-linejoin="round"/>');
    };
    const TRASH_PATH = "M 4 6 Q 4 2 12 2 Q 20 2 20 6 L 18.5 18 Q 18 22 12 22 Q 6 22 5.5 18 Z " +
        "M 6.7 5.9 C 6.7 3.7 17.3 3.7 17.3 5.9 C 17.3 8.1 6.7 8.1 6.7 5.9 Z " +
        "M 9 11 Q 9.7 10.3 10.4 11 L 12 12.6 L 13.6 11 Q 14.3 10.3 15 11 Q 15.7 11.7 15 12.4 L 13.4 14 L 15 15.6 " +
        "Q 15.7 16.3 15 17 Q 14.3 17.7 13.6 17 L 12 15.4 L 10.4 17 Q 9.7 17.7 9 17 Q 8.3 16.3 9 15.6 L 10.6 14 L 9 12.4 Q 8.3 11.7 9 11 Z";
    const binIcon = function (color) {
        return svgData('<path fill-rule="evenodd" fill="' + color + '" d="' + TRASH_PATH + '"/>');
    };

    // *** THE BUTTON SET (the ozden looks): { text, icon, look, width }
    const look = function (color, hoverColor, textColor, borderColor, bottomLine) {
        return {
            layout: { gap: 8, padding: [16, 0], align: "center center" },
            box: { color: color, border: 1, borderColor: borderColor, round: ROUND, boxShadow: bottomLine },
            hover: { color: hoverColor },
            active: { color: hoverColor },
            icon: { width: 22, height: 22, opacity: 0.8 },
            label: { fontSize: 20, textColor: textColor, fontFamily: "opensans" },
        };
    };
    const trashLook = look("white", "#FDF1EF", Black(0.7), Black(0.35), "none");
    trashLook.layout.padding = [0, 0];
    trashLook.icon = { width: 30, height: 30 };

    const BUTTONS = [
        { text: "Edit", icon: penIcon("black"), look: look("#9DC7B5", "#91BCA9", "rgba(0, 0, 0, 0.7)", LINE, BOTTOM_LINE) },
        { text: "Edit", icon: penIcon("black"), look: look("#52A8D0", "#479DC5", "rgba(0, 0, 0, 0.7)", LINE, BOTTOM_LINE) },
        { text: "Cancel", icon: "", look: look("#E3E3E3", "#D9D9D9", "rgba(0, 0, 0, 0.7)", Black(0.35), BOTTOM_LINE) },
        { text: "Cancel", icon: "", look: look("white", "#D9D9D9", "rgba(0, 0, 0, 0.7)", Black(0.35), BOTTOM_LINE) },
        { text: "", icon: binIcon("#6B6F73"), look: trashLook, width: 50, ariaLabel: "Delete" },
        { text: "Save", icon: "", look: look("#3871E0", "#2F62C7", "white", "#2F62C7", BOTTOM_LINE) },
        { text: "Delete", icon: "", look: look("#E8796D", "#DD6B5F", "white", "#D2685D", BOTTOM_LINE) },
    ];

    // *** THE OPTIONS
    // css: the CSS of the option (its class is on the button: .bench-NAME, and on the cover: .bench-NAME-cover)
    const DISABLED_OPTIONS = [
        { key: "d0", title: "D0 · BEFORE (style.disabled.look: \"faint\")", text: "opacity 0.45: the colors stay, only fainter (a blue Save still looks like a blue Save)", css: "", style: { disabled: { look: "faint" } } },
        { key: "d1", style: { disabled: { look: "faint" } }, title: "D1 · GRAY AND FAINT", text: "no color (grayscale) and a little fainter: every disabled button looks the same", css:
            ".bench-d1 { filter: grayscale(1) !important; opacity: 0.5 !important; }" },
        { key: "d2", title: "D2 · A FLAT GRAY BUTTON (CHOSEN: the default of the component now)", text: "a light gray surface, a faint edge, no bottom line (not pressable), the text and the icon faint", css: "" },
        { key: "d3", style: { disabled: { look: "faint" } }, title: "D3 · DASHED", text: "no surface, a dashed edge (as the empty places of the design), the text faint", css:
            ".bench-d3 { background-color: transparent !important; border: 1px dashed rgba(0, 0, 0, 0.3) !important; box-shadow: none !important; opacity: 1 !important; }" +
            ".bench-d3 * { color: rgba(0, 0, 0, 0.35) !important; }" +
            ".bench-d3 img { opacity: 0.3 !important; filter: grayscale(1) !important; }" },
        { key: "d4", style: { disabled: { look: "faint" } }, title: "D4 · CLOSED (STRIPES)", text: "its own color, faint, with thin diagonal stripes: \"closed for now\"", css:
            ".bench-d4 { opacity: 0.55 !important; box-shadow: none !important;" +
            " background-image: repeating-linear-gradient(135deg, rgba(0, 0, 0, 0.09) 0 2px, transparent 2px 7px) !important; }" },
    ];

    const WAITING_OPTIONS = [
        { key: "w0", title: "W0 · BEFORE (style.waiting.cover: \"color\")", text: "a dark cover (rgba 0,0,0,0.4); a dark button is covered with its own color (85%)", css: "", style: { waiting: { cover: "color" } } },
        { key: "w1", style: { waiting: { cover: "color" } }, title: "W1 · ITS OWN COLOR, FROSTED", text: "every button is covered with its own color (80%) and a light blur: the text is a shadow, the clock is clear", css:
            ".bench-w1-cover { background-color: color-mix(in srgb, var(--bench-color) 80%, transparent) !important; backdrop-filter: blur(2px); }" },
        { key: "w2", style: { waiting: { cover: "color" } }, title: "W2 · A LIGHT VEIL", text: "a white veil (70%) and a light blur: calm, the button seems to rest", css:
            ".bench-w2-cover { background-color: rgba(255, 255, 255, 0.7) !important; backdrop-filter: blur(1.5px); }" },
        { key: "w3", title: "W3 · NO COVER, THE TEXT FADES (CHOSEN: the default of the component now)", text: "no cover: the text and the icon fade (18%), the clock is in the middle of the button", css: "" },
        { key: "w4", style: { waiting: { cover: "color" } }, title: "W4 · ITS OWN COLOR, MOVING STRIPES", text: "its own color (85%) with slowly moving light stripes behind the clock: a job is running", css:
            ".bench-w4-cover { background-color: color-mix(in srgb, var(--bench-color) 85%, transparent) !important;" +
            " background-image: repeating-linear-gradient(135deg, rgba(255, 255, 255, 0.16) 0 6px, transparent 6px 14px) !important;" +
            " background-size: 20px 20px; animation: bench-stripes 0.8s linear infinite; }" +
            "@keyframes bench-stripes { to { background-position: 20px 0; } }" +
            "@media (prefers-reduced-motion: reduce) { .bench-w4-cover { animation: none; } }" },
    ];

    // *** THE PAGE

    // option.style: the style keys of an option that the component has (Ex: the look of before)
    const createButton = function (data, params, option) {
        const style = JSON.parse(JSON.stringify(data.look));
        if (option && option.style) Object.keys(option.style).forEach(function (part) { style[part] = Object.assign({}, style[part], option.style[part]); });
        return SmartButton(Object.assign({
            width: data.width || "auto",
            height: BUTTON_HEIGHT,
            labelText: data.text,
            ariaLabel: data.ariaLabel || "",
            iconFile: data.icon,
            style: style,
        }, params || {}));
    };

    // One row: the title of the option, its words, then the whole button set in that state
    const createRow = function (option, makeState) {
        VGroup({ width: "100%", height: "auto", align: "left top", gap: 8, padding: [0, 14], clipContent: 0 });
            Label({ plainText: option.title, fontSize: 12, bold: 1, textColor: INK, css: { letterSpacing: "0.3px" } });
            Label({ plainText: option.text, fontSize: 13, textColor: Black(0.5), width: "100%", css: { whiteSpace: "normal" } });
            HGroup({ width: "100%", height: "auto", align: "left center", gap: 10, wrap: 1, clipContent: 0 });
                BUTTONS.forEach(function (data) { makeState(createButton(data, null, option), option); });
            endGroup();
        endGroup();
    };

    const makeDisabled = function (button, option) {
        button.setEnabled(0);
        if (option.css) button.elem.classList.add("bench-" + option.key);
    };

    const makeWaiting = function (button, option) {
        button.elem.style.setProperty("--bench-color", button.style.box.color);
        button.setWaiting(1); // WHY first: the waiting cover is made at the first wait (SmartButton v26.11)
        if (option.css) {
            button.elem.classList.add("bench-" + option.key);
            button.waitingCover.elem.classList.add("bench-" + option.key + "-cover");
        }
    };

    const createPart = function (title, text, options, makeState) {
        VGroup({ width: "100%", height: "auto", align: "left top", gap: 22, padding: [24, 22], color: "white", round: 8, border: 1, borderColor: Black(0.1), clipContent: 0 });
            Label({ plainText: title, fontSize: 20, bold: 1, textColor: INK });
            Label({ plainText: text, fontSize: 14, textColor: Black(0.55), width: "100%", css: { whiteSpace: "normal" } });
            // NORMAL: the set as it is, to compare
            createRow({ title: "NORMAL", text: "the buttons as they are" }, function () {});
            options.forEach(function (option) { createRow(option, makeState); });
        endGroup();
    };

    const start = function () {

        page.color = PAGE_COLOR;
        basic.addCss("smart-button-bench", DISABLED_OPTIONS.concat(WAITING_OPTIONS).map(function (o) { return o.css; }).join(""));

        startBox(0, 0, "100%", "100%", { color: "transparent", scrollY: 1 });
            VGroup({ width: "100%", height: "auto", align: "center top", gap: 30, padding: [30, 20], clipContent: 0 });
            that.css = { maxWidth: "900px", margin: "0 auto" };

                Label({ plainText: "SmartButton: disabled and waiting", fontSize: 26, bold: 1, textColor: INK });

                createPart("Disabled (setEnabled(0))", "A disabled button can not be pressed. It must look so at once, also next to the other buttons of its row.", DISABLED_OPTIONS, makeDisabled);
                createPart("Waiting (setWaiting(1), the clock)", "A job runs: the button can not be pressed until it ends. The clock must be clear, and the button must still be recognized.", WAITING_OPTIONS, makeWaiting);

            endGroup();
        endBox();

    };

    </script>

</head>
<body>
</body>
</html>

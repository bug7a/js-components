<!DOCTYPE html>
<html lang="en">

<head>
    <title>Search Input: ozden style</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- LIBRARY FILES -->
    <link rel="stylesheet" type="text/css" href="../basic/basic.css">
    <script src="../basic/basic.js" type="text/javascript" charset="utf-8"></script>
    <script src="../basic/scroll-bar.js" type="text/javascript" charset="utf-8"></script>

    <!-- COMPONENT FILES -->
    <script src="../comp-m2/search-input-v2.js" type="text/javascript" charset="utf-8"></script>

    <script>

        /* Bismillah */

        // DESIGN PAGE: SearchInput with styleName "ozden", to edit SearchInput.styles.ozden (comp-m2/search-input-v2.js).
        // The look comes only from the package: the samples give no look params.
        // basic-designer:
        // http://127.0.0.1:5505/__projects/basic-designer/index.htm?page=02-comp-m2-samples/search-input-v2-ozden.htm

        // *** VARIABLES:
        let scrollBox, searchEmpty, searchWithText, searchWide, searchAnimated, searchDark, searchDarkAnimated, searchClassic, lblSearched;

        const start = function () {

            page.color = "#F4F5F2";

            // BOX: Scrolling page
            // WHY: page does not scroll. Scrollable content must be inside a Box with scrollY: 1.
            scrollBox = startBox(0, 0, "100%", "100%", { color: "#FFFFFF", scrollY: 1 });

                VGroup({ width: "100%", height: "auto", align: "left top", gap: 28, padding: 40 });

                    // BUGRA
                    caption("ozden · empty");
                    searchEmpty = SearchInput({
                        styleName: "ozden",
                        onSearch: showSearched,
                    });

                    caption("ozden · with text (setText shows the clear icon)");
                    searchWithText = SearchInput({
                        styleName: "ozden",
                        placeholderText: "Search products",
                        onSearch: showSearched,
                    });
                    searchWithText.setText("fishing boat");

                    caption("ozden · wide (480)");
                    searchWide = SearchInput({
                        styleName: "ozden",
                        width: 480,
                        height: 40,
                        fontSize: 18,
                        searchIconSize: 20,
                        placeholderText: "Search in all pages",
                        onSearch: showSearched,
                    });

                    caption("ozden · animated: 0 (the packages are animated: move the mouse over the others, click, type, clear)");
                    searchAnimated = SearchInput({
                        styleName: "ozden",
                        animated: 0,
                        placeholderText: "Search products",
                        onSearch: showSearched,
                    });

                    lblSearched = Label({ text: "Searched: -", fontSize: 13, textColor: Black(0.5) });

                    // BUGRA DARK
                    VGroup({ hug: 1, align: "left top", gap: 12, padding: 24, color: "#1E1F22", round: 16 });

                        Label({ text: "ozdenDark · on a dark page", fontSize: 12, textColor: White(0.45) });
                        searchDark = SearchInput({
                            styleName: "ozdenDark",
                            placeholderText: "Search products",
                            onSearch: showSearched,
                        });
                        searchDark.setText("fishing boat");

                        Label({ text: "ozdenDark · animated: 0", fontSize: 12, textColor: White(0.45) });
                        searchDarkAnimated = SearchInput({
                            styleName: "ozdenDark",
                            animated: 0,
                            placeholderText: "Search products",
                            onSearch: showSearched,
                        });

                    endGroup();

                    // CLASSIC (to compare)
                    caption("classic · to compare");
                    searchClassic = SearchInput({
                        onSearch: showSearched,
                    });

                endGroup();

            endBox();

            if (typeof ScrollBar !== "undefined") ScrollBar({ scrollableBox: scrollBox });

        };

        // *** OTHER FUNCTIONS:

        const showSearched = function (searchedText) {
            lblSearched.text = "Searched: " + (searchedText || "-");
        };

        const caption = function (text) {
            return Label({ text: text, fontSize: 12, textColor: Black(0.4) });
        };

    </script>

</head>

<body>
</body>

</html>

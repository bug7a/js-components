<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Login</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- LIBRARY FILES -->
        <link rel="preload" href="../basic/font/open-sans/OpenSans-Regular.ttf" as="font" crossorigin="anonymous">
        <link rel="preload" href="../basic/font/open-sans/OpenSans-Bold.ttf" as="font" crossorigin="anonymous">
        <link rel="stylesheet" type="text/css" href="../basic/basic.min.css">
        <script src="../basic/basic.min.js" charset="utf-8" defer></script>
        <script src="../basic/scroll-bar.min.js" charset="utf-8" defer></script>

        <script src="../comp-m4/ui-effects.js" type="text/javascript" charset="utf-8"></script>
        <script src="../comp-m2/tooltip.js" charset="utf-8" defer></script>
        <script src="../comp-m2/input-b.js" charset="utf-8" defer></script>
        <script src="../comp-m2/email-input-b.js" charset="utf-8" defer></script>
        <script src="../comp-m2/password-input-b.js" charset="utf-8" defer></script>
        <script src="../comp-m4/tabs.js" charset="utf-8" defer></script>
        <script src="../comp-m4/smart-button.js" charset="utf-8" defer></script>
        <script src="../comp-m4/loading-screen.js" charset="utf-8" defer></script>
        <script src="../comp-m2/login-page-v2.js" type="text/javascript" charset="utf-8" defer></script>

        <script type="module">

        // Supabase constants
        const SUPABASE_PROJECT_URL = "https://xhzzgxhjyoqcsftamtyz.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhoenpneGhqeW9xY3NmdGFtdHl6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDUzMTg2MDAsImV4cCI6MjA2MDg5NDYwMH0.XptujcYMNgl9XIzIQ2_CUig9JzkYOCKONfYAmMPd_wc";

        // The logos of the login buttons
        const GOOGLE_LOGO = "https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg";
        const APPLE_LOGO = "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSRsP-EH-Fc-gjQMFgxj4g1pkFGVCK8Y2deHA&s";

        // First running function.
        window.onload = async function() {

            page.color = "black";

            const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2');
            window.supabase = createClient(SUPABASE_PROJECT_URL, SUPABASE_ANON_KEY);

            window.userData = await checkIfLoggedIn();

            if (!userData) {

                // Show Login Page (the Supabase work is in onLoginClick / onSignupClick below)
                window.loginPage = LoginPage({
                    panelWidth: 420,
                    panelName: "MY PANEL v25.08.11",
                    showPasswordIconFile: "../comp-m2/password-input-b/show-btn.png",
                    hidePasswordIconFile: "../comp-m2/password-input-b/hide-btn.png",
                    onLoginClick: onLoginClick,
                    onSignupClick: onSignupClick,
                    primaryColor: "#2C5A38",
                });

                loginPage.createButtonWithIcon("Sign in with Google", GOOGLE_LOGO, function() {
                    loginWithProvider("google");
                });
                loginPage.createButtonWithIcon("Sign in with Apple", APPLE_LOGO, function() {
                    loginWithProvider("apple");
                });

                // TEST DATA: Fill the user data
                loginPage.loginEmail.setInputValue("bugra.ozden@gmail.com");
                loginPage.loginPassword.setInputValue("123456");
                // Call manuel to check form with out edit
                loginPage.loginEmail.onEdit();

            } else {

                // Show Panel Home Page
                createStructure();

            }

        };

        window.createStructure = function() {

            HGroup({
                    gap: 20,
                });

                Label({
                    text: "Logged In.",
                });

                Label({
                    text: "Logout",
                    color: "indianred",
                    textColor: "white",
                    padding: [8, 2],
                    round: 4,
                });
                that.elem.style.cursor = "pointer";
                that.on("click", function() {
                    logout();
                });

            endGroup();

        };

        window.openPageByKey = function(key) {

            if (!userData) { logout(); return 0; }

            switch (key) {

                case "page1":
                    // open page 1
                    break;

                case "page2":
                    // open page 2
                    break;

            }

        };

        window.checkIfLoggedIn = async function() {

            return false; // TEST

            const { data, error } = await supabase.auth.getSession();
            return data.session !== null;

        };

        window.logout = async function() {

            await supabase.auth.signOut();
            window.location.reload();

        };

        // Actions (the login page shows the waiting cover and the alerts)
        const onLoginClick = async function() {

            const email = loginPage.loginEmail.getInputValue();
            const password = loginPage.loginPassword.getInputValue();

            if (!email || !password) {
                loginPage.showAlert("Please enter email and password");
                return;
            }

            loginPage.waiting.show();

            try {
                const { error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) {
                    loginPage.showAlert("Login failed: " + error.message);
                } else {
                    window.location.reload(); // Logged in
                }
            } catch (e) {
                loginPage.showAlert("Login error");
            } finally {
                loginPage.waiting.hide();
            }

        };

        const onSignupClick = async function() {

            const email = loginPage.signupEmail.getInputValue();
            const p1 = loginPage.signupPassword.getInputValue();
            const p2 = loginPage.signupPassword2.getInputValue();

            if (!email || !p1 || !p2) {
                loginPage.showAlert("Please fill all fields");
                return;
            }
            if (p1 !== p2) {
                loginPage.showAlert("Passwords do not match");
                return;
            }

            loginPage.waiting.show();

            try {
                const { error } = await supabase.auth.signUp({ email, password: p1 });
                if (error) {
                    loginPage.showAlert("Sign up failed: " + error.message);
                } else {
                    loginPage.showAlert("Sign up successful. Check your email to confirm.", "#5DB182");
                    loginPage.signupPassword.setInputValue("");
                    loginPage.signupPassword2.setInputValue("");
                    loginPage.loginEmail.setInputValue(email);
                    loginPage.setActiveTab(0);
                }
            } catch (e) {
                loginPage.showAlert("Sign up error");
            } finally {
                loginPage.waiting.hide();
            }

        };

        // provider: "google", "apple"
        const loginWithProvider = async function(provider) {

            await supabase.auth.signInWithOAuth({
                provider: provider,
                options: {
                    redirectTo: `http://example.com/auth/callback`,
                },
            });

        };

        </script>
        
    </head>
    <body></body>
</html>
